<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Last Port v2.0</title>
<style>
:root{color-scheme:dark;--text:#f3f4f6;--muted:#9ca3af;--gold:#f59e0b;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--cyan:#22d3ee;--bg:#0c0e10;--card:#161a1e;--dark:#0a0c0e;--border:#2d353e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);user-select:none}
button{font:inherit;cursor:pointer;border:none;outline:0;transition:transform .1s}
button:active{transform:scale(.95)}
button:disabled{opacity:.35;pointer-events:none}
canvas{display:block}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:linear-gradient(180deg,rgba(10,12,14,.98),rgba(10,12,14,.88));border-bottom:1px solid var(--border);z-index:100;flex-shrink:0;gap:4px}
.player-info{display:flex;align-items:center;gap:6px}
.p-avatar{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#b45309,#92400e);display:grid;place-items:center;font-size:18px;border:2px solid var(--gold)}
.p-meta{display:flex;flex-direction:column}
.p-name{font-size:11px;font-weight:800;color:#fff}
.p-lvl{font-size:9px;color:var(--gold);font-weight:700}
.p-xp{width:65px;height:3px;background:#1c2128;border-radius:2px;overflow:hidden;margin-top:1px}
.p-xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#fbbf24);transition:width .3s}
.res-bar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.res-pill{display:flex;align-items:center;gap:2px;background:rgba(20,24,30,.9);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10px;font-weight:700}
.res-pill.food{color:#f87171}.res-pill.wood{color:#a3e635}.res-pill.metal{color:#93c5fd}.res-pill.gems{color:#c084fc}
.energy-pill{color:var(--cyan);border-color:rgba(34,211,238,.25)}
.day-night{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(20,24,30,.9);border:1px solid var(--border)}

/* QUEST BANNER */
.q-banner{display:flex;align-items:center;gap:6px;margin:0 8px;padding:6px 10px;background:linear-gradient(90deg,rgba(245,158,11,.1),transparent);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;cursor:pointer;flex-shrink:0}
.q-banner small{font-size:8px;color:var(--gold);font-weight:700;text-transform:uppercase;display:block}
.q-banner strong{font-size:11px;color:#fff}

/* SCENE */
.scene{flex:1;position:relative;overflow:hidden;background:#0d1117}
#map-canvas{width:100%;height:100%;touch-action:none}
.scene-ctrl{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:20}
.scene-ctrl button{width:34px;height:34px;border-radius:7px;background:rgba(16,20,24,.9);border:1px solid var(--border);color:#fff;font-size:14px}
.b-tooltip{position:absolute;background:rgba(12,14,18,.96);border:1px solid var(--gold);border-radius:10px;padding:10px;z-index:50;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.8);display:none;font-size:11px}
.b-tooltip.show{display:block}
.b-tooltip h4{font-size:12px;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.b-tooltip p{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.3}

/* BOTTOM PANEL */
.b-panel{background:rgba(12,14,18,.98);border-top:1px solid var(--border);display:flex;flex-direction:column;height:42dvh;transition:height .3s;z-index:100;flex-shrink:0}
.b-panel.collapsed{height:48px}
.b-panel.collapsed #panel{display:none}
.b-panel.expanded{height:65dvh}
.tab-bar{display:flex;background:var(--dark);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:52px;padding:6px 2px 4px;background:none;color:#6b7280;font-size:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;border-bottom:2px solid transparent}
.tab-btn .ti{font-size:16px}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.sub-tabs{display:flex;gap:3px;padding:6px 8px 3px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap}
.sub-tab.active{background:#28313b;color:#fff;border-color:var(--gold)}
#panel{flex:1;overflow-y:auto;padding:6px 8px 14px;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}

/* CARDS & GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g1{display:grid;grid-template-columns:1fr;gap:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.card.hl{border-color:var(--gold);box-shadow:0 0 10px rgba(245,158,11,.1)}
.card-h{display:flex;justify-content:space-between;align-items:center}
.card-t{font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;gap:4px}
.badge{font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.b-gold{background:rgba(245,158,11,.2);color:#fbbf24}
.b-green{background:rgba(34,197,94,.2);color:#4ade80}
.b-blue{background:rgba(59,130,246,.2);color:#60a5fa}
.b-red{background:rgba(239,68,68,.2);color:#f87171}
.b-purple{background:rgba(168,85,247,.2);color:#c084fc}
.b-cyan{background:rgba(34,211,238,.2);color:#22d3ee}
.card-d{font-size:9px;color:var(--muted);line-height:1.3}
.card-cost{font-size:9px;color:#d1d5db;display:flex;gap:6px;flex-wrap:wrap}
.btn-p{background:linear-gradient(180deg,#d97706,#b45309);color:#fff;padding:6px 10px;border-radius:5px;font-size:10px;font-weight:800}
.btn-g{background:linear-gradient(180deg,#16a34a,#15803d);color:#fff;padding:6px 10px;border-radius:5px;font-size:10px;font-weight:800}
.btn-b{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;padding:6px 10px;border-radius:5px;font-size:10px;font-weight:800}
.btn-v{background:linear-gradient(180deg,#9333ea,#7c3aed);color:#fff;padding:6px 10px;border-radius:5px;font-size:10px;font-weight:800}
.btn-s{background:rgba(255,255,255,.08);color:#d1d5db;padding:6px 10px;border-radius:5px;font-size:10px;font-weight:700}
.btn-f{width:100%}
.pbar{height:5px;border-radius:3px;background:#1c2128;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}
.pf-g{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.pf-gr{background:linear-gradient(90deg,#22c55e,#4ade80)}
.pf-b{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.pf-r{background:linear-gradient(90deg,#dc2626,#ef4444)}
.pf-c{background:linear-gradient(90deg,#22d3ee,#67e8f9)}
.sec-t{font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.sec-t::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(245,158,11,.3),transparent)}

/* HERO ROW */
.h-row{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:4px}
.h-row.sel{border-color:var(--gold);background:#1e2430}
.h-icon{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.h-icon.common{background:#1c2128;border:2px solid #6b7280}
.h-icon.rare{background:#1a2332;border:2px solid #3b82f6;box-shadow:0 0 6px rgba(59,130,246,.3)}
.h-icon.epic{background:#221a30;border:2px solid #a855f7;box-shadow:0 0 6px rgba(168,85,247,.3)}
.h-icon.legendary{background:#2a1f10;border:2px solid #f59e0b;box-shadow:0 0 8px rgba(245,158,11,.4)}
.h-info{flex:1;min-width:0}
.h-info .hn{font-size:11px;font-weight:800;color:#fff}
.h-info .hc{font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:700}
.h-info .hs{font-size:9px;color:#d1d5db;margin-top:1px}

/* EQUIP SLOTS */
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.eq-slot{aspect-ratio:1;background:var(--card);border:1px dashed var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;gap:2px}
.eq-slot.filled{border-style:solid}
.eq-slot .eq-name{font-size:7px;color:var(--muted);text-align:center;line-height:1.1}
.eq-slot.r-common{border-color:#6b7280}.eq-slot.r-uncommon{border-color:#22c55e}.eq-slot.r-rare{border-color:#3b82f6}.eq-slot.r-epic{border-color:#a855f7}.eq-slot.r-legendary{border-color:#f59e0b}

/* SKILL TREE */
.skill-tree{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.skill-tree::-webkit-scrollbar{display:none}
.skill-branch{min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.skill-branch h5{font-size:10px;color:var(--gold);margin-bottom:6px}
.skill-node{width:36px;height:36px;border-radius:50%;background:#1c2128;border:2px solid var(--border);display:grid;place-items:center;font-size:14px;margin:4px auto;cursor:pointer}
.skill-node.unlocked{border-color:var(--green);background:rgba(34,197,94,.15)}
.skill-node.available{border-color:var(--blue);background:rgba(59,130,246,.1)}

/* WORLD MAP */
.world-map{position:relative;width:800px;height:500px;background:#0a0e08;border-radius:8px;border:1px solid var(--border);overflow:hidden;touch-action:none}
.wm-node{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;cursor:pointer;border:2px solid var(--border);background:var(--card);transition:transform .2s;z-index:2}
.wm-node:hover{transform:scale(1.15)}
.wm-node.cleared{border-color:var(--green);background:rgba(34,197,94,.12)}
.wm-node.current{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,.4);animation:pulse 2s infinite}
.wm-node.locked{opacity:.3;pointer-events:none}
.wm-node.fog{background:#111;border-color:#222;opacity:.2}
.wm-label{position:absolute;font-size:8px;color:#ccc;font-weight:700;white-space:nowrap;z-index:3;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(245,158,11,.3)}50%{box-shadow:0 0 20px rgba(245,158,11,.6)}}

/* BATTLE OVERLAY */
#battle-overlay{position:fixed;inset:0;z-index:500;background:#050607;display:none;flex-direction:column}
#battle-overlay.active{display:flex}
#battle-canvas{flex:1;width:100%}
.battle-hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.b-wave{font-size:12px;font-weight:900;color:#fbbf24;text-shadow:0 2px 6px #000;text-align:center}
.b-hp-bar{width:min(280px,75%);height:12px;background:rgba(0,0,0,.6);border:1px solid #1a1d22;border-radius:6px;overflow:hidden;margin:0 auto}
.b-hp-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .25s}
.b-hp-fill.low{background:linear-gradient(90deg,#dc2626,#ef4444)}
.b-stats{display:flex;justify-content:center;gap:8px}
.b-stat{font-size:10px;font-weight:800;color:#e5e7eb;background:rgba(0,0,0,.5);border:1px solid #2d353e;border-radius:4px;padding:1px 6px}
.b-ult{position:absolute;right:16px;bottom:20px;width:60px;height:60px;border-radius:50%;background:rgba(20,24,28,.7);border:2px solid rgba(239,68,68,.5);display:grid;place-items:center;font-size:24px;touch-action:none;pointer-events:auto;z-index:10}
.b-ult.cd{opacity:.4;filter:grayscale(1)}
.b-result{position:absolute;inset:0;background:rgba(5,6,7,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
.b-result h2{font-size:24px;font-weight:900;text-shadow:0 3px 10px #000}
.b-result.win h2{color:#4ade80}
.b-result.lose h2{color:#ef4444}

/* TUTORIAL OVERLAY */
#tutorial{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px}
#tutorial.active{display:flex}
.tut-box{background:var(--bg);border:2px solid var(--gold);border-radius:14px;padding:20px;max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.tut-box h3{font-size:16px;color:var(--gold);margin-bottom:8px}
.tut-box p{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.4}
.tut-step{font-size:10px;color:var(--muted);margin-bottom:8px}

/* BATTLE PASS */
.bp-track{display:flex;gap:4px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.bp-track::-webkit-scrollbar{display:none}
.bp-cell{min-width:56px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 4px;text-align:center;flex-shrink:0}
.bp-cell.current{border-color:var(--gold);background:rgba(245,158,11,.1)}
.bp-cell.claimed{opacity:.35}
.bp-cell.premium{border-color:var(--purple);background:rgba(168,85,247,.08)}
.bp-cell .bp-lvl{font-size:8px;color:var(--muted);display:block}
.bp-cell .bp-icon{font-size:16px;display:block;margin:2px 0}
.bp-cell .bp-amt{font-size:8px;color:#fff;font-weight:700}

/* ALLIANCE CHAT */
.chat-box{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:8px;max-height:150px;overflow-y:auto;margin:8px 0;scrollbar-width:none}
.chat-msg{font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.chat-msg .cm-name{color:var(--gold);font-weight:700}
.chat-msg .cm-text{color:#d1d5db}
.chat-input{display:flex;gap:4px}
.chat-input input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:#fff;font-size:11px}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;width:100%;max-width:340px;max-height:75vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.modal h3{font-size:14px;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.modal-close{margin-left:auto;background:rgba(255,255,255,.1);color:#fff;width:26px;height:26px;border-radius:50%;font-size:12px;display:grid;place-items:center}

/* TOAST */
#toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-15px);z-index:9999;background:rgba(12,14,18,.96);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;font-size:11px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.8);opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:85%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* TICKER */
.ticker{background:rgba(220,38,38,.12);border-bottom:1px solid rgba(220,38,38,.2);padding:3px 10px;font-size:9px;font-weight:700;color:#fca5a5;overflow:hidden;flex-shrink:0}
.ticker span{display:inline-block;animation:tick 18s linear infinite;white-space:nowrap}
@keyframes tick{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* ZOMBIE WALK */
@keyframes zwalk{0%{transform:translateX(-40px) scaleX(-1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(calc(100vw + 40px)) scaleX(-1);opacity:0}}
.z-walk{position:absolute;font-size:24px;animation:zwalk 4s linear forwards;z-index:15;filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}

/* CRAFT */
.craft-recipe{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:4px}
.craft-recipe .cr-icon{font-size:20px}
.craft-recipe .cr-info{flex:1}
.craft-recipe .cr-info b{font-size:11px;color:#fff;display:block}
.craft-recipe .cr-info span{font-size:9px;color:var(--muted)}

/* STATS */
.stat-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px}
.stat-row .sl{color:var(--muted)}.stat-row .sv{color:#fff;font-weight:700}

/* OFFLINE POPUP */
.offline-box{text-align:center}
.offline-box h3{color:var(--cyan)}
.offline-box .off-res{display:flex;gap:8px;justify-content:center;margin:10px 0}
.offline-box .off-res span{font-size:12px;font-weight:800;color:#fff;background:var(--card);padding:4px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <div class="ticker"><span>⚠ Волна зомби приближается! | 🎁 Событие "Тёмный урожай" активно! | 📢 v2.0 — Battle Pass, крафт, карта мира!</span></div>
  <div class="top-bar">
    <div class="player-info">
      <div class="p-avatar">🧔</div>
      <div class="p-meta">
        <span class="p-name" id="pn">Выживший</span>
        <span class="p-lvl">Ур.<span id="pl">1</span> ⚔<span id="pp">0</span></span>
        <div class="p-xp"><div class="p-xp-fill" id="pxp" style="width:0%"></div></div>
      </div>
    </div>
    <div class="res-bar">
      <div class="res-pill food">🍖<span id="rf">500</span></div>
      <div class="res-pill wood">🪵<span id="rw">300</span></div>
      <div class="res-pill metal">⚙<span id="rm">150</span></div>
      <div class="res-pill gems">💎<span id="rg">50</span></div>
      <div class="res-pill energy-pill">⚡<span id="re">120</span></div>
      <div class="day-night" id="dn">☀ День</div>
    </div>
  </div>
  <div class="q-banner" onclick="G.tab('social','quests')">
    <div><small id="qc">Глава 1</small><strong id="qo">Постройте ферму</strong></div>
  </div>
  <div class="scene">
    <canvas id="map-canvas"></canvas>
    <div class="scene-ctrl">
      <button onclick="G.zoom(1)">＋</button>
      <button onclick="G.zoom(-1)">−</button>
      <button onclick="G.resetCam()" style="color:var(--gold)">⌂</button>
      <button onclick="G.toggleSound()" id="snd-btn">🔊</button>
    </div>
    <div class="b-tooltip" id="btt"></div>
  </div>
  <div class="b-panel" id="bp">
    <div class="tab-bar" id="tbar"></div>
    <div class="sub-tabs" id="stabs"></div>
    <div id="panel"></div>
  </div>
</div>
<div id="toast"></div>
<div id="tutorial"></div>
<div id="battle-overlay"><canvas id="battle-canvas"></canvas><div class="battle-hud"><div class="b-wave" id="bw">Волна 1</div><div class="b-stats"><div class="b-stat" id="bk">💀 0</div><div class="b-stat" id="bt">⏱ 60</div></div><div class="b-hp-bar"><div class="b-hp-fill" id="bhf"></div></div></div><div class="b-ult" id="bult" onclick="G.battleUlt()">💥</div></div>

<script>
// ══════════════════════════════════════════════════════════
//  THE LAST PORT v2.0 — COMPLETE GAME ENGINE
// ══════════════════════════════════════════════════════════

const G = {
// ── DEFAULT STATE ──
def() {
  return {
    name:'Выживший', lvl:1, xp:0, xpN:100,
    res:{food:500,wood:300,metal:150,gems:50},
    caps:{food:2000,wood:2000,metal:1000,gems:999},
    energy:120, maxEnergy:120, lastEnergyTick:Date.now(),
    power:0, day:1, hour:8, chapter:1, qStep:0,
    bld:{hq:1}, heroes:[], garrison:[null,null,null,null,null],
    equip:{}, techs:{}, exps:[], log:[], achs:{},
    dailyClaim:-1, wave:1, wallHP:100, wallMax:100,
    rating:1000, kills:0, built:0, crafted:0,
    bpLvl:0, bpXP:0, bpClaimed:[], bpPremium:false,
    alliance:null, chatLog:[],
    mapRevealed:['base','farm_spot'],
    inv:[], tutorialDone:false, tutorialStep:0,
