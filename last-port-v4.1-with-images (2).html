<style>
:root{color-scheme:dark;--t:#f3f4f6;--m:#9ca3af;--g:#f59e0b;--r:#ef4444;--gn:#22c55e;--b:#3b82f6;--p:#a855f7;--c:#22d3ee;--bg:#0c0e10;--cd:#161a1e;--dk:#0a0c0e;--bd:#2d353e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--t);user-select:none}
button{font:inherit;cursor:pointer;border:none;outline:0;transition:transform .1s}
button:active{transform:scale(.95)}button:disabled{opacity:.35;pointer-events:none}
canvas{display:block}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:linear-gradient(180deg,rgba(10,12,14,.98),rgba(10,12,14,.88));border-bottom:1px solid var(--bd);z-index:100;flex-shrink:0;gap:3px;flex-wrap:wrap}
.pi{display:flex;align-items:center;gap:5px}
.pa{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,#b45309,#92400e);display:grid;place-items:center;font-size:16px;border:2px solid var(--g)}
.pm{display:flex;flex-direction:column}.pn{font-size:10px;font-weight:800}.pl{font-size:8px;color:var(--g);font-weight:700}
.px{width:55px;height:3px;background:#1c2128;border-radius:2px;overflow:hidden;margin-top:1px}
.pxf{height:100%;background:linear-gradient(90deg,var(--g),#fbbf24);transition:width .3s}
.rb{display:flex;gap:2px;flex-wrap:wrap}
.rp{display:flex;align-items:center;gap:1px;background:rgba(20,24,30,.9);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700}
.rp.f{color:#f87171}.rp.w{color:#a3e635}.rp.m{color:#93c5fd}.rp.g{color:#c084fc}.rp.e{color:var(--c)}
.dn{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(20,24,30,.9);border:1px solid var(--bd)}
.wth{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(20,24,30,.9);border:1px solid var(--bd)}
.qb{display:flex;align-items:center;gap:5px;margin:0 6px;padding:5px 8px;background:linear-gradient(90deg,rgba(245,158,11,.1),transparent);border-left:3px solid var(--g);border-radius:0 5px 5px 0;cursor:pointer;flex-shrink:0}
.qb small{font-size:7px;color:var(--g);font-weight:700;text-transform:uppercase;display:block}
.qb strong{font-size:10px}
.sc{flex:1;position:relative;overflow:hidden;background:#0d1117}
#mc{width:100%;height:100%;touch-action:none}
.sct{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;z-index:20}
.sct button{width:30px;height:30px;border-radius:6px;background:rgba(16,20,24,.9);border:1px solid var(--bd);color:#fff;font-size:13px}
.tt{position:absolute;background:rgba(12,14,18,.96);border:1px solid var(--g);border-radius:8px;padding:8px;z-index:50;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.8);display:none;font-size:10px}
.tt.show{display:block}
.tt h4{font-size:11px;margin-bottom:3px;display:flex;align-items:center;gap:3px}
.tt p{font-size:9px;color:var(--m);margin-bottom:5px;line-height:1.3}
.bp{background:rgba(12,14,18,.98);border-top:1px solid var(--bd);display:flex;flex-direction:column;height:42dvh;transition:height .3s;z-index:100;flex-shrink:0}
.bp.col{height:44px}.bp.col #pn{display:none}.bp.exp{height:65dvh}
.tb{display:flex;background:var(--dk);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tbn{flex:1;min-width:44px;padding:5px 2px 3px;background:none;color:#6b7280;font-size:7px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;border-bottom:2px solid transparent}
.tbn .ti{font-size:15px}.tbn.act{color:var(--g);border-bottom-color:var(--g)}
.st{display:flex;gap:2px;padding:5px 6px 2px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.st::-webkit-scrollbar{display:none}
.stn{padding:3px 8px;background:var(--cd);border:1px solid var(--bd);border-radius:4px;color:var(--m);font-size:9px;font-weight:700;white-space:nowrap}
.stn.act{background:#28313b;color:#fff;border-color:var(--g)}
#pn{flex:1;overflow-y:auto;padding:5px 6px 12px;scrollbar-width:none}
#pn::-webkit-scrollbar{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.g1{display:grid;grid-template-columns:1fr;gap:5px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:7px;padding:7px;display:flex;flex-direction:column;gap:3px}
.cd.hl{border-color:var(--g);box-shadow:0 0 8px rgba(245,158,11,.1)}
.ch{display:flex;justify-content:space-between;align-items:center}
.ct{font-size:10px;font-weight:800;display:flex;align-items:center;gap:3px}
.bg{font-size:7px;font-weight:800;padding:1px 4px;border-radius:3px;text-transform:uppercase}
.bg-g{background:rgba(245,158,11,.2);color:#fbbf24}.bg-gn{background:rgba(34,197,94,.2);color:#4ade80}
.bg-b{background:rgba(59,130,246,.2);color:#60a5fa}.bg-r{background:rgba(239,68,68,.2);color:#f87171}
.bg-p{background:rgba(168,85,247,.2);color:#c084fc}.bg-c{background:rgba(34,211,238,.2);color:#22d3ee}
.cdd{font-size:8px;color:var(--m);line-height:1.3}
.cc{font-size:8px;color:#d1d5db;display:flex;gap:4px;flex-wrap:wrap}
.bp2{background:linear-gradient(180deg,#d97706,#b45309);color:#fff;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:800}
.bgn{background:linear-gradient(180deg,#16a34a,#15803d);color:#fff;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:800}
.bb{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:800}
.bv{background:linear-gradient(180deg,#9333ea,#7c3aed);color:#fff;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:800}
.bs{background:rgba(255,255,255,.08);color:#d1d5db;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:700}
.bf{width:100%}
.pb{height:4px;border-radius:2px;background:#1c2128;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width .4s}
.pfg{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.pfgr{background:linear-gradient(90deg,#22c55e,#4ade80)}
.pfb{background:linear-gradient(90deg,#3b82f6,#60a5fa)}.pfr{background:linear-gradient(90deg,#dc2626,#ef4444)}
.sec{font-size:9px;font-weight:800;color:var(--g);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 5px;display:flex;align-items:center;gap:3px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(245,158,11,.3),transparent)}
.hr{display:flex;align-items:center;gap:5px;background:var(--cd);border:1px solid var(--bd);border-radius:7px;padding:5px 7px;margin-bottom:3px}
.hr.sel{border-color:var(--g);background:#1e2430}
.hi{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.hi.common{background:#1c2128;border:2px solid #6b7280}.hi.rare{background:#1a2332;border:2px solid #3b82f6;box-shadow:0 0 5px rgba(59,130,246,.3)}
.hi.epic{background:#221a30;border:2px solid #a855f7;box-shadow:0 0 5px rgba(168,85,247,.3)}
.hi.legendary{background:#2a1f10;border:2px solid #f59e0b;box-shadow:0 0 7px rgba(245,158,11,.4)}
.hi.uncommon{background:#1a2a1a;border:2px solid #22c55e;box-shadow:0 0 5px rgba(34,197,94,.3)}
.hf{flex:1;min-width:0}.hf .hn{font-size:10px;font-weight:800}.hf .hc{font-size:7px;color:var(--m);text-transform:uppercase;font-weight:700}
.hf .hs{font-size:8px;color:#d1d5db;margin-top:1px}
.eq-g{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:4px 0}
.eq-s{aspect-ratio:1;background:var(--cd);border:1px dashed var(--bd);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;gap:1px}
.eq-s.filled{border-style:solid}.eq-s .en{font-size:6px;color:var(--m);text-align:center}
.wm{position:relative;width:100%;height:280px;background:#0a0e08;border-radius:8px;border:1px solid var(--bd);overflow:hidden}
.wn{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;cursor:pointer;border:2px solid var(--bd);background:var(--cd);z-index:2;transition:transform .2s}
.wn:hover{transform:scale(1.12)}.wn.cl{border-color:var(--gn);background:rgba(34,197,94,.12)}
.wn.cur{border-color:var(--g);box-shadow:0 0 10px rgba(245,158,11,.4);animation:pu 2s infinite}
.wn.lk{opacity:.25;pointer-events:none}
@keyframes pu{0%,100%{box-shadow:0 0 10px rgba(245,158,11,.3)}50%{box-shadow:0 0 18px rgba(245,158,11,.6)}}
.mb{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(2px)}
.mo{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;box-shadow:0 16px 50px rgba(0,0,0,.9)}
.mo h3{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:9px}
.sr .sl{color:var(--m)}.sr .sv{font-weight:700}
#toast{position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:9999;background:rgba(12,14,18,.96);border:1px solid var(--g);border-radius:7px;padding:7px 12px;font-size:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.8);opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:85%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tkr{background:rgba(220,38,38,.1);border-bottom:1px solid rgba(220,38,38,.15);padding:2px 8px;font-size:8px;font-weight:700;color:#fca5a5;overflow:hidden;flex-shrink:0}
.tkr span{display:inline-block;animation:tk 16s linear infinite;white-space:nowrap}
@keyframes tk{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#tut{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px}
#tut.act{display:flex}
.tbox{background:var(--bg);border:2px solid var(--g);border-radius:12px;padding:16px;max-width:300px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.9)}
.tbox h3{font-size:14px;color:var(--g);margin-bottom:6px}.tbox p{font-size:11px;color:var(--m);margin-bottom:10px;line-height:1.4}
.tstp{font-size:9px;color:var(--m);margin-bottom:6px}
.bpc{min-width:48px;background:var(--cd);border:1px solid var(--bd);border-radius:5px;padding:4px 3px;text-align:center;flex-shrink:0;display:inline-block;margin:2px}
.bpc.cur{border-color:var(--g);background:rgba(245,158,11,.1)}.bpc.clm{opacity:.3}
.bpc .bl{font-size:7px;color:var(--m);display:block}.bpc .bi{font-size:14px;display:block;margin:1px 0}.bpc .ba{font-size:7px;font-weight:700}
.notif-bar{position:absolute;top:4px;left:6px;display:flex;flex-direction:column;gap:2px;z-index:30;pointer-events:none}
.notif-item{background:rgba(12,14,18,.95);border:1px solid var(--g);border-radius:5px;padding:3px 8px;font-size:8px;font-weight:700;animation:notifIn .3s ease;pointer-events:auto;cursor:pointer}
@keyframes notifIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.infected{animation:infPulse 1s infinite}
@keyframes infPulse{0%,100%{box-shadow:0 0 3px rgba(34,197,94,.3)}50%{box-shadow:0 0 8px rgba(34,197,94,.7)}}
.skill-tree{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skill-node{width:56px;text-align:center;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:4px;cursor:pointer}
.skill-node.unlocked{border-color:var(--g);background:rgba(245,158,11,.1)}
.skill-node .si{font-size:18px;display:block}.skill-node .sn{font-size:7px;font-weight:700;display:block;margin-top:2px}
.skill-node .slv{font-size:7px;color:var(--g)}
.evt-choice{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.evt-choice button{flex:1;min-width:80px}
.bestiary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.best-card{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px;text-align:center}
.best-card.discovered{border-color:var(--gn)}.best-card .bci{font-size:22px;display:block}.best-card .bcn{font-size:8px;font-weight:700;display:block}
.best-card .bck{font-size:7px;color:var(--g)}
.trade-row{display:flex;align-items:center;gap:4px;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px;margin-bottom:4px}
.trade-row .tarrow{font-size:14px;color:var(--g)}
.season-bar{display:flex;align-items:center;gap:3px;font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(20,24,30,.9);border:1px solid var(--bd)}
.brand{width:24px;height:28px;flex-shrink:0;color:#f59e0b;margin-right:2px}
</style>
</head>

initAudio(){try{this.aCtx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}},
startWind(){if(!this.aCtx||this.windGain)return;try{const ctx=this.aCtx;const g=ctx.createGain();g.gain.value=0;g.connect(ctx.destination);const buf=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);const d=buf.getChannelData(0);let p=0;for(let i=0;i<d.length;i++){p=(p+(Math.random()*2-1)*.018)/1.018;d[i]=p*3}const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;src.connect(f);f.connect(g);src.start();this.windGain=g}catch(e){}},
snd(type){if(!this.S.snd||!this.aCtx)return;if(this.aCtx.state==='suspended')this.aCtx.resume();const o=this.aCtx.createOscillator(),g=this.aCtx.createGain();o.connect(g);g.connect(this.aCtx.destination);const t=this.aCtx.currentTime;switch(type){case'build':o.frequency.setValueAtTime(440,t);o.frequency.linearRampToValueAtTime(880,t+.1);g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.2);o.start(t);o.stop(t+.2);break;case'click':o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.06,t);g.gain.linearRampToValueAtTime(0,t+.06);o.start(t);o.stop(t+.06);break;case'reward':o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.1);o.frequency.setValueAtTime(784,t+.2);g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.35);o.start(t);o.stop(t+.35);break;case'hit':o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.12);o.start(t);o.stop(t+.12);break;case'lvl':o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(554,t+.08);o.frequency.setValueAtTime(659,t+.16);o.frequency.setValueAtTime(880,t+.24);g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.4);o.start(t);o.stop(t+.4);break;case'err':o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.setValueAtTime(150,t+.08);g.gain.setValueAtTime(.08,t);g.gain.linearRampToValueAtTime(0,t+.15);o.start(t);o.stop(t+.15);break;case'alert':o.type='square';o.frequency.setValueAtTime(800,t);o.frequency.setValueAtTime(400,t+.15);o.frequency.setValueAtTime(800,t+.3);g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.4);o.start(t);o.stop(t+.4);break}},
toggleSound(){this.S.snd=!this.S.snd;document.getElementById('sb').textContent=this.S.snd?'🔊':'🔇';try{if(this.aCtx){if(this.aCtx.state==='suspended')this.aCtx.resume();this.startWind();this.windGain&&this.windGain.gain.setTargetAtTime(this.S.snd?.22:0,this.aCtx.currentTime,.5)}}catch(e){}this.save()},
toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),2500)},
save(){this.S.lastOn=Date.now();try{localStorage.setItem('tlp3',JSON.stringify(this.S))}catch(e){}},
load(){try{const d=localStorage.getItem('tlp3');if(d){const p=JSON.parse(d);this.S={...this.def(),...p};if(!this.S.bestiary)this.S.bestiary={};if(!this.S.skills)this.S.skills={};if(!this.S.alliance)this.S.alliance=null;if(!this.S.allyRep)this.S.allyRep=0;if(!this.S.npcDone)this.S.npcDone=[];if(!this.S.infected)this.S.infected={};if(!this.S.trades)this.S.trades=0;if(!this.S.mapEvtCd)this.S.mapEvtCd=0;if(!this.S.pets)this.S.pets=[];if(this.S.activePet===undefined)this.S.activePet=null;if(!this.S.lb)this.S.lb=[];if(this.S.disaster===undefined)this.S.disaster=null;if(!this.S.disasterCd)this.S.disasterCd=0;this.offlineCalc();return true}}catch(e){}return false},
offlineCalc(){const el=(Date.now()-(this.S.lastOn||Date.now()))/1e3;if(el<60)return;const sc=Math.min(el,28800);let gn={};const wm=this.getWeatherMult();const sm=this.getSeasonMult();Object.entries(this.BD).forEach(([k,b])=>{if(!b.pr)return;const lv=this.S.bld[k]||0;if(!lv)return;const cy=Math.floor(sc/b.pr.t);let am=cy*b.pr.a(lv);if(b.pr.r==='food')am=Math.floor(am*wm.farm*sm.farm);if(b.pr.r==='metal')am=Math.floor(am*(wm.metal||1));const r=b.pr.r;gn[r]=(gn[r]||0)+am;this.S.res[r]=Math.min(this.S.res[r]+am,this.S.caps[r])});this.S.energy=Math.min(this.S.energy+Math.floor(sc/300),this.S.maxE);if(Object.keys(gn).length)setTimeout(()=>this.showOff(gn,sc),500)},
showOff(gn,sc){const h=Math.floor(sc/3600),m=Math.floor(sc%3600/60);const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo" style="text-align:center"><h3>⏰ С возвращением!</h3><p class="cdd">Не было ${h?h+'ч ':''}${m}мин</p><div style="display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap">${Object.entries(gn).map(([r,v])=>`<span style="font-size:11px;font-weight:800;background:var(--cd);padding:3px 8px;border-radius:5px">${this.IC[r]}+${v}</span>`).join('')}</div><button class="bgn bf" onclick="this.closest('.mb').remove()">Забрать!</button></div>`;document.body.appendChild(el);this.snd('reward')},
// ===== WEATHER SYSTEM =====
getWeatherMult(){const w=this.WEATHER[this.S.weather]||this.WEATHER[0];return{farm:w.eff.farmMult||1,def:w.eff.defMult||1,exp:w.eff.expMult||1,zombie:w.eff.zombieMult||1,metal:w.eff.metalMult||1,energyDrain:w.eff.energyDrain||1}},
getSeasonMult(){const s=this.SEASONS[this.S.season]||this.SEASONS[0];return{farm:s.farmB,zombie:s.zombB}},
updateWeather(){this.S.weather=Math.random()*this.WEATHER.length|0;const w=this.WEATHER[this.S.weather];this.addNotif(`${w.i} Погода: ${w.n}`,'weather');this.updWeatherUI()},
updateSeason(){const si=Math.floor((this.S.day-1)/7)%4;if(si!==this.S.season){this.S.season=si;const s=this.SEASONS[si];this.toast(`${s.i} Сезон: ${s.n}!`);this.addNotif(`${s.i} Наступил ${s.n}`,'season')}},
updWeatherUI(){const w=this.WEATHER[this.S.weather]||this.WEATHER[0];document.getElementById('wthd').textContent=`${w.i}${w.n}`;const s=this.SEASONS[this.S.season]||this.SEASONS[0];document.getElementById('seasonBar').textContent=`${s.i}${s.n}`},
// ===== NOTIFICATION SYSTEM =====
addNotif(text,type){this.notifications.push({text,type,time:Date.now()});if(this.notifications.length>8)this.notifications.shift();this.renderNotifs()},
renderNotifs(){const bar=document.getElementById('notifBar');if(!bar)return;this.notifications=this.notifications.filter(n=>Date.now()-n.time<8000);bar.innerHTML=this.notifications.map(n=>`<div class="notif-item">${n.text}</div>`).join('');setTimeout(()=>this.renderNotifs(),5000)},
// ===== PARTICLE SYSTEM =====
spawnParticle(x,y,emoji,dur=1200){this.particles.push({x,y,emoji,start:Date.now(),dur,vx:(Math.random()-.5)*2,vy:-1.5-Math.random()*2})},
drawParticles(ctx){const now=Date.now();this.particles=this.particles.filter(p=>{const t=(now-p.start)/p.dur;if(t>=1)return false;ctx.globalAlpha=1-t;ctx.font=`${14*(1-t*.4)}px serif`;ctx.fillText(p.emoji,p.x+p.vx*t*50,p.y+p.vy*t*80);ctx.globalAlpha=1;return true})},
// ===== MAP ZOMBIES =====
spawnMapZombie(){if(this.mapZombies.length>=5)return;this.mapZombies.push({y:10+Math.random()*80,start:Date.now(),speed:3+Math.random()*4,type:this.ZT[Math.random()*3|0]})},
drawMapZombies(ctx,w,h){const now=Date.now();this.mapZombies=this.mapZombies.filter(z=>{const el=(now-z.start)/1000;const x=el/z.speed*w;if(x>w+30)return false;ctx.font='16px serif';ctx.save();ctx.translate(x,z.y/100*h);ctx.scale(-1,1);ctx.fillText(z.type.i,0,0);ctx.restore();return true})},
// ===== INFECTION SYSTEM =====
infectHero(heroId){if(Math.random()<.15){this.S.infected[heroId]={timer:Date.now()+300000};this.toast(`⚠️ ${this.S.heroes.find(h=>h.id===heroId)?.n||'Герой'} заражён!`);this.addNotif(`☣️ Герой заражён!`,'danger');this.snd('alert')}},
healHero(heroIdx){const h=this.S.heroes[heroIdx];if(!h||!this.S.infected[h.id])return;const hosp=this.S.bld.hosp||0;const cost={food:50-hosp*3,metal:30-hosp*2};if(this.S.res.food<Math.max(cost.food,10)||this.S.res.metal<Math.max(cost.metal,5))return this.toast('Мало ресурсов!'),this.snd('err');this.S.res.food-=Math.max(cost.food,10);this.S.res.metal-=Math.max(cost.metal,5);delete this.S.infected[h.id];this.snd('reward');this.toast(`💊 ${h.n} вылечен!`);this.updAll()},
checkInfections(){Object.entries(this.S.infected).forEach(([id,inf])=>{if(Date.now()>inf.timer){const hi=this.S.heroes.findIndex(h=>h.id===id);if(hi>=0){this.S.heroes.splice(hi,1);this.S.gar=this.S.gar.map(g=>g===id?null:g);this.toast(`💀 Герой погиб от заражения!`);this.addNotif(`💀 Потерян герой!`,'danger');this.calcPow();this.updAll()}delete this.S.infected[id]}})},
// ===== MARKET/TRADE SYSTEM =====
trade(idx,amount){const deal=this.MARKET_RATES[idx];if(!deal)return;const ml=this.S.bld.market||0;const allyBonus=this.S.alliance&&this.ALLIANCES.find(a=>a.id===this.S.alliance)?.bonus?.trade||0;const rate=Math.max(deal.rate*(1-ml*.02-allyBonus),deal.rate*.5);const cost=Math.ceil(amount*rate);if(this.S.res[deal.from]<cost)return this.toast('Мало ресурсов!'),this.snd('err');this.S.res[deal.from]-=cost;this.S.res[deal.to]=Math.min(this.S.res[deal.to]+amount,this.S.caps[deal.to]||999);if(!this.S.trades)this.S.trades=0;this.S.trades++;this.snd('click');this.toast(`${deal.i} -${cost}→+${amount}`);this.updAll()},
// ===== SKILL TREE SYSTEM =====
upgradeSkill(skillId){const sk=this.SKILL_TREE.find(s=>s.id===skillId);if(!sk)return;const cur=this.S.skills[skillId]||0;if(cur>=sk.mx)return this.toast('Макс уровень!');const cost=sk.co(cur);if(this.S.res.food<cost)return this.toast(`Нужно 🍖${cost}!`),this.snd('err');this.S.res.food-=cost;this.S.skills[skillId]=(this.S.skills[skillId]||0)+1;this.calcPow();this.snd('lvl');this.toast(`🌳 ${sk.n} → Ур.${this.S.skills[skillId]}!`);this.updAll()},
getSkillBonus(key){let total=0;this.SKILL_TREE.forEach(sk=>{const lv=this.S.skills[sk.id]||0;if(lv){const ef=sk.ef(lv);if(ef[key])total+=ef[key]}});return total},
// ===== BESTIARY SYSTEM =====
registerKill(zombieId){if(!this.S.bestiary[zombieId])this.S.bestiary[zombieId]=0;this.S.bestiary[zombieId]++;const cnt=this.S.bestiary[zombieId];if(cnt===10||cnt===50||cnt===100){const z=this.ZT.find(t=>t.id===zombieId);this.toast(`📖 ${z?.n||'Зомби'} изучен! +${cnt===10?5:cnt===50?10:15}% урона`);this.addNotif(`📖 Бестиарий обновлён!`,'info')}},
getBestiaryBonus(zombieId){const cnt=this.S.bestiary[zombieId]||0;return cnt>=100?.15:cnt>=50?.1:cnt>=10?.05:0},
// ===== MAP EVENTS SYSTEM =====
triggerMapEvent(){if(Date.now()<(this.S.mapEvtCd||0))return;if(Math.random()>.35)return;const evt=this.MAP_EVENTS[Math.random()*this.MAP_EVENTS.length|0];this.S.mapEvtCd=Date.now()+120000;this.showEventModal(evt)},
showEventModal(evt){const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo"><h3>${evt.i} ${evt.n}</h3><p class="cdd" style="margin-bottom:8px">${evt.d}</p><div class="evt-choice">${evt.ch.map((c,i)=>`<button class="${i===0?'bp2':'bs'}" onclick="G.resolveEvent('${evt.id}','${c.ef}');this.closest('.mb').remove()">${c.t}</button>`).join('')}</div></div>`;document.body.appendChild(el)},
resolveEvent(evtId,effect){switch(effect){case'addRandomHero':const pool=this.HR.filter(h=>!this.S.heroes.find(x=>x.id===h.id));if(pool.length){const hero={...pool[Math.random()*pool.length|0],lv:1,sk:[]};this.S.heroes.push(hero);this.toast(`🧑 ${hero.n} присоединился!`);this.snd('reward')}else{this.S.res.food+=50;this.toast('Все герои уже есть! +🍖50')}break;case'evtRes':this.S.res.food=Math.min(this.S.res.food+120,this.S.caps.food);this.S.res.wood=Math.min(this.S.res.wood+80,this.S.caps.wood);this.toast('🍖+120 🪵+80');this.snd('reward');break;case'evtBuy':if(this.S.res.gems>=20){this.S.res.gems-=20;const eq={...this.EP[Math.random()*this.EP.length|0]};this.S.inv.push(eq);this.toast(`💎-20 → ${eq.i}${eq.n}!`);this.snd('reward')}else this.toast('Мало 💎!');break;case'evtRob':if(Math.random()>.5){this.S.res.gems=Math.min(this.S.res.gems+30,999);this.toast('😈 Ограбление удалось! +💎30');this.snd('reward')}else{this.S.rating=Math.max(0,this.S.rating-50);this.S.wHP=Math.max(0,this.S.wHP-20);this.toast('💀 Неудача! -50 рейтинг, -20 HP');this.snd('hit')}break;case'evtCache':if(Math.random()>.3){this.S.res.metal=Math.min(this.S.res.metal+80,this.S.caps.metal);this.toast('⚙+80!');this.snd('reward')}else{this.S.wHP=Math.max(0,this.S.wHP-15);this.toast('Засада! 🧱-15HP');this.snd('hit')}break;case'evtRadio':if(this.S.energy>=30){this.S.energy-=30;const unrevealed=this.MN.filter(m=>!this.S.mapRev.includes(m.id));if(unrevealed.length){const zone=unrevealed[0];this.S.mapRev.push(zone.id);this.toast(`🗺 Открыта зона: ${zone.n}!`);this.snd('reward')}else{this.S.res.gems=Math.min(this.S.res.gems+10,999);this.toast('Всё открыто! +💎10')}}else this.toast('Мало ⚡!');break;case'evtMerchEq':if(this.S.res.gems>=30){this.S.res.gems-=30;const rare=this.EP.filter(e=>e.r==='rare'||e.r==='epic');const eq={...rare[Math.random()*rare.length|0]};this.S.inv.push(eq);this.toast(`${eq.i} ${eq.n} куплено!`);this.snd('reward')}else this.toast('Мало 💎!');break;case'evtMerchRes':if(this.S.res.gems>=15){this.S.res.gems-=15;this.S.res.food=Math.min(this.S.res.food+200,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+100,this.S.caps.metal);this.toast('🍖+200 ⚙+100!');this.snd('reward')}else this.toast('Мало 💎!');break;case'evtFight':const pw=this.S.power;const zp=30+this.S.wave*10;if(pw>zp){this.S.kills+=5;this.S.res.food=Math.min(this.S.res.food+100,this.S.caps.food);this.toast('⚔ Победа! +5💀 +🍖100');this.snd('reward')}else{this.S.wHP=Math.max(0,this.S.wHP-30);this.toast('💀 Поражение! 🧱-30HP');this.snd('hit')}break;case'evtFlee':if(this.S.energy>=20){this.S.energy-=20;this.toast('🏃 Сбежали! -⚡20')}else{this.S.wHP=Math.max(0,this.S.wHP-15);this.toast('Не хватило ⚡! 🧱-15HP');this.snd('hit')}break;case'none':break}this.updAll()},
// ===== ALLIANCE SYSTEM =====
joinAlliance(id){this.S.alliance=id;this.S.allyRep=0;const a=this.ALLIANCES.find(x=>x.id===id);this.toast(`🤝 Вступили в ${a.n}!`);this.snd('reward');this.addNotif(`🤝 Альянс: ${a.n}`,'info');this.updAll()},
allyDonate(res,amount){if(this.S.res[res]<amount)return this.toast('Мало ресурсов!'),this.snd('err');this.S.res[res]-=amount;this.S.allyRep+=Math.floor(amount/10);this.addXP(5);this.toast(`🤝 +${Math.floor(amount/10)} репутации`);this.updAll()},
// ===== NPC MISSIONS =====
completeNPC(idx){const m=this.NPC_MISSIONS[idx];if(!m||this.S.npcDone.includes(m.id))return;for(const[r,v]of Object.entries(m.req))if(this.S.res[r]<v)return this.toast('Мало ресурсов!'),this.snd('err');for(const[r,v]of Object.entries(m.req))this.S.res[r]-=v;Object.entries(m.rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.S.npcDone.push(m.id);this.addXP(20);this.snd('reward');this.toast(`✅ ${m.npc}: Спасибо!`);this.updAll()},
// ===== ZOMBIE RAIDS =====
checkZombieRaid(){if(this.S.hour===22&&Math.random()<.3+this.S.wave*.03){const sm=this.getSeasonMult();const str=(this.S.wave*15+Math.random()*50)*sm.zombie;this.snd('alert');this.toast('🚨 НОЧНОЙ РЕЙД ЗОМБИ!');this.addNotif('🚨 Рейд зомби!','danger');this.autoDefend(str)}},
autoDefend(strength){const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);const ds=gh.reduce((s,h)=>s+(h.a+h.d)*h.lv,0)+(this.S.bld.wall||0)*10+this.S.power*.1;const won=ds>strength*.8;const dmg=won?Math.max(5,strength*.2|0):strength*.6|0;this.S.wHP=Math.max(0,this.S.wHP-dmg);if(won){const zk=3+Math.random()*5|0;this.S.kills+=zk;const zt=this.ZT[Math.random()*3|0];this.registerKill(zt.id);this.S.log.unshift(`✅ Рейд отбит! 💀${zk} 🧱-${dmg}`);if(gh.length)this.infectHero(gh[Math.random()*gh.length|0].id)}else{this.S.log.unshift(`❌ Рейд! 🧱-${dmg} ⚔${ds|0}vs🧟${strength|0}`)}this.S.log=this.S.log.slice(0,30);this.updAll()},
// ===== SALVAGE SYSTEM =====
salvageItem(invIdx){const item=this.S.inv[invIdx];if(!item)return;const rarity={common:1,uncommon:2,rare:3,epic:5,legendary:10};const mult=rarity[item.r]||1;this.S.res.metal=Math.min(this.S.res.metal+10*mult,this.S.caps.metal);this.S.inv.splice(invIdx,1);this.snd('click');this.toast(`♻️ +${10*mult}⚙`);this.updAll()},
// ===== TUTORIAL =====
TUTS:[{t:'Добро пожаловать!',d:'Мир захватили зомби. Постройте базу и защитите выживших!'},{t:'Постройте ферму',d:'Вкладка "База"→"Здания"→ постройте Ферму для еды.'},{t:'Наберите героя',d:'"Герои"→"Набор"→ потратьте 💎 для получения бойца.'},{t:'Назначьте гарнизон',d:'"Гарнизон"→ назначьте героев для защиты.'},{t:'Отразите волну!',d:'"Бой"→"Оборона"→ отразите первую волну зомби!'},{t:'Готово! 🎉',d:'Исследуйте карту, крафтите, торгуйте. Удачи!'}],
showTut(){if(this.S.tutDone)return;const s=this.TUTS[this.S.tutStep];if(!s){this.S.tutDone=true;this.save();document.getElementById('tut').classList.remove('act');return}document.getElementById('tut').innerHTML=`<div class="tbox"><div class="tstp">Шаг ${this.S.tutStep+1}/${this.TUTS.length}</div><h3>${s.t}</h3><p>${s.d}</p><button class="bp2" onclick="G.nextTut()">Далее →</button>${this.S.tutStep>0?'<button class="bs" onclick="G.skipTut()" style="margin-top:4px;font-size:8px">Пропустить</button>':''}</div>`;document.getElementById('tut').classList.add('act')},
nextTut(){this.S.tutStep++;if(this.S.tutStep>=this.TUTS.length){this.S.tutDone=true;this.S.res.gems+=30;this.toast('🎁 +💎30 за туториал!');this.snd('lvl');document.getElementById('tut').classList.remove('act');this.save();this.updAll();return}this.showTut()},
skipTut(){this.S.tutDone=true;document.getElementById('tut').classList.remove('act');this.save()},
// ===== CORE =====
init(){if(!this.load()){this.S=this.def();this.S.heroes.push({...this.HR[10],lv:1,sk:[]})}if(!this.S.heroes.length)this.S.heroes.push({...this.HR[10],lv:1,sk:[]});if(!this.S.bld.hq)this.S.bld.hq=1;this.initAudio();this.calcPow();this.rTabs();this.rSubs();this.rPanel();this.updTop();this.updQ();this.updWeatherUI();this.initCv();this.startLoop();if(!this.S.tutDone)setTimeout(()=>this.showTut(),600);this.save()},
addXP(a){this.S.xp+=a;while(this.S.xp>=this.S.xpN){this.S.xp-=this.S.xpN;this.S.lvl++;this.S.xpN=Math.floor(this.S.xpN*1.4);this.S.maxE+=5;this.S.energy=this.S.maxE;this.toast(`🎉 Уровень ${this.S.lvl}!`);this.snd('lvl')}this.updTop()},
addBPXP(a){this.S.bpXP+=a;while(this.S.bpXP>=50+this.S.bpLvl*20){this.S.bpXP-=50+this.S.bpLvl*20;this.S.bpLvl++;this.addNotif(`🎫 Battle Pass → Ур.${this.S.bpLvl}`,'bp')}},
calcPow(){let p=0;this.S.heroes.forEach(h=>{let a=h.a,d=h.d;a*=(1+this.getSkillBonus('atkMul')+this.getPetBonus('atkMul'));d*=(1+this.getSkillBonus('hpMul')+this.getPetBonus('hpMul'));const eq=this.S.equip[h.id];if(eq)Object.values(eq).forEach(e=>{if(e){a+=e.a||0;d+=e.d||0}});const sb=this.getSetBonus(h.id);a+=sb.a;d+=sb.d;p+=(a+d)*h.lv});Object.entries(this.S.bld).forEach(([k,lv])=>{if(k==='bar')p+=lv*10;if(k==='wall')p+=lv*5});Object.keys(this.S.techs).forEach(()=>p+=15);if(this.S.alliance){const ab=this.ALLIANCES.find(a=>a.id===this.S.alliance);if(ab?.bonus?.atk)p*=(1+ab.bonus.atk)}this.S.power=Math.floor(p)},
updTop(){document.getElementById('pn2').textContent=this.S.name;document.getElementById('plv').textContent=this.S.lvl;document.getElementById('ppw').textContent=this.S.power;document.getElementById('pxp').style.width=Math.min(this.S.xp/this.S.xpN*100,100)+'%';document.getElementById('rf').textContent=this.S.res.food;document.getElementById('rw').textContent=this.S.res.wood;document.getElementById('rm').textContent=this.S.res.metal;document.getElementById('rg').textContent=this.S.res.gems;document.getElementById('re').textContent=this.S.energy;const nt=this.S.hour>=20||this.S.hour<6;document.getElementById('dn').textContent=`${nt?'🌙':'☀'}Д${this.S.day}`},
updQ(){const q=this.QU[this.S.ch-1];if(!q)return;document.getElementById('qc').textContent=`Глава ${this.S.ch}: ${q.t}`;const cs=q.st[this.S.qs];document.getElementById('qo').textContent=cs?cs.t:'Завершено!'},
tab(t,s){this.S.tab=t;this.S.sub=s||this.SUBS[t][0];this.snd('click');this.rTabs();this.rSubs();this.rPanel();this.save()},
sub(s){this.S.sub=s;this.snd('click');this.rSubs();this.rPanel()},
rTabs(){document.getElementById('tbar').innerHTML=this.TABS.map(t=>`<button class="tbn${t.id===this.S.tab?' act':''}" onclick="G.tab('${t.id}')"><span class="ti">${t.i}</span>${t.l}</button>`).join('')},
rSubs(){const subs=this.SUBS[this.S.tab]||[];document.getElementById('stabs').innerHTML=subs.map(s=>`<button class="stn${s===this.S.sub?' act':''}" onclick="G.sub('${s}')">${this.SL[s]}</button>`).join('')},
rPanel(){const p=document.getElementById('pn');switch(this.S.sub){case'buildings':p.innerHTML=this.rBuildings();break;case'tech':p.innerHTML=this.rTech();break;case'craft':p.innerHTML=this.rCraft();break;case'inv':p.innerHTML=this.rInv();break;case'trade':p.innerHTML=this.rTrade();break;case'roster':p.innerHTML=this.rRoster();break;case'recruit':p.innerHTML=this.rRecruit();break;case'gar':p.innerHTML=this.rGar();break;case'pets':p.innerHTML=this.rPets();break;case'skills':p.innerHTML=this.rSkills();break;case'exp':p.innerHTML=this.rExp();break;case'world':p.innerHTML=this.rWorld();break;case'events':p.innerHTML=this.rEvents();break;case'bestiary':p.innerHTML=this.rBestiary();break;case'def':p.innerHTML=this.rDef();break;case'arena':p.innerHTML=this.rArena();break;case'lb':p.innerHTML=this.rLb();break;case'log':p.innerHTML=this.rLog();break;case'raids':p.innerHTML=this.rRaids();break;case'quests':p.innerHTML=this.rQuests();break;case'daily':p.innerHTML=this.rDaily();break;case'ach':p.innerHTML=this.rAch();break;case'bp':p.innerHTML=this.rBP();break;case'ally':p.innerHTML=this.rAlly();break;case'npc':p.innerHTML=this.rNPC();break;case'stats':p.innerHTML=this.rStats();break;default:p.innerHTML='<div class="cdd">Скоро...</div>'}},
// ===== RENDER FUNCTIONS =====
rBuildings(){return`<div class="g2">${Object.entries(this.BD).map(([k,b])=>{const lv=this.S.bld[k]||0;if(this.isLocked(k)){return`<div class="cd" style="opacity:.55"><div class="ch"><span class="ct">🔒 ${b.n}</span><span class="bg bg-r">Туман</span></div><div class="cdd">${b.d}</div><div class="cdd" style="color:var(--g)">Откроется: Ратуша Ур.${this.REVEAL[k]}</div></div>`}const nl=lv+1;const co=nl<=b.mx?b.c(nl):{};const ca=Object.entries(co).every(([r,v])=>this.S.res[r]>=v);const mx=lv>=b.mx;return`<div class="cd${lv?' hl':''}"><div class="ch"><span class="ct">${b.i} ${b.n}</span>${lv?`<span class="bg bg-g">Ур.${lv}</span>`:'<span class="bg bg-r">Нет</span>'}</div><div class="cdd">${b.d}</div>${lv?`<div class="cdd" style="color:#4ade80">${b.e(lv)}</div>`:''}<div class="cc">${!mx?Object.entries(co).map(([r,v])=>`<span style="color:${this.S.res[r]>=v?'#4ade80':'#f87171'}">${this.IC[r]}${v}</span>`).join(' '):'MAX'}</div><button class="${ca&&!mx?'bp2':'bs'} bf" ${!ca||mx?'disabled':''} onclick="G.build('${k}')">${lv?'⬆Улучшить':'🔨Построить'}</button></div>`}).join('')}</div>`},
rTech(){return`<div class="sec">🔬 Технологии</div><div class="g2">${this.TC.map(t=>{const done=this.S.techs[t.id];const ll=this.S.bld.lab||0;const rq=ll>=t.rq;const ca=rq&&Object.entries(t.co).every(([r,v])=>this.S.res[r]>=v);return`<div class="cd${done?' hl':''}"><div class="ct">${t.i} ${t.n} ${done?'✅':''}</div><div class="cdd">${t.d}</div><div class="cdd">Лаб Ур.${t.rq}${rq?' ✅':' ❌'}</div><div class="cc">${Object.entries(t.co).map(([r,v])=>`<span style="color:${this.S.res[r]>=v?'#4ade80':'#f87171'}">${this.IC[r]}${v}</span>`).join(' ')}</div><button class="${ca&&!done?'bb':'bs'} bf" ${!ca||done?'disabled':''} onclick="G.research('${t.id}')">${done?'Изучено':'🔬Изучить'}</button></div>`}).join('')}</div>`},
rCraft(){return`<div class="sec">🔨 Крафт</div><div class="g2">${this.CR.map((r,i)=>{const ep=this.EP.find(e=>e.id===r.res);const ca=Object.entries(r.mt).every(([m,v])=>this.S.res[m]>=v);return`<div class="cd"><div class="ct">${r.i} ${r.n}</div><div class="cdd">${ep?`${ep.r} · ⚔${ep.a} 🛡${ep.d}`:''}</div><div class="cc">${Object.entries(r.mt).map(([m,v])=>`<span style="color:${this.S.res[m]>=v?'#4ade80':'#f87171'}">${this.IC[m]}${v}</span>`).join(' ')}</div><button class="${ca?'bgn':'bs'} bf" ${ca?'':'disabled'} onclick="G.craft(${i})">🔨Крафтить</button></div>`}).join('')}</div>`},
rInv(){return`<div class="sec">🎒 Инвентарь (${this.S.inv.length})</div>${this.S.inv.length?`<div class="g2">${this.S.inv.map((item,i)=>`<div class="cd"><div class="ch"><span class="ct">${item.i} ${item.n}</span><span class="bg bg-${item.r==='legendary'?'g':item.r==='epic'?'p':item.r==='rare'?'b':'gn'}">${item.r}</span></div><div class="cdd">⚔${item.a||0} 🛡${item.d||0} · ${item.sl}</div><div style="display:flex;gap:3px"><button class="bs" style="flex:1;font-size:8px" onclick="G.showEquipModal(${i})">Экипировать</button><button class="bs" style="font-size:8px;color:#f87171" onclick="G.salvageItem(${i})">♻️</button></div></div>`).join('')}</div>`:'<div class="cdd" style="text-align:center;padding:20px">Пусто. Крафтите или находите предметы!</div>'}`},
rTrade(){const ml=this.S.bld.market||0;return`<div class="sec">🏪 Рынок ${ml?`(Ур.${ml} · -${ml*2}% комиссия)`:''}</div>${!ml?'<div class="cdd" style="text-align:center;padding:20px">Постройте Рынок для обмена ресурсов!</div>':`<div class="g1">${this.MARKET_RATES.map((d,i)=>{const rates=[10,25,50,100];return`<div class="trade-row"><span style="font-size:12px">${this.IC[d.from]}</span><span class="tarrow">→</span><span style="font-size:12px">${this.IC[d.to]}</span><span class="cdd" style="flex:1;margin:0 4px">1:${d.rate}</span><div style="display:flex;gap:2px">${rates.map(a=>`<button class="bs" style="padding:2px 5px;font-size:8px" onclick="G.trade(${i},${a})">+${a}</button>`).join('')}</div></div>`}).join('')}</div><div class="cdd" style="margin-top:6px">Обменов: ${this.S.trades||0}</div>`}`},
rRoster(){return`<div class="sec">♙ Отряд (${this.S.heroes.length})</div><div class="g1">${this.S.heroes.map((h,i)=>{const inf=this.S.infected[h.id];return`<div class="hr${inf?' infected':''}"><div class="hi ${h.r}">${h.i}</div><div class="hf"><div class="hn">${h.n} <span class="bg bg-${h.r==='legendary'?'g':h.r==='epic'?'p':'b'}">Ур.${h.lv}</span>${inf?'<span class="bg bg-r">☣️</span>':''}</div><div class="hc">${h.c} · ${h.r}</div><div class="hs">⚔${h.a*h.lv} 🛡${h.d*h.lv} ❤${h.h*h.lv} · ${h.sk}</div></div><div style="display:flex;flex-direction:column;gap:2px">${inf?`<button class="bs" style="font-size:8px;color:#4ade80" onclick="G.healHero(${i})">💊Лечить</button>`:`<button class="bp2" style="font-size:8px" onclick="G.lvlHero(${i})">⬆🍖${h.lv*25}</button>`}<button class="bs" style="font-size:8px" onclick="G.toFirstG(${i})">🛡→</button></div></div>`}).join('')}</div>`},
rRecruit(){return`<div class="sec">🎰 Набор героев</div><div class="g2"><div class="cd hl"><div class="ct">🎰 Обычный</div><div class="cdd">1 герой · 💎50</div><button class="bp2 bf" ${this.S.res.gems<50?'disabled':''} onclick="G.recruit('s')">Набрать</button></div><div class="cd hl"><div class="ct">🎰 Премиум x5</div><div class="cdd">5 героев · 💎200</div><button class="bv bf" ${this.S.res.gems<200?'disabled':''} onclick="G.recruit('m')">Набрать</button></div></div><div class="sec">Шансы</div><div class="cdd">⬜Common 50% · 🟦Rare 30% · 🟪Epic 15% · 🟨Legendary 5%</div>`},
rGar(){return`<div class="sec">🛡 Гарнизон</div><div class="g1">${this.S.gar.map((g,i)=>{const h=g?this.S.heroes.find(x=>x.id===g):null;return`<div class="hr${h?' sel':''}"><div class="hi ${h?h.r:'common'}">${h?h.i:'➕'}</div><div class="hf"><div class="hn">${h?h.n:`Слот ${i+1}`}</div>${h?`<div class="hc">⚔${h.a*h.lv} 🛡${h.d*h.lv}</div>`:''}</div>${h?`<button class="bs" style="font-size:8px" onclick="G.remG(${i})">✖</button>`:''}</div>`}).join('')}</div><div class="sec">Назначить</div><div class="g2">${this.S.heroes.filter(h=>!this.S.gar.includes(h.id)).map((h,i)=>`<button class="bs" onclick="G.toFirstG(${this.S.heroes.indexOf(h)})">${h.i}${h.n}</button>`).join('')||'<div class="cdd">Все назначены</div>'}</div>`},
rPets(){const owned=this.S.pets||[];return`<div class="sec">🐾 Питомцы (${owned.length})</div><div class="cd hl"><div class="ct">🎁 Приручить питомца</div><div class="cdd">Случайный питомец · 💎80</div><button class="bp2 bf" ${this.S.res.gems<80?'disabled':''} onclick="G.recruitPet()">Приручить</button></div>${owned.length?`<div class="g2">${owned.map((pt,i)=>`<div class="cd${this.S.activePet===pt.id?' hl':''}"><div class="ch"><span class="ct">${pt.i} ${pt.n}</span><span class="bg bg-${pt.r==='legendary'?'g':pt.r==='epic'?'p':pt.r==='rare'?'b':'gn'}">${pt.r}</span></div><div class="cdd">${Object.entries(pt.bonus).map(([k,v])=>`${k}:+${Math.round(v*100)}%`).join(' ')}</div><button class="${this.S.activePet===pt.id?'bs':'bgn'} bf" style="font-size:8px" onclick="G.setActivePet('${pt.id}')">${this.S.activePet===pt.id?'✅ Активен':'Активировать'}</button></div>`).join('')}</div>`:'<div class="cdd" style="text-align:center;padding:14px">Нет питомцев. Приручите первого!</div>'}`},
rSkills(){const cats={combat:'⚔ Боевые',survival:'❤ Выживание',utility:'🔧 Утилиты'};return`<div class="sec">🌳 Древо навыков</div>${Object.entries(cats).map(([cat,label])=>`<div class="cdd" style="font-weight:700;margin:6px 0 4px;color:var(--g)">${label}</div><div class="skill-tree">${this.SKILL_TREE.filter(s=>s.cat===cat).map(sk=>{const lv=this.S.skills[sk.id]||0;const mx=lv>=sk.mx;const cost=sk.co(lv);const ca=this.S.res.food>=cost&&!mx;return`<div class="skill-node${lv?' unlocked':''}" onclick="${ca?`G.upgradeSkill('${sk.id}')`:''}"><span class="si">${sk.i}</span><span class="sn">${sk.n}</span><span class="slv">${lv}/${sk.mx}</span><span class="sn" style="color:var(--m)">${mx?'MAX':'🍖'+cost}</span></div>`}).join('')}</div>`).join('')}`},
rExp(){return`<div class="sec">🧭 Экспедиции (${this.S.exps.length}/3)</div>${this.S.exps.length?`<div class="g1">${this.S.exps.map((e,i)=>{const rem=Math.max(0,e.et-Date.now());const done=rem<=0;const pct=done?100:Math.min(100,((Date.now()-e.st)/(e.et-e.st))*100);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${e.i} ${e.n}</span>${done?'<span class="bg bg-gn">Готово!</span>':`<span class="bg bg-b">${Math.ceil(rem/1000)}с</span>`}</div><div class="pb"><div class="pf pfb" style="width:${pct}%"></div></div><div class="cc">${Object.entries(e.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${done?`<button class="bgn bf" onclick="G.collectExp(${i})">Забрать!</button>`:''}</div>`}).join('')}</div>`:''}<div class="sec">Доступные</div><div class="g2">${this.EX.map((e,i)=>`<div class="cd"><div class="ct">${e.i} ${e.n}</div><div class="cdd">⏱${e.dur}с · ☠${e.dg} · ⚡${e.en}</div><div class="cc">${Object.entries(e.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div><button class="bb bf" ${this.S.energy<e.en||this.S.exps.length>=3?'disabled':''} onclick="G.startExp(${i})">🧭Отправить</button></div>`).join('')}</div>`},
rWorld(){return`<div class="sec">🌍 Мировая карта</div><div class="wm" id="worldMap">${this.MN.map(n=>{const rev=this.S.mapRev.includes(n.id);const cur=n.id==='base';return`<div class="wn${rev?' cl':''}${cur?' cur':''}${!rev?' lk':''}" style="left:${n.x}%;top:${n.y}%;transform:translate(-50%,-50%)" onclick="${rev?`G.exploreZone('${n.id}')`:''}"><span>${n.i}</span></div>`}).join('')}</div><div class="cdd" style="margin-top:4px">Открыто ${this.S.mapRev.length}/${this.MN.length} зон</div>`},
rEvents(){const disB=this.S.disaster?(()=>{const d=this.DISASTERS.find(x=>x.id===this.S.disaster.id);if(!d)return'';const rem=Math.max(0,Math.ceil((this.S.disaster.end-Date.now())/1000));return `<div class="cd hl" style="border-color:var(--r)"><div class="ct">${d.i} ${d.n} · ⏱${rem}с</div><div class="cdd">${d.d}</div><div class="cc">${Object.entries(d.cost).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div><button class="bp2 bf" onclick="G.resolveDisaster()">🚒 Устранить</button></div>`})():'';return`<div class="sec">🎪 События</div>${disB}<div class="cd hl"><div class="ct">🎲 Случайное событие</div><div class="cdd">Исследуйте мир для поиска событий. Каждая экспедиция может вызвать событие!</div><button class="bp2 bf" ${this.S.energy<15?'disabled':''} onclick="G.forceEvent()">🔍 Искать событие (⚡15)</button></div><div class="sec">Погода и сезоны</div><div class="cd"><div class="ct">${this.WEATHER[this.S.weather].i} ${this.WEATHER[this.S.weather].n}</div><div class="cdd">${Object.entries(this.WEATHER[this.S.weather].eff).map(([k,v])=>`${k}: x${v}`).join(', ')||'Без эффектов'}</div></div><div class="cd"><div class="ct">${this.SEASONS[this.S.season].i} ${this.SEASONS[this.S.season].n}</div><div class="cdd">Ферма x${this.SEASONS[this.S.season].farmB} · Зомби x${this.SEASONS[this.S.season].zombB}</div></div>`},
rBestiary(){return`<div class="sec">📖 Бестиарий</div><div class="bestiary-grid">${this.ZT.map(z=>{const cnt=this.S.bestiary[z.id]||0;const disc=cnt>0;const bonus=this.getBestiaryBonus(z.id);return`<div class="best-card${disc?' discovered':''}"><span class="bci">${disc?z.i:'❓'}</span><span class="bcn">${disc?z.n:'???'}</span><span class="bck">${disc?`💀${cnt} · +${Math.round(bonus*100)}%`:'Не обнаружен'}</span></div>`}).join('')}</div><div class="cdd" style="margin-top:6px">Убивайте зомби для изучения. 10/50/100 убийств = +5/10/15% урон.</div>`},
rDef(){const wm=this.WAVE_MODS[this.S.wave%5===0?4:this.S.wave%7===0?5:0];const sm=this.getSeasonMult();return`<div class="sec">🧱 Оборона · Волна ${this.S.wave}</div><div class="cd hl"><div class="ch"><span class="ct">🧱 Стена</span><span class="bg bg-${this.S.wHP>this.S.wMax*.5?'gn':this.S.wHP>this.S.wMax*.25?'g':'r'}">${this.S.wHP}/${this.S.wMax}</span></div><div class="pb"><div class="pf ${this.S.wHP>this.S.wMax*.5?'pfgr':'pfr'}" style="width:${this.S.wHP/this.S.wMax*100}%"></div></div>${this.S.wHP<this.S.wMax?`<button class="bs bf" onclick="G.repairWall()">🔧Ремонт (🪵50⚙30)</button>`:''}</div><div class="cd"><div class="ct">${wm.i} Модификатор: ${wm.n}</div><div class="cdd">${wm.d||'Обычная волна'}${wm.mult>1?` · Сила x${wm.mult}`:''}</div><div class="cdd">Сезон: ${this.SEASONS[this.S.season].i} Зомби x${sm.zombie}</div></div><div class="cd"><div class="ct">⚔ Ваша сила: ${this.S.power}</div><div class="cdd">Гарнизон: ${this.S.gar.filter(g=>g).length}/5</div></div>${wm.id==='boss'?(()=>{const boss=this.BOSSES[Math.max(0,Math.floor(this.S.wave/5)-1)%this.BOSSES.length];return `<div class="cd hl" style="border-color:var(--r)"><div class="ct">👑 БОСС: ${boss.i} ${boss.n}</div><div class="cdd">Особый враг этой волны! Гарантированная эпическая+ награда.</div></div><button class="bv bf" ${!this.S.bld.wall||!this.S.gar.some(g=>g)?'disabled':''} onclick="G.fightBoss()">👑 СРАЗИТЬСЯ С БОССОМ</button>`})():`<button class="bp2 bf" ${!this.S.bld.wall||!this.S.gar.some(g=>g)?'disabled':''} onclick="G.simDef()">⚔ ОТРАЗИТЬ ВОЛНУ ${this.S.wave}!</button>`}`},
rArena(){return`<div class="sec">🏟 PvP Арена</div><div class="cd hl"><div class="ct">🏆 Рейтинг: ${this.S.rating}</div><div class="cdd">Ваша сила: ⚔${this.S.power}</div></div><button class="bv bf" ${!this.S.gar.some(g=>g)?'disabled':''} onclick="G.pvp()">⚔ Найти противника</button>`},
rLb(){this.genLb();const list=[...this.S.lb,{n:this.S.name+' (Вы)',rating:this.S.rating,me:true}].sort((a,b)=>b.rating-a.rating);return`<div class="sec">🏆 Таблица лидеров</div><div class="g1">${list.map((p,i)=>`<div class="cd${p.me?' hl':''}"><div class="ch"><span class="ct">#${i+1} ${p.n}</span><span class="bg bg-g">🏆${Math.round(p.rating)}</span></div>${!p.me?`<button class="bs bf" style="font-size:8px" onclick="G.pvpAttack('${p.n}')">⚔ Атаковать</button>`:''}</div>`).join('')}</div>`},
rLog(){return`<div class="sec">📜 Журнал</div><div class="g1">${this.S.log.length?this.S.log.map(l=>`<div class="cdd" style="padding:3px;border-bottom:1px solid rgba(255,255,255,.03)">${l}</div>`).join(''):'<div class="cdd">Пусто</div>'}</div>`},
rRaids(){return`<div class="sec">💀 Ночные рейды</div><div class="cd"><div class="ct">🌙 Авто-рейды</div><div class="cdd">Каждую ночь (22:00) зомби могут атаковать! Вероятность: ${Math.round((30+this.S.wave*3))}%</div><div class="cdd" style="color:var(--g)">Совет: укрепляйте стену и назначайте гарнизон!</div></div><div class="cd"><div class="ct">📊 Статистика рейдов</div><div class="cdd">${this.S.log.filter(l=>l.includes('Рейд')).slice(0,5).map(l=>`<div style="padding:2px 0">${l}</div>`).join('')||'Рейдов пока не было'}</div></div>`},
rQuests(){const q=this.QU[this.S.ch-1];if(!q)return'<div class="cdd">Все главы пройдены! 🎉</div>';return`<div class="sec">📋 Глава ${this.S.ch}: ${q.t}</div><div class="g1">${q.st.map((s,i)=>{const done=i<this.S.qs;const cur=i===this.S.qs;const ck=s.ck(this.S);return`<div class="cd${done?' hl':''}${cur&&ck?' hl':''}"><div class="ch"><span class="ct">${done?'✅':cur?'👉':'🔒'} ${s.t}</span></div>${cur&&ck?`<button class="bgn bf" onclick="G.advQ()">Завершить!</button>`:''}</div>`}).join('')}</div>`},
rDaily(){const di=this.S.day%7;const claimed=this.S.daily>=this.S.day;return`<div class="sec">🎁 Ежедневные награды</div><div style="display:flex;flex-wrap:wrap;gap:4px">${this.DA.map((d,i)=>`<div class="bpc${i===di?' cur':''}${claimed&&i===di?' clm':''}"><span class="bl">День ${i+1}</span><span class="bi">${d.i}</span><span class="ba">${d.a}</span></div>`).join('')}</div>${!claimed?`<button class="bp2 bf" style="margin-top:6px" onclick="G.claimDaily()">🎁 Забрать награду дня!</button>`:'<div class="cdd" style="margin-top:6px;text-align:center">✅ Получено сегодня</div>'}`},
rAch(){return`<div class="sec">🏆 Достижения</div><div class="g1">${this.AC.map(a=>{const done=this.S.achs[a.id];const ck=a.ck(this.S);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${a.i} ${a.n}</span>${done?'<span class="bg bg-gn">✅</span>':ck?'<span class="bg bg-g">Готово!</span>':''}</div><div class="cdd">${a.d} → ${Object.entries(a.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${ck&&!done?`<button class="bgn bf" onclick="G.claimAch('${a.id}')">Забрать!</button>`:''}</div>`}).join('')}</div><div class="sec">Многоуровневые</div><div class="g1">${Object.entries(this.ACH_TIERS).map(([key,tiers])=>{const val=key==='kills'?this.S.kills:key==='built'?this.S.built:key==='heroes'?this.S.heroes.length:key==='waves'?this.S.wave:this.S.crafted;const cur=tiers.findIndex(t=>val<t);const tier=cur===-1?tiers.length:cur;return`<div class="cd"><div class="ct">${key==='kills'?'💀':key==='built'?'🏗':key==='heroes'?'👥':key==='waves'?'🌊':'🔨'} ${key} · Тир ${tier}/${tiers.length}</div><div class="pb"><div class="pf pfg" style="width:${Math.min(100,val/(tiers[cur]||tiers[tiers.length-1])*100)}%"></div></div><div class="cdd">${val}/${tiers[cur]||'MAX'}</div></div>`}).join('')}</div>`},
rBP(){return`<div class="sec">🎫 Battle Pass · Ур.${this.S.bpLvl}</div><div class="pb" style="margin-bottom:6px"><div class="pf pfg" style="width:${this.S.bpXP/(50+this.S.bpLvl*20)*100}%"></div></div><div class="cdd" style="margin-bottom:6px">XP: ${this.S.bpXP}/${50+this.S.bpLvl*20}</div><div style="display:flex;flex-wrap:wrap;gap:4px">${Array.from({length:20},(_, i)=>{const lv=i+1;const cl=this.S.bpCl.includes(lv);const avail=this.S.bpLvl>=lv;const special=lv%5===0;return`<div class="bpc${avail&&!cl?' cur':''}${cl?' clm':''}" style="${special?'border-color:var(--p)':''}"><span class="bl">Ур.${lv}</span><span class="bi">${special?'💎':'🍖'}</span><span class="ba">${special?10:50+lv*10}</span>${avail&&!cl?`<button class="bs" style="font-size:7px;margin-top:2px" onclick="G.claimBP(${lv})">Взять</button>`:''}</div>`}).join('')}</div>`},
rAlly(){return`<div class="sec">🤝 Альянсы</div>${this.S.alliance?`<div class="cd hl"><div class="ct">${this.ALLIANCES.find(a=>a.id===this.S.alliance).i} ${this.ALLIANCES.find(a=>a.id===this.S.alliance).n}</div><div class="cdd">${this.ALLIANCES.find(a=>a.id===this.S.alliance).d}</div><div class="cdd">Репутация: ⭐${this.S.allyRep}</div><div style="display:flex;gap:3px;margin-top:4px"><button class="bs" onclick="G.allyDonate('food',100)">🍖-100</button><button class="bs" onclick="G.allyDonate('wood',100)">🪵-100</button><button class="bs" onclick="G.allyDonate('metal',50)">⚙-50</button></div></div>`:`<div class="g2">${this.ALLIANCES.map(a=>`<div class="cd"><div class="ct">${a.i} ${a.n}</div><div class="cdd">${a.d}</div><button class="bgn bf" onclick="G.joinAlliance('${a.id}')">Вступить</button></div>`).join('')}</div>`}`},
rNPC(){return`<div class="sec">👤 Миссии NPC</div><div class="g1">${this.NPC_MISSIONS.map((m,i)=>{const done=this.S.npcDone.includes(m.id);const ca=!done&&Object.entries(m.req).every(([r,v])=>this.S.res[r]>=v);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${m.i} ${m.npc}</span>${done?'<span class="bg bg-gn">✅</span>':''}</div><div class="cdd" style="font-style:italic">"${m.dialog}"</div><div class="cdd">${m.task}</div><div class="cc">Награда: ${Object.entries(m.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${!done?`<button class="${ca?'bgn':'bs'} bf" ${ca?'':'disabled'} onclick="G.completeNPC(${i})">Выполнить</button>`:''}</div>`}).join('')}</div>`},
rStats(){return`<div class="sec">📊 Статистика</div><div class="g1">${[['🧔 Уровень',this.S.lvl],['⚔ Сила',this.S.power],['💀 Убийств',this.S.kills],['🏗 Построек',this.S.built],['🔨 Крафтов',this.S.crafted],['🌊 Волна',this.S.wave],['🏆 Рейтинг',this.S.rating],['👥 Героев',this.S.heroes.length],['🗺 Зон',this.S.mapRev.length],['📅 День',this.S.day],['🏪 Обменов',this.S.trades||0],['🤝 Альянс',this.S.alliance?this.ALLIANCES.find(a=>a.id===this.S.alliance)?.n:'—'],['${this.WEATHER[this.S.weather].i} Погода',this.WEATHER[this.S.weather].n],['${this.SEASONS[this.S.season].i} Сезон',this.SEASONS[this.S.season].n],['☣️ Заражённых',Object.keys(this.S.infected).length]].map(([l,v])=>`<div class="sr"><span class="sl">${l}</span><span class="sv">${v}</span></div>`).join('')}</div><div style="display:flex;gap:4px;margin-top:6px"><button class="bs" style="flex:1" onclick="G.exportSave()">📤 Экспорт</button><button class="bs" style="flex:1" onclick="G.importSave()">📥 Импорт</button></div><button class="bs bf" style="margin-top:6px;color:#f87171" onclick="if(confirm('Сбросить?')){localStorage.removeItem('tlp3');location.reload()}">🗑 Сбросить прогресс</button>`},
// ===== ACTIONS =====
build(k){const dt=this.BD[k],lv=this.S.bld[k]||0,nl=lv+1,co=dt.c(nl);if(nl>dt.mx)return this.toast('Макс!');for(const[r,v]of Object.entries(co))if(this.S.res[r]<v)return this.toast('Мало ресурсов!'),this.snd('err');for(const[r,v]of Object.entries(co))this.S.res[r]-=v;this.S.bld[k]=nl;this.S.built++;if(k==='wall'){this.S.wMax=100+nl*50;this.S.wHP=this.S.wMax}if(k==='wh'){const bn=nl*200;this.S.caps.food=2000+bn;this.S.caps.wood=2000+bn;this.S.caps.metal=1000+bn}if(k==='hq'){const newly=Object.entries(this.REVEAL).filter(([bk,rq])=>rq===nl&&bk!=='hq').map(([bk])=>this.BD[bk].n);if(newly.length)this.addNotif(`🌫️ Туман рассеялся: ${newly.join(', ')}!`,'info')}this.calcPow();this.addXP(15+nl*5);this.addBPXP(10);this.snd('build');this.toast(`${dt.i} ${dt.n} → Ур.${nl}!`);this.addNotif(`🏗 ${dt.n} Ур.${nl}`,'build');this.updAll();document.getElementById('btt').classList.remove('show')},
recruit(type){const cost=type==='s'?50:200,cnt=type==='s'?1:5;if(this.S.res.gems<cost)return this.toast('Мало 💎!'),this.snd('err');this.S.res.gems-=cost;const gn=[];for(let i=0;i<cnt;i++){const rl=Math.random();let pool=rl<.05?this.HR.filter(h=>h.r==='legendary'):rl<.2?this.HR.filter(h=>h.r==='epic'):rl<.5?this.HR.filter(h=>h.r==='rare'):this.HR.filter(h=>h.r==='common');const hero={...pool[Math.random()*pool.length|0],lv:1,sk:[]};const ex=this.S.heroes.find(h=>h.id===hero.id);if(ex){ex.lv++;gn.push(`${hero.i}→Ур.${ex.lv}`)}else{this.S.heroes.push(hero);gn.push(`${hero.i}НОВЫЙ!`)}}this.calcPow();this.addBPXP(5*cnt);this.snd('reward');this.toast('Набор: '+gn.join(', '));this.updAll()},
recruitPet(){if(this.S.res.gems<80)return this.toast('Мало 💎!'),this.snd('err');this.S.res.gems-=80;const rl=Math.random();const pool=rl<.05?this.PETS.filter(p=>p.r==='legendary'):rl<.2?this.PETS.filter(p=>p.r==='epic'):rl<.5?this.PETS.filter(p=>p.r==='rare'):this.PETS.filter(p=>p.r==='common'||p.r==='uncommon');const base=pool[Math.random()*pool.length|0];const ex=this.S.pets.find(p=>p.id===base.id);if(ex){ex.lv=(ex.lv||1)+1;this.toast(`${base.i}${base.n}→Ур.${ex.lv}`)}else{this.S.pets.push({...base,lv:1});if(!this.S.activePet)this.S.activePet=base.id;this.toast(`🐾 ${base.i}${base.n} приручён!`)}this.snd('reward');this.calcPow();this.updAll()},
setActivePet(id){this.S.activePet=id;this.snd('click');this.calcPow();this.updAll()},
getPetBonus(key){if(!this.S.activePet)return 0;const pt=this.S.pets.find(p=>p.id===this.S.activePet);if(!pt)return 0;const lv=pt.lv||1;const base=pt.bonus[key]||0;return base*(1+(lv-1)*.15)},
getSetBonus(heroId){const eq=this.S.equip[heroId]||{};const ids=Object.values(eq).filter(Boolean).map(x=>x.id);let bonus={a:0,d:0};this.SETS.forEach(st=>{if(st.pcs.every(id=>ids.includes(id))){bonus.a+=st.bonus.a||0;bonus.d+=st.bonus.d||0}});return bonus},
genLb(){if(this.S.lb&&this.S.lb.length)return;this.S.lb=this.BOT_NAMES.map(n=>({n,rating:Math.max(200,(this.S.rating+(Math.random()*400-200))|0)}))},
pvpAttack(name){const gh=this.S.gar.filter(g=>g);if(!gh.length)return this.toast('Гарнизон!');this.genLb();const bot=this.S.lb.find(b=>b.n===name);const ep=bot?bot.rating*.15+50:100+Math.random()*this.S.power*1.5;const won=this.S.power>ep*(.7+Math.random()*.6);if(won){const pts=15+Math.random()*10|0;this.S.rating+=pts;if(bot)bot.rating=Math.max(0,bot.rating-Math.floor(pts*.6));this.S.kills+=3;this.S.res.gems=Math.min(this.S.res.gems+5,999);this.addXP(20);this.addBPXP(10);this.snd('reward');this.toast(`🏆 Победа над ${name}! +${pts}🏆 +💎5`)}else{const pts=10+Math.random()*8|0;this.S.rating=Math.max(0,this.S.rating-pts);if(bot)bot.rating+=Math.floor(pts*.6);this.snd('hit');this.toast(`💀 ${name} оказался сильнее! -${pts}🏆`)}this.updAll()},
fightBoss(){if(!this.S.bld.wall)return this.toast('Стена!');const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);if(!gh.length)return this.toast('Гарнизон!');const boss=this.BOSSES[Math.max(0,Math.floor(this.S.wave/5)-1)%this.BOSSES.length];const atkB=1+this.getSkillBonus('atkMul')+this.getPetBonus('atkMul');const defB=1+this.getSkillBonus('hpMul')+this.getPetBonus('hpMul');const ds=gh.reduce((s,h)=>{let a=h.a*h.lv*atkB,d=h.d*h.lv*defB;const eq=this.S.equip[h.id];if(eq)Object.values(eq).forEach(e=>{if(e){a+=e.a||0;d+=e.d||0}});const sb=this.getSetBonus(h.id);a+=sb.a;d+=sb.d;return s+a+d},0)+(this.S.bld.wall||0)*10;const bhp=(200+this.S.wave*30)*boss.hpM;const won=ds>bhp*.6;if(won){Object.entries(boss.rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.S.kills+=15;this.registerKill('b');const rare=this.EP.filter(e=>e.r==='epic'||e.r==='legendary');const eq={...rare[Math.random()*rare.length|0]};this.S.inv.push(eq);this.S.wave++;this.addXP(60);this.addBPXP(25);this.snd('reward');this.toast(`👑 Босс ${boss.n} повержен! ${eq.i}${eq.n}!`);this.addNotif('👑 Босс повержен!','boss')}else{const dmg=Math.max(10,(bhp-ds)*.3|0);this.S.wHP=Math.max(0,this.S.wHP-dmg);this.snd('hit');this.toast(`💀 ${boss.n} слишком силён! 🧱-${dmg}`)}this.updAll()},
// ===== DISASTERS =====
triggerDisaster(){if(this.S.disaster||Date.now()<(this.S.disasterCd||0))return;if(Math.random()>.15)return;const d=this.DISASTERS[Math.random()*this.DISASTERS.length|0];this.S.disaster={id:d.id,end:Date.now()+d.dur*1000};this.S.disasterCd=Date.now()+180000;this.snd('alert');this.toast(`🚨 ${d.i} ${d.n}!`);this.addNotif(`🚨 ${d.n}! Загляните в 🎪События`,'danger')},
resolveDisaster(){if(!this.S.disaster)return;const d=this.DISASTERS.find(x=>x.id===this.S.disaster.id);if(!d)return;const ca=Object.entries(d.cost).every(([r,v])=>this.S.res[r]>=v);if(!ca)return this.toast('Не хватает ресурсов!'),this.snd('err');Object.entries(d.cost).forEach(([r,v])=>this.S.res[r]-=v);this.S.disaster=null;this.snd('reward');this.toast(`✅ ${d.n} устранена!`);this.updAll()},
applyDisasterDamage(){const d=this.DISASTERS.find(x=>x.id===this.S.disaster?.id);this.S.disaster=null;if(!d)return;if(d.id==='fire'){this.S.res.wood=Math.max(0,this.S.res.wood-d.dmgAmt);this.toast(`🔥 Склад сгорел! 🪵-${d.dmgAmt}`)}else if(d.id==='plague'){if(this.S.heroes.length)this.infectHero(this.S.heroes[Math.random()*this.S.heroes.length|0].id);this.toast('☣️ Инфекция распространилась!')}else if(d.id==='raid'){this.S.wHP=Math.max(0,this.S.wHP-40);this.toast('🏴 Мародёры пробили стену! 🧱-40')}this.snd('hit');this.updAll()},
// ===== SAVE EXPORT/IMPORT =====
exportSave(){try{const code=btoa(unescape(encodeURIComponent(JSON.stringify(this.S))));prompt('Скопируйте код сохранения:',code)}catch(e){this.toast('Ошибка экспорта')}},
importSave(){const code=prompt('Вставьте код сохранения:');if(!code)return;try{const p=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));this.S={...this.def(),...p};this.save();this.toast('✅ Импортировано!');location.reload()}catch(e){this.toast('❌ Неверный код!')}},
toFirstG(hi){const es=this.S.gar.indexOf(null);if(es===-1)return this.toast('Все слоты заняты!');const h=this.S.heroes[hi];if(!h)return;this.S.gar=this.S.gar.map(g=>g===h.id?null:g);this.S.gar[es]=h.id;this.calcPow();this.updAll()},
remG(sl){this.S.gar[sl]=null;this.calcPow();this.updAll()},
startExp(i){const t=this.EX[i];if(!t)return;if(!this.S.gar.some(g=>g))return this.toast('Назначьте гарнизон!');if(this.S.exps.length>=3)return this.toast('Макс 3!');const wm=this.getWeatherMult();if(this.S.energy<t.en*wm.energyDrain)return this.toast('Мало ⚡!');this.S.energy-=Math.ceil(t.en*wm.energyDrain);this.S.exps.push({...t,st:Date.now(),et:Date.now()+t.dur*1e3*(wm.exp||1)});this.snd('click');this.toast(`🧭 ${t.n} начата!`);this.triggerMapEvent();this.updAll()},
collectExp(i){const e=this.S.exps[i];if(!e||Date.now()<e.et)return;const gm=1+this.getSkillBonus('gatherMul')+this.getPetBonus('expMul');Object.entries(e.rw).forEach(([r,v])=>{const bonus=Math.floor(v*gm);this.S.res[r]=Math.min(this.S.res[r]+bonus,this.S.caps[r]||999)});this.S.exps.splice(i,1);this.addXP(25);this.addBPXP(8);this.S.kills+=5;const zt=this.ZT[Math.random()*3|0];this.registerKill(zt.id);this.snd('reward');this.toast(`✅ Экспедиция завершена!`);this.addNotif(`✅ Экспедиция: ${e.n}`,'exp');this.updAll()},
craft(i){const r=this.CR[i];if(!r)return;for(const[mt,v]of Object.entries(r.mt))if(this.S.res[mt]<v)return this.toast('Мало ресурсов!'),this.snd('err');for(const[mt,v]of Object.entries(r.mt))this.S.res[mt]-=v;const eq={...this.EP.find(e=>e.id===r.res)};this.S.inv.push(eq);this.S.crafted++;this.addBPXP(5);this.snd('build');this.toast(`🔨 ${eq.i} ${eq.n}!`);this.updAll()},
showEquipModal(invIdx){const item=this.S.inv[invIdx];if(!item)return;const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo"><h3>${item.i} ${item.n} <span class="bg bg-${item.r==='legendary'?'g':item.r==='epic'?'p':'b'}">${item.r}</span></h3><p class="cdd">⚔${item.a||0} 🛡${item.d||0} · ${item.sl}</p><div class="sec">Экипировать на:</div><div class="g1">${this.S.heroes.map(h=>`<button class="bs bf" style="margin-bottom:3px" onclick="G.equipItem(${invIdx},'${h.id}');this.closest('.mb').remove()">${h.i} ${h.n}</button>`).join('')}</div><button class="bs bf" style="margin-top:6px" onclick="this.closest('.mb').remove()">Закрыть</button></div>`;document.body.appendChild(el)},
equipItem(invIdx,heroId){const item=this.S.inv[invIdx];if(!item)return;const hero=this.S.heroes.find(h=>h.id===heroId);if(!hero)return;if(!this.S.equip[heroId])this.S.equip[heroId]={};const old=this.S.equip[heroId][item.sl];if(old)this.S.inv.push(old);this.S.equip[heroId][item.sl]=item;this.S.inv.splice(invIdx,1);this.calcPow();this.snd('build');this.toast(`${item.i}→${hero.n}`);this.updAll()},
research(id){if(this.S.techs[id])return;const t=this.TC.find(x=>x.id===id);if(!t)return;const ll=this.S.bld.lab||0;if(ll<t.rq)return this.toast(`Лаб Ур.${t.rq}!`);for(const[r,v]of Object.entries(t.co))if(this.S.res[r]<v)return this.toast('Мало!'),this.snd('err');for(const[r,v]of Object.entries(t.co))this.S.res[r]-=v;this.S.techs[id]=true;this.calcPow();this.addXP(35);this.addBPXP(12);this.snd('reward');this.toast(`🔬 ${t.n}!`);this.updAll()},
lvlHero(i){const h=this.S.heroes[i];if(!h)return;const cost=h.lv*25;if(this.S.res.food<cost)return this.toast(`🍖${cost}!`),this.snd('err');this.S.res.food-=cost;h.lv++;this.calcPow();this.addBPXP(3);this.snd('lvl');this.toast(`${h.i}→Ур.${h.lv}!`);this.updAll()},
simDef(){if(!this.S.bld.wall)return this.toast('Стена!');const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);if(!gh.length)return this.toast('Гарнизон!');const wm=this.WAVE_MODS[this.S.wave%5===0?4:this.S.wave%7===0?5:0];const sm=this.getSeasonMult();const wth=this.getWeatherMult();const ws=(this.S.wave*20+Math.random()*30)*wm.mult*sm.zombie*wth.zombie;const atkB=1+this.getSkillBonus('atkMul')+this.getPetBonus('atkMul');const defB=1+this.getSkillBonus('hpMul')+this.getPetBonus('hpMul');const ds=(gh.reduce((s,h)=>{let a=h.a*h.lv*atkB,d=h.d*h.lv*defB;const eq=this.S.equip[h.id];if(eq)Object.values(eq).forEach(e=>{if(e){a+=e.a||0;d+=e.d||0}});const sb=this.getSetBonus(h.id);a+=sb.a;d+=sb.d;return s+a+d},0)+(this.S.bld.wall||0)*10*(this.S.techs.wl?1.25:1))*wth.def;const won=ds>ws;const dmg=won?Math.max(5,ws*.3|0):ws*.8|0;this.S.wHP=Math.max(0,this.S.wHP-dmg);const zk=3+this.S.wave*2+(Math.random()*5|0);const log=[];if(won){this.S.kills+=zk;this.S.wave++;const zt=this.ZT[Math.random()*this.ZT.length|0];this.registerKill(zt.id);const fr=50+this.S.wave*15,mr=20+this.S.wave*8;this.S.res.food=Math.min(this.S.res.food+fr,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+mr,this.S.caps.metal);this.addXP(25+this.S.wave*5);this.addBPXP(15);log.push(`✅ Волна ${this.S.wave-1}(${wm.n}) 💀${zk}`);log.push(`🧱-${dmg} 🍖+${fr} ⚙+${mr}`);if(gh.length)this.infectHero(gh[Math.random()*gh.length|0].id)}else{this.S.kills+=zk/2|0;log.push(`❌ Волна ${this.S.wave}(${wm.n}) 🧱-${dmg}`);log.push(`⚔${ds|0} vs 🧟${ws|0}`)}this.S.log=[...log,...this.S.log].slice(0,30);this.snd(won?'reward':'hit');this.toast(won?`⚔ Отражено! +${zk}💀`:'💀 Оборона пала!');this.updAll()},
repairWall(){if(this.S.res.wood<50||this.S.res.metal<30)return this.toast('Мало!');this.S.res.wood-=50;this.S.res.metal-=30;this.S.wHP=this.S.wMax;this.snd('build');this.toast('🧱 Восстановлено!');this.updAll()},
pvp(){const gh=this.S.gar.filter(g=>g);if(!gh.length)return this.toast('Гарнизон!');const ep=100+Math.random()*this.S.power*1.5;const won=this.S.power>ep*(.7+Math.random()*.6);if(won){const pts=15+Math.random()*10|0;this.S.rating+=pts;this.S.kills+=3;this.S.res.gems=Math.min(this.S.res.gems+5,999);this.addXP(20);this.addBPXP(10);this.snd('reward');this.toast(`🏆 Победа! +${pts}🏆 +💎5`)}else{const pts=10+Math.random()*8|0;this.S.rating=Math.max(0,this.S.rating-pts);this.snd('hit');this.toast(`💀 Поражение! -${pts}🏆`)}this.updAll()},
advQ(){const q=this.QU[this.S.ch-1];if(!q)return;const cs=q.st[this.S.qs];if(!cs||!cs.ck(this.S))return;this.S.qs++;this.addXP(30);this.addBPXP(10);this.S.res.gems=Math.min(this.S.res.gems+10,999);this.snd('reward');if(this.S.qs>=q.st.length){this.S.ch++;this.S.qs=0;this.toast(`📖 Глава ${this.S.ch}!`)}else this.toast('✅ Задание выполнено!');this.updAll()},
claimDaily(){const di=this.S.day%7;if(this.S.daily>=this.S.day)return this.toast('Уже!');const rw=this.DA[di];this.S.res[rw.r]=Math.min(this.S.res[rw.r]+rw.a,this.S.caps[rw.r]||999);this.S.daily=this.S.day;this.addXP(10);this.addBPXP(5);this.snd('reward');this.toast(`🎁 +${rw.a}${rw.n}!`);this.updAll()},
claimAch(id){if(this.S.achs[id])return;const a=this.AC.find(x=>x.id===id);if(!a||!a.ck(this.S))return;this.S.achs[id]=true;Object.entries(a.rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.addXP(20);this.snd('reward');this.toast(`🏆 ${a.n}!`);this.updAll()},
claimBP(lvl){if(this.S.bpCl.includes(lvl)||this.S.bpLvl<lvl)return;this.S.bpCl.push(lvl);const rw=lvl%5===0?{gems:10}:{food:50+lvl*10};Object.entries(rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.snd('reward');this.toast(`🎫 BP Ур.${lvl}!`);this.updAll()},
exploreZone(id){const zone=this.MN.find(m=>m.id===id);if(!zone)return;const dg=zone.dg||0;const cost=5+dg*5;if(this.S.energy<cost)return this.toast('Мало ⚡!');this.S.energy-=cost;if(!dg){this.S.res.food=Math.min(this.S.res.food+30,this.S.caps.food);this.snd('reward');this.toast(`📍 ${zone.n}: 🍖+30`);this.updAll();return}const req=40+dg*60;const won=this.S.power>=req*(.6+Math.random()*.5);if(won){const fr=20*dg,mr=15*dg,gm=dg>=4?3:0;this.S.res.food=Math.min(this.S.res.food+fr,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+mr,this.S.caps.metal);if(gm)this.S.res.gems=Math.min(this.S.res.gems+gm,999);this.S.kills+=dg;const zt=this.ZT[Math.min(dg,this.ZT.length-1)];this.registerKill(zt.id);this.snd('reward');this.toast(`📍 ${zone.n}: 🍖+${fr} ⚙+${mr}${gm?' 💎+'+gm:''}`);const locked=this.MN.filter(m=>!this.S.mapRev.includes(m.id)&&(m.dg||0)<=dg+1);if(locked.length&&Math.random()<.3){const nz=locked[Math.random()*locked.length|0];this.S.mapRev.push(nz.id);this.addNotif(`🗺 Открыта зона: ${nz.n}!`,'info')}}else{const dmg=dg*8;this.S.wHP=Math.max(0,this.S.wHP-dmg);this.snd('hit');this.toast(`💀 ${zone.n}: слишком опасно! 🧱-${dmg}`)}if(Math.random()<.25)this.triggerMapEvent();this.updAll()},
forceEvent(){if(this.S.energy<15)return this.toast('Мало ⚡!');this.S.energy-=15;this.S.mapEvtCd=0;this.triggerMapEvent();if(!document.querySelector('.mb'))this.toast('Ничего не найдено...');this.updAll()},

drawPhotoBuilding(c,bx,by,s,img,st,lv){const cw=s*1.35,ch=cw*.68;let ty=by-ch-s*.3;if(ty<3)ty=3;const lx=bx-cw/2,r=6;c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=9;c.shadowOffsetY=3;c.beginPath();c.roundRect(lx,ty,cw,ch,r);c.fillStyle='#000';c.fill();c.restore();c.save();c.beginPath();c.roundRect(lx,ty,cw,ch,r);c.clip();c.globalAlpha=lv>0?1:.4;this.drawImgCover(c,img,lx,ty,cw,ch);if(lv<=0){c.fillStyle='rgba(10,12,14,.45)';c.fillRect(lx,ty,cw,ch)}c.globalAlpha=1;c.restore();c.save();c.beginPath();c.roundRect(lx,ty,cw,ch,r);c.lineWidth=lv>0?2:1.3;c.strokeStyle=st.accent;c.globalAlpha=lv>0?.95:.5;c.stroke();c.restore();return{iconX:bx,iconY:ty+ch/2,baseY:ty+ch}},

drawFogBlob(c,bx,by,s,nf){const puffs=[[0,0,1],[-s*.35,s*.08,.7],[s*.35,s*.08,.7],[0,-s*.18,.6]];puffs.forEach(([dx,dy,sc])=>{const gr=c.createRadialGradient(bx+dx,by+dy,2,bx+dx,by+dy,s*.6*sc);gr.addColorStop(0,`rgba(205,212,222,${.5*nf})`);gr.addColorStop(1,'rgba(205,212,222,0)');c.fillStyle=gr;c.beginPath();c.arc(bx+dx,by+dy,s*.6*sc,0,Math.PI*2);c.fill()});c.font='13px serif';c.textAlign='center';c.textBaseline='middle';c.globalAlpha=.85*nf;c.fillText('🔒',bx,by-2);c.globalAlpha=1},
