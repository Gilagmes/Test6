<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c0e">
<title>The Last Port - Survivors</title>
<style>
/* ================= UI ТЕМА ================= */
:root {
  color-scheme: dark;
  --text: #e8e8e8; --muted: #7b8c9d; --gold: #f4b136;
  --bg-main: #0a0c0e; --bg-card: #1c2127; --border: #2c353f; --height: 100dvh;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
button { font: inherit; cursor: pointer; border: none; outline: none; transition: transform 0.1s; }
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
[hidden] { display: none !important; }

/* ================= СЛОИ И КАРТА ================= */
main { position: relative; width: 100%; height: var(--height); overflow: hidden; }
.scene { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at center, #1b2421 0%, #06080a 100%); }
canvas { display: block; touch-action: none; }
#camera-layer { position: absolute; inset: 0; z-index: 2; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 100px rgba(0,0,0,0.9); }

/* ================= ВЕРХНИЙ HUD ================= */
.ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 10px); }
header { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 15px; pointer-events: auto; }

.profile-badge { display: flex; align-items: center; gap: 10px; background: rgba(10, 12, 14, 0.85); border: 1px solid var(--gold); border-radius: 40px; padding: 4px 16px 4px 4px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
.profile-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
.profile-info { display: flex; flex-direction: column; }
.profile-level { font-size: 9px; color: var(--gold); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.profile-power { font-size: 16px; font-weight: 900; margin-top: -2px; }

.resources { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.res-item { background: rgba(10, 12, 14, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 6px 12px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
.res-food { color: #a5d6a7; } .res-wood { color: #d7ccc8; } .res-parts { color: #b0bec5; } .res-wave { color: #81d4fa; }

#chapter-strip { align-self: flex-start; margin: 5px 15px; background: rgba(10, 12, 14, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 8px 15px 8px 8px; display: flex; align-items: center; gap: 10px; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.chapter-avatar { width: 36px; height: 36px; border-radius: 8px; background: #262c33; display: grid; place-items: center; font-size: 18px; color: var(--gold); }
.chapter-copy small { display: block; font-size: 10px; color: var(--muted); }
.chapter-copy strong { font-size: 13px; color: #fff; }

.camera-controls { position: absolute; right: 15px; top: 40%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
.camera-controls button { width: 44px; height: 44px; border-radius: 50%; background: rgba(28, 33, 39, 0.9); border: 1px solid var(--border); color: #fff; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.camera-controls .primary { border-color: var(--gold); color: var(--gold); }

/* ================= НИЖНЯЯ ПАНЕЛЬ И НАВИГАЦИЯ ================= */
#dock { margin-top: auto; background: rgba(14,17,20, 0.95); backdrop-filter: blur(10px); border-top-left-radius: 24px; border-top-right-radius: 24px; pointer-events: auto; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); height: 42dvh; transition: 0.3s; z-index: 100; border-top: 1px solid var(--border); }
#dock[data-size="map"] { height: auto; padding-bottom: env(safe-area-inset-bottom, 20px); }

.toolbar { display: flex; gap: 8px; padding: 15px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button { background: var(--bg-card); border: 1px solid var(--border); color: var(--muted); padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; }
.toolbar button.active { background: #2c353f; color: #fff; border-color: #3d4957; }
.size-btn { width: 40px; padding: 0 !important; display: grid; place-items: center; font-size: 18px; }

#panel { flex: 1; overflow-y: auto; padding: 0 15px 15px; scrollbar-width: none; }
#panel::-webkit-scrollbar { display: none; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.card.selected { border-color: var(--gold); background: #252b31; box-shadow: 0 0 15px rgba(244,177,54,0.1); }

.card-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 4px; }
.card-lvl { font-size: 10px; color: var(--gold); background: rgba(244, 177, 54, 0.15); padding: 3px 8px; border-radius: 6px; }
.card p { font-size: 11px; color: var(--muted); line-height: 1.4; margin: 0; flex: 1; }

.card > button { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px; border-radius: 10px; font-weight: bold; font-size: 12px; margin-top: auto; }
.card > button.primary { background: var(--gold); color: #000; }

nav { display: flex; justify-content: space-around; background: #0c0f12; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); flex-shrink: 0; }
nav button { background: none; color: #5a6673; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav button.active { color: var(--gold); }
nav button b { font-size: 20px; }

/* Анимации частиц */
.fly-res { position: absolute; z-index: 9999; font-weight: bold; font-size: 14px; color: #fff; text-shadow: 0 2px 4px #000; pointer-events: none; transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); }
</style>
</head>
<body>
<main>
  <!-- CANVAS СЛОЙ -->
  <div class="scene">
    <canvas id="world"></canvas>
    <div class="vignette"></div>
    <div id="camera-layer"></div>
  </div>

  <!-- UI СЛОЙ -->
  <div class="ui-layer">
    <header>
      <div class="profile-badge">
        <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80" class="profile-avatar">
        <div class="profile-info">
          <span class="profile-level">База ур. <span id="hq-lvl">1</span></span>
          <span class="profile-power">⚔ <span id="power">57</span></span>
        </div>
      </div>
      
      <div class="resources">
        <div class="res-item res-food" id="btn-food">🌾 <span id="food">0</span></div>
        <div class="res-item res-wood" id="btn-wood">🪵 <span id="wood">0</span></div>
        <div class="res-item res-parts">⚙ <span id="parts">120</span></div>
        <div class="res-item res-wave">🌊 <span id="wave">1</span></div>
      </div>
    </header>

    <button id="chapter-strip">
      <div class="chapter-avatar">⌖</div>
      <div class="chapter-copy"><small>Глава 1</small><strong>Сигнал в темноте</strong></div>
    </button>

    <div class="camera-controls">
      <button data-camera="in">＋</button>
      <button data-camera="out">−</button>
      <button class="primary" data-camera="home">⌂</button>
    </div>

    <!-- DOCK ПАНЕЛЬ -->
    <section id="dock" data-size="normal">
      <div class="toolbar">
        <button class="active">♙ Жители</button>
        <button>⚖ Торговля</button>
        <button>⚙ Развитие</button>
        <button class="size-btn" data-action="collapse">▾</button>
      </div>
      
      <div id="panel"></div>

      <nav>
        <button data-action="tab" data-id="base" class="active"><b>⌂</b>База</button>
        <button data-action="tab" data-id="territory"><b>▧</b>Земли</button>
        <button data-action="tab" data-id="heroes"><b>★</b>Герои</button>
        <button data-action="tab" data-id="army"><b>⚑</b>Войска</button>
        <button data-action="tab" data-id="map"><b>⌖</b>Карта</button>
        <button data-action="tab" data-id="battle"><b>⚔</b>Оборона</button>
      </nav>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat("ru-RU").format(Math.floor(n||0));

/* ================= 1. БАЗА ДАННЫХ И ЛОГИКА ================= */
const BUILD = {
 hq: {name:"Штаб", x:2, y:2, w:1.8, d:1.8},
 farm: {name:"Теплицы", x:0, y:2, w:1.8, d:1.8},
 mill: {name:"Лесопилка", x:2, y:0, w:1.8, d:1.8},
 barracks: {name:"Казармы", x:4, y:2, w:1.8, d:1.8},
 wall: {name:"Вышка", x:2, y:4, w:1.2, d:1.2}
};
const TERRITORY = {
 grove: {name:"Заросший сквер", x:-1, y:-1, cost:30},
 scrapyard: {name:"Свалка машин", x:1, y:-1, cost:80},
 garden: {name:"Старые сады", x:-1, y:1, cost:110}
};

let s = {
  food: 5900, wood: 4300, parts: 120, wave: 1,
  buildings: { hq:1, farm:1, mill:1, barracks:1, wall:1 },
  territory: { cleared: [] }
};

let readyToCollect = { farm: false, mill: false };
setInterval(() => {
  if(s.buildings.farm) readyToCollect.farm = true;
  if(s.buildings.mill) readyToCollect.mill = true;
}, 6000); 

let tab="base", dockSize="normal", selectedObj=null;

// NPC Выжившие (Жизнь на базе)
const npcs = Array.from({length: 5}, () => ({
  x: 2 + Math.random()*2, y: 2 + Math.random()*2,
  tx: 2 + Math.random()*2, ty: 2 + Math.random()*2,
  speed: 0.005 + Math.random()*0.005
}));

/* ================= 2. РЕНДЕР UI ================= */
function renderBase(){
  return `<div class="grid">${Object.entries(BUILD).map(([id,b])=>{
      const l=s.buildings[id];
      return `<article class="card ${selectedObj===id?"selected":""}">
        <div class="card-title"><span>${b.name}</span><span class="card-lvl">${l?`Ур. ${l}`:"Строится"}</span></div>
        <p>${id==="farm"?"Добыча еды.":id==="mill"?"Добыча дерева.":"Развитие базы."}</p>
        <button data-action="build" data-id="${id}">Улучшить (🪵 ${l*50})</button></article>`;
  }).join("")}</div>`;
}

function renderTerritory(){
  return `<div class="grid">${Object.entries(TERRITORY).map(([id,p])=>{
      const done = s.territory.cleared.includes(id);
      return `<article class="card ${done?"selected":""}">
        <div class="card-title"><span>${p.name}</span></div>
        <p>${done?"Освоено. Можно строить.":"Очистка сектора от зараженных."}</p>
        <button ${done?"disabled":""} data-action="clear" data-id="${id}">${done?"Безопасно":"Зачистить (🪵 "+p.cost+")"}</button></article>`;
  }).join("")}</div>`;
}

function renderUI(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.id===tab));
  $("dock").dataset.size = dockSize;
  $("panel").hidden = (dockSize==="map");
  
  if(tab==="base") $("panel").innerHTML = renderBase();
  else if(tab==="territory") $("panel").innerHTML = renderTerritory();
  else $("panel").innerHTML = `<p style="text-align:center; color:gray; margin-top:20px;">Раздел в разработке</p>`;
  
  $("food").innerText = fmt(s.food); $("wood").innerText = fmt(s.wood);
  $("hq-lvl").innerText = s.buildings.hq;
}

/* ================= 3. АТМОСФЕРНЫЙ CANVAS ДВИЖОК ================= */
const canvas = $("world"), ctx = canvas.getContext("2d");
let camera = { x: 0, y: 0, scale: 1.2 };
let hits = []; 

function iso(c, r) {
  const cx = canvas.width / 2 + camera.x;
  const cy = canvas.height / 2 - 120 + camera.y; 
  const tw = 65 * camera.scale;
  const th = 32.5 * camera.scale;
  return { x: cx + (c - r) * tw, y: cy + (c + r) * th };
}

function poly(points, fill) {
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}

function drawBlock(c, r, w, d, h, topColor, sideLeft, sideRight) {
  const p1 = iso(c, r), p2 = iso(c+w, r), p3 = iso(c+w, r+d), p4 = iso(c, r+d);
  const up = p => ({ x: p.x, y: p.y - h * camera.scale });
  
  poly([p2, p3, up(p3), up(p2)], sideRight); // Правая грань (Тень)
  poly([p4, p3, up(p3), up(p4)], sideLeft);  // Левая грань
  poly([up(p1), up(p2), up(p3), up(p4)], topColor); // Крыша
}

function drawGround(c, r) {
  const p1 = iso(c, r), p2 = iso(c+1, r), p3 = iso(c+1, r+1), p4 = iso(c, r+1);
  // Грязный цвет выжженной земли
  poly([p1, p2, p3, p4], "#232b26");
  
  // Дорожки (Грязь)
  if((c+r)%2===0) {
    const d1 = iso(c+0.2, r+0.2), d2 = iso(c+0.8, r+0.2), d3 = iso(c+0.8, r+0.8), d4 = iso(c+0.2, r+0.8);
    poly([d1, d2, d3, d4], "#1c211d");
  }
}

function drawFog(c, r) {
  const center = iso(c+1, r+1);
  const h = 40 * camera.scale;
  
  // Отрисовка темных "облаков" тумана
  const grad = ctx.createRadialGradient(center.x, center.y - h/2, 0, center.x, center.y - h/2, 100 * camera.scale);
  grad.addColorStop(0, "rgba(5, 7, 9, 0.95)");
  grad.addColorStop(1, "rgba(5, 7, 9, 0)");
  
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(center.x, center.y - h/2, 100 * camera.scale, 0, Math.PI*2); ctx.fill();

  ctx.font = `${16 * camera.scale}px Arial`; ctx.textAlign = "center";
  ctx.fillText("🔒", center.x, center.y - h - 10);
  hits.push({ type: "land", id: Object.keys(TERRITORY).find(k=>TERRITORY[k].x===c && TERRITORY[k].y===r), x: center.x, y: center.y - 20, r: 50 * camera.scale });
}

function drawDetailedBuilding(id, x, y, time) {
  const sIso = iso(x+0.9, y+0.9); // Центр здания

  if (id === "hq") {
    // Бункер из бетона
    drawBlock(x+0.1, y+0.1, 1.6, 1.6, 25, "#3b434a", "#2b3137", "#1a1e22");
    drawBlock(x+0.3, y+0.3, 1.2, 1.2, 40, "#4a545e", "#3a424a", "#292f35");
    // Антенна с мигающим красным огоньком
    const ant = iso(x+0.9, y+0.9);
    ctx.beginPath(); ctx.moveTo(ant.x, ant.y-40*camera.scale); ctx.lineTo(ant.x, ant.y-85*camera.scale); ctx.strokeStyle="#777"; ctx.lineWidth=2; ctx.stroke();
    if(Math.sin(time*5) > 0) {
      ctx.beginPath(); ctx.arc(ant.x, ant.y-85*camera.scale, 3, 0, Math.PI*2); ctx.fillStyle="#ff3333"; ctx.fill();
      ctx.shadowColor = "#ff3333"; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  else if (id === "farm") {
    // Теплицы (земля + полупрозрачная пленка)
    drawBlock(x+0.2, y+0.1, 0.6, 1.6, 5, "#382e25", "#2a221b", "#1a1511"); // Грядка
    drawBlock(x+1.0, y+0.1, 0.6, 1.6, 5, "#382e25", "#2a221b", "#1a1511"); // Грядка
    ctx.globalAlpha = 0.7; // Эффект пленки
    drawBlock(x+0.2, y+0.1, 0.6, 1.6, 18, "#5d7a8c", "#415968", "#2a3d49");
    drawBlock(x+1.0, y+0.1, 0.6, 1.6, 18, "#5d7a8c", "#415968", "#2a3d49");
    ctx.globalAlpha = 1.0;
  }
  else if (id === "mill") {
    // Лесопилка: доски, бревна
    drawBlock(x+0.2, y+0.2, 1.4, 1.4, 5, "#4a3c31", "#332921", "#1f1814"); // Помост
    drawBlock(x+0.3, y+0.3, 0.4, 1.0, 15, "#6b5442", "#4a3a2d", "#2e241c"); // Штабель
    drawBlock(x+1.0, y+0.4, 0.5, 0.5, 20, "#2c353f", "#1c2127", "#0f1316"); // Станок
  }
  else if (id === "barracks") {
    // Палатки и костер
    drawBlock(x+0.1, y+0.1, 0.8, 0.8, 22, "#41593e", "#2e3f2c", "#1a2419");
    drawBlock(x+0.9, y+0.9, 0.8, 0.8, 22, "#41593e", "#2e3f2c", "#1a2419");
    
    // Анимированный костер
    const fire = iso(x+1.2, y+0.4);
    const glowStr = Math.abs(Math.sin(time*10)) * 5 + 15;
    const fGrad = ctx.createRadialGradient(fire.x, fire.y, 0, fire.x, fire.y, glowStr * camera.scale);
    fGrad.addColorStop(0, "rgba(255, 150, 0, 0.8)"); fGrad.addColorStop(1, "rgba(255, 150, 0, 0)");
    ctx.fillStyle = fGrad; ctx.beginPath(); ctx.arc(fire.x, fire.y, glowStr * camera.scale, 0, Math.PI*2); ctx.fill();
  }
  else if (id === "wall") {
    drawBlock(x+0.5, y+0.5, 0.8, 0.8, 50, "#524436", "#3d3227", "#261f18");
  }

  // Плавающая иконка сбора ресурсов
  if ((id === "farm" && readyToCollect.farm) || (id === "mill" && readyToCollect.mill)) {
    const bubbleY = sIso.y - 65 * camera.scale + Math.sin(time*3)*5; 
    ctx.beginPath(); ctx.roundRect(sIso.x - 30*camera.scale, bubbleY - 14*camera.scale, 60*camera.scale, 28*camera.scale, 12*camera.scale);
    ctx.fillStyle = "#f4b136"; ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle = "#000"; ctx.font = `bold ${13*camera.scale}px sans-serif`; ctx.textAlign="center";
    ctx.fillText(id==="farm"?"🌾 150":"🪵 80", sIso.x, bubbleY+5*camera.scale);
    hits.push({ type: "collect", id: id, x: sIso.x, y: bubbleY, r: 35 * camera.scale });
  }

  hits.push({ type: "building", id: id, x: sIso.x, y: sIso.y-20, r: 50 * camera.scale });
}

function drawGame() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hits = [];
  const time = Date.now() / 1000;

  // Отрисовка земли
  for(let r=-2; r<7; r++) {
    for(let c=-2; c<7; c++) {
      drawGround(c, r);
    }
  }

  // Отрисовка выживших (NPC)
  npcs.forEach(npc => {
    // Движение
    const dx = npc.tx - npc.x, dy = npc.ty - npc.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 0.1) { npc.tx = 0 + Math.random()*4; npc.ty = 0 + Math.random()*4; }
    else { npc.x += (dx/dist)*npc.speed; npc.y += (dy/dist)*npc.speed; }
    
    // Рисование человечка
    const p = iso(npc.x, npc.y);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.ellipse(p.x, p.y, 6*camera.scale, 3*camera.scale, 0, 0, Math.PI*2); ctx.fill(); // Тень
    ctx.fillStyle = "#6d7c8a"; ctx.beginPath(); ctx.arc(p.x, p.y-8*camera.scale, 4*camera.scale, 0, Math.PI*2); ctx.fill(); // Тело
  });

  // Туман (закрытые земли)
  for(const [id, t] of Object.entries(TERRITORY)) {
    if (!s.territory.cleared.includes(id)) drawFog(t.x, t.y);
  }

  // Здания
  const blds = Object.entries(BUILD).sort((a,b) => (a[1].x+a[1].y) - (b[1].x+b[1].y));
  for(const [id, b] of blds) {
    if(s.buildings[id]) drawDetailedBuilding(id, b.x, b.y, time);
    // Подсветка при выделении
    if(selectedObj === id) {
      const p = iso(b.x+0.9, b.y+0.9);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 55*camera.scale, 27.5*camera.scale, 0, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(244, 177, 54, 0.8)"; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  requestAnimationFrame(drawGame);
}

/* ================= 4. КАМЕРА, СВАЙП И КЛИКИ ================= */
const layer = $("camera-layer");
let isDragging = false, startX, startY, camStartX, camStartY, isClick = true;

layer.addEventListener("pointerdown", e => {
  isDragging = true; isClick = true;
  startX = e.clientX; startY = e.clientY;
  camStartX = camera.x; camStartY = camera.y;
  layer.setPointerCapture(e.pointerId);
});

layer.addEventListener("pointermove", e => {
  if (!isDragging) return;
  let dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isClick = false; 
  camera.x = camStartX + dx; camera.y = camStartY + dy;
});

function flyResource(startX, startY, type) {
  const el = document.createElement("div");
  el.className = "fly-res"; el.innerText = type === "farm" ? "+150 🌾" : "+80 🪵";
  el.style.left = startX + "px"; el.style.top = startY + "px";
  document.body.appendChild(el);
  const target = $(type === "farm" ? "btn-food" : "btn-wood").getBoundingClientRect();
  setTimeout(() => { el.style.left = target.left+"px"; el.style.top = target.top+"px"; el.style.transform="scale(0.5)"; el.style.opacity="0"; }, 50);
  setTimeout(() => { el.remove(); if(type==="farm") s.food+=150; else s.wood+=80; renderUI(); }, 800);
}

layer.addEventListener("pointerup", e => {
  isDragging = false; layer.releasePointerCapture(e.pointerId);
  if (isClick) {
    for(let i=hits.length-1; i>=0; i--) {
      const h = hits[i];
      if (Math.hypot(e.clientX - h.x, e.clientY - h.y) < h.r) {
        if (h.type === "collect") {
          flyResource(e.clientX, e.clientY, h.id); readyToCollect[h.id] = false;
        } else {
          selectedObj = h.id; tab = h.type === "land" ? "territory" : "base"; dockSize = "normal"; renderUI();
        }
        return;
      }
    }
    selectedObj = null; renderUI();
  }
});

document.addEventListener("click", e => {
  const btnZoom = e.target.closest("[data-camera]");
  if(btnZoom) {
    const act = btnZoom.dataset.camera;
    if(act === "in") camera.scale = Math.min(2.0, camera.scale * 1.2);
    if(act === "out") camera.scale = Math.max(0.6, camera.scale / 1.2);
    if(act === "home") { camera.x = 0; camera.y = 0; camera.scale = 1.0; }
    return;
  }
  const b = e.target.closest("button[data-action]"); if(!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  if (a === "tab") { tab = id; renderUI(); }
  if (a === "collapse") { dockSize = dockSize==="map" ? "normal" : "map"; renderUI(); }
  if (a === "build" && pay({wood: s.buildings[id]*50})) { s.buildings[id]++; renderUI(); }
  if (a === "clear" && pay({wood: TERRITORY[id].cost})) { s.territory.cleared.push(id); renderUI(); }
});

/* ================= 5. ЗАПУСК ================= */
renderUI();
requestAnimationFrame(drawGame);
</script>
</body>
</html>
