<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2229">
<title>Последний порт — Приливы и туманы</title>
<style>
:root{
  color-scheme:dark;
  --bg:#08161c;--panel:#132a30;--panel2:#1e3a3f;
  --line:#4d6058;--gold:#e0c186;--text:#e7ede7;--muted:#a4b6b0;
  --green:#a9c580;--red:#e4a094;--blue:#8dc0d1;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#28464a 0,#10252b 40%,var(--bg) 80%);
  color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;color:var(--text);background:linear-gradient(145deg,#2b4548,#152b32);
  border:1px solid #687b716e;border-radius:14px;padding:11px 14px;
  touch-action:manipulation;transition:filter .15s,transform .15s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.primary{background:linear-gradient(135deg,#eed3a0,#b28950);color:#302818;border-color:#eed3a0}
.danger{border-color:#b67868;color:#f1b2a4}
.ghost{background:transparent;border-color:#4c5f5666}
button.small{padding:6px 10px;border-radius:11px;font-size:12px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(22px,4.4vw,33px);letter-spacing:2px;line-height:1.25}
h2{font-size:21px}h3{font-size:16px}
p{margin:7px 0;color:#c1cec5}
small,.muted{color:var(--muted)}
.eyebrow{font-size:10px;letter-spacing:3px;color:#c7c5ac}
.app{max-width:1120px;margin:auto;padding:16px 12px 30px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.header{margin-bottom:14px;gap:14px}
.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.resource{position:relative;background:#152f34d9;border:1px solid #67786e55;border-bottom:3px solid var(--accent);
  padding:9px 6px;border-radius:15px;text-align:center;overflow:hidden}
.resource small{display:block;font-size:9px;letter-spacing:1.5px;color:#a3b2a9}
.resource strong{display:block;font-size:clamp(16px,3.2vw,23px);line-height:1.15;margin:2px 0}
.resource em{font-size:9.5px;color:#a3b6ad;font-style:normal;display:block;line-height:1.35}
.resource .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);opacity:.55;transition:width .3s}
.scene{position:relative;overflow:hidden;border:1px solid #8e896b;border-radius:24px;
  background:#0f2830;box-shadow:0 18px 55px #0004}
canvas{display:block;width:100%;aspect-ratio:10/7;touch-action:none}
.badge{position:absolute;top:11px;left:11px;max-width:calc(100% - 90px);
  border:1px solid #8c835955;padding:6px 10px;border-radius:11px;
  background:#0b202888;color:#e2d1ab;font-size:10px;letter-spacing:1.4px;pointer-events:none;
  backdrop-filter:blur(6px)}
.badge b{color:#fff;font-weight:600}
.camera{position:absolute;bottom:11px;right:11px;display:flex;gap:5px;padding:5px;
  border:1px solid #857d5555;border-radius:16px;background:#0b1c2388;backdrop-filter:blur(6px)}
.camera button{width:42px;height:42px;padding:0;font-size:22px}
.status-strip{position:absolute;top:11px;right:11px;color:#e5d1a1;font-size:11px;
  padding:6px 10px;border-radius:11px;background:#0b202888;border:1px solid #8c835955;pointer-events:none;
  backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2}
.status-strip small{color:#b5c9c1}
.strip{margin-top:10px;padding:13px 16px;border-radius:16px;border:1px solid #b89d69;
  background:linear-gradient(100deg,#73603b66,#20433866);width:100%;text-align:left}
.strip strong{display:block;font-size:17px}
.queue{display:flex;gap:6px;overflow:auto;padding:10px 0 2px;scrollbar-width:thin}
.queue:empty{display:none}
.chip{white-space:nowrap;font-size:11.5px;border:1px solid #81907c44;border-radius:30px;padding:5px 11px;background:#20373b}
.chip.warn{border-color:#b78166;color:#f1b18f;background:#3a251f}
.chip.good{border-color:#87a874;color:#c9e2a7;background:#22322a}
.toolbar{margin:12px 0 9px;display:flex;gap:6px;flex-wrap:wrap}
.toolbar button{flex:1;white-space:nowrap;padding:9px;font-size:13px}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border-radius:19px;
  background:#12292ff2;border:1px solid #73827766;position:sticky;top:5px;z-index:3;backdrop-filter:blur(10px)}
nav button{border:0;background:none;padding:8px 3px;font-size:11.5px;color:#aebdb5}
nav button b{display:block;font-size:22px;line-height:1.3}
nav button.active{background:linear-gradient(140deg,#ead09b,#b28a52);color:#332d1d}
#panel{margin:14px 0;min-height:180px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{padding:15px;border:1px solid #70847750;border-radius:17px;
  background:linear-gradient(140deg,#243d40b8,#0f272ec4);min-width:0;position:relative;overflow:hidden}
.card p{font-size:13px}
.card button{margin-top:8px}
.card .row button{margin-top:0}
.card.selected{border-color:var(--gold);box-shadow:0 0 20px #dfbf8226}
.card.working{border-color:#a8c38a}
.card.working::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:2px;
  background:linear-gradient(90deg,transparent,#c8e39c,transparent);animation:sweep 1.8s linear infinite}
@keyframes sweep{to{left:100%}}
.icon{font-size:23px;margin-bottom:3px}
.cost{color:#d8c69b;font-size:12px;line-height:1.7}
.bad{color:var(--red)}.good{color:var(--green)}
.bar{height:9px;border-radius:8px;overflow:hidden;background:#061620;margin:8px 0;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a361,#edd5a0);transition:width .3s}
.bar.red i{background:linear-gradient(90deg,#ad5d50,#e7a381)}
.bar.green i{background:linear-gradient(90deg,#68835b,#b5d28a)}
.bar.blue i{background:linear-gradient(90deg,#4f7d8f,#a3d3e0)}
.hint{font-size:12px;color:#95a89f;line-height:1.5}
.section-title{margin:0 0 10px}
.wide{grid-column:1/-1}
footer{font-size:11px;color:#879e98;margin-top:16px;text-align:center}
dialog{border:1px solid #aa966b;border-radius:22px;padding:0;background:#0e2429;color:var(--text);
  width:min(650px,calc(100% - 20px));max-height:88dvh;box-shadow:0 30px 100px #000a}
dialog::backdrop{background:#020a10bc;backdrop-filter:blur(5px)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:16px 18px;border-bottom:1px solid #77856b44;background:#1a3237}
#modal-body{padding:16px;overflow:auto;max-height:calc(88dvh - 84px)}
#modal-body .card{margin-bottom:10px}
.quote{border-left:3px solid var(--gold);padding:8px 13px;background:#bda3640d;font-style:italic}
.log{border-bottom:1px solid #64776b3b;padding:11px 0}
.log small{font-size:10px}
.log-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;background:#2a3f43;margin-right:6px;color:#c2d1cb;letter-spacing:.5px}
.log-tag.bad{background:#3a231d;color:#f1b18f}
.log-tag.good{background:#22322a;color:#c9e2a7}
.log-tag.event{background:#2b2b1f;color:#e5d29d}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;
  pointer-events:none;z-index:20;background:#ead2a2;color:#292a21;padding:11px 18px;
  border-radius:12px;box-shadow:0 8px 30px #0009;transition:.22s;width:max-content;max-width:90%;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:22px;text-align:center;color:#a8bcb2}
.event-pop{position:absolute;top:60px;left:11px;max-width:280px;padding:11px 14px;border-radius:13px;
  background:#0d2429e6;border:1px solid #dfbf82aa;color:#f6ecd0;font-size:12.5px;backdrop-filter:blur(8px);
  animation:pop .3s;box-shadow:0 12px 40px #0006}
@keyframes pop{from{transform:translateY(-10px);opacity:0}}
.event-pop b{color:#ffdc95;display:block;margin-bottom:4px}
.event-pop button{margin-top:8px;font-size:12px;padding:6px 11px}
@media(min-width:800px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  canvas{aspect-ratio:1000/580}
  #modal-body .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  .app{padding:12px 8px 22px}
  .resource{padding:8px 3px}
  .resource small{font-size:8px}
  .toolbar button{font-size:12px;padding:9px 5px}
  .card{padding:11px}.card h3{font-size:14.5px}
  .card button{padding:9px 10px;font-size:12.5px}
  canvas{aspect-ratio:1/1}
  nav button{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="row between header">
    <div><div class="eyebrow">ПРИЛИВЫ И ТУМАНЫ · ОБНОВЛЕНИЕ 2</div><h1>ПОСЛЕДНИЙ ПОРТ</h1></div>
    <div class="row">
      <small id="wave"></small>
      <button data-act="fullscreen" class="ghost" aria-label="Полный экран">⛶</button>
      <button data-act="help" class="ghost">?</button>
    </div>
  </header>
  <div class="resources" id="resources"></div>
  <section class="scene">
    <canvas id="world" aria-label="Карта порта."></canvas>
    <div class="badge" id="badge"></div>
    <div class="status-strip" id="status-strip"></div>
    <div class="camera">
      <button data-act="zoomout" aria-label="Уменьшить">−</button>
      <button data-act="zoomin" aria-label="Увеличить">+</button>
      <button data-act="home" class="primary" aria-label="Общий вид">⌂</button>
    </div>
    <div id="event-pop" hidden></div>
  </section>
  <button class="strip" data-act="project" id="project-strip"></button>
  <div id="queue" class="queue"></div>
  <div class="toolbar">
    <button data-act="people">♙ Жители</button>
    <button data-act="market">⚖ Торговля</button>
    <button data-act="research">⚙ Развитие</button>
    <button data-act="quests">✧ Задания</button>
  </div>
  <nav id="nav"></nav>
  <section id="panel"></section>
  <div class="row between">
    <span class="hint" id="status">Порт ждёт твоих решений.</span>
    <button data-act="journal">☷ Журнал</button>
  </div>
  <footer>Автосохранение в этом браузере · офлайн-производство до 8 часов · оборона в фоне на паузе · сохранение v2</footer>
</main>
<dialog id="dialog">
  <div class="modal-head"><h2 id="modal-title"></h2><button data-act="close" aria-label="Закрыть">✕</button></div>
  <div id="modal-body"></div>
</dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

const TABS=[["base","⌂","База"],["lands","▧","Земли"],["heroes","★","Герои"],["army","⚑","Войска"],["trips","⌖","Вылазки"],["defense","⚔","Оборона"]];

function fresh(){
 const now=Date.now();
 return {version:VERSION,last:now,res:{food:500,wood:550,parts:220,coins:90},
 b:Object.fromEntries(Object.keys(B).map(k=>[k,1])),
 tech:Object.fromEntries(Object.keys(TECH).map(k=>[k,0])),
 heroes:{vera:1,mark:1,lina:1,sol:1},active:"vera",people:12,army:8,wounded:0,
 jobs:{build:null,research:null,train:null,heal:null,trip:null,land:null},
 lands:[],project:0,wave:1,fight:null,claimed:[],logs:[],
 stats:{trips:0,wins:0,rain:0},
 market:{epoch:Math.floor(now/14400000),used:{}},
 weather:{id:"clear",until:now+900000,seed:Math.random()},
 morale:70,water:180,patrol:{last:now},
 hazard:null
 };
}

function migrate(v){
  const out=fresh();
  const keep=["last","res","b","heroes","active","people","army","wounded","jobs","lands","project","wave","fight","claimed","logs","stats","market"];
  for(const k of keep)if(v[k]!==undefined)out[k]=v[k];
  for(const k in TECH)out.tech[k]=(v.tech&&v.tech[k])||0;
  for(const k in HERO)out.heroes[k]=(v.heroes&&v.heroes[k])||1;
  if(!HERO[out.active])out.active="vera";
  out.stats.rain=0;
  out.version=VERSION;
  return out;
}

function validate(v){
  try{
    if(v&&v.version===1)v=migrate(v);
    const num=(n,mn,mx)=>typeof n==="number"&&Number.isFinite(n)&&n>=mn&&n<=mx;
    const int=(n,mn,mx)=>num(n,mn,mx)&&Number.isInteger(n);
    if(!v||v.version!==VERSION)return fresh();
    const out=fresh();
    if(num(v.last,0,Date.now()+864e5))out.last=v.last;
    for(const k in RES)if(num(v.res&&v.res[k],0,1e12))out.res[k]=v.res[k];
    for(const k in B)if(int(v.b&&v.b[k],1,B[k].max))out.b[k]=v.b[k];
    for(const k in TECH)if(int(v.tech&&v.tech[k],0,TECH[k].max))out.tech[k]=v.tech[k];
    for(const k in HERO)if(int(v.heroes&&v.heroes[k],1,10))out.heroes[k]=v.heroes[k];
    if(HERO[v.active])out.active=v.active;
    if(int(v.people,12,1e5))out.people=v.people;
    if(int(v.army,0,150))out.army=v.army;
    if(int(v.wounded,0,150))out.wounded=v.wounded;
    if(int(v.project,0,3))out.project=v.project;
    if(int(v.wave,1,1e5))out.wave=v.wave;
    if(Array.isArray(v.lands))out.lands=[...new Set(v.lands.filter(k=>LAND[k]))];
    if(Array.isArray(v.claimed))out.claimed=[...new Set(v.claimed.filter(n=>int(n,0,QUESTS.length-1)))];
    if(v.stats)for(const k of ["trips","wins","rain"])if(int(v.stats[k],0,1e9))out.stats[k]=v.stats[k];
    if(v.market&&int(v.market.epoch,0,1e10)){
      out.market={epoch:v.market.epoch,used:{}};
      for(const k in TRADES){const n=(v.market.used&&v.market.used[k])||0;if(int(n,0,TRADES[k].stock))out.market.used[k]=n}
    }
    if(v.jobs&&typeof v.jobs==="object"){
      for(const kind in out.jobs){
        const j=v.jobs[kind];if(j==null)continue;
        if(!num(j.start,0,Date.now()+864e5)||!num(j.end,j.start+1,j.start+864e5))continue;
        const n={start:j.start,end:j.end};
        if(kind==="build"||kind==="research"){
          const defs=kind==="build"?B:TECH,state=kind==="build"?out.b:out.tech;
          if(!defs[j.id]||state[j.id]>=defs[j.id].max)continue;
          n.id=j.id;
        }
        if(kind==="land"){if(!LAND[j.id]||out.lands.includes(j.id))continue;n.id=j.id}
        if(kind==="train"||kind==="heal"){if(!int(j.count,1,150))continue;n.count=j.count}
        if(kind==="trip"){
          if(!MISSIONS[j.id]||!int(j.units,1,150))continue;
          if(!num(j.at,j.start,j.end)||!int(j.event,0,EVENTS.length-1))continue;
          n.id=j.id;n.units=j.units;n.at=j.at;
          n.event=j.event;
          n.choice=[null,"safe","help"].includes(j.choice)?j.choice:null;
          n.roll=num(j.roll,0,1)?j.roll:Math.random();
        }
        out.jobs[kind]=n;
      }
    }
    if(v.fight){
      const f=v.fight;
      if(num(f.hp,.001,1e12)&&num(f.max,.001,1e12)&&num(f.enemy,.001,1e12)&&num(f.enemyMax,.001,1e12)&&num(f.damage,.001,1e12)&&num(f.attack,.001,1e12)){
        out.fight={hp:f.hp,max:f.max,enemy:f.enemy,enemyMax:f.enemyMax,damage:f.damage,attack:f.attack,
          cooldown:num(f.cooldown,0,2)?f.cooldown:0,shield:num(f.shield,0,10)?f.shield:0,
          used:Array.isArray(f.used)?f.used.filter(x=>["burst","repair","cover"].includes(x)):[]};
      }
    }
    if(Array.isArray(v.logs))out.logs=v.logs.slice(0,120).map(e=>({at:+e.at||Date.now(),text:String(e.text||"").slice(0,500),tag:e.tag||""}));
    if(num(v.morale,0,120))out.morale=v.morale;
    if(num(v.water,0,1e6))out.water=v.water;
    if(v.weather&&WEATHER.some(w=>w.id===v.weather.id)&&num(v.weather.until,0,Date.now()+864e5))
      out.weather={id:v.weather.id,until:v.weather.until,seed:v.weather.seed||Math.random()};
    if(v.patrol&&num(v.patrol.last,0,Date.now()+864e5))out.patrol=v.patrol;
    if(v.hazard&&typeof v.hazard==="object"&&num(v.hazard.until,0,Date.now()+864e5))out.hazard=v.hazard;
    return out;
  }catch(e){console.error("validate:",e);return fresh()}
}

let tab="base",selected="hq",modal=null,lastSave=0,lastUI=0,lastFrame=0,saveWarn=false;
const camera={scale:1,x:0,y:0};

let eventPopSeen=null;

function toast(text){
 const t=$("toast");if(!t)return;
 t.textContent=text;t.classList.add("show");
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}
function log(text,tag=""){s.logs.unshift({at:Date.now(),text,tag});s.logs=s.logs.slice(0,120);const st=$("status");if(st)st.textContent=text}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(s));lastSave=Date.now()}
 catch(e){if(!saveWarn){toast("Сохранение недоступно.");saveWarn=true}}

function cap(){return 1500+s.b.store*1500}
function moraleCap(){return 100+s.tech.morale*8}
function add(reward){for(const k in reward){if(RES[k]){const mx=k==="coins"?1e12:cap();s.res[k]=Math.min(mx,s.res[k]+reward[k])}}}
function afford(cost){for(const k in cost)if(s.res[k]<cost[k])return false;return true}
function pay(cost){if(!afford(cost))return false;for(const k in cost)s.res[k]-=cost[k];return true}
function costHTML(cost){return Object.keys(cost).map(k=>`<span class="${s.res[k]<cost[k]?"bad":""}">${RES[k][0]} ${fmt(cost[k])}</span>`).join(" · ")}
function rewardHTML(reward){return Object.keys(reward).map(k=>`${RES[k][0]} ${fmt(reward[k])}`).join(" · ")}
function time(sec){sec=Math.max(0,Math.ceil(sec));if(sec>=3600)return `${Math.floor(sec/3600)} ч ${Math.floor(sec%3600/60)} м`;return sec>=60?`${Math.floor(sec/60)} м ${sec%60} с`:`${sec} с`}
function timer(j){return `<div class="bar"><i data-progress="${j.start},${j.end}"></i></div><small>Осталось <span data-end="${j.end}"></span></small>`}
function button(act,id,text,disabled=false,primary=false){return `<button data-act="${act}" data-id="${id}" ${disabled?"disabled":""} class="${primary?"primary":""}">${text}</button>`}

function buildCost(id){const n=s.b[id],out={};for(const k in B[id].cost)out[k]=Math.ceil(B[id].cost[k]*Math.pow(1.57,n-1));return out}
function techCost(id){const out={};for(const k in TECH[id].cost)out[k]=Math.ceil(TECH[id].cost[k]*Math.pow(1.8,s.tech[id]));return out}
function buildReason(id){
 if(s.b[id]>=B[id].max)return "Максимальный уровень";
 if(s.jobs.build)return "Строительная очередь занята";
 if(id!=="hq"&&s.b[id]>=s.b.hq+2)return "Сначала улучши штаб";
 if(!afford(buildCost(id)))return "Недостаточно ресурсов";
 return "";
}

function workerInfo(){
 const total=Math.min(Math.floor(s.people*.6),s.b.energy*6,(s.b.farm+s.b.mill+s.b.workshop)*3);
 const support=clamp(Math.min(s.b.housing*15,s.b.water*18)/s.people,.5,1);
 const slots=[s.b.farm*3,s.b.mill*3,s.b.workshop*3],counts=[0,0,0];
 for(let i=0;i<total;i++){
   const free=counts.map((v,k)=>v<slots[k]?v/slots[k]:Infinity);
   counts[free.indexOf(Math.min.apply(null,free))]++;
 }
 return {total,support,counts};
}

function weatherFactor(){
  const w=s.weather.id,mit=1-s.tech.weather*.2;
  if(w==="rain")return {food:1-.2*mit,wood:1,parts:1,defense:1,trip:1};
  if(w==="fog")return {food:1,wood:1,parts:1,defense:1,trip:1-.1*mit};
  if(w==="storm")return {food:1,wood:1,parts:1,defense:1-.2*mit,trip:0};
  return {food:1,wood:1,parts:1,defense:1,trip:1};
}
function moraleFactor(){return clamp(.8+s.morale/100*.4,.5,1.2)}

function rates(){
 const w=workerInfo(),hero=s.active==="vera"?s.heroes.vera*.05:0,wf=weatherFactor(),mf=moraleFactor();
 const out={};
 ["farm","mill","workshop"].forEach((id,i)=>{
   const b=B[id],land=s.lands.reduce((a,k)=>a+(LAND[k][b.res]||0),0);
   const base=b.rate*s.b[id]*(1+s.tech.tools*.12+hero+land+(s.project===3?.25:0));
   const workBonus=1+w.counts[i]*.04*w.support*mf;
   out[b.res]=base*workBonus*wf[b.res];
 });
 return out;
}
function tripBonus(){return (1+s.b.dock*.08+(s.active==="lina"?s.heroes.lina*.08:0)+(s.lands.includes("radar")?.15:0))*(s.weather.id==="fog"?1-.1*(1-s.tech.weather*.2):1)}
function availableArmy(){return Math.max(0,s.army-(s.jobs.trip?s.jobs.trip.units:0))}
function power(){return (8+s.b.wall*5+availableArmy()*2.4)*(1+s.tech.tactics*.1+(s.active==="mark"?s.heroes.mark*.07:0))*weatherFactor().defense}
function baseHP(){return 250+s.b.hq*100+s.b.wall*95}
function jobsList(){const out=[];for(const k in s.jobs)if(s.jobs[k])out.push([k,s.jobs[k]]);return out}

function startJob(kind,payload,seconds,cost){
 if(s.jobs[kind])return toast("Эта очередь уже занята.");
 if(!pay(cost))return toast("Недостаточно ресурсов.");
 const now=Date.now();s.jobs[kind]=Object.assign({},payload,{start:now,end:now+seconds*1000});
 log("Начато: "+jobName(kind,s.jobs[kind])+".","event");changed();
}
function jobName(kind,j){
 if(kind==="build")return B[j.id].name;
 if(kind==="research")return TECH[j.id].name;
 if(kind==="train")return "обучение "+j.count+" бойцов";
 if(kind==="heal")return "лечение "+j.count+" бойцов";
 if(kind==="trip")return MISSIONS[j.id].name;
 if(kind==="land")return LAND[j.id].name;
 return kind;
}
function finishJob(kind,j){
 s.jobs[kind]=null;
 if(kind==="build"){s.b[j.id]++;log("Построено: "+B[j.id].name+" ур. "+s.b[j.id]+".","good")}
 else if(kind==="research"){s.tech[j.id]++;log("Исследование: "+TECH[j.id].name+" ур. "+s.tech[j.id]+".","good")}
 else if(kind==="train"){s.army+=j.count;log("Обучено бойцов: "+j.count+".","good")}
 else if(kind==="heal"){s.wounded-=j.count;s.army+=j.count;s.morale=Math.min(moraleCap(),s.morale+j.count*1.5);log("Излечено: "+j.count+".","good")}
 else if(kind==="land"){s.lands.push(j.id);s.people+=LAND[j.id].people||0;log("Освоено: "+LAND[j.id].name+".","good")}
 else if(kind==="trip"){
   const m=MISSIONS[j.id],bonus=tripBonus(),reward={};
   for(const k in m.reward)reward[k]=Math.floor(m.reward[k]*bonus);
   add(reward);
   let injured=0;
   if(j.roll<m.risk*(1-s.tech.medicine*.12)*(1-(s.active==="sol"?s.heroes.sol*.1:0))){
     injured=Math.min(s.army,Math.max(1,Math.floor(j.units*.2)));
     s.army-=injured;s.wounded+=injured;s.morale=Math.max(0,s.morale-injured*.8);
   }
   let extra="";
   if(j.choice==="help"){const e=EVENTS[j.event];add(e.reward);s.people+=e.people;extra=" Событие: "+e.name+"."}
   s.stats.trips++;
   log(m.name+": отряд вернулся. "+rewardHTML(reward)+"."+extra+(injured?" Ранены: "+injured+".":""),injured?"bad":"good");
 }
}

function tickWeather(now){
  if(now<s.weather.until)return;
  const pool=WEATHER.filter(w=>w.id!==s.weather.id);
  const pick=pool[Math.floor(Math.random()*pool.length)];
  s.weather={id:pick.id,until:now+(6+Math.random()*10)*60000,seed:Math.random()};
  if(pick.id!=="clear")log("Погода: "+pick.name+". "+pick.desc,"event");
  if(pick.id==="storm")toast("⚡ Шторм! Вылазки закрыты.");
  if(pick.id==="rain"){s.stats.rain++;s.water=Math.min(cap(),s.water+50)}
  if(pick.id==="clear"&&Math.random()<.4){add({parts:30});log("После непогоды нашли обломки: +30 деталей.","good")}
}
function tickPatrol(now){
  const dt=(now-s.patrol.last)/60000;
  if(dt<1||availableArmy()<2)return;
  const cycles=Math.min(dt,60);
  s.patrol.last+=cycles*60000;
  const gain=Math.floor(cycles*availableArmy()*.35);
  if(gain>0){s.res.wood=Math.min(cap(),s.res.wood+gain);s.res.parts=Math.min(cap(),s.res.parts+Math.floor(gain*.3))}
}
function tickHazard(now){
  if(s.hazard){
    if(now>s.hazard.until){log("Авария устранена сама, но обошлась дорого.","bad");s.morale=Math.max(0,s.morale-6);s.res.wood=Math.max(0,s.res.wood-80);s.hazard=null}
    return;
  }
  if(Math.random()<.00025){
    const kinds=[{name:"Пожар на складе",cost:{wood:60,parts:20}},{name:"Течь в водонапорной",cost:{parts:40,wood:30}}];
    const k=kinds[Math.floor(Math.random()*kinds.length)];
    s.hazard={name:k.name,cost:k.cost,until:now+180000};
    log("⚠ "+k.name+"!","bad");toast("⚠ "+k.name);
  }
}
function tickMorale(){
  const storeFill=(s.res.food+s.res.wood+s.res.parts)/(cap()*3);
  const housingRate=Math.min(1,s.b.housing*15/s.people);
  const waterRate=Math.min(1,s.b.water*18/s.people);
  const target=clamp(50+storeFill*20+housingRate*15+waterRate*15+(s.active==="sol"?s.heroes.sol*3:0)+s.tech.morale*3-s.wounded*.4,20,moraleCap());
  s.morale+=(target-s.morale)*.02;
}

function simulate(now){
 if(now<s.last){s.last=now;return false}
 let cursor=s.last,changedFlag=false,iter=0;
 const productionStart=Math.max(cursor,now-8*3600000);
 while(cursor<now&&iter++<40){
   const times=[now,s.weather.until];
   jobsList().forEach(([,j])=>times.push(Math.max(cursor,j.end)));
   const next=Math.min.apply(null,times);
   const dt=Math.max(0,next-Math.max(cursor,productionStart))/1000;
   if(dt){
     const r=rates(),gain={};
     for(const k in r)gain[k]=r[k]*dt;
     add(gain);
     if(s.weather.id==="rain")s.water=Math.min(cap(),s.water+dt*.5);
   }
   cursor=next;
   const done=jobsList().filter(([,j])=>j.end<=cursor);
   for(const [kind,j] of done){finishJob(kind,j);changedFlag=true}
   tickWeather(cursor);
   if(!done.length&&cursor===now)break;
 }
 tickPatrol(now);
 tickHazard(now);
 tickMorale();
 s.last=now;
 const epoch=Math.floor(now/14400000);
 if(epoch!==s.market.epoch){s.market={epoch,used:{}};changedFlag=true}
 return changedFlag;
}

 const q=jobsList(),chips=[];

 if(s.weather.id!=="clear"){const w=WEATHER.find(x=>x.id===s.weather.id);chips.push(`<div class="chip ${w.id==="storm"?"warn":""}">${w.icon} ${w.name}</div>`)}
 $("queue").innerHTML=chips.join("");
 let html="";
 if(tab==="base"){

     <div class="icon">${b.icon}</div><h3>${b.name} · ${s.b[id]}</h3><p>${b.desc}</p>
     ${b.res?`<p class="good">${(r[b.res]*60).toFixed(1)} / мин</p>`:""}
     ${j?timer(j):`<div class="cost">${s.b[id]<b.max?costHTML(buildCost(id)):"Максимальный уровень"}</div>`}
     ${button("building",id,j?"Строится…":"Управлять",false,selected===id)}</article>`;
   }).join("")+"</div>";
 }
 if(tab==="lands"){
   html=`<h3 class="section-title">Освоено ${s.lands.length} / ${Object.keys(LAND).length}</h3><div class="grid">`+
   Object.keys(LAND).map(id=>{
     const l=LAND[id],done=s.lands.includes(id),j=s.jobs.land&&s.jobs.land.id===id?s.jobs.land:null;
     return `<article class="card ${j?"working":""}"><div class="icon">${done?"⚑":"▧"}</div><h3>${l.name}</h3><p>${l.desc}</p>
       ${j?timer(j):done?`<p class="good">Территория принадлежит порту</p>`:`<div class="cost">${costHTML(l.cost)} · ${time(l.time)}</div>`}
       ${button("land",id,done?"Освоено":j?"Расчистка…":"Освоить",done||!!s.jobs.land||!afford(l.cost),!done)}</article>`;
   }).join("")+"</div>";
 }
 if(tab==="heroes"){

function enemyStats(){return {hp:380*Math.pow(1.18,s.wave-1),attack:15*Math.pow(1.115,s.wave-1)}}
function waveReward(){return {food:100+s.wave*35,wood:90+s.wave*30,parts:65+s.wave*22,coins:25+s.wave*8}}

function resolveFight(){
 const f=s.fight;if(!f||(f.hp>0&&f.enemy>0))return;
 if(f.enemy<=0){
   const reward=waveReward();add(reward);s.stats.wins++;s.morale=Math.min(moraleCap(),s.morale+8);
   log("Волна "+s.wave+" отражена! "+rewardHTML(reward),"good");s.wave++;toast("Победа!");
 }else{
   const n=Math.min(availableArmy(),Math.max(1,Math.floor(availableArmy()*.2*(1-s.tech.medicine*.12))));
   s.army-=n;s.wounded+=n;s.morale=Math.max(0,s.morale-15);
   log("Оборона не выдержала. Ранены: "+n+".","bad");toast("Отступление.");
 }
 s.fight=null;changed();
}
function fightTick(dt){
 const f=s.fight;if(!f||document.hidden)return;
 f.cooldown=Math.max(0,f.cooldown-dt);
 const shieldDt=Math.min(dt,f.shield);f.shield=Math.max(0,f.shield-dt);
 const effAttack=f.attack*(1-shieldDt/dt*.8);
 f.enemy-=f.damage*dt;
 f.hp-=effAttack*dt;
 if(f.hp<0)f.hp=0;if(f.enemy<0)f.enemy=0;
 resolveFight();
}

 if(act==="train"){if(s.fight)return toast("После боя.");if(s.army+s.wounded+5>s.b.barracks*15)return toast("Улучши казармы.");return startJob("train",{count:5},55/(1+s.b.barracks*.12),{food:100,wood:40,parts:20})}
 if(act==="heal"){if(s.fight)return toast("После боя.");const c=Math.min(5,s.wounded);if(!c)return;return startJob("heal",{count:c},45/(1+s.b.hospital*.15),{food:c*18,parts:c*5})}
 if(act==="trip"){

   return startJob("trip",{id,units:m.need,event:Math.floor(Math.random()*EVENTS.length),at:Date.now()+seconds*450,choice:null,roll:Math.random()},seconds,m.cost);
 }
 if(act==="event-choice"){const j=s.jobs.trip;if(!j||j.choice||Date.now()<j.at||Date.now()>=j.end)return;if(id==="help"&&!pay(EVENTS[j.event].cost))return toast("Недостаточно.");j.choice=id;log("Решение отряду принято.","event")}
 if(act==="trade"){const t=TRADES[id];if(s.fight||(s.market.used[id]||0)>=t.stock||!pay(t.cost)||(t.req&&!t.req(s)))return toast("Недоступно.");s.market.used[id]=(s.market.used[id]||0)+1;add(t.reward);log("Караван: "+t.name+".","good")}
 if(act==="project-build"){const p=PROJECT[s.project];if(!p||s.b.hq<p.hq||s.lands.length<p.land||!pay(p.cost))return toast("Условия не выполнены.");s.project++;log("Проект: "+p.name+".","good");toast(s.project===3?"Маяк зажжён!":"Этап завершён!")}
 if(act==="claim"){const n=+id,q=QUESTS[n];if(!q||s.claimed.includes(n)||!q.check(s))return;s.claimed.push(n);add(q.reward);log("Задание: "+q.name+".","good");toast("Награда!")}
 if(act==="fight"){if(s.fight)return;const en=enemyStats(),hp=baseHP();s.fight={hp,max:hp,enemy:en.hp,enemyMax:en.hp,damage:power(),attack:en.attack,cooldown:0,shield:0,used:[]};tab="defense";log("Началась оборона. Волна "+s.wave+".","event")}
 if(act==="repair-base"){if(!pay({wood:80,parts:30}))return toast("Ресурсы.");s.morale=Math.min(moraleCap(),s.morale+4);log("Периметр укреплён.","good")}
 if(act==="shoot"){const f=s.fight;if(!f||f.cooldown>0)return;f.enemy=Math.max(0,f.enemy-f.damage*.9);f.cooldown=.7;resolveFight()}

 if(act==="fix-hazard"){if(!s.hazard||!pay(s.hazard.cost))return toast("Ресурсы.");log("Устранено: "+s.hazard.name+".","good");s.morale=Math.min(moraleCap(),s.morale+3);s.hazard=null}
 if(act==="export"){download();return}
 if(act==="import"){if(s.fight)return toast("Сначала заверши оборону.");$("import-file").click();return}
 changed();
});

function drawSky(t){

  const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const interp=(a,b,k)=>a+(b-a)*k;
  const at=x=>{
    for(let i=0;i<stops.length-1;i++){
      if(x>=stops[i][0]&&x<=stops[i+1][0]){
        const k=(x-stops[i][0])/((stops[i+1][0]-stops[i][0])||1);
        const a=hex(stops[i][1]),b=hex(stops[i+1][1]);
        return `rgb(${interp(a[0],b[0],k)|0},${interp(a[1],b[1],k)|0},${interp(a[2],b[2],k)|0})`;
      }

    const cx=((i*230+t*20)%vw)-40,cy=60+i*17,alpha=s.weather.id==="storm"?.45:s.weather.id==="fog"?.55:.22;
    const cc=`rgba(190,205,197,${alpha})`;

function localPoint(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function worldPoint(p){const sc=vw/1000*camera.scale;return {x:(p.x-vw/2-camera.x)/sc+500,y:(p.y-vh/2-camera.y)/sc+340}}
const pointers=new Map();let dragStart=null,moved=false;
function pinchData(){const a=[...pointers.values()];return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
canvas.addEventListener("pointerdown",e=>{try{canvas.setPointerCapture(e.pointerId)}catch(_){}pointers.set(e.pointerId,localPoint(e));if(pointers.size===1){dragStart=localPoint(e);moved=false}else moved=true});
canvas.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 const prev=pointers.get(e.pointerId),old=pointers.size===2?pinchData():null,p=localPoint(e);
 pointers.set(e.pointerId,p);
 if(pointers.size===2){
   const next=pinchData(),world=worldPoint(old);
   camera.scale=clamp(camera.scale*next.d/Math.max(1,old.d),.75,2.8);
   const sc=vw/1000*camera.scale;camera.x=next.x-vw/2-(world.x-500)*sc;camera.y=next.y-vh/2-(world.y-340)*sc;moved=true;
 }else if(pointers.size===1){
   camera.x=clamp(camera.x+p.x-prev.x,-vw,vw);camera.y=clamp(camera.y+p.y-prev.y,-vh,vh);
   if(dragStart&&Math.hypot(p.x-dragStart.x,p.y-dragStart.y)>7)moved=true;
 }
});
function release(e,cancel){

 const p=localPoint(e),wasSingle=pointers.size===1;pointers.delete(e.pointerId);
 if(!cancel&&!moved&&wasSingle){
   const q=worldPoint(p);let hit=null;
   for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(q.x>=h.x&&q.x<=h.x+h.w&&q.y>=h.y&&q.y<=h.y+h.h){hit=h;break}}
   if(hit){selected=hit.id;tab="base";render();open("building",hit.id)}

canvas.addEventListener("pointerup",e=>release(e,false));

resize();
const away=Date.now()-s.last,before=Object.assign({},s.res);
simulate(Date.now());
if(!s.logs.length)log("Первые 12 жителей обустроили порт. Открой развитие, отправь разведку на берег.","event");
if(away>60000){
 const delta={};
 for(const k in RES){const d=Math.max(0,s.res[k]-before[k]);if(d>=1)delta[k]=d}
 log(`Порт дождался тебя. Отсутствие: ${time(away/1000)}. Прирост: ${rewardHTML(delta)||"склады полны"}.`,"good");
}
render();updateLive();
if(loadMessage)toast(loadMessage);
else if(away>60000)toast("С возвращением!");

function frame(ms){
 const dt=lastFrame?Math.min(.08,(ms-lastFrame)/1000):0;lastFrame=ms;
 if(!document.hidden){
   fightTick(dt);
   if(ms-lastUI>1000){simulate(Date.now());render();renderModal();updateLive();lastUI=ms;if(Date.now()-lastSave>10000)save()}
   else if(s.fight)updateCombatOnly();
   draw(reduced.matches?0:ms/1000);
 }
 requestAnimationFrame(frame);
}
function updateCombatOnly(){
 const f=s.fight;if(!f||!$("fight-hp"))return;
 $("fight-hp").textContent=`${fmt(f.hp)} / ${fmt(f.max)}`;
 $("fight-enemy").textContent=`${fmt(f.enemy)} / ${fmt(f.enemyMax)}`;
 $("hp-fill").style.width=clamp(f.hp/f.max*100,0,100)+"%";
 $("enemy-fill").style.width=clamp(f.enemy/f.enemyMax*100,0,100)+"%";
 const b=document.querySelector('[data-act="shoot"]');
 if(b){b.disabled=f.cooldown>0;b.textContent=f.cooldown>0?`Зарядка ${f.cooldown.toFixed(1)} с`:"Прицельный удар"}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){simulate(Date.now());save()}else{lastFrame=0;simulate(Date.now());render();renderModal();updateLive()}});
window.addEventListener("pagehide",()=>{simulate(Date.now());save()});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue)toast("Игра открыта в другой вкладке.")});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
