<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TWD Survivors Clone</title>
  <style>
    /* ================= БАЗОВЫЕ СТИЛИ И ИНТЕРФЕЙС ================= */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121517; color: #fff; overflow: hidden; display: flex; justify-content: center; }
    .game-app { width: 100vw; max-width: 480px; height: 100vh; position: relative; background: radial-gradient(circle at top, #1a2026, #0d1013); overflow: hidden; }
    .hidden { display: none !important; }

    /* Верхняя панель (HUD) */
    .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 100; pointer-events: none; }
    .player-profile { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 20px; border: 1px solid #f0a500; display: flex; flex-direction: column; pointer-events: auto; }
    .player-profile .level { color: #f0a500; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
    .player-profile .power { font-size: 16px; font-weight: bold; }
    .resources { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; width: 60%; pointer-events: auto; }
    .res-badge { background: rgba(30,35,40,0.8); border: 1px solid #333; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .res-food { color: #8bc34a; } .res-wood { color: #d7ccc8; } .res-diamonds { color: #00bcd4; }

    /* ================= ИЗОМЕТРИЧЕСКАЯ КАРТА ================= */
    .map-wrapper { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; perspective: 1000px; z-index: 10; }
    .iso-map { width: 100%; height: 100%; position: relative; transform: rotateX(60deg) rotateZ(-45deg); transform-style: preserve-3d; }
    .tile { position: absolute; width: 60px; height: 60px; background: rgba(45, 60, 50, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; font-size: 24px; }
    .tile:active { transform: scale(0.95); }
    
    /* Состояния клеток */
    .tile.building { background: #3a4146; border: 1px solid #f0a500; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
    .tile.empty { background: rgba(35, 45, 38, 0.6); border: 1px dashed rgba(240, 165, 0, 0.5); }
    .tile.empty::after { content: "+"; color: #f0a500; font-weight: bold; font-size: 24px; opacity: 0.5; }
    .tile.fogged { background: #0f1214; border: 1px dashed #e63946; }
    .tile.fogged::after { content: "🔒"; font-size: 20px; animation: pulseLock 1.5s infinite alternate; }
    .tile.under-construction { background: rgba(60, 50, 30, 0.8); border: 1px solid #f0a500; }
    
    @keyframes pulseLock { from { opacity: 0.5; } to { opacity: 1; } }

    /* Значки сбора и стройка */
    .resource-badge { position: absolute; top: -30px; left: 50%; transform: translateX(-50%) rotateZ(45deg) rotateX(-60deg); background: #f0a500; color: #000; padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: bounce 1s infinite alternate; cursor: pointer; z-index: 50; }
    @keyframes bounce { to { margin-top: -5px; } }
    .flying-resource { position: fixed; z-index: 9999; font-weight: bold; font-size: 14px; color: #f0a500; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 20px; transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1); pointer-events: none; }
    .construction-bar { position: absolute; bottom: 5px; left: 5px; right: 5px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; transform: rotateZ(45deg) rotateX(-60deg); }
    .construction-progress { height: 100%; width: 0%; background: #f0a500; transition: width 0.2s linear; }

    /* ================= НИЖНЯЯ ПАНЕЛЬ И КНОПКА РАДИО ================= */
    .bottom-controls { position: absolute; bottom: 20px; left: 0; width: 100%; padding: 0 20px; z-index: 20; }
    .btn-radio { width: 100%; background: linear-gradient(180deg, #f0a500, #c88a00); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(240, 165, 0, 0.4); cursor: pointer; }
    .btn-radio:active { transform: translateY(2px); }

    /* ================= МОДАЛЬНЫЕ ОКНА (Общие) ================= */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 12, 14, 0.9); backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: center; }
    .modal-box { width: 90%; max-width: 340px; background: #16191c; border: 1px solid #2d3339; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); text-align: center; }
    .btn-primary { width: 100%; padding: 12px; background: #f0a500; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; cursor: pointer; }
    .btn-cancel { width: 100%; padding: 10px; background: transparent; color: #8a949e; border: none; margin-top: 5px; cursor: pointer; font-size: 14px; }

    /* Специфичные модалки: Радио */
    .radio-waves { position: relative; width: 60px; height: 60px; margin: 0 auto 20px; }
    .wave { position: absolute; border: 2px solid #f0a500; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: ripple 1.5s infinite ease-out; }
    .wave:nth-child(2) { animation-delay: 0.5s; } .wave:nth-child(3) { animation-delay: 1s; }
    @keyframes ripple { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 80px; height: 80px; opacity: 0; } }
    .hero-card { background: #1e2227; padding: 15px; border-radius: 12px; border: 2px solid #f0a500; animation: cardAppear 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.2); }
    @keyframes cardAppear { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Специфичные модалки: Бой */
    .enemy-card { background: #222; padding: 15px; border-radius: 10px; border: 1px solid #e63946; margin-bottom: 15px; }
    .bar-bg { height: 10px; background: #333; border-radius: 5px; margin: 5px 0 15px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.3s; }
    .fill-player { background: #4caf50; width: 100%; } .fill-enemy { background: #e63946; width: 100%; }

    /* Меню стройки (Шторка) */
    .build-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #181c20; border-top: 1px solid #333; border-radius: 20px 20px 0 0; padding: 20px; z-index: 900; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); transition: transform 0.3s ease; }
    .build-sheet.hidden { transform: translate(-50%, 100%) !important; display: block !important; }
    .build-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .build-item { background: #222; border: 1px solid #444; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .build-item span { font-size: 12px; color: #aaa; }
    .build-item button { background: #f0a500; border: none; border-radius: 5px; padding: 6px; font-weight: bold; cursor: pointer; color: #000; }
    .build-item button:disabled { background: #444; color: #888; }
  </style>
</head>
<body>

<div class="game-app">
  <!-- Верхняя панель (HUD) -->
  <div class="hud">
    <div class="player-profile">
      <span class="level">БАЗА УР. 1</span>
      <span class="power" id="army-power">⚔️ 57</span>
    </div>
    <div class="resources">
      <div class="res-badge res-food" id="hud-food">🌾 <span id="val-food">5740</span></div>
      <div class="res-badge res-wood" id="hud-wood">🪵 <span id="val-wood">4050</span></div>
      <div class="res-badge res-diamonds" id="hud-diamonds">💎 <span id="val-diamonds">90</span></div>
    </div>
  </div>

  <!-- Изометрическая Карта -->
  <div class="map-wrapper">
    <div class="iso-map" id="iso-map">
      <!-- Клетки генерируются через JS -->
    </div>
  </div>

  <!-- Нижняя панель управления -->
  <div class="bottom-controls">
    <button class="btn-radio" onclick="openRadio()">📻 Радиовышка: Поиск (30 💎)</button>
  </div>

  <!-- Модалка: Радиовышка (Гача) -->
  <div id="modal-radio" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="radio-searching">
        <div class="radio-waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
        <h3 style="color:#f0a500;">ПОИСК СИГНАЛА...</h3>
      </div>
      <div id="radio-result" class="hidden">
        <div class="hero-card">
          <div style="font-size: 50px;" id="hero-icon">🤠</div>
          <h3 id="hero-name" style="margin: 10px 0; color:#f0a500;">Имя Героя</h3>
          <p id="hero-desc" style="font-size: 12px; color:#aaa;">Снайпер. Сила армии +20</p>
          <button class="btn-primary" onclick="closeModal('modal-radio')">Забрать выжившего</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка: Бой за территорию -->
  <div id="modal-battle" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="battle-prep">
        <h3 style="color:#e63946; margin-bottom: 10px;">🚨 Сектор в тумане</h3>
        <div class="enemy-card">
          <span style="font-size: 40px;">🧟</span>
          <p>Врагов: <strong id="b-zombies">15</strong></p>
          <p>Треб. сила: <strong id="b-req">100</strong></p>
        </div>
        <p style="font-size: 12px; color:#aaa; margin-bottom:15px;">Цена атаки: 🌾 <span id="b-cost">300</span> | Награда: 🪵 500</p>
        <button class="btn-primary" style="background:#e63946; color:#fff;" onclick="startCombat()">⚔️ Атаковать</button>
        <button class="btn-cancel" onclick="closeModal('modal-battle')">Отмена</button>
      </div>
      
      <div id="battle-active" class="hidden">
        <h3>ИДЕТ БОЙ...</h3>
        <div style="text-align: left; margin-top:20px;">
          <span style="font-size:12px;">Выжившие</span>
          <div class="bar-bg"><div id="hp-player" class="bar-fill fill-player"></div></div>
          <span style="font-size:12px;">Ходячие</span>
          <div class="bar-bg"><div id="hp-enemy" class="bar-fill fill-enemy"></div></div>
        </div>
        <p id="battle-log" style="font-size: 12px; color: #f0a500; margin-top:10px;">Отряд открыл огонь...</p>
      </div>
    </div>
  </div>

  <!-- Шторка: Строительство -->
  <div id="sheet-build" class="build-sheet hidden">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <h3>🔨 Строительство</h3>
      <button onclick="closeBuildSheet()" style="background:none;border:none;color:#aaa;font-size:18px;">✕</button>
    </div>
    <div class="build-grid" id="build-grid">
      <!-- Карточки стройки генерируются JS -->
    </div>
  </div>

</div>

<script>
// ================= ДАННЫЕ ИГРОКА =================
const player = {
  power: 57,
  res: { food: 5740, wood: 4050, diamonds: 90 }
};

// ================= КАРТА И ЗДАНИЯ =================
const tileSize = 60;
// Сетка 3x3 (от 0,0 до 2,2)
const mapGrid = [
  { id: 't_0_0', x: 0, y: 0, type: 'fog', reqPower: 80, cost: 200, rewardWood: 300 },
  { id: 't_1_0', x: 1, y: 0, type: 'fog', reqPower: 120, cost: 400, rewardWood: 500 },
  { id: 't_2_0', x: 2, y: 0, type: 'empty' },
  { id: 't_0_1', x: 0, y: 1, type: 'empty' },
  { id: 't_1_1', x: 1, y: 1, type: 'building', name: 'Теплица', icon: '🌾', bType: 'farm', accum: 0, rate: 2, max: 100 },
  { id: 't_2_1', x: 2, y: 1, type: 'building', name: 'Лесопилка', icon: '🪵', bType: 'sawmill', accum: 0, rate: 1.5, max: 80 },
  { id: 't_0_2', x: 0, y: 2, type: 'fog', reqPower: 50, cost: 100, rewardWood: 150 },
  { id: 't_1_2', x: 1, y: 2, type: 'empty' },
  { id: 't_2_2', x: 2, y: 2, type: 'building', name: 'Штаб', icon: '⛺', bType: 'hq', accum: 0, rate: 0, max: 0 }
];

const buildCatalog = [
  { id: 'farm', name: 'Теплица', icon: '🌾', costWood: 100, costFood: 0, time: 5, rate: 2, max: 100 },
  { id: 'sawmill', name: 'Лесопилка', icon: '🪵', costWood: 0, costFood: 150, time: 5, rate: 1.5, max: 80 },
  { id: 'barracks', name: 'Казарма', icon: '🪖', costWood: 200, costFood: 200, time: 8, isMilitary: true, powerBonus: 30 }
];

let selectedTile = null;

// ================= ИНИЦИАЛИЗАЦИЯ И РЕНДЕР =================
function updateHUD() {
  document.getElementById('val-food').innerText = Math.floor(player.res.food);
  document.getElementById('val-wood').innerText = Math.floor(player.res.wood);
  document.getElementById('val-diamonds').innerText = player.res.diamonds;
  document.getElementById('army-power').innerText = `⚔️ ${player.power}`;
}

function renderMap() {
  const mapEl = document.getElementById('iso-map');
  mapEl.innerHTML = '';

  mapGrid.forEach(tile => {
    const el = document.createElement('div');
    el.id = tile.id;
    
    // Сдвиг по сетке + центрирование карты
    el.style.left = `${tile.x * tileSize + 60}px`; 
    el.style.top = `${tile.y * tileSize + 60}px`;
    
    if (tile.type === 'fog') {
      el.className = 'tile fogged';
      el.onclick = () => openBattle(tile);
    } else if (tile.type === 'empty') {
      el.className = 'tile empty';
      el.onclick = () => openBuildSheet(tile);
    } else if (tile.type === 'building') {
      el.className = 'tile building';
      el.innerHTML = tile.icon;
      // Если это стройка
      if (tile.isBuilding) {
        el.className = 'tile under-construction';
        el.innerHTML = `🏗️<div class="construction-bar"><div class="construction-progress" id="prog_${tile.id}"></div></div>`;
      }
    }
    mapEl.appendChild(el);
  });
}

// ================= ФОНОВЫЙ ЦИКЛ ПРОИЗВОДСТВА =================
setInterval(() => {
  mapGrid.forEach(tile => {
    if (tile.type === 'building' && tile.rate > 0 && !tile.isBuilding) {
      if (tile.accum < tile.max) {
        tile.accum += tile.rate;
        updateResourceBadge(tile);
      }
    }
  });
}, 1000);

function updateResourceBadge(tile) {
  const el = document.getElementById(tile.id);
  if (!el) return;
  let badge = el.querySelector('.resource-badge');

  if (tile.accum >= 10) {
    if (!badge) {
      badge = document.createElement('div');
      badge.className = 'resource-badge';
      // Компенсируем поворот изометрии, чтобы значок смотрел прямо
      badge.onclick = (e) => { e.stopPropagation(); collectResource(tile, badge); };
      el.appendChild(badge);
    }
    badge.innerText = `${tile.icon} ${Math.floor(tile.accum)}`;
  }
}

function collectResource(tile, badge) {
  const amount = Math.floor(tile.accum);
  if (amount <= 0) return;
  tile.accum = 0;
  badge.remove();

  // Анимация полета
  const badgeRect = badge.getBoundingClientRect();
  const targetId = tile.bType === 'farm' ? 'hud-food' : 'hud-wood';
  const targetRect = document.getElementById(targetId).getBoundingClientRect();

  const particle = document.createElement('div');
  particle.className = 'flying-resource';
  particle.innerText = `+${amount}`;
  particle.style.left = `${badgeRect.left}px`;
  particle.style.top = `${badgeRect.top}px`;
  document.body.appendChild(particle);

  requestAnimationFrame(() => {
    particle.style.left = `${targetRect.left + 20}px`;
    particle.style.top = `${targetRect.top + 10}px`;
    particle.style.opacity = '0.3';
    particle.style.transform = 'scale(0.5)';
  });

  setTimeout(() => {
    if (tile.bType === 'farm') player.res.food += amount;
    else player.res.wood += amount;
    updateHUD();
    particle.remove();
  }, 800);
}

// ================= РАДИОВЫШКА (ГАЧА) =================
function openRadio() {
  if (player.res.diamonds < 30) return alert("Недостаточно алмазов!");
  player.res.diamonds -= 30;
  updateHUD();

  document.getElementById('modal-radio').classList.remove('hidden');
  document.getElementById('radio-searching').classList.remove('hidden');
  document.getElementById('radio-result').classList.add('hidden');

  setTimeout(() => {
    const isLegendary = Math.random() > 0.7;
    document.getElementById('hero-icon').innerText = isLegendary ? '🕵️‍♂️' : '👷‍♂️';
    document.getElementById('hero-name').innerText = isLegendary ? 'Рик Лидер' : 'Боб Строитель';
    document.getElementById('hero-desc').innerText = isLegendary ? 'Сила армии +50' : 'Сила армии +10';
    
    player.power += isLegendary ? 50 : 10;
    updateHUD();

    document.getElementById('radio-searching').classList.add('hidden');
    document.getElementById('radio-result').classList.remove('hidden');
  }, 2000);
}

// ================= БОЙ (РАСЧИСТКА ТУМАНА) =================
function openBattle(tile) {
  selectedTile = tile;
  document.getElementById('b-zombies').innerText = tile.reqPower * 2;
  document.getElementById('b-req').innerText = tile.reqPower;
  document.getElementById('b-cost').innerText = tile.cost;
  
  document.getElementById('modal-battle').classList.remove('hidden');
  document.getElementById('battle-prep').classList.remove('hidden');
  document.getElementById('battle-active').classList.add('hidden');
}

function startCombat() {
  if (player.res.food < selectedTile.cost) return alert("Мало еды!");
  player.res.food -= selectedTile.cost;
  updateHUD();

  document.getElementById('battle-prep').classList.add('hidden');
  document.getElementById('battle-active').classList.remove('hidden');

  let pHP = 100, eHP = 100;
  const timer = setInterval(() => {
    pHP -= Math.random() * (selectedTile.reqPower / player.power * 20);
    eHP -= Math.random() * (player.power / selectedTile.reqPower * 25);
    
    document.getElementById('hp-player').style.width = Math.max(0, pHP) + '%';
    document.getElementById('hp-enemy').style.width = Math.max(0, eHP) + '%';

    if (eHP <= 0 || pHP <= 0) {
      clearInterval(timer);
      if (eHP <= 0) {
        document.getElementById('battle-log').innerText = "ПОБЕДА! Туман рассеян.";
        setTimeout(() => {
          player.res.wood += selectedTile.rewardWood;
          selectedTile.type = 'empty';
          updateHUD();
          renderMap();
          closeModal('modal-battle');
        }, 1500);
      } else {
        document.getElementById('battle-log').innerText = "ПОРАЖЕНИЕ. Армия отступила.";
        setTimeout(() => closeModal('modal-battle'), 1500);
      }
    }
  }, 500);
}

// ================= СТРОИТЕЛЬСТВО =================
function openBuildSheet(tile) {
  selectedTile = tile;
  const grid = document.getElementById('build-grid');
  grid.innerHTML = '';

  buildCatalog.forEach(b => {
    const canAfford = player.res.wood >= b.costWood && player.res.food >= b.costFood;
    grid.innerHTML += `
      <div class="build-item">
        <strong style="color:#f0a500;">${b.icon} ${b.name}</strong>
        <span>🪵 ${b.costWood} | 🌾 ${b.costFood}</span>
        <span>⏱️ ${b.time} сек</span>
        <button ${!canAfford ? 'disabled' : ''} onclick="startBuild('${b.id}')">Построить</button>
      </div>
    `;
  });
  document.getElementById('sheet-build').classList.remove('hidden');
}

function closeBuildSheet() { document.getElementById('sheet-build').classList.add('hidden'); }

function startBuild(bId) {
  const bData = buildCatalog.find(b => b.id === bId);
  player.res.wood -= bData.costWood;
  player.res.food -= bData.costFood;
  updateHUD();
  closeBuildSheet();

  selectedTile.type = 'building';
  selectedTile.isBuilding = true;
  selectedTile.icon = bData.icon;
  renderMap();

  let elapsed = 0;
  const timer = setInterval(() => {
    elapsed += 0.2;
    const progEl = document.getElementById(`prog_${selectedTile.id}`);
    if(progEl) progEl.style.width = (elapsed / bData.time * 100) + '%';

    if (elapsed >= bData.time) {
      clearInterval(timer);
      selectedTile.isBuilding = false;
      selectedTile.name = bData.name;
      selectedTile.bType = bData.id;
      selectedTile.rate = bData.rate || 0;
      selectedTile.max = bData.max || 0;
      selectedTile.accum = 0;
      
      if (bData.isMilitary) {
        player.power += bData.powerBonus;
        updateHUD();
      }
      renderMap();
    }
  }, 200);
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// Запуск
updateHUD();
renderMap();
</script>
</body>
</html>
