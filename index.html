<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121517">
<title>The Last Port — Ultimate+</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root{color-scheme:dark;--text:#f3f4f6;--muted:#9ca3af;--gold:#f59e0b;--bg:#0c0e10;--card:#161a1e;--brd:#2d353e;--h:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
button{font:inherit;cursor:pointer;border:none;outline:none;transition:transform .1s,background .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;filter:grayscale(1);pointer-events:none}
[hidden]{display:none!important}
main{position:relative;width:100%;height:var(--h);overflow:hidden}
.scene{position:absolute;inset:0;z-index:1;background:#0a0f12}
canvas{display:block;touch-action:none}
#camera-layer{position:absolute;inset:0;z-index:2;touch-action:none}
.ui{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,8px)}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 10px;pointer-events:auto;gap:6px}
.pbadge{display:flex;align-items:center;gap:6px;background:rgba(15,18,22,.93);border:1px solid #b48530;border-radius:10px;padding:3px 10px 3px 3px;backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.8)}
.pav{width:40px;height:40px;border-radius:8px;border:2px solid var(--gold);background:#1c2128;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pinfo{display:flex;flex-direction:column}
.plvl{font-size:8px;color:#fbbf24;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.ppw{font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.prat{font-size:9px;color:#93c5fd;font-weight:700}
.xp-bar{height:3px;border-radius:2px;background:#1c2128;margin-top:2px;overflow:hidden;width:80px}
.xp-fill{height:100%;background:linear-gradient(90deg,#a855f7,#c084fc);transition:width .4s}
.res{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ri{background:rgba(15,18,22,.93);border:1px solid var(--brd);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:bold;display:flex;align-items:center;gap:4px;box-shadow:0 3px 10px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.rf{color:#f87171;border-color:rgba(248,113,113,.3)}
.rw{color:#fcd34d;border-color:rgba(253,224,71,.3)}
.rp{color:#93c5fd;border-color:rgba(147,197,253,.3)}
#chstrip{align-self:flex-start;margin:3px 10px;background:linear-gradient(90deg,rgba(20,24,30,.96),rgba(12,15,18,.85));border-left:3px solid var(--gold);border-radius:6px;padding:6px 12px;display:flex;align-items:center;gap:7px;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.7);backdrop-filter:blur(6px);cursor:pointer}
.chav{width:26px;height:26px;border-radius:5px;background:#262c33;display:grid;place-items:center;font-size:13px}
.chc small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase}
.chc strong{font-size:11px;color:#f3f4f6}
.cctrl{position:absolute;right:10px;top:36%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.cctrl button{width:38px;height:38px;border-radius:9px;background:rgba(22,26,32,.92);border:1px solid var(--brd);color:#fff;font-size:16px;box-shadow:0 3px 12px rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.cctrl .pr{border-color:var(--gold);color:var(--gold)}
#dock{margin-top:auto;background:rgba(14,17,21,.97);backdrop-filter:blur(14px);border-top-left-radius:16px;border-top-right-radius:16px;pointer-events:auto;display:flex;flex-direction:column;box-shadow:0 -8px 36px rgba(0,0,0,.9);height:44dvh;transition:height .35s cubic-bezier(.4,0,.2,1);z-index:100;border-top:1px solid var(--brd)}
#dock.col{height:48px}
.tb{display:flex;gap:5px;padding:8px 10px 5px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tb::-webkit-scrollbar{display:none}
.tb button{background:var(--card);border:1px solid var(--brd);color:var(--muted);padding:7px 10px;border-radius:7px;font-size:10px;font-weight:bold;white-space:nowrap}
.tb button.act{background:#28313b;color:#fff;border-color:var(--gold)}
.sz{width:32px;padding:0!important;display:grid;place-items:center;font-size:14px}
#panel{flex:1;overflow-y:auto;padding:5px 10px 10px;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cd{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:5px;transition:border-color .2s,box-shadow .2s}
.cd.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(245,158,11,.12)}
.ct{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;color:#fff}
.cl{font-size:9px;color:var(--gold);background:rgba(245,158,11,.15);padding:2px 5px;border-radius:3px}
.cd p{font-size:9px;color:var(--muted);line-height:1.3;margin:0;flex:1}
.cd>button,.cbtn{background:linear-gradient(180deg,#d97706,#b45309);color:#fff;padding:7px;border-radius:7px;font-weight:bold;font-size:10px;text-shadow:0 1px 2px rgba(0,0,0,.5);text-align:center}
.ci{font-size:22px;text-align:center}
.cb{height:4px;border-radius:3px;background:#1c2128;overflow:hidden}
.cbf{height:100%;border-radius:3px;transition:width .4s}
nav{display:flex;justify-content:space-around;background:#090b0d;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));border-top:1px solid var(--brd);flex-shrink:0;overflow-x:auto}
nav button{background:none;color:#6b7280;font-size:8px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 4px;min-width:0}
nav button.act{color:var(--gold)}
nav button b{font-size:16px}
#toast{position:absolute;top:6px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:9998;background:rgba(12,15,18,.97);border:1px solid var(--gold);border-radius:9px;padding:8px 16px;font-size:11px;font-weight:700;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.8);opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fly{position:absolute;z-index:9999;font-weight:900;font-size:14px;text-shadow:0 2px 6px #000;pointer-events:none;transition:.9s cubic-bezier(.2,1,.3,1)}
.rar{font-size:8px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase}
.rc{background:rgba(156,163,175,.2);color:#d1d5db}
.rr{background:rgba(96,165,250,.2);color:#60a5fa}
.re{background:rgba(192,132,252,.2);color:#c084fc}
.rl{background:rgba(245,158,11,.25);color:#fbbf24}
.hav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #4b5563;background:#1c2128;flex-shrink:0}
.hav.rr{border-color:#60a5fa;box-shadow:0 0 8px rgba(96,165,250,.4)}
.hav.re{border-color:#c084fc;box-shadow:0 0 8px rgba(192,132,252,.4)}
.hav.rl{border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.5)}
.hr{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:8px;margin-bottom:6px}
.hr.sel{border-color:var(--gold)}
.hri{flex:1;min-width:0}
.hri b{display:block;font-size:11px;color:#fff}
.hri small{font-size:9px;color:var(--muted)}
.eqslot{display:inline-block;width:28px;height:28px;border:1px dashed var(--brd);border-radius:5px;background:#1c2128;text-align:center;line-height:28px;font-size:12px;margin:2px}
.eqslot.filled{border-color:var(--gold);border-style:solid;background:#241c10}
.wmap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.wtile{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1px solid var(--brd);transition:transform .15s}
.wtile:active{transform:scale(.93)}
.wtile.forest{background:#1a2e1a}
.wtile.ruins{background:#2a2220}
.wtile.military{background:#1a2030}
.wtile.hospital{background:#1a2a2a}
.wtile.town{background:#2a2a1a}
.wtile small{font-size:7px;color:var(--muted);margin-top:2px}
.wtile.explored{opacity:.5}
.wtile.current{border-color:var(--gold);box-shadow:0 0 8px rgba(245,158,11,.3)}
.tech-node{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.tech-node.done{border-color:#16a34a;background:#0f1f15}
.tech-node.active{border-color:#2563eb}
.tech-icon{width:40px;height:40px;border-radius:8px;background:#1c2128;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tech-info{flex:1}
.tech-info b{display:block;font-size:11px;color:#fff}
.tech-info p{font-size:9px;color:var(--muted);margin:2px 0}
.tech-bar{height:4px;border-radius:3px;background:#1c2128;overflow:hidden;margin-top:4px}
.tech-bar-fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .5s}
.inv-item{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px;margin-bottom:6px}
.inv-icon{width:36px;height:36px;border-radius:6px;background:#1c2128;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--brd)}
.inv-info{flex:1}
.inv-info b{display:block;font-size:11px;color:#fff}
.inv-info small{font-size:9px;color:var(--muted)}
.alliance-box{background:linear-gradient(160deg,#141a24,#0e1218);border:1px solid #2563eb;border-radius:12px;padding:14px;text-align:center;margin-bottom:10px}
.alliance-box h4{margin:0 0 4px;font-size:14px;color:#60a5fa}
.alliance-box p{margin:0 0 10px;font-size:10px;color:var(--muted)}
.alliance-box button{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;font-weight:900;padding:10px 20px;border-radius:8px;font-size:12px}
.member-row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px;margin-bottom:6px}
.member-av{width:32px;height:32px;border-radius:50%;background:#1c2128;display:flex;align-items:center;justify-content:center;font-size:16px}
.recipe-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px;margin-bottom:8px}
.recipe-top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.recipe-icon{width:36px;height:36px;border-radius:6px;background:#1c2128;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--brd)}
.recipe-cost{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.recipe-cost span{font-size:9px;padding:2px 5px;border-radius:3px;background:#1c2128}
.recipe-cost .ok{color:#4ade80}
.recipe-cost .no{color:#ef4444}
.quest-card{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:8px}
.quest-card .qn{font-size:9px;color:var(--gold);text-transform:uppercase;font-weight:800}
.quest-card h3{margin:4px 0;font-size:13px;color:#fff}
.quest-card p{font-size:10px;color:var(--muted);margin:0 0 8px}
.qr{font-size:10px;color:#fbbf24;margin-bottom:8px}
.exp-card{background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:9px;margin-bottom:6px}
.exp-top{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#fff;margin-bottom:3px}
.exp-card p{font-size:9px;color:var(--muted);margin:0 0 6px}
.eb{height:5px;border-radius:3px;background:#262c33;overflow:hidden;margin-bottom:6px}
.ebf{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);transition:width .5s}
.exp-card button{width:100%;background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;font-weight:bold;padding:7px;border-radius:6px;font-size:10px}
.exp-card button.rdy{background:linear-gradient(180deg,#16a34a,#15803d)}
.gacha{background:linear-gradient(160deg,#241c10,#171310);border:1px solid var(--gold);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
.gacha h4{margin:0 0 4px;font-size:14px;color:#fbbf24}
.gacha p{margin:0 0 10px;font-size:10px;color:var(--muted)}
.gacha button{background:linear-gradient(180deg,#f59e0b,#b45309);color:#1a1206;font-weight:900;padding:9px 20px;border-radius:7px;font-size:11px}
.rwstrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin-bottom:10px;scrollbar-width:none}
.rwstrip::-webkit-scrollbar{display:none}
.rwd{flex:0 0 auto;width:52px;background:var(--card);border:1px solid var(--brd);border-radius:7px;padding:6px 3px;text-align:center}
.rwd.today{border-color:var(--gold);background:#241c10}
.rwd.done{opacity:.35}
.rwd small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.rwd span{font-size:14px}
.rwd b{display:block;font-size:9px;color:#fff;margin-top:1px}
.pvp-box{background:linear-gradient(160deg,#1a1420,#120e18);border:1px solid #7c3aed;border-radius:12px;padding:14px;text-align:center;margin-top:12px}
.pvp-box h4{margin:0 0 4px;font-size:14px;color:#c084fc}
.pvp-box p{margin:0 0 10px;font-size:10px;color:var(--muted)}
.pvp-box button{background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;font-weight:900;padding:9px 20px;border-radius:7px;font-size:11px}
.wfx{position:absolute;inset:0;z-index:3;pointer-events:none}
#arena-overlay{position:fixed;inset:0;z-index:5000;background:#050607}
#arena-overlay[hidden]{display:none!important}
#arena-canvas{position:absolute;inset:0;width:100%;height:100%}
.ahud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.awave{font-size:13px;font-weight:900;color:#fbbf24;text-shadow:0 2px 6px #000;text-transform:uppercase}
.ahpw{width:min(300px,78%);height:14px;background:rgba(0,0,0,.7);border:2px solid #1a1d22;border-radius:7px;overflow:hidden}
.ahpf{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .25s}
.ahpf.low{background:linear-gradient(90deg,#dc2626,#ef4444)}
.asplash{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.7);font-size:22px;font-weight:900;text-align:center;text-shadow:0 4px 18px #000;opacity:0;transition:.4s cubic-bezier(.2,1,.3,1);pointer-events:none;white-space:pre-line}
.asplash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.asplash.win{color:#4ade80}
.asplash.lose{color:#ef4444}
.ajoy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;background:rgba(20,24,28,.55);border:2px solid rgba(245,158,11,.35);touch-action:none;pointer-events:auto}
.ajoy .stk{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:rgba(245,158,11,.85);border:2px solid #fff8;box-shadow:0 4px 10px rgba(0,0,0,.6);pointer-events:none}
.aflash{position:absolute;inset:0;background:#dc2626;opacity:0;pointer-events:none;z-index:1;transition:opacity .12s}
.abtn{position:absolute;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.abtn-atk{right:max(18px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom));width:64px;height:64px;background:linear-gradient(180deg,#dc2626,#991b1b);border:3px solid #fca5a5;font-size:22px}
.abtn-skl{right:max(92px,calc(env(safe-area-inset-right) + 74px));bottom:max(58px,calc(env(safe-area-inset-bottom) + 22px));width:48px;height:48px;background:linear-gradient(180deg,#2563eb,#1d4ed8);border:2px solid #93c5fd;font-size:16px}
.akills{position:absolute;top:max(55px,calc(env(safe-area-inset-top) + 45px));right:14px;font-size:12px;font-weight:800;color:#fbbf24;text-shadow:0 2px 6px #000;pointer-events:none}
.atimer{position:absolute;top:max(55px,calc(env(safe-area-inset-top) + 45px));left:14px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
.axp-popup{position:absolute;z-index:9999;font-weight:900;font-size:12px;color:#c084fc;text-shadow:0 2px 6px #000;pointer-events:none;transition:.8s cubic-bezier(.2,1,.3,1)}
</style>
</head>
<body>
<main>
<div class="scene"><canvas id="world"></canvas><div id="camera-layer"></div></div>
<canvas class="wfx" id="wcanvas"></canvas>
<div class="ui">
  <header>
    <div class="pbadge">
      <div class="pav" id="pav-icon">🧑</div>
      <div class="pinfo">
        <span class="plvl">Ур.<span id="plvl">1</span> | Ратуша <span id="hlvl">1</span></span>
        <span class="ppw">⚔<span id="ppw">0</span></span>
        <span class="prat">🏆<span id="prat">1000</span></span>
        <div class="xp-bar"><div class="xp-fill" id="xpfill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="res">
      <div class="ri rf">🍅<span id="rfood">0</span><small style="opacity:.5;font-size:8px">/<span id="rfcap">500</span></small></div>
      <div class="ri rw">🪵<span id="rwood">0</span><small style="opacity:.5;font-size:8px">/<span id="rwcap">500</span></small></div>
      <div class="ri rp">⚙<span id="rparts">120</span><small style="opacity:.5;font-size:8px">/<span id="rpcap">500</span></small></div>
    </div>
  </header>
  <button id="chstrip"><div class="chav">📋</div><div class="chc"><small id="chn">Глава 1</small><strong id="cht">Отремонтируйте ратушу</strong></div></button>
  <div class="cctrl">
    <button data-cam="in">＋</button><button data-cam="out">−</button><button class="pr" data-cam="home">⌂</button>
  </div>
  <section id="dock">
    <div class="tb" id="subtabs"></div>
    <div id="panel"></div>
    <nav id="mnav"></nav>
  </section>
</div>
<div id="toast"></div>
<div id="arena-overlay" hidden>
  <canvas id="arena-canvas"></canvas>
  <div class="aflash" id="aflash"></div>
  <div class="ahud"><div class="awave" id="awlbl">Волна 1</div><div class="ahpw"><div class="ahpf" id="ahpf"></div></div></div>
  <div class="asplash" id="asplash"></div>
  <div class="ajoy" id="ajoy"><div class="stk" id="astk"></div></div>
  <button class="abtn abtn-atk" id="aatk">⚔</button>
  <button class="abtn abtn-skl" id="askl">💥</button>
  <div class="akills" id="akills">💀 0</div>
  <div class="atimer" id="atimer">⏱ 0:00</div>
</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat("ru-RU").format(Math.floor(n||0));

/* ===== STATE ===== */
const S={
  food:80,wood:60,parts:120,fcap:500,wcap:500,pcap:500,
  xp:0,xpNext:100,plvl:1,
  buildings:{
    hq:{n:"Ратуша",l:1,i:"🏛",x:0,z:0,w:2.2,d:2.2,hp:100,mhp:100,prod:null,cost:{wood:50,parts:30},pw:500},
    farm:{n:"Ферма",l:1,i:"🌾",x:-3.5,z:0,w:1.6,d:1.6,hp:80,mhp:80,prod:{r:"food",v:2},cost:{wood:30},pw:100},
    mill:{n:"Лесопилка",l:1,i:"🪓",x:0,z:-3.5,w:1.6,d:1.6,hp:80,mhp:80,prod:{r:"wood",v:2},cost:{wood:20,parts:10},pw:100},

function addTree(x,z,s){const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.06*s,.1*s,.8*s,6),new THREE.MeshStandardMaterial({color:0x3d2b1f,roughness:.9}));tr.position.y=.4*s;tr.castShadow=true;g.add(tr);

  g.position.set(x,0,z);SC.add(g)}
function mkBld(b,k){const g=new THREE.Group();
  if(b.l<=0){const bs=new THREE.Mesh(new THREE.BoxGeometry(b.w,.08,b.d),new THREE.MeshStandardMaterial({color:0x333840,roughness:.9,transparent:true,opacity:.5}));bs.position.y=.04;g.add(bs);

  }else{const h=.5+b.l*.3+(k==="hq"?.5:0);
    const cs={hq:0x8B7355,farm:0x5a7a3a,mill:0x7a6a3a,barracks:0x6a3a3a,wall:0x5a5a58,tower:0x4a5a6a,workshop:0x5a4a3a,hospital:0x6a8a8a};
    const cl=cs[k]||0x666;
    const fd=new THREE.Mesh(new THREE.BoxGeometry(b.w+.1,.12,b.d+.1),new THREE.MeshStandardMaterial({color:0x2a2820,roughness:.95}));fd.position.y=.06;fd.receiveShadow=true;g.add(fd);
    if(k==="hq"){const mn=new THREE.Mesh(new THREE.BoxGeometry(b.w*.85,h,b.d*.85),new THREE.MeshStandardMaterial({color:cl,roughness:.7,metalness:.1}));mn.position.y=h/2+.1;mn.castShadow=true;g.add(mn);
      const rf=new THREE.Mesh(new THREE.ConeGeometry(b.w*.7,.5,4),new THREE.MeshStandardMaterial({color:0x4a3020,roughness:.8}));rf.position.y=h+.35;rf.rotation.y=Math.PI/4;rf.castShadow=true;g.add(rf);
      for(const wx of[-.4,.4]){const w=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.05),new THREE.MeshStandardMaterial({color:0xffcc66,emissive:0xffaa22,emissiveIntensity:.5}));w.position.set(wx,h*.55,b.d*.43);g.add(w)}
    }else if(k==="tower"){const tw=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,h*1.5,8),new THREE.MeshStandardMaterial({color:cl,roughness:.75,metalness:.15}));tw.position.y=h*.75+.1;tw.castShadow=true;g.add(tw);
      const tp=new THREE.Mesh(new THREE.ConeGeometry(.4,.4,8),new THREE.MeshStandardMaterial({color:0x3a4a5a}));tp.position.y=h*1.5+.3;g.add(tp);
      const sl=new THREE.PointLight(0xffaa44,.8,5);sl.position.set(0,h*1.5+.1,0);g.add(sl);
    }else{const mn=new THREE.Mesh(new THREE.BoxGeometry(b.w*.8,h,b.d*.8),new THREE.MeshStandardMaterial({color:cl,roughness:.75}));mn.position.y=h/2+.1;mn.castShadow=true;g.add(mn);
      const rf=new THREE.Mesh(new THREE.BoxGeometry(b.w*.9,.08,b.d*.9),new THREE.MeshStandardMaterial({color:0x3a3a38}));rf.position.y=h+.14;g.add(rf)}
    if(b.l>=2){const fp=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.6,4),new THREE.MeshStandardMaterial({color:0x888,metalness:.5}));fp.position.set(b.w*.35,h+.4,b.d*.35);g.add(fp);
      const fl=new THREE.Mesh(new THREE.PlaneGeometry(.2,.12),new THREE.MeshStandardMaterial({color:0xf59e0b,side:THREE.DoubleSide,emissive:0xf59e0b,emissiveIntensity:.3}));fl.position.set(b.w*.35+.1,h+.6,b.d*.35);g.add(fl)}}
  g.position.set(b.x,0,b.z);g.userData={k,ph:Math.random()*6.28};return g}
function rebuild3D(){for(const k in BM)SC.remove(BM[k]);BM={};for(const[k,b]of Object.entries(S.buildings)){const m=mkBld(b,k);BM[k]=m;SC.add(m)}}
function updCam(){const d=S.cd;CAM.position.set(Math.sin(S.cr)*Math.cos(S.ca)*d,Math.sin(S.ca)*d,Math.cos(S.cr)*Math.cos(S.ca)*d);CAM.lookAt(0,.5,0)}
function anim3D(){requestAnimationFrame(anim3D);const t=CLK.getElapsedTime();for(const[k,m]of Object.entries(BM))if(S.buildings[k].l>0)m.position.y=Math.sin(t*1.2+m.userData.ph)*.012;R.render(SC,CAM)}

window.upg=function(k){const b=S.buildings[k],m=b.l+1;for(const[r,v]of Object.entries(b.cost))if(S[r]<v*m){toast("Недостаточно!");return}
