// ===== AUDIO MANAGER =====
// Self-contained procedural sound system: sfx, ambient loop, master volume, mute.
AudioManager:{
ctx:null,master:null,ambSrc:null,ambG:null,ambTimer:null,
init(vol){try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=vol;this.master.connect(this.ctx.destination)}catch(e){}},
resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
setVolume(v){if(this.master&&this.ctx)this.master.gain.setTargetAtTime(v,this.ctx.currentTime,.1)},
// plays a short sequence of oscillator notes: {type,vol,notes:[{f,to,at,dur}]}
tone(o){if(!this.ctx)return;this.resume();const ctx=this.ctx,t=ctx.currentTime;(o.notes||[{f:o.f,dur:.15}]).forEach(n=>{const at=n.at||0,dur=n.dur||.15;const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=o.type||'sine';osc.connect(g);g.connect(this.master);osc.frequency.setValueAtTime(n.f,t+at);if(n.to)osc.frequency.linearRampToValueAtTime(n.to,t+at+dur);g.gain.setValueAtTime(0,t+at);g.gain.linearRampToValueAtTime(o.vol||.1,t+at+.006);g.gain.linearRampToValueAtTime(0,t+at+dur);osc.start(t+at);osc.stop(t+at+dur+.03)})},
// short filtered noise burst, used for gunshots / thuds / rain-like textures
noise(dur,vol,freq,type){if(!this.ctx)return;this.resume();const ctx=this.ctx,t=ctx.currentTime;const buf=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1200;const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+dur);src.connect(f);f.connect(g);g.connect(this.master);src.start(t);src.stop(t+dur)},
play(type){if(!this.ctx)return;switch(type){
case'click':this.tone({type:'sine',vol:.06,notes:[{f:600,dur:.06}]});break;
case'build':this.tone({type:'square',vol:.1,notes:[{f:440,to:880,dur:.12}]});break;
case'reward':this.tone({type:'sine',vol:.09,notes:[{f:523,dur:.12},{f:659,at:.1,dur:.12},{f:784,at:.2,dur:.18}]});break;
case'lvl':this.tone({type:'triangle',vol:.09,notes:[{f:440,dur:.1},{f:554,at:.08,dur:.1},{f:659,at:.16,dur:.1},{f:880,at:.24,dur:.18}]});break;
case'err':this.tone({type:'square',vol:.08,notes:[{f:200,dur:.08},{f:150,at:.08,dur:.1}]});break;
case'hit':this.tone({type:'sawtooth',vol:.11,notes:[{f:150,to:50,dur:.12}]});break;
case'alert':this.tone({type:'square',vol:.09,notes:[{f:800,dur:.15},{f:400,at:.15,dur:.15},{f:800,at:.3,dur:.15}]});break;
// siren-style warning right before a zombie wave hits
case'waveAlarm':this.tone({type:'sawtooth',vol:.12,notes:[{f:300,to:900,dur:.25},{f:900,to:300,at:.32,dur:.25}]});this.noise(.55,.05,500,'lowpass');break;
// quick burst of gunfire
case'shot':for(let i=0;i<3;i++)setTimeout(()=>this.noise(.06,.15,2400,'bandpass'),i*95);break;
// dull, guttural thud when a zombie lands a hit on the wall/defenders
case'zombieHit':this.tone({type:'sawtooth',vol:.1,notes:[{f:90,to:38,dur:.18}]});this.noise(.22,.09,280,'lowpass');break;
case'victory':this.tone({type:'triangle',vol:.1,notes:[{f:523,dur:.14},{f:659,at:.12,dur:.14},{f:784,at:.24,dur:.14},{f:1047,at:.36,dur:.32}]});break;
case'defeat':this.tone({type:'sawtooth',vol:.11,notes:[{f:220,to:110,dur:.35},{f:110,to:55,at:.3,dur:.45}]});break;
}},
// combat SFX sequence: gunfire, optional zombie blow if damage was taken, then victory/defeat sting
battleSeq(won,tookDamage){this.play('shot');if(tookDamage)setTimeout(()=>this.play('zombieHit'),260);setTimeout(()=>this.play(won?'victory':'defeat'),tookDamage?620:420)},
// quiet, looping post-apocalyptic wind bed with sparse distant creaks/groans
startAmbient(){if(!this.ctx||this.ambSrc)return;try{const ctx=this.ctx;const g=ctx.createGain();g.gain.value=0;g.connect(this.master);const buf=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);const d=buf.getChannelData(0);let p=0;for(let i=0;i<d.length;i++){p=(p+(Math.random()*2-1)*.018)/1.018;d[i]=p*3}const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=500;src.connect(f);f.connect(g);src.start();this.ambSrc=src;this.ambG=g;g.gain.linearRampToValueAtTime(.16,ctx.currentTime+1.5);this.scheduleCreak()}catch(e){}},
scheduleCreak(){clearTimeout(this.ambTimer);this.ambTimer=setTimeout(()=>{if(this.ambSrc&&this.ctx){const ctx=this.ctx,t=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(55+Math.random()*45,t);o.frequency.linearRampToValueAtTime(28+Math.random()*22,t+2);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.5);g.gain.linearRampToValueAtTime(0,t+2.2);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+2.3)}this.scheduleCreak()},12000+Math.random()*15000)},
setAmbientOn(on){if(!this.ctx)return;if(!this.ambSrc){if(on)this.startAmbient();return}this.ambG.gain.setTargetAtTime(on?.16:0,this.ctx.currentTime,.6)}
},
initAudio(){this.AudioManager.init(this.S.volume);if(this.S.snd)this.AudioManager.startAmbient()},
snd(type){if(!this.S.snd)return;this.AudioManager.play(type)},
// plays the alarm+gunfire+result sequence for a combat encounter (respects mute)
battleSfx(won,tookDamage){if(!this.S.snd)return;this.AudioManager.battleSeq(won,tookDamage)},
toggleSound(){this.S.snd=!this.S.snd;const sb=document.getElementById('sb');if(sb)sb.textContent=this.S.snd?'🔊':'🔇';this.AudioManager.resume();this.AudioManager.setAmbientOn(this.S.snd);const vsb=document.getElementById('vsb');if(vsb)vsb.textContent=this.S.snd?'🔊':'🔇';this.save()},
setVolume(v){v=Math.max(0,Math.min(1,parseFloat(v)||0));this.S.volume=v;this.AudioManager.setVolume(v);this.save()},
toggleLowGfx(){this.S.lowGfx=!this.S.lowGfx;this.save();this.rPanel()},
toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),2500)},
missingRes(cost){return Object.entries(cost).filter(([r,v])=>this.S.res[r]<v).map(([r,v])=>`${this.IC[r]}${Math.max(0,Math.ceil(v-this.S.res[r]))}`).join(' ')},
hasSubReward(tabId,sub){switch(sub){
case'daily':return this.S.daily<this.S.day;
case'quests':{const q=this.QU[this.S.ch-1];return!!(q&&q.st[this.S.qs]&&q.st[this.S.qs].ck(this.S))}
case'ach':return this.AC.some(a=>!this.S.achs[a.id]&&a.ck(this.S));
case'bp':return(this.S.bpCl?this.S.bpCl.length:0)<this.S.bpLvl;
case'npc':return this.NPC_MISSIONS.some(m=>!this.S.npcDone.includes(m.id)&&Object.entries(m.req).every(([r,v])=>this.S.res[r]>=v));
case'exp':return this.S.exps.some(e=>Date.now()>=e.et);case'chat':return(this.S.chat||[]).some(m=>(m.t||0)>(this.S.chatSeen||0));
case'gar':return this.S.heroes.length>0&&this.S.gar.every(g=>!g);
case'roster':return this.S.heroes.some(h=>!this.S.gar.includes(h.id));
default:return false}},
hasTabReward(tabId){return(this.SUBS[tabId]||[]).some(s=>this.hasSubReward(tabId,s))},
getNextHint(){const S=this.S;
if(!(S.bld.farm>=1))return{tab:'base',sub:'buildings',text:'Постройте Ферму 🌾 — источник еды для базы.'};
if(!(S.bld.saw>=1))return{tab:'base',sub:'buildings',text:'Постройте Лесопилку 🪚 — понадобится дерево.'};
if(this.hasSubReward('social','daily'))return{tab:'social',sub:'daily',text:'Заберите ежедневную награду! 🎁'};
{const q=this.QU[S.ch-1];if(q&&q.st[S.qs]&&q.st[S.qs].ck(S))return{tab:'social',sub:'quests',text:'Задание выполнено — заберите награду! 📋'}}
if(S.heroes.length===0)return{tab:'heroes',sub:'recruit',text:'Наберите первого героя 🎰'};
if(S.gar.every(g=>!g))return{tab:'heroes',sub:'gar',text:'Назначьте героев в гарнизон 🛡 для защиты!'};
if(!(S.bld.wall>=1))return{tab:'base',sub:'buildings',text:'Постройте Стену 🧱 — без неё оборона невозможна.'};
if(this.hasSubReward('map','exp'))return{tab:'map',sub:'exp',text:'Экспедиция завершена — заберите награду! 🧭'};
if(S.wHP<S.wMax*.5)return{tab:'battle',sub:'def',text:'Стена повреждена! 🔧 Почините её перед волной.'};
if(this.hasSubReward('social','ach'))return{tab:'social',sub:'ach',text:'Есть доступное достижение! 🏆'};
if(this.hasSubReward('social','bp'))return{tab:'social',sub:'bp',text:'Battle Pass: заберите награду! 🎫'};
if(this.hasSubReward('social','npc'))return{tab:'social',sub:'npc',text:'NPC ждёт выполнения задания! 👤'};
if(S.bld.wall>=1&&S.gar.some(g=>g))return{tab:'battle',sub:'def',text:`Отразите волну ${S.wave}! ⚔`};
return null},
renderHint(){const h=this.getNextHint();const bar=document.getElementById('hintBar');if(!bar)return;if(h){bar.style.display='flex';const tx=document.getElementById('hintTxt');if(tx)tx.textContent=h.text}else{bar.style.display='none'}},
hintClick(){const h=this.getNextHint();if(h)this.tab(h.tab,h.sub)},
showHintModal(){const h=this.getNextHint();const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class=\"mo\" style=\"text-align:center\"><h3>❓ Что делать дальше?</h3><p class=\"cdd\" style=\"margin:8px 0\">${h?h.text:'Вы отлично справляетесь! Развивайте базу, исследуйте карту и отражайте волны зомби.'}</p>${h?`<button class=\"bgn bf\" onclick=\"G.tab('${h.tab}','${h.sub}');this.closest('.mb').remove()\">Перейти</button>`:''}<button class=\"bs bf\" style=\"margin-top:6px\" onclick=\"this.closest('.mb').remove()\">Закрыть</button></div>`;document.body.appendChild(el)},
save(){this.S.lastOn=Date.now();try{const s={...this.S,chat:(this.S.chat||[]).map(m=>m.vid?{...m,vid:0,vmiss:1}:m)};localStorage.setItem('tlp3',JSON.stringify(s))}catch(e){}},
load(){try{const d=localStorage.getItem('tlp3');if(d){const p=JSON.parse(d);this.S={...this.def(),...p};if(!this.S.bestiary)this.S.bestiary={};if(!this.S.skills)this.S.skills={};if(!this.S.alliance)this.S.alliance=null;if(!this.S.allyRep)this.S.allyRep=0;if(!this.S.npcDone)this.S.npcDone=[];if(!this.S.infected)this.S.infected={};if(!this.S.trades)this.S.trades=0;if(!this.S.mapEvtCd)this.S.mapEvtCd=0;if(!this.S.pets)this.S.pets=[];if(this.S.activePet===undefined)this.S.activePet=null;if(!this.S.lb)this.S.lb=[];if(this.S.disaster===undefined)this.S.disaster=null;if(!this.S.disasterCd)this.S.disasterCd=0;if(this.S.volume===undefined)this.S.volume=.75;if(this.S.lowGfx===undefined)this.S.lowGfx=false;if(!this.S.workers)this.S.workers={farm:0,saw:0,wrk:0,hunt:0,bld:0};if(!this.S.tiles)this.S.tiles={};if(!this.S.chat)this.S.chat=[];if(this.S.pity===undefined)this.S.pity=0;this.migrateRoster();if(!this.S.heroes.length)['jo','li'].forEach(id=>{const b=this.HR.find(h=>h.id===id);this.S.heroes.push({...b,lv:1,st:1})});this.offlineCalc();return true}}catch(e){}return false},
offlineCalc(){const el=(Date.now()-(this.S.lastOn||Date.now()))/1e3;if(el<60)return;const sc=Math.min(el,28800);let gn={};const wm=this.getWeatherMult();const sm=this.getSeasonMult();Object.entries(this.BD).forEach(([k,b])=>{if(!b.pr)return;const lv=this.S.bld[k]||0;if(!lv)return;const cy=Math.floor(sc/b.pr.t);let am=cy*b.pr.a(lv);if(b.pr.r==='food')am=Math.floor(am*wm.farm*sm.farm);if(b.pr.r==='metal')am=Math.floor(am*(wm.metal||1));const r=b.pr.r;gn[r]=(gn[r]||0)+am;this.S.res[r]=Math.min(this.S.res[r]+am,this.S.caps[r])});this.S.energy=Math.min(this.S.energy+Math.floor(sc/300),this.S.maxE+this.getSkillBonus('maxEn')+this.getPetBonus('energyMax'));if(Object.keys(gn).length)setTimeout(()=>this.showOff(gn,sc),500)},
showOff(gn,sc){const h=Math.floor(sc/3600),m=Math.floor(sc%3600/60);const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo" style="text-align:center"><h3>⏰ С возвращением!</h3><p class="cdd">Не было ${h?h+'ч ':''}${m}мин</p><div style="display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap">${Object.entries(gn).map(([r,v])=>`<span style="font-size:11px;font-weight:800;background:var(--cd);padding:3px 8px;border-radius:5px">${this.IC[r]}+${v}</span>`).join('')}</div><button class="bgn bf" onclick="this.closest('.mb').remove()">Забрать!</button></div>`;document.body.appendChild(el);this.snd('reward')},
// ===== WEATHER SYSTEM =====
getWeatherMult(){const w=this.WEATHER[this.S.weather]||this.WEATHER[0];return{farm:w.eff.farmMult||1,def:w.eff.defMult||1,exp:w.eff.expMult||1,zombie:w.eff.zombieMult||1,metal:w.eff.metalMult||1,energyDrain:w.eff.energyDrain||1}},
getSeasonMult(){const s=this.SEASONS[this.S.season]||this.SEASONS[0];return{farm:s.farmB,zombie:s.zombB}},
updateWeather(){const pool=this.WEATHER.filter(w=>w.id!=='snow'||this.S.season===3);const w=pool[Math.random()*pool.length|0];this.S.weather=this.WEATHER.indexOf(w);this.addNotif(`${w.i} Погода: ${w.n}`,'weather');this.updWeatherUI()},
updateSeason(){const si=Math.floor((this.S.day-1)/7)%4;if(si!==this.S.season){this.S.season=si;const s=this.SEASONS[si];this.toast(`${s.i} Сезон: ${s.n}!`);this.addNotif(`${s.i} Наступил ${s.n}`,'season')}},
updWeatherUI(){const w=this.WEATHER[this.S.weather]||this.WEATHER[0];document.getElementById('wthd').textContent=`${w.i}${w.n}`;const s=this.SEASONS[this.S.season]||this.SEASONS[0];document.getElementById('seasonBar').textContent=`${s.i}${s.n}`},
// ===== NOTIFICATION SYSTEM =====
addNotif(text,type){this.notifications.push({text,type,time:Date.now()});if(this.notifications.length>8)this.notifications.shift();this.renderNotifs()},
renderNotifs(){const bar=document.getElementById('notifBar');if(!bar)return;this.notifications=this.notifications.filter(n=>Date.now()-n.time<8000);bar.innerHTML=this.notifications.map(n=>`<div class="notif-item">${n.text}</div>`).join('');setTimeout(()=>this.renderNotifs(),5000)},
// ===== PARTICLE SYSTEM =====
spawnParticle(x,y,emoji,dur=1200){this.particles.push({x,y,emoji,start:Date.now(),dur,vx:(Math.random()-.5)*2,vy:-1.5-Math.random()*2})},

// ===== INFECTION SYSTEM =====
infectHero(heroId){if(Math.random()<.15){this.S.infected[heroId]={timer:Date.now()+300000};this.toast(`⚠️ ${this.S.heroes.find(h=>h.id===heroId)?.n||'Герой'} заражён!`);this.addNotif(`☣️ Герой заражён!`,'danger');this.snd('alert')}},
healHero(heroIdx){const h=this.S.heroes[heroIdx];if(!h||!this.S.infected[h.id])return;const hosp=this.S.bld.hosp||0;const cost={food:50-hosp*3,metal:30-hosp*2};if(this.S.res.food<Math.max(cost.food,10)||this.S.res.metal<Math.max(cost.metal,5))return this.toast('Не хватает: '+this.missingRes({food:Math.max(cost.food,10),metal:Math.max(cost.metal,5)})),this.snd('err');this.S.res.food-=Math.max(cost.food,10);this.S.res.metal-=Math.max(cost.metal,5);delete this.S.infected[h.id];this.snd('reward');this.toast(`💊 ${h.n} вылечен!`);this.updAll()},
checkInfections(){Object.entries(this.S.infected).forEach(([id,inf])=>{if(Date.now()>inf.timer){const hi=this.S.heroes.findIndex(h=>h.id===id);if(hi>=0){this.S.heroes.splice(hi,1);this.S.gar=this.S.gar.map(g=>g===id?null:g);this.toast(`💀 Герой погиб от заражения!`);this.addNotif(`💀 Потерян герой!`,'danger');this.calcPow();this.updAll()}delete this.S.infected[id]}})},
// ===== MARKET/TRADE SYSTEM =====
trade(idx,amount){const deal=this.MARKET_RATES[idx];if(!deal)return;const ml=this.S.bld.market||0;const allyBonus=this.S.alliance&&this.ALLIANCES.find(a=>a.id===this.S.alliance)?.bonus?.trade||0;const rate=Math.max(deal.rate*(1-ml*.02-allyBonus),deal.rate*.5);const cost=Math.ceil(amount*rate);if(this.S.res[deal.from]<cost)return this.toast('Не хватает: '+this.IC[deal.from]+Math.ceil(cost-this.S.res[deal.from])),this.snd('err');this.S.res[deal.from]-=cost;this.S.res[deal.to]=Math.min(this.S.res[deal.to]+amount,this.S.caps[deal.to]||999);if(!this.S.trades)this.S.trades=0;this.S.trades++;this.snd('click');this.toast(`${deal.i} -${cost}→+${amount}`);this.updAll()},
// ===== SKILL TREE SYSTEM =====
upgradeSkill(skillId){const sk=this.SKILL_TREE.find(s=>s.id===skillId);if(!sk)return;const cur=this.S.skills[skillId]||0;if(cur>=sk.mx)return this.toast('Макс уровень!');const cost=sk.co(cur);if(this.S.res.food<cost)return this.toast(`Нужно 🍖${cost}!`),this.snd('err');this.S.res.food-=cost;this.S.skills[skillId]=(this.S.skills[skillId]||0)+1;this.calcPow();this.snd('lvl');this.toast(`🌳 ${sk.n} → Ур.${this.S.skills[skillId]}!`);this.updAll()},
getSkillBonus(key){let total=0;this.SKILL_TREE.forEach(sk=>{const lv=this.S.skills[sk.id]||0;if(lv){const ef=sk.ef(lv);if(ef[key])total+=ef[key]}});return total},
// ===== BESTIARY SYSTEM =====
registerKill(zombieId){if(!this.S.bestiary[zombieId])this.S.bestiary[zombieId]=0;this.S.bestiary[zombieId]++;const cnt=this.S.bestiary[zombieId];if(cnt===10||cnt===50||cnt===100){const z=this.ZT.find(t=>t.id===zombieId);this.toast(`📖 ${z?.n||'Зомби'} изучен! +${cnt===10?5:cnt===50?10:15}% урона`);this.addNotif(`📖 Бестиарий обновлён!`,'info')}},
getBestiaryBonus(zombieId){const cnt=this.S.bestiary[zombieId]||0;return cnt>=100?.15:cnt>=50?.1:cnt>=10?.05:0},
// ===== MAP EVENTS SYSTEM =====
triggerMapEvent(){if(Date.now()<(this.S.mapEvtCd||0))return;if(Math.random()>.35)return;const evt=this.MAP_EVENTS[Math.random()*this.MAP_EVENTS.length|0];this.S.mapEvtCd=Date.now()+120000;this.showEventModal(evt)},
showEventModal(evt){const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo"><h3>${evt.i} ${evt.n}</h3><p class="cdd" style="margin-bottom:8px">${evt.d}</p><div class="evt-choice">${evt.ch.map((c,i)=>`<button class="${i===0?'bp2':'bs'}" onclick="G.resolveEvent('${evt.id}','${c.ef}');this.closest('.mb').remove()">${c.t}</button>`).join('')}</div></div>`;document.body.appendChild(el)},
resolveEvent(evtId,effect){switch(effect){case'addRandomHero':const pool=this.HR.filter(h=>!this.S.heroes.find(x=>x.id===h.id));if(pool.length){const hero={...pool[Math.random()*pool.length|0],lv:1,st:1};this.S.heroes.push(hero);this.toast(`🧑 ${hero.n} присоединился!`);this.snd('reward')}else{this.S.res.food+=50;this.toast('Все герои уже есть! +🍖50')}break;case'evtRes':this.S.res.food=Math.min(this.S.res.food+120,this.S.caps.food);this.S.res.wood=Math.min(this.S.res.wood+80,this.S.caps.wood);this.toast('🍖+120 🪵+80');this.snd('reward');break;case'evtBuy':if(this.S.res.gems>=20){this.S.res.gems-=20;const eq={...this.EP[Math.random()*this.EP.length|0]};this.S.inv.push(eq);this.toast(`💎-20 → ${eq.i}${eq.n}!`);this.snd('reward')}else this.toast('Мало 💎!');break;case'evtRob':if(Math.random()>.5){this.S.res.gems=Math.min(this.S.res.gems+30,999);this.toast('😈 Ограбление удалось! +💎30');this.snd('reward')}else{this.S.rating=Math.max(0,this.S.rating-50);this.S.wHP=Math.max(0,this.S.wHP-20);this.toast('💀 Неудача! -50 рейтинг, -20 HP');this.snd('hit')}break;case'evtCache':if(Math.random()>.3){this.S.res.metal=Math.min(this.S.res.metal+80,this.S.caps.metal);this.toast('⚙+80!');this.snd('reward')}else{this.S.wHP=Math.max(0,this.S.wHP-15);this.toast('Засада! 🧱-15HP');this.snd('hit')}break;case'evtRadio':if(this.S.energy>=30){this.S.energy-=30;this.revealRandomFogTile();this.snd('reward')}else this.toast('Мало ⚡!');break;case'evtMerchEq':if(this.S.res.gems>=30){this.S.res.gems-=30;const rare=this.EP.filter(e=>e.r==='rare'||e.r==='epic');const eq={...rare[Math.random()*rare.length|0]};this.S.inv.push(eq);this.toast(`${eq.i} ${eq.n} куплено!`);this.snd('reward')}else this.toast('Мало 💎!');break;case'evtMerchRes':if(this.S.res.gems>=15){this.S.res.gems-=15;this.S.res.food=Math.min(this.S.res.food+200,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+100,this.S.caps.metal);this.toast('🍖+200 ⚙+100!');this.snd('reward')}else this.toast('Мало 💎!');break;case'evtFight':const pw=this.S.power;const zp=30+this.S.wave*10;if(pw>zp){this.S.kills+=5;this.S.res.food=Math.min(this.S.res.food+100,this.S.caps.food);this.toast('⚔ Победа! +5💀 +🍖100');this.snd('reward')}else{this.S.wHP=Math.max(0,this.S.wHP-30);this.toast('💀 Поражение! 🧱-30HP');this.snd('hit')}break;case'evtFlee':if(this.S.energy>=20){this.S.energy-=20;this.toast('🏃 Сбежали! -⚡20')}else{this.S.wHP=Math.max(0,this.S.wHP-15);this.toast('Не хватило ⚡! 🧱-15HP');this.snd('hit')}break;case'none':break}this.updAll()},
// ===== ALLIANCE SYSTEM =====
joinAlliance(id){this.S.alliance=id;this.S.allyRep=0;const a=this.ALLIANCES.find(x=>x.id===id);this.toast(`🤝 Вступили в ${a.n}!`);this.snd('reward');this.addNotif(`🤝 Альянс: ${a.n}`,'info');this.updAll()},
allyDonate(res,amount){if(this.S.res[res]<amount)return this.toast('Не хватает: '+this.IC[res]+Math.ceil(amount-this.S.res[res])),this.snd('err');this.S.res[res]-=amount;this.S.allyRep+=Math.floor(amount/10);this.addXP(5);this.toast(`🤝 +${Math.floor(amount/10)} репутации`);this.updAll()},
// ===== NPC MISSIONS =====
completeNPC(idx){const m=this.NPC_MISSIONS[idx];if(!m||this.S.npcDone.includes(m.id))return;for(const[r,v]of Object.entries(m.req))if(this.S.res[r]<v)return this.toast('Не хватает: '+this.missingRes(m.req)),this.snd('err');for(const[r,v]of Object.entries(m.req))this.S.res[r]-=v;Object.entries(m.rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.S.npcDone.push(m.id);this.addXP(20);this.snd('reward');this.toast(`✅ ${m.npc}: Спасибо!`);this.updAll()},
// ===== ZOMBIE RAIDS =====
checkZombieRaid(){if(this.S.hour===22&&Math.random()<.3+this.S.wave*.03){const sm=this.getSeasonMult();const str=(this.S.wave*15+Math.random()*50)*sm.zombie;this.snd('waveAlarm');this.toast('🚨 НОЧНОЙ РЕЙД ЗОМБИ!');this.addNotif('🚨 Рейд зомби!','danger');setTimeout(()=>this.autoDefend(str),550)}},
autoDefend(strength){const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);const {won,dmg}=this.fightOutcome(strength*.8,false);this.S.wHP=Math.max(0,this.S.wHP-dmg);if(dmg>0)this.screenShake();this.battleSfx(won,dmg>0);if(won){const zk=3+Math.random()*5|0;this.S.kills+=zk;const zt=this.ZT[Math.random()*3|0];this.registerKill(zt.id);this.S.log.unshift(`✅ Рейд отбит! 💀${zk} 🧱-${dmg}`);if(gh.length)this.infectHero(gh[Math.random()*gh.length|0].id)}else{const cs=this.combatStats();this.S.log.unshift(`❌ Рейд! 🧱-${dmg} ⚔${(cs.atk+cs.def)|0}vs🧟${strength|0}`)}this.S.log=this.S.log.slice(0,30);this.updAll()},
// ===== SALVAGE SYSTEM =====
salvageItem(invIdx){const item=this.S.inv[invIdx];if(!item)return;const rarity={common:1,uncommon:2,rare:3,epic:5,legendary:10};const mult=rarity[item.r]||1;this.S.res.metal=Math.min(this.S.res.metal+10*mult,this.S.caps.metal);this.S.inv.splice(invIdx,1);this.snd('click');this.toast(`♻️ +${10*mult}⚙`);this.updAll()},
salvageAllTotal(){return this.S.inv.reduce((s,it)=>s+10*({common:1,uncommon:2,rare:3,epic:5,legendary:10}[it.r]||1),0)},
salvageAll(){if(!this.S.inv.length)return;const tot=this.salvageAllTotal();const n=this.S.inv.length;this.S.res.metal=Math.min(this.S.res.metal+tot,this.S.caps.metal);this.S.inv=[];this.snd('reward');this.toast(`♻️ Продано ${n} шт. +${tot}⚙`);this.updAll()},

],
clearTutHl(){document.querySelectorAll('.tut-hl').forEach(el=>el.classList.remove('tut-hl'))},
highlightTutTarget(s){this.clearTutHl();if(s.tab){const idx=this.TABS.findIndex(t=>t.id===s.tab);const b=document.querySelectorAll('#tbar .tbn')[idx];if(b)b.classList.add('tut-hl')}if(s.tab&&s.sub){const subs=this.SUBS[s.tab]||[];const idx=subs.indexOf(s.sub);const b=document.querySelectorAll('#stabs .stn')[idx];if(b)b.classList.add('tut-hl')}if(s.sel){const el=document.querySelector(s.sel);if(el)el.classList.add('tut-hl')}},
showTut(){if(this.S.tutDone)return;const s=this.TUTS[this.S.tutStep];if(!s){this.S.tutDone=true;this.save();document.getElementById('tut').classList.remove('act');this.clearTutHl();return}if(s.tab)this.tab(s.tab,s.sub);this.highlightTutTarget(s);const list=s.list?`<ul style="text-align:left;font-size:9px;color:var(--m);margin:0 0 8px 16px;padding:0;line-height:1.5">${s.list.map(li=>`<li>${li}</li>`).join('')}</ul>`:'';document.getElementById('tut').innerHTML=`<div class="tbox"><div class="tstp">Шаг ${this.S.tutStep+1}/${this.TUTS.length}</div><h3>${s.t}</h3><p>${s.d}</p>${list}<button class="bp2" onclick="G.nextTut()">${s.btn||'Далее →'}</button>${this.S.tutStep>0?'<button class="bs" onclick="G.skipTut()" style="margin-top:4px;font-size:8px">Пропустить</button>':''}</div>`;document.getElementById('tut').classList.add('act')},
nextTut(){this.S.tutStep++;if(this.S.tutStep>=this.TUTS.length){this.S.tutDone=true;this.S.res.gems+=30;this.toast('🎁 +💎30 за туториал!');this.snd('lvl');document.getElementById('tut').classList.remove('act');this.clearTutHl();this.save();this.updAll();return}this.showTut()},
skipTut(){this.S.tutDone=true;document.getElementById('tut').classList.remove('act');this.clearTutHl();this.save()},
// ===== CORE =====
init(){if(!this.load()){this.S=this.def();this.S.heroes.push({...this.HR.find(h=>h.id==='jo'),lv:1,st:1})}if(!this.S.heroes.length)this.S.heroes.push({...this.HR.find(h=>h.id==='jo'),lv:1,st:1});if(!this.S.bld.hq)this.S.bld.hq=1;this.initAudio();this.calcPow();this.rTabs();this.rSubs();this.rPanel();this.updTop();this.updQ();this.updWeatherUI();this.initCv();this.startLoop();this.renderHint();if(!this.S.tutDone)setTimeout(()=>this.showTut(),600);this.save()},
addXP(a){this.S.xp+=a;while(this.S.xp>=this.S.xpN){this.S.xp-=this.S.xpN;this.S.lvl++;this.S.xpN=Math.floor(this.S.xpN*1.4);this.S.maxE+=5;this.S.energy=this.S.maxE;this.toast(`🎉 Уровень ${this.S.lvl}!`);this.snd('lvl')}this.updTop()},
addBPXP(a){this.S.bpXP+=a;while(this.S.bpXP>=50+this.S.bpLvl*20){this.S.bpXP-=50+this.S.bpLvl*20;this.S.bpLvl++;this.addNotif(`🎫 Battle Pass → Ур.${this.S.bpLvl}`,'bp')}},
calcPow(){let p=0;this.S.heroes.forEach(h=>{let a=h.a,d=h.d;a*=(1+this.getSkillBonus('atkMul')+this.getPetBonus('atkMul'));d*=(1+this.getSkillBonus('hpMul')+this.getPetBonus('hpMul'));const eq=this.S.equip[h.id];if(eq)Object.values(eq).forEach(e=>{if(e){const es=this.itemStats(e);a+=es.a;d+=es.d}});const sb=this.getSetBonus(h.id);a+=sb.a;d+=sb.d;p+=(a+d)*h.lv});Object.entries(this.S.bld).forEach(([k,lv])=>{if(k==='bar')p+=lv*10;if(k==='wall')p+=lv*5});Object.keys(this.S.techs).forEach(()=>p+=15);if(this.S.alliance){const ab=this.ALLIANCES.find(a=>a.id===this.S.alliance);if(ab?.bonus?.atk)p*=(1+ab.bonus.atk)}this.S.power=Math.floor(p)},
updTop(){document.getElementById('pn2').textContent=this.S.name;document.getElementById('plv').textContent=this.S.lvl;document.getElementById('ppw').textContent=this.S.power;document.getElementById('pxp').style.width=Math.min(this.S.xp/this.S.xpN*100,100)+'%';document.getElementById('rf').textContent=this.S.res.food;document.getElementById('rw').textContent=this.S.res.wood;document.getElementById('rm').textContent=this.S.res.metal;document.getElementById('rg').textContent=this.S.res.gems;document.getElementById('re').textContent=this.S.energy;const nt=this.S.hour>=20||this.S.hour<6;document.getElementById('dn').textContent=`${nt?'🌙':'☀'}Д${this.S.day}`},
updQ(){const q=this.QU[this.S.ch-1];if(!q)return;document.getElementById('qc').textContent=`Глава ${this.S.ch}: ${q.t}`;const cs=q.st[this.S.qs];document.getElementById('qo').textContent=cs?cs.t:'Завершено!'},
tab(t,s){this.S.tab=t;this.S.sub=s||this.SUBS[t][0];this.snd('click');this.rTabs();this.rSubs();this.rPanel();this.save()},
sub(s){this.S.sub=s;this.snd('click');this.rSubs();this.rPanel()},
rTabs(){const hint=this.getNextHint();document.getElementById('tbar').innerHTML=this.TABS.map(t=>{const badge=this.hasTabReward(t.id)?'<span class="badge-dot"></span>':'';const hl=hint&&hint.tab===t.id&&t.id!==this.S.tab?' hl-next':'';return `<button class="tbn${t.id===this.S.tab?' act':''}${hl}" onclick="G.tab('${t.id}')">${badge}<span class="ti">${t.i}</span>${t.l}</button>`}).join('')},
rSubs(){const subs=this.SUBS[this.S.tab]||[];const hint=this.getNextHint();document.getElementById('stabs').innerHTML=subs.map(s=>{const badge=this.hasSubReward(this.S.tab,s)?'<span class="badge-dot"></span>':'';const hl=hint&&hint.tab===this.S.tab&&hint.sub===s&&s!==this.S.sub?' hl-next':'';return `<button class="stn${s===this.S.sub?' act':''}${hl}" onclick="G.sub('${s}')">${badge}${this.SL[s]}</button>`}).join('')},
rPanel(){const p=document.getElementById('pn');switch(this.S.sub){case'buildings':p.innerHTML=this.rBuildings();break;case'tech':p.innerHTML=this.rTech();break;case'craft':p.innerHTML=this.rCraft();break;case'inv':p.innerHTML=this.rInv();break;case'trade':p.innerHTML=this.rTrade();break;case'work':p.innerHTML=this.rWork();break;case'roster':p.innerHTML=this.rRoster();break;case'recruit':p.innerHTML=this.rRecruit();break;case'gar':p.innerHTML=this.rGar();break;case'pets':p.innerHTML=this.rPets();break;case'skills':p.innerHTML=this.rSkills();break;case'exp':p.innerHTML=this.rExp();break;case'world':p.innerHTML=this.rWorld();break;case'events':p.innerHTML=this.rEvents();break;case'bestiary':p.innerHTML=this.rBestiary();break;case'def':p.innerHTML=this.rDef();break;case'arena':p.innerHTML=this.rArena();break;case'lb':p.innerHTML=this.rLb();break;case'log':p.innerHTML=this.rLog();break;case'raids':p.innerHTML=this.rRaids();break;case'quests':p.innerHTML=this.rQuests();break;case'daily':p.innerHTML=this.rDaily();break;case'ach':p.innerHTML=this.rAch();break;case'bp':p.innerHTML=this.rBP();break;case'ally':p.innerHTML=this.rAlly();break;case'chat':p.innerHTML=this.rChat();break;case'npc':p.innerHTML=this.rNPC();break;case'stats':p.innerHTML=this.rStats();break;default:p.innerHTML='<div class="cdd">Скоро...</div>'}if(this.S.sub==='world')this.initWorldMap();},
// ===== RENDER FUNCTIONS =====
rBuildings(){const amt=this.S.buildAmt||1;const sel=(v)=>this.S.buildAmt===v?' act':'';const selBtns=`<div class="cd" style="margin-bottom:5px"><div class="ct">🔢 Кол-во улучшений</div><div style="display:flex;gap:3px;margin-top:3px">${[[1,'×1'],[10,'×10'],[999,'МАКС']].map(([v,l])=>`<button class="stn${sel(v)}" style="flex:1" onclick="G.setBuildAmt(${v})">${l}</button>`).join('')}</div></div>`;return`${selBtns}<div class="g2">${Object.entries(this.BD).map(([k,b])=>{const lv=this.S.bld[k]||0;if(this.isLocked(k)){return`<div class="cd" style="opacity:.55"><div class="ch"><span class="ct">🔒 ${b.n}</span><span class="bg bg-r">Туман</span></div><div class="cdd">${b.d}</div><div class="cdd" style="color:var(--g)">Откроется: Ратуша Ур.${this.REVEAL[k]}</div></div>`}const mx=lv>=b.mx;const na=mx?0:Math.min(amt,b.mx-lv);const co=this.buildCost(k,na);const ca=!mx&&Object.entries(co).every(([r,v])=>this.S.res[r]>=v);const lab=mx?'MAX':(na>1?`×${na}`:'');return`<div class="cd${lv?' hl':''}"><div class="ch"><span class="ct">${b.i} ${b.n}</span>${lv?`<span class="bg bg-g">Ур.${lv}</span>`:'<span class="bg bg-r">Нет</span>'}</div><div class="cdd">${b.d}</div>${lv?`<div class="cdd" style="color:#4ade80">${b.e(lv)}</div>`:''}<div class="cc">${!mx?Object.entries(co).map(([r,v])=>`<span style="color:${this.S.res[r]>=v?'#4ade80':'#f87171'}">${this.IC[r]}${v}</span>`).join(' '):'MAX'}</div><button class="${ca&&!mx?'bp2':'bs'} bf" ${!ca||mx?'disabled':''} onclick="G.build('${k}')">${lv?'⬆Улучшить':'🔨Построить'} ${lab}</button></div>`}).join('')}</div>`},
rTech(){return`<div class="sec">🔬 Технологии</div><div class="g2">${this.TC.map(t=>{const done=this.S.techs[t.id];const ll=this.S.bld.lab||0;const rq=ll>=t.rq;const ca=rq&&Object.entries(t.co).every(([r,v])=>this.S.res[r]>=v);return`<div class="cd${done?' hl':''}"><div class="ct">${t.i} ${t.n} ${done?'✅':''}</div><div class="cdd">${t.d}</div><div class="cdd">Лаб Ур.${t.rq}${rq?' ✅':' ❌'}</div><div class="cc">${Object.entries(t.co).map(([r,v])=>`<span style="color:${this.S.res[r]>=v?'#4ade80':'#f87171'}">${this.IC[r]}${v}</span>`).join(' ')}</div><button class="${ca&&!done?'bb':'bs'} bf" ${!ca||done?'disabled':''} onclick="G.research('${t.id}')">${done?'Изучено':'🔬Изучить'}</button></div>`}).join('')}</div>`},

rRoster(){const bg={common:'linear-gradient(165deg,#8494ab,#3f4c63)',rare:'linear-gradient(165deg,#4aa8e8,#1e40af)',epic:'linear-gradient(165deg,#b06ae8,#5b21b6)',legendary:'linear-gradient(165deg,#fbbf24,#c2410c)'};const idle=this.S.heroes.filter(h=>!this.S.gar.includes(h.id)).length;

return`<div style="position:relative;background:${bg[h.r]};border-radius:12px;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer" onclick="G.showHero(${i})"><div style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:9px">${cl.i||''}</div>${inf?'<div style="position:absolute;top:4px;right:4px;font-size:10px">☣️</div>':''}<div style="text-align:center;font-size:32px;line-height:1.15;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">${h.i}</div><div style="text-align:center;font:800 10px system-ui;color:#fff;text-shadow:0 1px 2px #000">${h.n}</div><div style="text-align:center;color:#ffd75e;font-size:9px;letter-spacing:1px;text-shadow:0 1px 1px #7c2d12">${'★'.repeat(st)}${'☆'.repeat(5-st)}</div><div style="position:absolute;top:24px;left:5px;background:rgba(0,0,0,.55);border-radius:4px;padding:1px 4px;font:700 8px system-ui;color:#fff">Ур.${h.lv}</div><div class="hc" style="color:#fef3c7;text-align:center;margin-top:2px">${ab.i||'✨'} ${ab.n||''}</div><div style="text-align:center;font:700 8px system-ui;color:rgba(255,255,255,.85)">⚔${Math.round(h.a*h.lv)} 🛡${Math.round(h.d*h.lv)} ❤${h.h*h.lv}</div><div style="display:flex;gap:2px;margin-top:4px;justify-content:center">${inf?`<button class="bs" style="font-size:8px;color:#4ade80" onclick="event.stopPropagation();G.healHero(${i})">💊Лечить</button>`:`<button class="bp2" style="font-size:8px" onclick="event.stopPropagation();G.lvlHero(${i})">⬆${h.lv*25}</button>`}<button class="bs" style="font-size:8px" onclick="event.stopPropagation();G.toFirstG(${i})">🛡→</button><button class="bs" style="font-size:8px" onclick="event.stopPropagation();G.showHeroEquip(${i})">🎽</button></div></div>`}).join('')}</div>`},
rRecruit(){const pity=30-(this.S.pity||0);return`<div class="sec">🎰 Призыв героев</div><div class="cd hl" style="text-align:center;background:linear-gradient(160deg,#3b2a12,#241a0e)"><div style="font-size:26px">🌟</div><div class="ct">Баннер «Выжившие легенды»</div><div class="cdd">Шансы: ⬜55% 🟦30% 🟪12% 🟨3%<br>Гарант легендарного через ${pity} призывов</div></div><div class="g2"><div class="cd hl"><div class="ct">🎰 Призыв ×1</div><div class="cdd">💎60</div><button class="bp2 bf" ${this.S.res.gems<60?'disabled':''} onclick="G.summon(1)">Призвать</button></div><div class="cd hl"><div class="ct">🎰 Призыв ×10</div><div class="cdd">💎540 · гарант 🟦+</div><button class="bv bf" ${this.S.res.gems<540?'disabled':''} onclick="G.summon(10)">Призвать</button></div></div><div class="sec">Коллекция ${this.S.heroes.length}/${this.HR.length}</div>${this.rCollection()}<div class="cdd" style="margin-top:5px">Тап по карточке — просмотр. Затемнённые с 🔒 ещё не призваны. Дубликаты → ★ (макс 5), затем уровень.</div>`},

rExp(){return`<div class="sec">🧭 Экспедиции (${this.S.exps.length}/3)</div><div style="display:flex;justify-content:flex-end;margin-bottom:4px"><button class="${this.S.autoExp?'bgn':'bs'}" style="font-size:8px" onclick="G.setAutoExp()">🔁 Автосбор: ${this.S.autoExp?'ВКЛ':'ВЫКЛ'}</button></div>${this.S.exps.length?`<div class="g1">${this.S.exps.map((e,i)=>{const rem=Math.max(0,e.et-Date.now());const done=rem<=0;const pct=done?100:Math.min(100,((Date.now()-e.st)/(e.et-e.st))*100);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${e.i} ${e.n}</span>${done?'<span class="bg bg-gn">Готово!</span>':`<span class="bg bg-b" id="exb${i}">${Math.ceil(rem/1000)}с</span>`}</div><div class="pb"><div class="pf pfb" id="expb${i}" style="width:${pct}%"></div></div><div class="cc">${Object.entries(e.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${done?`<button class="bgn bf" onclick="G.collectExp(${i})">Забрать!</button>`:''}</div>`}).join('')}</div>`:''}<div class="sec">Доступные</div><div class="g2">${this.EX.map((e,i)=>`<div class="cd"><div class="ct">${e.i} ${e.n}</div><div class="cdd">⏱${e.dur}с · ☠${e.dg} · ⚡${e.en}</div><div class="cc">${Object.entries(e.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div><button class="bb bf" ${this.S.energy<e.en||this.S.exps.length>=3?'disabled':''} onclick="G.startExp(${i})">🧭Отправить</button></div>`).join('')}</div>`},
rWorld(){return`<div class="sec">🌍 Карта территории</div><canvas id="worldCv" style="width:100%;height:280px;border-radius:8px;border:1px solid var(--bd);touch-action:none;display:block;background:#0a0e08"></canvas><div class="cdd" style="margin-top:5px">Как в Tiles Survive: открывайте соседние тайлы за ⚡, зачищайте гнёзда 🧟, узлы ресурсов дают добычу каждые 10с. Тайлов под контролем: ${Object.keys(this.S.tiles||{}).length+1}.</div>`},
drawWorldMap(){const c=this.wCtx;if(!c||!this.worldCv)return;const dpr=devicePixelRatio||1;const w=this.worldCv.width/dpr,h=this.worldCv.height/dpr;const now=Date.now();
c.clearRect(0,0,w,h);c.fillStyle='#101810';c.fillRect(0,0,w,h);
const ts=Math.min(w/this.TGW,h/this.TGH);const ox=(w-ts*this.TGW)/2,oy=(h-ts*this.TGH)/2;
for(let gy=0;gy<this.TGH;gy++)for(let gx=0;gx<this.TGW;gx++){const x=ox+gx*ts,y=oy+gy*ts;const inf=this.tileInfo(gx,gy);const own=this.tileOwned(gx,gy);const front=!own&&this.tileAdjOwned(gx,gy);
const bc=inf.biome==='grass'?'#4ea34a':inf.biome==='forest'?'#2f7d3f':'#cfd8e6';
c.beginPath();c.roundRect(x+1,y+1,ts-2,ts-2,4);

c.font=`${ts*.42}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(inf.ct==='nest'?'✅':inf.icon,x+ts/2,y+ts/2)}
else{c.fillStyle='rgba(18,24,30,.92)';c.fill();
if(front){c.globalAlpha=.45;c.fillStyle=bc;c.beginPath();c.roundRect(x+1,y+1,ts-2,ts-2,4);c.fill();c.globalAlpha=1;
const pu=.45+Math.sin(now/300+gx*1.7+gy)*.3;c.strokeStyle=`rgba(234,179,8,${pu})`;c.lineWidth=2;c.stroke();
c.font=`${ts*.36}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(inf.ct==='nest'?'🧟':'',x+ts/2,y+ts*.38);
c.font=`bold ${ts*.22}px sans-serif`;c.fillStyle='#fbbf24';c.fillText(`⚡${this.capCost(gx,gy)}`,x+ts/2,y+ts*.74)}
else{c.font=`${ts*.3}px serif`;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=.35;c.fillStyle='#9ca3af';c.fillText('🔒',x+ts/2,y+ts/2);c.globalAlpha=1}}}},
worldClick(cx,cy){if(!this.worldCv)return;const dpr=devicePixelRatio||1;const w=this.worldCv.width/dpr,h=this.worldCv.height/dpr;
const ts=Math.min(w/this.TGW,h/this.TGH);const ox=(w-ts*this.TGW)/2,oy=(h-ts*this.TGH)/2;

revealRandomFogTile(){for(let i=0;i<60;i++){const gx=Math.random()*this.TGW|0,gy=Math.random()*this.TGH|0;if(!this.tileOwned(gx,gy)&&this.tileAdjOwned(gx,gy)){this.S.tiles[gx+'_'+gy]=1;this.S.mapRev.push(gx+'_'+gy);return this.toast(`🗺 Сигнал расшифрован: тайл открыт!`)}}this.S.res.gems=Math.min(this.S.res.gems+10,999);this.toast('Всё открыто! +💎10')},
initWorldMap(){const cv=document.getElementById('worldCv');if(!cv)return;this.worldCv=cv;const setup=()=>{const dpr=devicePixelRatio||1;const rect=cv.getBoundingClientRect();cv.width=Math.max(1,rect.width*dpr);cv.height=Math.max(1,rect.height*dpr);this.wCtx=cv.getContext('2d');this.wCtx.setTransform(dpr,0,0,dpr,0,0);this.drawWorldMap()};setup();if(!cv._bound){cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();this.worldClick(e.clientX-r.left,e.clientY-r.top)});window.addEventListener('resize',()=>{if(document.getElementById('worldCv')===cv)setup()});cv._bound=true}},
rEvents(){const disB=this.S.disaster?(()=>{const d=this.DISASTERS.find(x=>x.id===this.S.disaster.id);if(!d)return'';const rem=Math.max(0,Math.ceil((this.S.disaster.end-Date.now())/1000));return `<div class="cd hl" style="border-color:var(--r)"><div class="ct">${d.i} ${d.n} · ⏱${rem}с</div><div class="cdd">${d.d}</div><div class="cc">${Object.entries(d.cost).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div><button class="bp2 bf" onclick="G.resolveDisaster()">🚒 Устранить</button></div>`})():'';return`<div class="sec">🎪 События</div>${disB}<div class="cd hl"><div class="ct">🎲 Случайное событие</div><div class="cdd">Исследуйте мир для поиска событий. Каждая экспедиция может вызвать событие!</div><button class="bp2 bf" ${this.S.energy<15?'disabled':''} onclick="G.forceEvent()">🔍 Искать событие (⚡15)</button></div><div class="sec">Погода и сезоны</div><div class="cd"><div class="ct">${this.WEATHER[this.S.weather].i} ${this.WEATHER[this.S.weather].n}</div><div class="cdd">${Object.entries(this.WEATHER[this.S.weather].eff).map(([k,v])=>`${k}: x${v}`).join(', ')||'Без эффектов'}</div></div><div class="cd"><div class="ct">${this.SEASONS[this.S.season].i} ${this.SEASONS[this.S.season].n}</div><div class="cdd">Ферма x${this.SEASONS[this.S.season].farmB} · Зомби x${this.SEASONS[this.S.season].zombB}</div></div>`},
rBestiary(){return`<div class="sec">📖 Бестиарий</div><div class="bestiary-grid">${this.ZT.map(z=>{const cnt=this.S.bestiary[z.id]||0;const disc=cnt>0;const bonus=this.getBestiaryBonus(z.id);return`<div class="best-card${disc?' discovered':''}"><span class="bci">${disc?z.i:'❓'}</span><span class="bcn">${disc?z.n:'???'}</span><span class="bck">${disc?`💀${cnt} · +${Math.round(bonus*100)}%`:'Не обнаружен'}</span></div>`}).join('')}</div><div class="cdd" style="margin-top:6px">Убивайте зомби для изучения. 10/50/100 убийств = +5/10/15% урон.</div>`},
screenShake(){const el=document.getElementById('app');if(!el)return;el.classList.add('dmgshake');setTimeout(()=>el.classList.remove('dmgshake'),400)},
waveIcons(wm,wave){const sets={normal:['w','w','w'],fog:['w','r','r'],rage:['w','e','e'],horde:['w','w','w','w','r'],boss:['b','w','w'],moon:['w','r','t','e','s']};const ids=sets[wm.id]||sets.normal;return ids.map(id=>this.ZT.find(z=>z.id===id)).filter(Boolean).map(z=>`<span title="${z.n}" style="font-size:18px;margin-right:2px">${z.i}</span>`).join('')},
rDef(){const wm=this.WAVE_MODS[this.S.wave%5===0?4:this.S.wave%7===0?5:this.S.wave%4];const sm=this.getSeasonMult();return`<div class="sec">🧱 Оборона · Волна ${this.S.wave}</div><div class="cd hl"><div class="ch"><span class="ct">🧱 Стена</span><span class="bg bg-${this.S.wHP>this.S.wMax*.5?'gn':this.S.wHP>this.S.wMax*.25?'g':'r'}">${this.S.wHP}/${this.S.wMax}</span></div><div class="pb"><div class="pf ${this.S.wHP>this.S.wMax*.5?'pfgr':'pfr'}" style="width:${this.S.wHP/this.S.wMax*100}%"></div></div>${this.S.wHP<this.S.wMax?`<button class="bs bf" onclick="G.repairWall()">🔧Ремонт (🪵50⚙30)</button>`:''}</div>${this.S.wHP<this.S.wMax*.5?`<div class="cd warn-wall"><div class="ct">⚠️ Стена сильно повреждена!</div><div class="cdd">Урон в следующем бою будет выше обычного. Рекомендуем сначала починить стену.</div></div>`:''}<div class="cd"><div class="ct">${wm.i} Модификатор: ${wm.n}</div><div class="cdd">${wm.d||'Обычная волна'}${wm.mult>1?` · Сила x${wm.mult}`:''}</div><div class="cdd">Сезон: ${this.SEASONS[this.S.season].i} Зомби x${sm.zombie}</div><div class="cdd" style="margin-top:4px">Ожидаются: ${this.waveIcons(wm,this.S.wave)}</div></div><div class="cd"><div class="ct">⚔ Ваша сила: ${this.S.power}</div><div class="cdd">Гарнизон: ${this.S.gar.filter(g=>g).length}/5</div></div>${wm.id==='boss'?(()=>{const boss=this.BOSSES[Math.max(0,Math.floor(this.S.wave/5)-1)%this.BOSSES.length];return `<div class="cd hl" style="border-color:var(--r)"><div class="ct">👑 БОСС: ${boss.i} ${boss.n}</div><div class="cdd">Особый враг этой волны! Гарантированная эпическая+ награда.</div></div><button class="bv bf" ${!this.S.bld.wall||!this.S.gar.some(g=>g)||this.S.battling?'disabled':''} onclick="G.fightBoss()">👑 СРАЗИТЬСЯ С БОССОМ</button>`})():`<button class="bp2 bf" ${!this.S.bld.wall||!this.S.gar.some(g=>g)||this.S.battling?'disabled':''} onclick="G.simDef()">⚔ ОТРАЗИТЬ ВОЛНУ ${this.S.wave}!</button>`}`},
rArena(){return`<div class="sec">🏟 PvP Арена</div><div class="cd hl"><div class="ct">🏆 Рейтинг: ${this.S.rating}</div><div class="cdd">Ваша сила: ⚔${this.S.power}</div></div><button class="bv bf" ${!this.S.gar.some(g=>g)?'disabled':''} onclick="G.pvp()">⚔ Найти противника</button>`},
rLb(){this.genLb();const list=[...this.S.lb,{n:this.S.name+' (Вы)',rating:this.S.rating,me:true}].sort((a,b)=>b.rating-a.rating);return`<div class="sec">🏆 Таблица лидеров</div><div class="g1">${list.map((p,i)=>`<div class="cd${p.me?' hl':''}"><div class="ch"><span class="ct">#${i+1} ${p.n}</span><span class="bg bg-g">🏆${Math.round(p.rating)}</span></div>${!p.me?`<button class="bs bf" style="font-size:8px" onclick="G.pvpAttack('${p.n}')">⚔ Атаковать</button>`:''}</div>`).join('')}</div>`},

rRaids(){return`<div class="sec">💀 Ночные рейды</div><div class="cd"><div class="ct">🌙 Авто-рейды</div><div class="cdd">Каждую ночь (22:00) зомби могут атаковать! Вероятность: ${Math.round((30+this.S.wave*3))}%</div><div class="cdd" style="color:var(--g)">Совет: укрепляйте стену и назначайте гарнизон!</div></div><div class="cd"><div class="ct">📊 Статистика рейдов</div><div class="cdd">${this.S.log.filter(l=>l.includes('Рейд')).slice(0,5).map(l=>`<div style="padding:2px 0">${l}</div>`).join('')||'Рейдов пока не было'}</div></div>`},
rQuests(){const q=this.QU[this.S.ch-1];if(!q)return'<div class="cdd">Все главы пройдены! 🎉</div>';return`<div class="sec">📋 Глава ${this.S.ch}: ${q.t}</div><div class="g1">${q.st.map((s,i)=>{const done=i<this.S.qs;const cur=i===this.S.qs;const ck=s.ck(this.S);return`<div class="cd${done?' hl':''}${cur&&ck?' hl':''}"><div class="ch"><span class="ct">${done?'✅':cur?'👉':'🔒'} ${s.t}</span></div>${cur&&ck?`<button class="bgn bf" onclick="G.advQ()">Завершить!</button>`:''}</div>`}).join('')}</div>`},
rDaily(){const di=(this.S.day-1)%7;const claimed=this.S.daily>=this.S.day;return`<div class="sec">🎁 Ежедневные награды</div><div style="display:flex;flex-wrap:wrap;gap:4px">${this.DA.map((d,i)=>`<div class="bpc${i===di?' cur':''}${claimed&&i===di?' clm':''}"><span class="bl">День ${i+1}</span><span class="bi">${d.i}</span><span class="ba">${d.a}</span></div>`).join('')}</div>${!claimed?`<button class="bp2 bf" style="margin-top:6px" onclick="G.claimDaily()">🎁 Забрать награду дня!</button>`:'<div class="cdd" style="margin-top:6px;text-align:center">✅ Получено сегодня</div>'}`},
rAch(){return`<div class="sec">🏆 Достижения</div><div class="g1">${this.AC.map(a=>{const done=this.S.achs[a.id];const ck=a.ck(this.S);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${a.i} ${a.n}</span>${done?'<span class="bg bg-gn">✅</span>':ck?'<span class="bg bg-g">Готово!</span>':''}</div><div class="cdd">${a.d} → ${Object.entries(a.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${ck&&!done?`<button class="bgn bf" onclick="G.claimAch('${a.id}')">Забрать!</button>`:''}</div>`}).join('')}</div><div class="sec">Многоуровневые</div><div class="g1">${Object.entries(this.ACH_TIERS).map(([key,tiers])=>{const val=key==='kills'?this.S.kills:key==='built'?this.S.built:key==='heroes'?this.S.heroes.length:key==='waves'?this.S.wave:this.S.crafted;const cur=tiers.findIndex(t=>val<t);const tier=cur===-1?tiers.length:cur;return`<div class="cd"><div class="ct">${key==='kills'?'💀':key==='built'?'🏗':key==='heroes'?'👥':key==='waves'?'🌊':'🔨'} ${key} · Тир ${tier}/${tiers.length}</div><div class="pb"><div class="pf pfg" style="width:${Math.min(100,val/(tiers[cur]||tiers[tiers.length-1])*100)}%"></div></div><div class="cdd">${val}/${tiers[cur]||'MAX'}</div></div>`}).join('')}</div>`},
rBP(){return`<div class="sec">🎫 Battle Pass · Ур.${this.S.bpLvl}</div><div class="pb" style="margin-bottom:6px"><div class="pf pfg" style="width:${this.S.bpXP/(50+this.S.bpLvl*20)*100}%"></div></div><div class="cdd" style="margin-bottom:6px">XP: ${this.S.bpXP}/${50+this.S.bpLvl*20}</div><div style="display:flex;flex-wrap:wrap;gap:4px">${Array.from({length:20},(_, i)=>{const lv=i+1;const cl=this.S.bpCl.includes(lv);const avail=this.S.bpLvl>=lv;const special=lv%5===0;return`<div class="bpc${avail&&!cl?' cur':''}${cl?' clm':''}" style="${special?'border-color:var(--p)':''}"><span class="bl">Ур.${lv}</span><span class="bi">${special?'💎':'🍖'}</span><span class="ba">${special?10:50+lv*10}</span>${avail&&!cl?`<button class="bs" style="font-size:7px;margin-top:2px" onclick="G.claimBP(${lv})">Взять</button>`:''}</div>`}).join('')}</div>`},
rAlly(){const A=this.ALLIANCES.find(a=>a.id===this.S.alliance);
if(!this.S.alliance)return`<div class="sec">🤝 Альянсы</div><div class="g2">${this.ALLIANCES.map(a=>`<div class="cd"><div class="ct">${a.i} ${a.n}</div><div class="cdd">${a.d}</div><button class="bgn bf" onclick="G.joinAlliance('${a.id}')">Вступить</button></div>`).join('')}</div>`;
const ab=this.S.allyBoss;
return`<div class="sec">${A.i} ${A.n} · ⭐${this.S.allyRep}</div>
<div class="cd"><div class="ct">🎁 Взнос</div><div class="cdd">Репутация за ресурсы — открывает уважение союзников.</div><div style="display:flex;gap:3px;margin-top:4px"><button class="bs" onclick="G.allyDonate('food',100)">🍖-100</button><button class="bs" onclick="G.allyDonate('wood',100)">🪵-100</button><button class="bs" onclick="G.allyDonate('metal',50)">⚙-50</button></div></div>
<div class="cd"><div class="ct">🆘 Помощь альянса</div><div class="cdd">Попросите ресурсы — союзники ответят в чате и пришлют припасы.</div><button class="bb bf" ${Date.now()<(this.S.allyHelpCd||0)?'disabled':''} onclick="G.allyHelp()">Попросить помощь</button></div>
<div class="cd${ab?' hl':''}"><div class="ct">👑 Совместный босс</div>${ab?`<div class="pb"><div class="pf pfr" style="width:${Math.max(0,ab.hp/ab.max*100)}%"></div></div><div class="cdd">HP ${Math.max(0,Math.ceil(ab.hp))}/${ab.max} · союзники вносят урон вместе с вами!</div><button class="bv bf" ${this.S.energy<10?'disabled':''} onclick="G.allyAttack()">⚔ Атаковать (⚡10)</button>`:`<div class="cdd">Общий босс альянса: урон вносят все участники, награда — всем.</div><button class="bv bf" onclick="G.allyBossStart()">👑 Призвать босса</button>`}</div>`},
rNPC(){return`<div class="sec">👤 Миссии NPC</div><div class="g1">${this.NPC_MISSIONS.map((m,i)=>{const done=this.S.npcDone.includes(m.id);const ca=!done&&Object.entries(m.req).every(([r,v])=>this.S.res[r]>=v);return`<div class="cd${done?' hl':''}"><div class="ch"><span class="ct">${m.i} ${m.npc}</span>${done?'<span class="bg bg-gn">✅</span>':''}</div><div class="cdd" style="font-style:italic">"${m.dialog}"</div><div class="cdd">${m.task}</div><div class="cc">Награда: ${Object.entries(m.rw).map(([r,v])=>`${this.IC[r]}${v}`).join(' ')}</div>${!done?`<button class="${ca?'bgn':'bs'} bf" ${ca?'':'disabled'} onclick="G.completeNPC(${i})">Выполнить</button>`:''}</div>`}).join('')}</div>`},
rSound(){return`<div class="sec">🔊 Звук</div><div class="cd"><div class="vr"><button class="bs" id="vsb" style="width:34px;flex-shrink:0" onclick="G.toggleSound()">${this.S.snd?'🔊':'🔇'}</button><input type="range" min="0" max="100" value="${Math.round(this.S.volume*100)}" oninput="G.setVolume(this.value/100);this.nextElementSibling.textContent=this.value+'%'"><span class="vlbl">${Math.round(this.S.volume*100)}%</span></div><div class="cdd" style="margin-top:4px">Общая громкость и звук: клики, стройка, выстрелы, тревога перед волной, удары зомби, победа/поражение, фоновый эмбиент.</div></div>`},
rGfx(){return`<div class="sec">🖼 Графика</div><div class="cd"><div class="ch"><span class="ct">Анимации базы</span><span class="bg bg-${this.S.lowGfx?'r':'gn'}">${this.S.lowGfx?'Выкл':'Вкл'}</span></div><div class="cdd">Дым, огни в окнах, костёр, дождь/снег/туман, рабочие, пульсация построек.</div><button class="${this.S.lowGfx?'bgn':'bs'} bf" onclick="G.toggleLowGfx()">${this.S.lowGfx?'🖼 Включить эффекты':'🪫 Низкая графика (для слабых телефонов)'}</button></div>`},
rStats(){return`${this.rSound()}${this.rGfx()}<div class="sec">📊 Статистика</div><div class="g1">${[['🧔 Уровень',this.S.lvl],['⚔ Сила',this.S.power],['💀 Убийств',this.S.kills],['🏗 Построек',this.S.built],['🔨 Крафтов',this.S.crafted],['🌊 Волна',this.S.wave],['🏆 Рейтинг',this.S.rating],['👥 Героев',this.S.heroes.length],['🗺 Зон',this.S.mapRev.length],['📅 День',this.S.day],['🏪 Обменов',this.S.trades||0],['🤝 Альянс',this.S.alliance?this.ALLIANCES.find(a=>a.id===this.S.alliance)?.n:'—'],[`${this.WEATHER[this.S.weather].i} Погода`,this.WEATHER[this.S.weather].n],[`${this.SEASONS[this.S.season].i} Сезон`,this.SEASONS[this.S.season].n],['☣️ Заражённых',Object.keys(this.S.infected).length]].map(([l,v])=>`<div class="sr"><span class="sl">${l}</span><span class="sv">${v}</span></div>`).join('')}</div><div style="display:flex;gap:4px;margin-top:6px"><button class="bs" style="flex:1" onclick="G.exportSave()">📤 Экспорт</button><button class="bs" style="flex:1" onclick="G.importSave()">📥 Импорт</button></div><button class="bs bf" style="margin-top:6px;color:#f87171" onclick="G.resetProgress()">🗑 Сбросить прогресс</button>`},
resetProgress(){this.askConfirm('Точно сбросить весь прогресс? Это действие необратимо!',()=>{try{localStorage.removeItem('tlp3')}catch(e){}location.reload()})},
// ===== ACTIONS =====
// ===== V5: ГЕРОЙСКИЕ СПОСОБНОСТИ / БОЙ =====
itemStats(it){const lv=Math.max(0,(it.lv||1)-1);return{a:(it.a||0)+(it.a>0?lv*Math.max(1,Math.round(it.a*.08)):0),d:(it.d||0)+(it.d>0?lv*Math.max(1,Math.round(it.d*.12)):0)}},
combatStats(){const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);const skA=this.getSkillBonus('atkMul'),skD=this.getSkillBonus('hpMul'),petA=this.getPetBonus('atkMul'),petD=this.getPetBonus('hpMul');let atk=0,def=0,crit=0,dodge=0,boss=0,wall=0,team=0;gh.forEach(h=>{const ab=this.HAB[h.id]||{};const st=this.S.equip[h.id]||{};const stars=h.st||1;const sf=1+.2*(stars-1),sb8=.08*(stars-1);const cl={sword:[.1,0,0,0],gun:[0,.08,0,0],shield:[0,0,.1,0],med:[0,0,0,.05]}[h.cls]||[0,0,0,0];let a=h.a*h.lv*(1+skA+petA+cl[0]+(ab.a||0)*sf+sb8);let d=h.d*h.lv*(1+skD+petD+(ab.d||0)*sf+sb8);Object.values(st).forEach(e=>{if(e){const es=this.itemStats(e);a+=es.a;d+=es.d}});const sb=this.getSetBonus(h.id);a+=sb.a;d+=sb.d;atk+=a;def+=d;crit+=(ab.crit||0)*sf+cl[1];dodge+=(ab.dodge||0)*sf;boss+=(ab.boss||0)*sf;wall+=(ab.wall||0)*sf+cl[2];team+=(ab.team||0)*sf+cl[3]});atk*=(1+team)*(1+((this.S.workers||{}).hunt||0)*.02);return{atk,def,crit:Math.min(.6,crit),dodge:Math.min(.6,dodge),boss,wall}},
fightOutcome(ws,boss){const cs=this.combatStats();let atk=cs.atk*(boss?1+cs.boss:1);if(cs.crit>0&&Math.random()<cs.crit)atk*=1.5;const wallD=(this.S.bld.wall||0)*10*(1+cs.wall)*(this.S.techs.wl?1.25:1)*this.getWeatherMult().def;const ds=atk+cs.def+wallD;const won=ds>ws;let dmg;if(won){dmg=Math.max(5,ws*.3|0);if(Math.random()<cs.dodge)dmg=Math.max(1,dmg*.5|0)}else{dmg=Math.max(8,ws*.8|0);if(Math.random()<cs.dodge)dmg=Math.max(1,dmg*.5|0)}return{won,dmg}},
// ===== V5: МАССОВОЕ СТРОИТЕЛЬСТВО =====
buildCost(k,amt){const dt=this.BD[k],lv=this.S.bld[k]||0;amt=Math.min(amt||1,Math.max(0,dt.mx-lv));const co={};const disc=Math.min(.2,((this.S.workers||{}).bld||0)*.005);for(let i=1;i<=amt;i++)Object.entries(dt.c(lv+i)).forEach(([r,v])=>co[r]=(co[r]||0)+Math.max(1,Math.ceil(v*(1-disc))));return co},
setBuildAmt(v){this.S.buildAmt=v;this.snd('click');this.rPanel();this.drawMap()},
// ===== V5: МОДАЛКА ПОДТВЕРЖДЕНИЯ =====
askConfirm(msg,onYes){const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo" style="text-align:center"><h3>⚠️ Подтверждение</h3><p class="cdd" style="margin:8px 0">${msg}</p><div style="display:flex;gap:6px"><button class="bgn bf" onclick="G._confirmYes()">Да</button><button class="bs bf" onclick="this.closest('.mb').remove()">Отмена</button></div></div>`;document.body.appendChild(el);this._confirmCb=onYes},
_confirmYes(){const cb=this._confirmCb;this._confirmCb=null;const m=document.querySelector('.mb');if(m)m.remove();if(cb)cb()},

triggerDisaster(){if(this.S.disaster||Date.now()<(this.S.disasterCd||0))return;if(Math.random()>.15)return;const d=this.DISASTERS[Math.random()*this.DISASTERS.length|0];this.S.disaster={id:d.id,end:Date.now()+d.dur*1000};this.S.disasterCd=Date.now()+180000;this.snd('alert');this.toast(`🚨 ${d.i} ${d.n}!`);this.addNotif(`🚨 ${d.n}! Загляните в 🎪События`,'danger')},
resolveDisaster(){if(!this.S.disaster)return;const d=this.DISASTERS.find(x=>x.id===this.S.disaster.id);if(!d)return;const ca=Object.entries(d.cost).every(([r,v])=>this.S.res[r]>=v);if(!ca)return this.toast('Не хватает ресурсов!'),this.snd('err');Object.entries(d.cost).forEach(([r,v])=>this.S.res[r]-=v);this.S.disaster=null;this.snd('reward');this.toast(`✅ ${d.n} устранена!`);this.updAll()},
applyDisasterDamage(){const d=this.DISASTERS.find(x=>x.id===this.S.disaster?.id);this.S.disaster=null;if(!d)return;if(d.id==='fire'){this.S.res.wood=Math.max(0,this.S.res.wood-d.dmgAmt);this.toast(`🔥 Склад сгорел! 🪵-${d.dmgAmt}`)}else if(d.id==='plague'){if(this.S.heroes.length)this.infectHero(this.S.heroes[Math.random()*this.S.heroes.length|0].id);this.toast('☣️ Инфекция распространилась!')}else if(d.id==='raid'){this.S.wHP=Math.max(0,this.S.wHP-40);this.toast('🏴 Мародёры пробили стену! 🧱-40')}this.snd('hit');this.updAll()},
// ===== SAVE EXPORT/IMPORT =====
exportSave(){try{const code=btoa(unescape(encodeURIComponent(JSON.stringify(this.S))));prompt('Скопируйте код сохранения:',code)}catch(e){this.toast('Ошибка экспорта')}},
importSave(){const code=prompt('Вставьте код сохранения:');if(!code)return;try{const p=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));this.S={...this.def(),...p};this.save();this.toast('✅ Импортировано!');location.reload()}catch(e){this.toast('❌ Неверный код!')}},
toFirstG(hi){const es=this.S.gar.indexOf(null);if(es===-1)return this.toast('Все слоты заняты!');const h=this.S.heroes[hi];if(!h)return;this.S.gar=this.S.gar.map(g=>g===h.id?null:g);this.S.gar[es]=h.id;this.calcPow();this.updAll()},
remG(sl){this.S.gar[sl]=null;this.calcPow();this.updAll()},
startExp(i){const t=this.EX[i];if(!t)return;if(!this.S.gar.some(g=>g))return this.toast('Назначьте гарнизон!');if(this.S.exps.length>=3)return this.toast('Макс 3!');const wm=this.getWeatherMult();if(this.S.energy<t.en*wm.energyDrain)return this.toast('Мало ⚡!');this.S.energy-=Math.ceil(t.en*wm.energyDrain);this.S.exps.push({...t,st:Date.now(),et:Date.now()+t.dur*1e3*(wm.exp||1)});this.snd('click');this.toast(`🧭 ${t.n} начата!`);this.triggerMapEvent();this.updAll()},
collectExp(i){const e=this.S.exps[i];if(!e||Date.now()<e.et)return;const gm=1+this.getSkillBonus('gatherMul')+this.getPetBonus('expMul');Object.entries(e.rw).forEach(([r,v])=>{const bonus=Math.floor(v*gm);this.S.res[r]=Math.min(this.S.res[r]+bonus,this.S.caps[r]||999)});this.S.exps.splice(i,1);this.addXP(25);this.addBPXP(8);this.S.kills+=5;const zt=this.ZT[Math.random()*3|0];this.registerKill(zt.id);this.snd('reward');this.toast(`✅ Экспедиция завершена!`);this.addNotif(`✅ Экспедиция: ${e.n}`,'exp');this.updAll()},
craft(i){const r=this.CR[i];if(!r)return;for(const[mt,v]of Object.entries(r.mt))if(this.S.res[mt]<v)return this.toast('Не хватает: '+this.missingRes(r.mt)),this.snd('err');for(const[mt,v]of Object.entries(r.mt))this.S.res[mt]-=v;const eq={...this.EP.find(e=>e.id===r.res)};this.S.inv.push(eq);this.S.crafted++;this.addBPXP(5);this.snd('build');this.toast(`🔨 ${eq.i} ${eq.n}!`);this.updAll()},
showEquipModal(invIdx){const item=this.S.inv[invIdx];if(!item)return;const el=document.createElement('div');el.className='mb';el.innerHTML=`<div class="mo"><h3>${item.i} ${item.n} <span class="bg bg-${item.r==='legendary'?'g':item.r==='epic'?'p':'b'}">${item.r}</span></h3><p class="cdd">⚔${item.a||0} 🛡${item.d||0} · ${item.sl}</p><div class="sec">Экипировать на:</div><div class="g1">${this.S.heroes.map(h=>`<button class="bs bf" style="margin-bottom:3px" onclick="G.equipItem(${invIdx},'${h.id}');this.closest('.mb').remove()">${h.i} ${h.n}</button>`).join('')}</div><button class="bs bf" style="margin-top:6px" onclick="this.closest('.mb').remove()">Закрыть</button></div>`;document.body.appendChild(el)},
equipItem(invIdx,heroId){const item=this.S.inv[invIdx];if(!item)return;const hero=this.S.heroes.find(h=>h.id===heroId);if(!hero)return;if(!this.S.equip[heroId])this.S.equip[heroId]={};const old=this.S.equip[heroId][item.sl];if(old)this.S.inv.push(old);this.S.equip[heroId][item.sl]=item;this.S.inv.splice(invIdx,1);this.calcPow();this.snd('build');this.toast(`${item.i}→${hero.n}`);this.updAll()},
research(id){if(this.S.techs[id])return;const t=this.TC.find(x=>x.id===id);if(!t)return;const ll=this.S.bld.lab||0;if(ll<t.rq)return this.toast(`Лаб Ур.${t.rq}!`);for(const[r,v]of Object.entries(t.co))if(this.S.res[r]<v)return this.toast('Не хватает: '+this.missingRes(t.co)),this.snd('err');for(const[r,v]of Object.entries(t.co))this.S.res[r]-=v;this.S.techs[id]=true;this.calcPow();this.addXP(35);this.addBPXP(12);this.snd('reward');this.toast(`🔬 ${t.n}!`);this.updAll()},
lvlHero(i){const h=this.S.heroes[i];if(!h)return;const cost=h.lv*25;if(this.S.res.food<cost)return this.toast(`🍖${cost}!`),this.snd('err');this.S.res.food-=cost;h.lv++;this.calcPow();this.addBPXP(3);this.snd('lvl');this.toast(`${h.i}→Ур.${h.lv}!`);this.updAll()},
simDef(){if(!this.S.bld.wall)return this.toast('Стена!');if(!this.S.gar.some(g=>g))return this.toast('Гарнизон!');if(this.S.wHP<this.S.wMax*.5){this.askConfirm(`⚠️ Стена повреждена (${this.S.wHP}/${this.S.wMax})! Продолжить бой?`,()=>this.doDef());return}this.doDef()},
doDef(){if(this.S.battling)return;const gh=this.S.gar.filter(g=>g).map(id=>this.S.heroes.find(h=>h.id===id)).filter(Boolean);this.snd('waveAlarm');const wm=this.WAVE_MODS[this.S.wave%5===0?4:this.S.wave%7===0?5:this.S.wave%4];const sm=this.getSeasonMult();const wth=this.getWeatherMult();const ws=(this.S.wave*20+Math.random()*30)*wm.mult*sm.zombie*wth.zombie;const {won,dmg}=this.fightOutcome(ws,false);const zk=3+this.S.wave*2+(Math.random()*5|0);
this.S.battling=true;this.rPanel();
this.playBattle({boss:false,won,dur:this.S.lowGfx?3500:6500,cb:()=>{
this.S.wHP=Math.max(0,this.S.wHP-dmg);if(dmg>0)this.screenShake();const log=[];
if(won){this.S.kills+=zk;this.S.wave++;const zt=this.ZT[Math.random()*this.ZT.length|0];this.registerKill(zt.id);const huntB=1+((this.S.workers||{}).hunt||0)*.02;const fr=Math.floor((50+this.S.wave*15)*huntB),mr=20+this.S.wave*8;this.S.res.food=Math.min(this.S.res.food+fr,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+mr,this.S.caps.metal);this.addXP(25+this.S.wave*5);this.addBPXP(15);log.push(`✅ Волна ${this.S.wave-1}(${wm.n}) 💀${zk}`);log.push(`🧱-${dmg} 🍖+${fr} ⚙+${mr}`);if(gh.length)this.infectHero(gh[Math.random()*gh.length|0].id)}else{this.S.kills+=zk/2|0;const cs=this.combatStats();log.push(`❌ Волна ${this.S.wave}(${wm.n}) 🧱-${dmg}`);log.push(`⚔${(cs.atk+cs.def)|0} vs 🧟${ws|0}`)}
this.S.log=[...log,...this.S.log].slice(0,30);this.battleSfx(won,dmg>0);this.toast(won?`⚔ Отражено! +${zk}💀`:'💀 Оборона пала!');this.S.battling=false;this.updAll()}})},
repairWall(){if(this.S.res.wood<50||this.S.res.metal<30)return this.toast('Не хватает: '+this.missingRes({wood:50,metal:30}));this.S.res.wood-=50;this.S.res.metal-=30;this.S.wHP=this.S.wMax;this.snd('build');this.toast('🧱 Восстановлено!');this.updAll()},
pvp(){const gh=this.S.gar.filter(g=>g);if(!gh.length)return this.toast('Гарнизон!');const ep=100+Math.random()*this.S.power*1.5;const won=this.S.power>ep*(.7+Math.random()*.6);if(won){const pts=15+Math.random()*10|0;this.S.rating+=pts;this.S.kills+=3;this.S.res.gems=Math.min(this.S.res.gems+5,999);this.addXP(20);this.addBPXP(10);this.battleSfx(true,false);this.toast(`🏆 Победа! +${pts}🏆 +💎5`)}else{const pts=10+Math.random()*8|0;this.S.rating=Math.max(0,this.S.rating-pts);this.battleSfx(false,false);this.toast(`💀 Поражение! -${pts}🏆`)}this.updAll()},
advQ(){const q=this.QU[this.S.ch-1];if(!q)return;const cs=q.st[this.S.qs];if(!cs||!cs.ck(this.S))return;this.S.qs++;this.addXP(30);this.addBPXP(10);this.S.res.gems=Math.min(this.S.res.gems+10,999);this.snd('reward');if(this.S.qs>=q.st.length){this.S.ch++;this.S.qs=0;this.toast(`📖 Глава ${this.S.ch}!`)}else this.toast('✅ Задание выполнено!');this.updAll()},
claimDaily(){const di=(this.S.day-1)%7;if(this.S.daily>=this.S.day)return this.toast('Уже!');const rw=this.DA[di];this.S.res[rw.r]=Math.min(this.S.res[rw.r]+rw.a,this.S.caps[rw.r]||999);this.S.daily=this.S.day;this.addXP(10);this.addBPXP(5);this.snd('reward');this.toast(`🎁 +${rw.a}${rw.n}!`);this.updAll()},
claimAch(id){if(this.S.achs[id])return;const a=this.AC.find(x=>x.id===id);if(!a||!a.ck(this.S))return;this.S.achs[id]=true;Object.entries(a.rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.addXP(20);this.snd('reward');this.toast(`🏆 ${a.n}!`);this.updAll()},
claimBP(lvl){if(this.S.bpCl.includes(lvl)||this.S.bpLvl<lvl)return;this.S.bpCl.push(lvl);const rw=lvl%5===0?{gems:10}:{food:50+lvl*10};Object.entries(rw).forEach(([r,v])=>{this.S.res[r]=Math.min(this.S.res[r]+v,this.S.caps[r]||999)});this.snd('reward');this.toast(`🎫 BP Ур.${lvl}!`);this.updAll()},
exploreZone(id){const zone=this.MN.find(m=>m.id===id);if(!zone)return;const dg=zone.dg||0;const cost=5+dg*5;if(this.S.energy<cost)return this.toast('Мало ⚡!');this.S.energy-=cost;if(!dg){this.S.res.food=Math.min(this.S.res.food+30,this.S.caps.food);this.snd('reward');this.toast(`📍 ${zone.n}: 🍖+30`);this.updAll();return}const req=40+dg*60;const won=this.S.power>=req*(.6+Math.random()*.5);if(won){const fr=20*dg,mr=15*dg,gm=dg>=4?3:0;this.S.res.food=Math.min(this.S.res.food+fr,this.S.caps.food);this.S.res.metal=Math.min(this.S.res.metal+mr,this.S.caps.metal);if(gm)this.S.res.gems=Math.min(this.S.res.gems+gm,999);this.S.kills+=dg;const zt=this.ZT[Math.min(dg,this.ZT.length-1)];this.registerKill(zt.id);this.snd('reward');this.toast(`📍 ${zone.n}: 🍖+${fr} ⚙+${mr}${gm?' 💎+'+gm:''}`);const locked=this.MN.filter(m=>!this.S.mapRev.includes(m.id)&&(m.dg||0)<=dg+1);if(locked.length&&Math.random()<.3){const nz=locked[Math.random()*locked.length|0];this.S.mapRev.push(nz.id);this.addNotif(`🗺 Открыта зона: ${nz.n}!`,'info')}}else{const dmg=dg*8;this.S.wHP=Math.max(0,this.S.wHP-dmg);this.snd('hit');this.toast(`💀 ${zone.n}: слишком опасно! 🧱-${dmg}`)}if(Math.random()<.25)this.triggerMapEvent();this.updAll()},
forceEvent(){if(this.S.energy<15)return this.toast('Мало ⚡!');this.S.energy-=15;this.S.mapEvtCd=0;this.triggerMapEvent();if(!document.querySelector('.mb'))this.toast('Ничего не найдено...');this.updAll()},

spr.scale.set(3.4,3.4,1);const z=Math.random()*110-55;spr.position.set(-95,1.7,z);
this.scene3d.add(spr);this.zomb3d.push({spr,x:-95,sp:5+Math.random()*6,bob:Math.random()*6})},
spawnParticle(x,y,emoji,dur=1200){if(!this.r3d)return;const r=this.cv.getBoundingClientRect();if(!r.width)return;
const nd=new THREE.Vector2(x/r.width*2-1,-(y/r.height*2-1));const rc=new THREE.Raycaster();rc.setFromCamera(nd,this.camera);
const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);const p=new THREE.Vector3();
if(!rc.ray.intersectPlane(pl,p))p.set(0,0,0);this.spawnParticle3D(p,emoji,dur)},
spawnParticle3D(pos,emoji,dur=1200){if(!this.r3d)return;const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:this.emojiTex(emoji),transparent:true,depthWrite:false}));
spr.scale.set(2.6,2.6,1);spr.position.set(pos.x,Math.max(1,pos.y),pos.z);this.scene3d.add(spr);
this.parts3d.push({spr,vx:(Math.random()-.5)*3.5,vy:4.5+Math.random()*3.5,vz:(Math.random()-.5)*3.5,start:Date.now(),dur})},
builtFx3D(k){const b=this.mBlds.find(m=>m.k===k);if(!b)return;const p=new THREE.Vector3((b.x-.5)*this.WX,3,(b.y-.5)*this.WZ);
this.spawnParticle3D(p,'🔨',900);for(let i=0;i<3;i++)this.spawnParticle3D(new THREE.Vector3(p.x+(Math.random()-.5)*6,1,p.z+(Math.random()-.5)*6),'💨',1100)},
drawMap(){/* 3D: рендер идёт в rAF-цикле update3D() */},
drawImgCover(c,img,x,y,w,h){const ir=img.width/img.height,r=w/h;let sx,sy,sw,sh;if(ir>r){sh=img.height;sw=sh*r;sx=(img.width-sw)/2;sy=0}else{sw=img.width;sh=sw/r;sx=0;sy=(img.height-sh)/2}c.drawImage(img,sx,sy,sw,sh,x,y,w,h)},
// ===== GAME LOOP =====
lastTick:0,prodTimers:{},
startLoop(){this.lastTick=Date.now();setInterval(()=>this.tick(),1000);setInterval(()=>{this.drawMap();if(this.S.tab==='map'&&this.S.sub==='world')this.drawWorldMap()},100);setInterval(()=>{if(Math.random()<.3)this.spawnMapZombie()},3000)},
tick(){const now=Date.now();
// Resource production
const wm=this.getWeatherMult();const sm=this.getSeasonMult();const gatherB=1+this.getSkillBonus('gatherMul')+this.getPetBonus('gatherMul');Object.entries(this.BD).forEach(([k,b])=>{if(!b.pr)return;const lv=this.S.bld[k]||0;if(!lv)return;if(!this.prodTimers[k])this.prodTimers[k]=now;if(now-this.prodTimers[k]>=b.pr.t*1000){let am=b.pr.a(lv);const WB=this.S.workers||{};if(b.pr.r==='food')am=Math.floor(am*wm.farm*sm.farm*gatherB*(1+(WB.farm||0)*.04));else if(b.pr.r==='metal')am=Math.floor(am*(wm.metal||1)*gatherB*(1+(WB.wrk||0)*.04));else am=Math.floor(am*gatherB*(1+(WB.saw||0)*.04));this.S.res[b.pr.r]=Math.min(this.S.res[b.pr.r]+am,this.S.caps[b.pr.r]);this.prodTimers[k]=now}});
// Energy regen
if(now-this.S.lastET>=300000){this.S.energy=Math.min(this.S.energy+1,this.S.maxE+this.getSkillBonus('maxEn')*1+this.getPetBonus('energyMax'));this.S.lastET=now}
// Disasters
if(!this.S.disaster&&Math.random()<.02)this.triggerDisaster();else if(this.S.disaster&&Date.now()>this.S.disaster.end)this.applyDisasterDamage();if(this.S.disaster&&this.S.sub==='events')this.rPanel();
// Live-таймеры экспедиций в панели (без полной перерисовки, чтобы не сбивать скролл)
if(this.S.sub==='exp'&&this.S.exps.length){const di=this.S.exps.findIndex((e,i)=>Date.now()>=e.et&&document.getElementById('exb'+i));
if(di>=0)this.rPanel();
else this.S.exps.forEach((e,i)=>{const b=document.getElementById('exb'+i),pb=document.getElementById('expb'+i);
if(b)b.textContent=Math.ceil(Math.max(0,e.et-Date.now())/1000)+'с';
if(pb)pb.style.width=Math.min(100,((Date.now()-e.st)/(e.et-e.st))*100)+'%'})}
// V7: тайлы, альянс-события, чат-боты
this.tileProd();this.allyTick();
// Time progression
if(now-this.lastTick>=8000){this.S.hour++;if(this.S.hour>=24){this.S.hour=0;this.S.day++;this.updateSeason();this.addNotif(`🌅 День ${this.S.day}`,'day')}if(this.S.hour%6===0)this.updateWeather();this.checkZombieRaid();this.checkInfections();this.lastTick=now}
// Auto-expedition: collect finished ones and auto-restart if energy allows
if(this.S.autoExp){let loop=true;while(loop){loop=false;const i=this.S.exps.findIndex(e=>Date.now()>=e.et);if(i>=0){const done=this.S.exps[i];this.collectExp(i);const ti=this.EX.findIndex(x=>x.i===done.i);if(ti>=0&&this.S.energy>=this.EX[ti].en&&this.S.exps.length<3){this.startExp(ti);loop=true}}}}
this.updTop();this.updQ();this.updWeatherUI();this.renderHint();this.save()},
updAll(){this.updTop();this.updQ();this.updWeatherUI();this.calcPow();this.rPanel();this.drawMap();this.renderHint();this.save()},
};
