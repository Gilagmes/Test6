<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Last Port v4.2 — Siege Update</title>
<style>
/* ======================== CSS VARIABLES ======================== */
:root {
  --bg-dark: #0a0e14;
  --bg-panel: #12181f;
  --bg-card: #1a2230;
  --bg-hover: #243044;
  --accent: #e8a624;
  --accent-dim: #b8841a;
  --danger: #e84040;
  --heal: #44cc66;
  --shield: #4488ee;
  --text: #e0ddd4;
  --text-dim: #8899aa;
  --border: #2a3444;
  --radius: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,.5);
  --font: 'Segoe UI', system-ui, sans-serif;
}

/* ======================== RESET & BASE ======================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg-dark);
  color: var(--text);
  font-size: 14px;
  line-height: 1.4;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  outline: none;
  font-size: 13px;
  border-radius: var(--radius);
  transition: all .2s;
}
button:active { transform: scale(.96); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ======================== LAYOUT ======================== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* TOP BAR */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  flex-shrink: 0;
}
#topbar .res-group {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.res-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
}
.res-item .ico { font-size: 16px; }
.res-item .val { color: var(--text); font-weight: 600; }
#topbar .info-group {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  color: var(--text-dim);
}

/* MAIN AREA */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* BASE VIEW (isometric grid) */
#base-view {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #0d1117;
}
#base-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#camera-controls {
  position: absolute;
  bottom: 12px;
  right: 12px;
  display: flex;
  gap: 6px;
  z-index: 20;
}
#camera-controls button {
  width: 36px; height: 36px;
  background: var(--bg-panel);
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#camera-controls button:hover { background: var(--bg-hover); }

/* SIDE PANEL */
#side-panel {
  width: 380px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
#panel-header {
  padding: 10px 14px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#panel-header .close-btn {
  background: none;
  color: var(--text-dim);
  font-size: 20px;
  padding: 2px 6px;
}
#panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* BOTTOM NAV */
#bottombar {
  display: flex;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  z-index: 100;
  flex-shrink: 0;
}
#bottombar button {
  flex: 1;
  padding: 8px 4px;
  background: none;
  color: var(--text-dim);
  border-radius: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  border-right: 1px solid var(--border);
  position: relative;
}
#bottombar button:last-child { border-right: none; }
#bottombar button .nav-ico { font-size: 20px; }
#bottombar button.active { color: var(--accent); background: rgba(232,166,36,.08); }
#bottombar button:hover { color: var(--accent); }
#bottombar button .badge {
  position: absolute;
  top: 4px; right: 20%;
  background: var(--danger);
  color: #fff;
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 8px;
  font-weight: 700;
}

/* ======================== CARDS ======================== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}
.card-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 12px;
}
.card-row .label { color: var(--text-dim); }

/* BUTTONS */
.btn-primary {
  background: var(--accent);
  color: #000;
  padding: 8px 16px;
  font-weight: 700;
  width: 100%;
}
.btn-primary:hover { background: var(--accent-dim); }
.btn-primary:disabled {
  background: var(--border);
  color: var(--text-dim);
  cursor: not-allowed;
  transform: none;
}
.btn-secondary {
  background: var(--bg-hover);
  color: var(--text);
  padding: 6px 12px;
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border); }
.btn-danger {
  background: rgba(232,64,64,.15);
  color: var(--danger);
  padding: 6px 12px;
  border: 1px solid rgba(232,64,64,.3);
}
.btn-small {
  padding: 4px 10px;
  font-size: 11px;
}

/* PROGRESS BAR */
.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--bg-dark);
  border-radius: 4px;
  overflow: hidden;
  margin: 6px 0;
}
.progress-bar .fill {
  height: 100%;
  border-radius: 4px;
  transition: width .3s;
}
.fill-accent { background: var(--accent); }
.fill-danger { background: var(--danger); }
.fill-heal { background: var(--heal); }
.fill-shield { background: var(--shield); }

/* HERO CARD */
.hero-card {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .2s;
}
.hero-card:hover { border-color: var(--accent); }
.hero-card.selected { border-color: var(--accent); box-shadow: 0 0 12px rgba(232,166,36,.2); }
.hero-avatar {
  width: 56px;
  height: 56px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.hero-info { flex: 1; min-width: 0; }
.hero-name { font-weight: 700; font-size: 13px; }
.hero-class { font-size: 11px; color: var(--text-dim); }
.hero-stats { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; }
.hero-stats span { color: var(--text-dim); }
.hero-stats .stat-val { color: var(--text); font-weight: 600; }
.rarity-common { border-left: 3px solid #888; }
.rarity-rare { border-left: 3px solid #4488ee; }
.rarity-epic { border-left: 3px solid #aa44ee; }
.rarity-legendary { border-left: 3px solid #ee8800; }

/* BUILDING LIST ITEM */
.building-item {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .2s;
}
.building-item:hover { border-color: var(--accent); }
.building-ico {
  width: 48px; height: 48px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: var(--bg-dark);
  flex-shrink: 0;
}
.building-info { flex: 1; }
.building-name { font-weight: 700; font-size: 13px; }
.building-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.building-level { font-size: 11px; color: var(--accent); }
.building-constructing {
  border-color: var(--accent) !important;
  animation: pulse-border 2s infinite;
}
@keyframes pulse-border {
  0%, 100% { border-color: var(--accent); }
  50% { border-color: var(--border); }
}

/* COST ROW */
.cost-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 6px 0;
}
.cost-item {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg-dark);
}
.cost-item.affordable { color: var(--heal); }
.cost-item.expensive { color: var(--danger); }

/* QUEST ITEM */
.quest-item {
  padding: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.quest-title { font-weight: 700; font-size: 13px; }
.quest-desc { font-size: 12px; color: var(--text-dim); margin: 4px 0; }
.quest-reward {
  font-size: 11px;
  color: var(--accent);
  margin-top: 4px;
}

/* BATTLE SCENE */
#battle-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.92);
  z-index: 500;
  display: none;
  flex-direction: column;
}
#battle-overlay.active { display: flex; }
#battle-header {
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
#battle-header .wave-info { font-weight: 700; font-size: 15px; }
#battle-header .wave-type { font-size: 12px; color: var(--text-dim); }
#battle-arena {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#battle-canvas {
  width: 100%;
  height: 100%;
}
#battle-hud {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.85));
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.battle-hero-hud {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  text-align: center;
}
.battle-hero-hud .bh-name { font-size: 11px; font-weight: 700; }
.battle-hero-hud .bh-hp-bar {
  width: 100%;
  height: 6px;
  background: var(--bg-dark);
  border-radius: 3px;
  margin: 4px 0;
  overflow: hidden;
}
.battle-hero-hud .bh-hp-fill {
  height: 100%;
  background: var(--heal);
  border-radius: 3px;
  transition: width .3s;
}
.battle-hero-hud .bh-skill {
  margin-top: 4px;
}
.battle-hero-hud .bh-skill button {
  width: 100%;
  padding: 4px;
  font-size: 10px;
  background: var(--accent);
  color: #000;
  font-weight: 700;
}
.battle-hero-hud .bh-skill button:disabled {
  background: var(--border);
  color: var(--text-dim);
}
#battle-controls {
  padding: 8px 16px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: center;
}
#battle-controls button {
  padding: 8px 20px;
  font-weight: 700;
}

/* BATTLE RESULT */
#battle-result {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.9);
  z-index: 600;
  display: none;
  align-items: center;
  justify-content: center;
}
#battle-result.active { display: flex; }
.result-box {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  max-width: 400px;
  width: 90%;
}
.result-box h2 {
  font-size: 24px;
  margin-bottom: 6px;
}
.result-box .result-victory { color: var(--accent); }
.result-box .result-defeat { color: var(--danger); }
.result-stats {
  margin: 16px 0;
  text-align: left;
}
.result-stats .rs-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.result-rewards {
  margin: 12px 0;
  text-align: left;
}
.result-rewards h4 { color: var(--accent); margin-bottom: 6px; font-size: 13px; }
.result-rewards .rr-item {
  font-size: 12px;
  padding: 2px 0;
}

/* MODAL */
#modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.7);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
}
#modal-overlay.active { display: flex; }
.modal-box {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  max-width: 420px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-box h3 { margin-bottom: 12px; }

/* TOAST */
#toast-container {
  position: fixed;
  top: 50px;
  right: 12px;
  z-index: 800;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.toast {
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  animation: toast-in .3s, toast-out .3s 2.7s forwards;
  box-shadow: var(--shadow);
  max-width: 300px;
}
.toast-success { border-left: 3px solid var(--heal); }
.toast-warning { border-left: 3px solid var(--accent); }
.toast-danger { border-left: 3px solid var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(40px); } }

/* TABS */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 6px;
  background: var(--bg-dark);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
}
.tab-btn.active {
  background: var(--accent);
  color: #000;
}

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* MISC */
.text-accent { color: var(--accent); }
.text-dim { color: var(--text-dim); }
.text-danger { color: var(--danger); }
.text-heal { color: var(--heal); }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.text-center { text-align: center; }
.text-sm { font-size: 12px; }
.fw-700 { font-weight: 700; }
.gap-6 { gap: 6px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }

/* RESPONSIVE */
@media (max-width: 768px) {
  #side-panel { width: 100%; position: absolute; top: 0; bottom: 0; right: -100%; z-index: 200; transition: right .3s; }
  #side-panel.open { right: 0; }
}
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="res-group">
      <div class="res-item"><span class="ico">🍖</span><span class="val" id="res-food">0</span></div>
      <div class="res-item"><span class="ico">🪵</span><span class="val" id="res-wood">0</span></div>
      <div class="res-item"><span class="ico">⚙️</span><span class="val" id="res-metal">0</span></div>
      <div class="res-item"><span class="ico">⛽</span><span class="val" id="res-fuel">0</span></div>
      <div class="res-item"><span class="ico">💊</span><span class="val" id="res-meds">0</span></div>
      <div class="res-item"><span class="ico">💎</span><span class="val" id="res-gems">0</span></div>
    </div>
    <div class="info-group">
      <span id="hud-day">День 1</span>
      <span id="hud-time">06:00</span>
      <span id="hud-weather">☀️</span>
      <span id="hud-season">Весна</span>
      <span id="hud-pop">👤 0/10</span>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- BASE VIEW -->
    <div id="base-view">
      <canvas id="base-canvas"></canvas>
      <div id="camera-controls">
        <button onclick="Camera.zoomIn()" title="Приблизить">+</button>
        <button onclick="Camera.zoomOut()" title="Отдалить">−</button>
        <button onclick="Camera.reset()" title="Сбросить">⌂</button>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div id="side-panel">
      <div id="panel-header">
        <span id="panel-title">Меню</span>
        <button class="close-btn" onclick="Panel.close()">✕</button>
      </div>
      <div id="panel-content"></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bottombar">
    <button onclick="Nav.go('base')" id="nav-base"><span class="nav-ico">🏚️</span>База</button>
    <button onclick="Nav.go('build')" id="nav-build"><span class="nav-ico">🔨</span>Строить</button>
    <button onclick="Nav.go('heroes')" id="nav-heroes"><span class="nav-ico">👥</span>Выжившие</button>
    <button onclick="Nav.go('battle')" id="nav-battle"><span class="nav-ico">⚔️</span>Оборона</button>
    <button onclick="Nav.go('map')" id="nav-map"><span class="nav-ico">🗺️</span>Карта</button>
    <button onclick="Nav.go('quests')" id="nav-quests"><span class="nav-ico">📋</span>Задания</button>
    <button onclick="Nav.go('more')" id="nav-more"><span class="nav-ico">☰</span>Ещё</button>
  </div>
</div>

<!-- BATTLE OVERLAY -->
<div id="battle-overlay">
  <div id="battle-header">
    <div>
      <div class="wave-info" id="battle-wave-info">Волна 1</div>
      <div class="wave-type" id="battle-wave-type">Обычная</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="battle-kills" style="font-size:13px;">☠️ 0</span>
      <span id="battle-timer" style="font-size:13px;color:var(--text-dim);">00:00</span>
    </div>
  </div>
  <div id="battle-arena">
    <canvas id="battle-canvas"></canvas>
    <div id="battle-hud"></div>
  </div>
  <div id="battle-controls">
    <button class="btn-secondary" onclick="BattleScene.toggleSpeed()" id="btn-speed">⏩ x1</button>
    <button class="btn-danger" onclick="BattleScene.retreat()">🏃 Отступить</button>
  </div>
</div>

<!-- BATTLE RESULT -->
<div id="battle-result">
  <div class="result-box" id="result-box"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="Modal.close()">
  <div class="modal-box" id="modal-box" onclick="event.stopPropagation()"></div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<script>
/* ================================================================
   THE LAST PORT v4.2 — SIEGE UPDATE
   Complete Survival Strategy Game
   ================================================================ */

// ======================== CONFIG: RESOURCES ========================
const RES_NAMES = {
  food: '🍖 Еда', wood: '🪵 Дерево', metal: '⚙️ Металл',
  fuel: '⛽ Топливо', meds: '💊 Медикаменты', gems: '💎 Кристаллы'
};

// ======================== CONFIG: BUILDINGS ========================
const BUILDINGS = {
  hq: {
    name: 'Штаб', icon: '🏛️', desc: 'Центр управления. Открывает новые здания.',
    maxLevel: 15,
    costs: lvl => ({ wood: 80*lvl, metal: 50*lvl, food: 40*lvl }),
    time: lvl => 30 + lvl * 60,
    effect: lvl => `Открывает здания до ур.${lvl}`,
    production: null
  },
  farm: {
    name: 'Ферма', icon: '🌾', desc: 'Производит еду для выживших.',
    maxLevel: 15,
    costs: lvl => ({ wood: 40*lvl, metal: 10*lvl }),
    time: lvl => 15 + lvl * 30,
    effect: lvl => `+${5 + lvl*3} еды/мин`,
    production: { res: 'food', base: 5, perLvl: 3 }
  },
  sawmill: {
    name: 'Лесопилка', icon: '🪓', desc: 'Добывает древесину.',
    maxLevel: 15,
    costs: lvl => ({ food: 30*lvl, metal: 15*lvl }),
    time: lvl => 15 + lvl * 30,
    effect: lvl => `+${4 + lvl*3} дерева/мин`,
    production: { res: 'wood', base: 4, perLvl: 3 }
  },
  workshop: {

function getDefaultState() {
  return {
    version: SAVE_VERSION,
    resources: { food: 200, wood: 200, metal: 100, fuel: 30, meds: 20, gems: 5 },
    buildings: { hq: 1 },

    weather: 'clear',
    stats: { wavesCleared: 0, zombiesKilled: 0, bossesKilled: 0, expeditions: 0, totalXP: 0, playTime: 0 },
    completedQuests: [],
    currentChapter: 1,
    lastDailyDate: null,
    dailyStreak: 0,
    discoveredLocations: ['loc1'],
    activeExpedition: null, // { locationId, startTime, duration, squad }
    lastSaveTime: Date.now(),
    wallHP: 100,
    maxWallHP: 100,
    morale: 50,
    playerLevel: 1,
    playerXP: 0,
    researchPoints: 0,
  };
}

function createHeroState(templateId, level) {
  const t = HERO_TEMPLATES.find(h => h.id === templateId);
  if (!t) return null;
  return {
    id: t.id,
    level: level || 1,
    xp: 0,
    hp: t.baseHP,
    maxHP: t.baseHP,
    wounded: false,
    woundHealTime: 0,
    equipped: null,
    skillCooldown: 0,
  };
}

function saveGame() {
  State.lastSaveTime = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(State));
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return getDefaultState();
    const data = JSON.parse(raw);
    // Version migration
    const def = getDefaultState();
    for (const key in def) {
      if (!(key in data)) data[key] = def[key];
    }
    if (!data.stats.bossesKilled) data.stats.bossesKilled = 0;
    if (!data.stats.expeditions) data.stats.expeditions = 0;
    if (!data.constructionQueue) data.constructionQueue = [];
    if (!data.discoveredLocations) data.discoveredLocations = ['loc1'];
    if (!data.activeExpedition) data.activeExpedition = null;
    data.version = SAVE_VERSION;
    return data;
  } catch(e) {
    console.error('Save corrupted, resetting:', e);
    return getDefaultState();
  }
}

// ======================== UTILITY ========================
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+'K' : Math.floor(n).toString(); }
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function canAfford(costs) {
  for (const r in costs) {
    if ((State.resources[r]||0) < costs[r]) return false;
  }
  return true;
}
function spendResources(costs) {
  for (const r in costs) State.resources[r] = (State.resources[r]||0) - costs[r];
}
function addResources(rewards) {
  const lim = getStorageLimit();
  for (const r in rewards) {
    if (r === 'xp') { addXP(rewards[r]); continue; }
    if (r === 'unlockHero') { unlockHero(rewards[r]); continue; }
    if (r === 'gems') { State.resources.gems = (State.resources.gems||0) + rewards[r]; continue; }
    State.resources[r] = Math.min((State.resources[r]||0) + rewards[r], lim);
  }
}
function getStorageLimit() {
  return 500 + (State.buildings.warehouse||0) * 200;
}
function addXP(amount) {
  State.playerXP += amount;
  State.stats.totalXP += amount;
  const needed = State.playerLevel * 100;
  while (State.playerXP >= needed) {
    State.playerXP -= needed;
    State.playerLevel++;
    toast(`Уровень ${State.playerLevel}!`, 'success');
  }
}
function unlockHero(heroId) {
  if (State.heroes.find(h => h.id === heroId)) return;
  const h = createHeroState(heroId, 1);
  if (h) {
    State.heroes.push(h);
    const t = HERO_TEMPLATES.find(x => x.id === heroId);
    toast(`Новый выживший: ${t.name}!`, 'success');
  }
}
function getHeroTemplate(id) { return HERO_TEMPLATES.find(h => h.id === id); }
function getHeroState(id) { return State.heroes.find(h => h.id === id); }

function getHeroEffectiveStats(heroState) {
  const t = getHeroTemplate(heroState.id);
  const lvl = heroState.level;
  return {
    hp: t.baseHP + (lvl-1) * 20,
    atk: t.baseATK + (lvl-1) * 4,
    def: t.baseDEF + (lvl-1) * 3,
  };
}

// ======================== CAMERA ========================
const Camera = {
  x: 0, y: 0, zoom: 1, minZoom: 0.5, maxZoom: 2.5,
  dragging: false, dragStartX: 0, dragStartY: 0, camStartX: 0, camStartY: 0,

  init() {
    const cvs = document.getElementById('base-canvas');
    cvs.addEventListener('mousedown', e => { this.dragging=true; this.dragStartX=e.clientX; this.dragStartY=e.clientY; this.camStartX=this.x; this.camStartY=this.y; });
    cvs.addEventListener('mousemove', e => { if (!this.dragging) return; this.x = this.camStartX + (e.clientX - this.dragStartX); this.y = this.camStartY + (e.clientY - this.dragStartY); });
    cvs.addEventListener('mouseup', () => this.dragging=false);
    cvs.addEventListener('mouseleave', () => this.dragging=false);
    cvs.addEventListener('wheel', e => { e.preventDefault(); if (e.deltaY < 0) this.zoomIn(); else this.zoomOut(); }, { passive: false });
    // Touch
    cvs.addEventListener('touchstart', e => { if (e.touches.length===1) { this.dragging=true; this.dragStartX=e.touches[0].clientX; this.dragStartY=e.touches[0].clientY; this.camStartX=this.x; this.camStartY=this.y; }});
    cvs.addEventListener('touchmove', e => { if (!this.dragging||e.touches.length!==1) return; e.preventDefault(); this.x=this.camStartX+(e.touches[0].clientX-this.dragStartX); this.y=this.camStartY+(e.touches[0].clientY-this.dragStartY); }, { passive: false });
    cvs.addEventListener('touchend', () => this.dragging=false);
  },
  zoomIn() { this.zoom = Math.min(this.maxZoom, this.zoom + 0.2); },
  zoomOut() { this.zoom = Math.max(this.minZoom, this.zoom - 0.2); },
  reset() { this.x = 0; this.y = 0; this.zoom = 1; }
};

// ======================== BASE RENDERER ========================
const BaseRenderer = {
  canvas: null, ctx: null,
  tileW: 80, tileH: 40,

  init() {
    this.canvas = document.getElementById('base-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * devicePixelRatio;
    this.canvas.height = rect.height * devicePixelRatio;
    this.canvas.style.width = rect.width + 'px';
    this.canvas.style.height = rect.height + 'px';
    this.ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  },

  render() {
    const ctx = this.ctx;
    const w = this.canvas.width / devicePixelRatio;
    const h = this.canvas.height / devicePixelRatio;
    ctx.clearRect(0, 0, w, h);

    // Sky gradient based on hour
    const hour = State.hour;
    let skyTop, skyBot;
    if (hour >= 6 && hour < 18) {
      skyTop = '#1a2a3a'; skyBot = '#2a3a4a';
    } else if (hour >= 18 && hour < 21) {
      skyTop = '#1a1520'; skyBot = '#2a2030';
    } else {
      skyTop = '#0a0810'; skyBot = '#151020';
    }
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, skyTop);
    grad.addColorStop(1, skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(w/2 + Camera.x, h * 0.3 + Camera.y);
    ctx.scale(Camera.zoom, Camera.zoom);

    // Draw ground grid
    const gridSize = 8;
    for (let gy = -gridSize; gy < gridSize; gy++) {
      for (let gx = -gridSize; gx < gridSize; gx++) {
        const sx = (gx - gy) * this.tileW / 2;
        const sy = (gx + gy) * this.tileH / 2;
        this.drawTile(ctx, sx, sy, '#1a2518', '#2a3528');
      }
    }

    // Place buildings
    const placements = this.getBuildingPlacements();
    for (const p of placements) {
      const sx = (p.gx - p.gy) * this.tileW / 2;
      const sy = (p.gx + p.gy) * this.tileH / 2;
      this.drawBuilding(ctx, sx, sy, p);
    }

    ctx.restore();

    // HUD overlay on canvas
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#556';
    ctx.fillText(`Zoom: ${(Camera.zoom*100).toFixed(0)}%`, 10, h - 10);
  },

  drawTile(ctx, x, y, fill, stroke) {
    const tw = this.tileW, th = this.tileH;
    ctx.beginPath();
    ctx.moveTo(x, y - th/2);
    ctx.lineTo(x + tw/2, y);
    ctx.lineTo(x, y + th/2);
    ctx.lineTo(x - tw/2, y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  },

  drawBuilding(ctx, x, y, placement) {
    const tw = this.tileW, th = this.tileH;
    const buildingConf = BUILDINGS[placement.id];
    const level = State.buildings[placement.id] || 0;
    const isConstructing = State.constructionQueue.some(q => q.buildingId === placement.id);

    // Building base tile
    ctx.beginPath();
    ctx.moveTo(x, y - th/2);
    ctx.lineTo(x + tw/2, y);
    ctx.lineTo(x, y + th/2);
    ctx.lineTo(x - tw/2, y);
    ctx.closePath();
    ctx.fillStyle = isConstructing ? '#3a3520' : (level > 0 ? '#2a3028' : '#1a1a18');
    ctx.fill();
    ctx.strokeStyle = isConstructing ? '#e8a624' : (level > 0 ? '#4a5a48' : '#333');
    ctx.lineWidth = isConstructing ? 2 : 1;
    ctx.stroke();

    if (level > 0 || isConstructing) {
      // Building body (isometric box)
      const bh = 20 + level * 3;
      ctx.beginPath();
      ctx.moveTo(x - tw/2, y);
      ctx.lineTo(x - tw/2, y - bh);
      ctx.lineTo(x, y - bh - th/2);
      ctx.lineTo(x, y - th/2);
      ctx.closePath();
      ctx.fillStyle = isConstructing ? '#4a4020' : '#3a4538';
      ctx.fill();
      ctx.strokeStyle = '#5a6a58';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + tw/2, y);
      ctx.lineTo(x + tw/2, y - bh);
      ctx.lineTo(x, y - bh - th/2);
      ctx.lineTo(x, y - th/2);
      ctx.closePath();
      ctx.fillStyle = isConstructing ? '#3a3018' : '#2a3528';
      ctx.fill();
      ctx.stroke();

      // Roof
      ctx.beginPath();
      ctx.moveTo(x, y - bh - th/2);
      ctx.lineTo(x + tw/2, y - bh);
      ctx.lineTo(x, y - bh + th/2);
      ctx.lineTo(x - tw/2, y - bh);
      ctx.closePath();
      ctx.fillStyle = isConstructing ? '#e8a624' : '#5a6a58';
      ctx.fill();

      // Icon
      ctx.font = '18px serif';
      ctx.textAlign = 'center';
      ctx.fillText(buildingConf.icon, x, y - bh - th/2 - 4);

      // Level badge
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(`Lv.${level}`, x, y + th/2 + 12);

      // Construction timer
      if (isConstructing) {
        const q = State.constructionQueue.find(q => q.buildingId === placement.id);
        if (q) {
          const remaining = Math.max(0, (q.startTime + q.duration * 1000) - Date.now());
          const text = remaining > 0 ? fmtTime(remaining / 1000) : 'Готово!';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#e8a624';
          ctx.fillText(`⏳ ${text}`, x, y - bh - th/2 - 20);
        }
      }

      // Production indicator
      if (buildingConf.production && level > 0 && !isConstructing) {
        const rate = buildingConf.production.base + level * buildingConf.production.perLvl;
        ctx.font = '9px sans-serif';
        ctx.fillStyle = '#8c8';
        ctx.fillText(`+${rate}/m`, x, y + th/2 + 22);
      }
    }
    ctx.textAlign = 'start';
  },

  getBuildingPlacements() {
    const positions = [
      { id: 'hq', gx: 0, gy: 0 },
      { id: 'farm', gx: -2, gy: 0 },
      { id: 'sawmill', gx: 0, gy: -2 },
      { id: 'workshop', gx: 2, gy: 0 },
      { id: 'generator', gx: 0, gy: 2 },
      { id: 'hospital', gx: -2, gy: -2 },
      { id: 'barracks', gx: 2, gy: -2 },
      { id: 'watchtower', gx: 2, gy: 2 },
      { id: 'wall', gx: -2, gy: 2 },
      { id: 'warehouse', gx: -3, gy: 1 },
      { id: 'lab', gx: 3, gy: -1 },
      { id: 'kitchen', gx: -1, gy: -3 },
    ];
    return positions;
  }
};

// ======================== PANEL SYSTEM ========================
const Panel = {
  currentTab: 'base',

  close() {
    const sp = document.getElementById('side-panel');
    if (window.innerWidth <= 768) sp.classList.remove('open');
  },

  show(title, html) {
    document.getElementById('panel-title').textContent = title;
    document.getElementById('panel-content').innerHTML = html;
    if (window.innerWidth <= 768) {
      document.getElementById('side-panel').classList.add('open');
    }
  }
};

// ======================== NAVIGATION ========================
const Nav = {
  current: 'base',

  go(tab) {
    this.current = tab;
    document.querySelectorAll('#bottombar button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + tab);
    if (btn) btn.classList.add('active');

    switch(tab) {
      case 'base': this.showBase(); break;
      case 'build': this.showBuild(); break;
      case 'heroes': this.showHeroes(); break;
      case 'battle': this.showBattle(); break;
      case 'map': this.showMap(); break;
      case 'quests': this.showQuests(); break;
      case 'more': this.showMore(); break;
    }
  },

  showBase() {
    let constructionHtml = '';
    if (State.constructionQueue.length > 0) {
      constructionHtml = '<div class="card"><div class="card-title">🔨 Строительство</div>';
      for (const q of State.constructionQueue) {
        const b = BUILDINGS[q.buildingId];
        const remaining = Math.max(0, (q.startTime + q.duration * 1000) - Date.now());
        const pct = 100 - (remaining / (q.duration * 1000)) * 100;
        constructionHtml += `
          <div class="card-row"><span>${b.icon} ${b.name} → Ур.${q.targetLevel}</span><span>${remaining > 0 ? fmtTime(remaining/1000) : '✅ Готово!'}</span></div>
          <div class="progress-bar"><div class="fill fill-accent" style="width:${pct}%"></div></div>
        `;
        if (remaining <= 0) {
          constructionHtml += `<button class="btn-primary btn-small mt-8" onclick="Construction.complete('${q.buildingId}')">Завершить</button>`;
        } else {
          constructionHtml += `<button class="btn-danger btn-small mt-8" onclick="Construction.cancel('${q.buildingId}')">Отменить</button>`;
        }
      }
      constructionHtml += '</div>';
    }

    const wallPct = State.maxWallHP > 0 ? (State.wallHP / State.maxWallHP * 100) : 0;
    const storeLim = getStorageLimit();

    let html = `
      <div class="card">
        <div class="card-title">🏛️ Штаб — Уровень ${State.buildings.hq||1}</div>
        <div class="card-row"><span class="label">Уровень игрока</span><span>${State.playerLevel} (${State.playerXP}/${State.playerLevel*100} XP)</span></div>
        <div class="card-row"><span class="label">День</span><span>${State.day}</span></div>
        <div class="card-row"><span class="label">Мораль</span><span>${State.morale}%</span></div>
        <div class="card-row"><span class="label">Лимит ресурсов</span><span>${storeLim}</span></div>
        <div class="card-row"><span class="label">Выжившие</span><span>${State.heroes.length}</span></div>
      </div>
      <div class="card">
        <div class="card-title">🧱 Стена</div>
        <div class="card-row"><span class="label">Прочность</span><span>${State.wallHP}/${State.maxWallHP}</span></div>
        <div class="progress-bar"><div class="fill ${wallPct > 50 ? 'fill-heal' : 'fill-danger'}" style="width:${wallPct}%"></div></div>
        <button class="btn-secondary btn-small mt-8" onclick="Actions.repairWall()" ${State.resources.wood >= 10 && State.wallHP < State.maxWallHP ? '' : 'disabled'}>🔧 Починить (10 🪵)</button>
      </div>
      ${constructionHtml}
      <div class="card">
        <div class="card-title">📊 Статистика</div>
        <div class="card-row"><span class="label">Волн отражено</span><span>${State.stats.wavesCleared}</span></div>
        <div class="card-row"><span class="label">Зомби убито</span><span>${State.stats.zombiesKilled}</span></div>
        <div class="card-row"><span class="label">Боссов убито</span><span>${State.stats.bossesKilled}</span></div>
        <div class="card-row"><span class="label">Экспедиций</span><span>${State.stats.expeditions}</span></div>
      </div>
    `;
    Panel.show('🏚️ База', html);
  },

  showBuild() {
    const hqLevel = State.buildings.hq || 1;
    let html = '<div class="tab-row">';
    html += '<button class="tab-btn active" onclick="Nav.showBuild()">Все здания</button>';
    html += '</div>';

    for (const id in BUILDINGS) {
      const b = BUILDINGS[id];
      const currentLevel = State.buildings[id] || 0;
      const nextLevel = currentLevel + 1;
      const isMaxed = currentLevel >= b.maxLevel;
      const isConstructing = State.constructionQueue.some(q => q.buildingId === id);
      const reqHQ = b.reqHQ || 0;
      const locked = reqHQ > hqLevel;

      let statusText = '';
      if (locked) statusText = `🔒 Нужен Штаб ур.${reqHQ}`;
      else if (isMaxed) statusText = '✅ Максимум';
      else if (isConstructing) statusText = '🔨 Строится...';
      else statusText = `Уровень ${currentLevel}`;

      const costs = !isMaxed && !locked ? b.costs(nextLevel) : {};
      const affordable = canAfford(costs);
      const canBuild = !isMaxed && !locked && !isConstructing && affordable && State.constructionQueue.length < 1;

      let costHtml = '';
      if (!isMaxed && !locked) {
        costHtml = '<div class="cost-row">';
        for (const r in costs) {
          const has = (State.resources[r]||0) >= costs[r];
          costHtml += `<span class="cost-item ${has ? 'affordable' : 'expensive'}">${RES_NAMES[r]?.split(' ')[0]||r} ${costs[r]}</span>`;
        }
        costHtml += `<span class="cost-item">⏱️ ${fmtTime(b.time(nextLevel))}</span>`;
        costHtml += '</div>';
      }

      html += `
        <div class="building-item ${isConstructing ? 'building-constructing' : ''}">
          <div class="building-ico">${b.icon}</div>
          <div class="building-info">
            <div class="building-name">${b.name}</div>
            <div class="building-desc">${b.desc}</div>
            <div class="building-level">${statusText}</div>
            ${!isMaxed && !locked ? `<div class="text-sm text-dim mt-8">${b.effect(nextLevel)}</div>` : ''}
            ${costHtml}
            ${canBuild ? `<button class="btn-primary btn-small mt-8" onclick="Construction.start('${id}')">Строить → Ур.${nextLevel}</button>` :
              (!isMaxed && !locked && !isConstructing && State.constructionQueue.length >= 1 ? '<div class="text-sm text-danger mt-8">Строитель занят</div>' : '')}
          </div>
        </div>
      `;
    }
    Panel.show('🔨 Строительство', html);
  },

  showHeroes() {
    let html = '';
    for (const hs of State.heroes) {
      const t = getHeroTemplate(hs.id);
      if (!t) continue;
      const stats = getHeroEffectiveStats(hs);
      const inSquad = State.squad.includes(hs.id);
      const xpNeeded = hs.level * 50;

      html += `
        <div class="hero-card rarity-${t.rarity}" onclick="Nav.showHeroDetail('${hs.id}')">
          <div class="hero-avatar" style="background:${t.avatarBG}">${t.icon}</div>
          <div class="hero-info">
            <div class="hero-name">${t.name} ${hs.wounded ? '🩹' : ''}</div>
            <div class="hero-class">${t.className} · Ур.${hs.level} · ${t.rarity}</div>
            <div class="hero-stats">
              <span>❤️ <span class="stat-val">${stats.hp}</span></span>
              <span>⚔️ <span class="stat-val">${stats.atk}</span></span>
              <span>🛡️ <span class="stat-val">${stats.def}</span></span>
            </div>
            <div class="progress-bar" style="margin-top:4px"><div class="fill fill-accent" style="width:${(hs.xp/xpNeeded)*100}%"></div></div>
            <div style="display:flex;gap:6px;margin-top:6px">
              <button class="btn-small ${inSquad ? 'btn-danger' : 'btn-secondary'}" onclick="event.stopPropagation(); Actions.toggleSquad('${hs.id}')">
                ${inSquad ? '➖ Убрать' : '➕ В отряд'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    const squadNames = State.squad.map(id => {
      const t = getHeroTemplate(id);
      return t ? t.icon + ' ' + t.name : id;
    }).join(', ');
    html = `
      <div class="card">
        <div class="card-title">🎯 Текущий отряд</div>
        <div class="text-sm text-dim">${squadNames || 'Пусто'}</div>
      </div>
    ` + html;

    Panel.show('👥 Выжившие', html);
  },

  showHeroDetail(heroId) {
    const hs = getHeroState(heroId);
    const t = getHeroTemplate(heroId);
    if (!hs || !t) return;
    const stats = getHeroEffectiveStats(hs);
    const xpNeeded = hs.level * 50;

    Modal.show(`
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px;margin-bottom:8px">${t.icon}</div>
        <h3>${t.name}</h3>
        <div class="text-dim text-sm">${t.className} · ${t.rarity} · Уровень ${hs.level}</div>
      </div>
      <div class="text-sm text-dim mb-8">${t.desc}</div>
      <div class="card">
        <div class="card-row"><span class="label">❤️ HP</span><span>${stats.hp}</span></div>
        <div class="card-row"><span class="label">⚔️ Атака</span><span>${stats.atk}</span></div>
        <div class="card-row"><span class="label">🛡️ Защита</span><span>${stats.def}</span></div>
        <div class="card-row"><span class="label">📊 Опыт</span><span>${hs.xp}/${xpNeeded}</span></div>
        <div class="progress-bar"><div class="fill fill-accent" style="width:${(hs.xp/xpNeeded)*100}%"></div></div>
      </div>
      <div class="card">
        <div class="card-title">⚡ ${t.skill.name}</div>
        <div class="text-sm text-dim">${t.skill.desc}</div>
        <div class="card-row"><span class="label">Перезарядка</span><span>${t.skill.cooldown} сек</span></div>
      </div>
      ${hs.wounded ? `<div class="card"><div class="text-danger text-sm">🩹 Ранен — лечится в Госпитале</div></div>` : ''}
      <button class="btn-primary mt-12" onclick="Modal.close()">Закрыть</button>
    `);
  },

  showBattle() {
    const waveNum = State.stats.wavesCleared + 1;
    const waveMod = getWaveModifier(waveNum);
    const squadReady = State.squad.length > 0 && !State.squad.some(id => {
      const hs = getHeroState(id);
      return hs && hs.wounded;
    });

    let html = `
      <div class="card">
        <div class="card-title">⚔️ Оборона базы</div>
        <div class="card-row"><span class="label">Следующая волна</span><span class="text-accent">#${waveNum}</span></div>
        <div class="card-row"><span class="label">Модификатор</span><span style="color:${waveMod.color}">${waveMod.name}</span></div>
        ${waveMod.effect ? `<div class="card-row"><span class="label">Эффект</span><span class="text-dim">${waveMod.effect}</span></div>` : ''}
        <div class="card-row"><span class="label">Стена</span><span>${State.wallHP}/${State.maxWallHP}</span></div>
      </div>
      <div class="card">
        <div class="card-title">🎯 Отряд обороны</div>
    `;
    if (State.squad.length === 0) {
      html += '<div class="text-sm text-dim">Назначьте выживших в отряд во вкладке Выжившие</div>';
    } else {
      for (const id of State.squad) {
        const hs = getHeroState(id);
        const t = getHeroTemplate(id);
        if (!hs || !t) continue;
        const stats = getHeroEffectiveStats(hs);
        html += `<div class="card-row"><span>${t.icon} ${t.name} ${hs.wounded ? '🩹' : ''}</span><span>ATK ${stats.atk} · DEF ${stats.def}</span></div>`;
      }
    }
    html += `</div>
      <button class="btn-primary mt-12" onclick="BattleScene.start()" ${squadReady ? '' : 'disabled'}>
        ${squadReady ? '⚔️ Начать оборону' : (State.squad.length === 0 ? 'Назначьте отряд' : '🩹 Есть раненые')}
      </button>
    `;
    Panel.show('⚔️ Оборона', html);
  },

  showMap() {
    let html = `
      <div class="card">
        <div class="card-title">🗺️ Карта региона</div>
        <div class="text-sm text-dim mb-8">Отправляйте отряды на разведку и сбор ресурсов.</div>
      </div>
    `;

    // Active expedition
    if (State.activeExpedition) {
      const loc = MAP_LOCATIONS.find(l => l.id === State.activeExpedition.locationId);
      const remaining = Math.max(0, (State.activeExpedition.startTime + State.activeExpedition.duration * 1000) - Date.now());
      const pct = 100 - (remaining / (State.activeExpedition.duration * 1000)) * 100;
      html += `
        <div class="card">
          <div class="card-title">🚶 Активная экспедиция</div>
          <div class="card-row"><span>${loc.icon} ${loc.name}</span></div>
          <div class="progress-bar"><div class="fill fill-accent" style="width:${pct}%"></div></div>
          <div class="card-row"><span class="label">Осталось</span><span>${remaining > 0 ? fmtTime(remaining/1000) : '✅ Готово!'}</span></div>
          ${remaining <= 0 ? `<button class="btn-primary btn-small mt-8" onclick="Expeditions.complete()">Забрать добычу</button>` : ''}
        </div>
      `;
    }

    for (const loc of MAP_LOCATIONS) {
      const discovered = State.discoveredLocations.includes(loc.id);
      const hasActiveExp = State.activeExpedition !== null;
      const fuelCost = loc.distance * 3;
      const canGo = discovered && !hasActiveExp && (State.resources.fuel || 0) >= fuelCost && State.squad.length > 0;

      let lootText = Object.entries(loc.loot).map(([r, v]) => `${RES_NAMES[r]?.split(' ')[0]||r} ${v}`).join(', ');

      html += `
        <div class="building-item" style="${!discovered ? 'opacity:0.4' : ''}">
          <div class="building-ico">${discovered ? loc.icon : '❓'}</div>
          <div class="building-info">
            <div class="building-name">${discovered ? loc.name : '???'}</div>
            <div class="building-desc">${discovered ? `Расстояние: ${loc.distance} · Сложность: ${'⭐'.repeat(loc.difficulty)}` : 'Не обнаружено'}</div>
            ${discovered ? `<div class="text-sm text-dim mt-8">Добыча: ${lootText} · +${loc.xp} XP</div>` : ''}
            ${discovered ? `<div class="cost-row"><span class="cost-item ${(State.resources.fuel||0)>=fuelCost?'affordable':'expensive'}">⛽ ${fuelCost}</span><span class="cost-item">⏱️ ${fmtTime(loc.distance * 20)}</span></div>` : ''}
            ${canGo ? `<button class="btn-primary btn-small mt-8" onclick="Expeditions.send('${loc.id}')">🚶 Отправить отряд</button>` : ''}
            ${!discovered ? `<button class="btn-secondary btn-small mt-8" onclick="Expeditions.discover('${loc.id}')" ${(State.resources.fuel||0)>=5 ? '' : 'disabled'}>🔍 Разведать (5 ⛽)</button>` : ''}
          </div>
        </div>
      `;
    }
    Panel.show('🗺️ Карта', html);
  },

  showQuests() {
    let html = '';

    // Daily reward
    const today = new Date().toDateString();
    const canClaimDaily = State.lastDailyDate !== today;
    if (canClaimDaily) {
      const dayIndex = State.dailyStreak % 7;
      const reward = DAILY_REWARDS[dayIndex];
      const rewardText = Object.entries(reward).map(([r,v]) => `${RES_NAMES[r]?.split(' ')[0]||r} ${v}`).join(', ');
      html += `
        <div class="card" style="border-color:var(--accent)">
          <div class="card-title">🎁 Ежедневная награда (День ${State.dailyStreak + 1})</div>
          <div class="text-sm text-dim mb-8">${rewardText}</div>
          <button class="btn-primary" onclick="Actions.claimDaily()">Забрать!</button>
        </div>
      `;
    }

    // Chapters
    for (const ch of CHAPTERS) {
      if (ch.reqChapter && !CHAPTERS.find(c => c.id === ch.reqChapter)?.quests.every(q => State.completedQuests.includes(q.id))) {
        html += `
          <div class="card" style="opacity:.4">
            <div class="card-title">🔒 ${ch.title}</div>
            <div class="text-sm text-dim">Завершите предыдущую главу</div>
          </div>
        `;
        continue;
      }

      html += `<div class="card"><div class="card-title">📖 ${ch.title}</div>`;
      for (const q of ch.quests) {
        const done = State.completedQuests.includes(q.id);
        const complete = !done && q.check(State);
        const rewardText = Object.entries(q.reward)
          .filter(([k]) => k !== 'unlockHero')
          .map(([r,v]) => `${RES_NAMES[r]?.split(' ')[0]||r||'XP'} ${v}`).join(', ');
        const heroReward = q.reward.unlockHero ? ` + 🆕 ${getHeroTemplate(q.reward.unlockHero)?.name || ''}` : '';

        html += `
          <div class="quest-item" style="${done ? 'opacity:.5' : ''}">
            <div class="quest-title">${done ? '✅' : (complete ? '⭐' : '⬜')} ${q.text}</div>
            <div class="quest-reward">🎁 ${rewardText}${heroReward}</div>
            ${complete ? `<button class="btn-primary btn-small mt-8" onclick="Actions.claimQuest('${q.id}')">Получить награду</button>` : ''}
          </div>
        `;
      }
      html += '</div>';
    }

    Panel.show('📋 Задания', html);
  },

  showMore() {
    let html = `
      <div class="card">
        <div class="card-title">⚙️ Настройки</div>
        <button class="btn-secondary mb-8" onclick="saveGame(); toast('Сохранено!','success')" style="width:100%">💾 Сохранить</button>
        <button class="btn-danger" onclick="Actions.resetGame()" style="width:100%">🗑️ Сбросить прогресс</button>
      </div>
      <div class="card">
        <div class="card-title">ℹ️ The Last Port v4.2</div>
        <div class="text-sm text-dim">Siege Update</div>
        <div class="text-sm text-dim mt-8">Survival Strategy Game</div>
        <div class="text-sm text-dim mt-8">Сохранение: ${SAVE_VERSION}</div>
      </div>
    `;
    Panel.show('☰ Ещё', html);
