<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121517">
<title>The Last Port - Survivors</title>
<style>
:root {
  color-scheme: dark;
  --text: #f3f4f6;
  --muted: #9ca3af;
  --gold: #f59e0b;
  --red: #ef4444;
  --green: #22c55e;
  --blue: #3b82f6;
  --purple: #a855f7;
  --bg-main: #0c0e10;
  --bg-card: #161a1e;
  --bg-dark: #0a0c0e;
  --border: #2d353e;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body, html {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  user-select: none;
}

button {
  font: inherit; cursor: pointer; border: none; outline: 0;
  transition: transform .1s, opacity .2s;
}
button:active { transform: scale(.95); }
button:disabled { opacity: .4; pointer-events: none; }

canvas { display: block; }

/* ─── MAIN LAYOUT ─── */
#app {
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

/* ─── TOP BAR ─── */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px;
  background: linear-gradient(180deg, rgba(10,12,14,.98), rgba(10,12,14,.85));
  border-bottom: 1px solid var(--border);
  z-index: 100;
  flex-shrink: 0;
}

.player-info {
  display: flex; align-items: center; gap: 8px;
}

.player-avatar {
  width: 40px; height: 40px;
  border-radius: 8px;
  background: linear-gradient(135deg, #b45309, #92400e);
  display: grid; place-items: center;
  font-size: 22px;
  border: 2px solid var(--gold);
  box-shadow: 0 0 10px rgba(245,158,11,.3);
}

.player-meta {
  display: flex; flex-direction: column;
}

.player-name {
  font-size: 13px; font-weight: 800; color: #fff;
}

.player-level {
  font-size: 10px; color: var(--gold); font-weight: 700;
}

.player-xp-bar {
  width: 80px; height: 4px;
  background: #1c2128; border-radius: 3px;
  overflow: hidden; margin-top: 2px;
}

.player-xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), #fbbf24);
  transition: width .3s;
}

.resources-bar {
  display: flex; gap: 4px; align-items: center;
}

.res-pill {
  display: flex; align-items: center; gap: 3px;
  background: rgba(20,24,30,.9);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px; font-weight: 700;
}

.res-pill.food { color: #f87171; border-color: rgba(248,113,113,.25); }
.res-pill.wood { color: #a3e635; border-color: rgba(163,230,53,.25); }
.res-pill.metal { color: #93c5fd; border-color: rgba(147,197,253,.25); }
.res-pill.gems { color: #c084fc; border-color: rgba(192,132,252,.25); }

.res-pill .res-icon { font-size: 13px; }

/* ─── QUEST BANNER ─── */
.quest-banner {
  display: flex; align-items: center; gap: 8px;
  margin: 0 10px; padding: 8px 12px;
  background: linear-gradient(90deg, rgba(245,158,11,.12), rgba(245,158,11,.03));
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  cursor: pointer;
  flex-shrink: 0;
}

.quest-banner-icon { font-size: 20px; }
.quest-banner-text { flex: 1; }
.quest-banner-text small { font-size: 9px; color: var(--gold); font-weight: 700; text-transform: uppercase; display: block; }
.quest-banner-text strong { font-size: 12px; color: #fff; }
.quest-banner-arrow { color: var(--muted); font-size: 14px; }

/* ─── MAP / SCENE ─── */
.scene-container {
  flex: 1; position: relative; overflow: hidden;
  background: #0d1117;
}

#map-canvas {
  width: 100%; height: 100%;
  touch-action: none;
}

/* Map building tooltips */
.building-tooltip {
  position: absolute;
  background: rgba(12,14,18,.96);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 10px 14px;
  pointer-events: auto;
  z-index: 50;
  min-width: 180px;
  box-shadow: 0 8px 30px rgba(0,0,0,.8);
  backdrop-filter: blur(8px);
  display: none;
}

.building-tooltip.show { display: block; }

.building-tooltip h4 {
  font-size: 13px; color: #fff; margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}

.building-tooltip p {
  font-size: 10px; color: var(--muted); margin-bottom: 8px; line-height: 1.4;
}

.building-tooltip .bt-stats {
  display: flex; gap: 8px; margin-bottom: 8px;
}

.building-tooltip .bt-stat {
  font-size: 10px; color: #d1d5db;
  background: rgba(255,255,255,.06);
  padding: 3px 6px; border-radius: 4px;
}

.bt-actions {
  display: flex; gap: 6px;
}

.bt-actions button {
  flex: 1; padding: 7px; border-radius: 6px;
  font-size: 11px; font-weight: 700; color: #fff;
}

.btn-upgrade {
  background: linear-gradient(180deg, #d97706, #b45309);
}

.btn-info {
  background: rgba(255,255,255,.1);
}

/* Scene overlay buttons */
.scene-controls {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 6px;
  z-index: 20;
}

.scene-controls button {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: rgba(16,20,24,.9);
  border: 1px solid var(--border);
  color: #fff; font-size: 16px;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 10px rgba(0,0,0,.5);
}

/* ─── BOTTOM PANEL ─── */
.bottom-panel {
  background: rgba(12,14,18,.98);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);
  display: flex; flex-direction: column;
  height: 44dvh;
  transition: height .3s ease;
  z-index: 100;
  flex-shrink: 0;
}

.bottom-panel.collapsed { height: 52px; }
.bottom-panel.collapsed #panel-content { display: none; }
.bottom-panel.expanded { height: 60dvh; }

/* Tabs */
.tab-bar {
  display: flex;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1; min-width: 60px;
  padding: 8px 4px 6px;
  background: none; color: #6b7280;
  font-size: 9px; font-weight: 700;
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  border-bottom: 2px solid transparent;
  position: relative;
}

.tab-btn .tab-icon { font-size: 18px; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

.tab-btn .notif {
  position: absolute; top: 4px; right: calc(50% - 18px);
  width: 8px; height: 8px;
  background: var(--red); border-radius: 50%;
  border: 1.5px solid var(--bg-dark);
}

/* Sub tabs */
.sub-tabs {
  display: flex; gap: 4px;
  padding: 8px 10px 4px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.sub-tabs::-webkit-scrollbar { display: none; }

.sub-tab {
  padding: 5px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 11px; font-weight: 700;
  white-space: nowrap;
}
.sub-tab.active { background: #28313b; color: #fff; border-color: var(--gold); }

/* Panel content */
#panel-content {
  flex: 1; overflow-y: auto;
  padding: 8px 10px 16px;
  scrollbar-width: none;
}
#panel-content::-webkit-scrollbar { display: none; }

/* ─── CARDS ─── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-1 { display: grid; grid-template-columns: 1fr; gap: 8px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  display: flex; flex-direction: column; gap: 5px;
}

.card.highlight { border-color: var(--gold); box-shadow: 0 0 12px rgba(245,158,11,.12); }
.card.locked { opacity: .5; }

.card-header {
  display: flex; justify-content: space-between; align-items: center;
}

.card-title {
  font-size: 12px; font-weight: 800; color: #fff;
  display: flex; align-items: center; gap: 5px;
}

.card-badge {
  font-size: 9px; font-weight: 800;
  padding: 2px 6px; border-radius: 4px;
  text-transform: uppercase;
}

.badge-green { background: rgba(34,197,94,.2); color: #4ade80; }
.badge-gold { background: rgba(245,158,11,.2); color: #fbbf24; }
.badge-blue { background: rgba(59,130,246,.2); color: #60a5fa; }
.badge-red { background: rgba(239,68,68,.2); color: #f87171; }
.badge-purple { background: rgba(168,85,247,.2); color: #c084fc; }

.card-desc {
  font-size: 10px; color: var(--muted); line-height: 1.35;
}

.card-cost {
  font-size: 10px; color: #d1d5db;
  display: flex; gap: 8px; flex-wrap: wrap;
}

.card-cost span { display: flex; align-items: center; gap: 2px; }

.btn-primary {
  background: linear-gradient(180deg, #d97706, #b45309);
  color: #fff; padding: 7px 12px;
  border-radius: 6px; font-size: 11px; font-weight: 800;
  text-shadow: 0 1px 2px rgba(0,0,0,.4);
}

.btn-green {
  background: linear-gradient(180deg, #16a34a, #15803d);
  color: #fff; padding: 7px 12px;
  border-radius: 6px; font-size: 11px; font-weight: 800;
}

.btn-blue {
  background: linear-gradient(180deg, #2563eb, #1d4ed8);
  color: #fff; padding: 7px 12px;
  border-radius: 6px; font-size: 11px; font-weight: 800;
}

.btn-purple {
  background: linear-gradient(180deg, #9333ea, #7c3aed);
  color: #fff; padding: 7px 12px;
  border-radius: 6px; font-size: 11px; font-weight: 800;
}

.btn-secondary {
  background: rgba(255,255,255,.08);
  color: #d1d5db; padding: 7px 12px;
  border-radius: 6px; font-size: 11px; font-weight: 700;
}

.btn-full { width: 100%; }

/* Progress bar */
.progress-bar {
  height: 6px; border-radius: 4px;
  background: #1c2128; overflow: hidden;
}

.progress-fill {
  height: 100%; border-radius: 4px;
  transition: width .4s ease;
}

.pf-gold { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.pf-green { background: linear-gradient(90deg, #22c55e, #4ade80); }
.pf-blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
.pf-red { background: linear-gradient(90deg, #dc2626, #ef4444); }

/* Hero row */
.hero-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 6px;
}

.hero-row.selected { border-color: var(--gold); background: #1e2430; }

.hero-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}

.hero-icon.common { background: #1c2128; border: 2px solid #6b7280; }
.hero-icon.rare { background: #1a2332; border: 2px solid #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,.3); }
.hero-icon.epic { background: #221a30; border: 2px solid #a855f7; box-shadow: 0 0 8px rgba(168,85,247,.3); }
.hero-icon.legendary { background: #2a1f10; border: 2px solid #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,.4); }

.hero-info { flex: 1; min-width: 0; }
.hero-info .h-name { font-size: 12px; font-weight: 800; color: #fff; }
.hero-info .h-class { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
.hero-info .h-stats { font-size: 10px; color: #d1d5db; margin-top: 2px; }

.hero-actions { display: flex; gap: 4px; }

/* Expedition */
.exp-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}

.exp-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}

.exp-title { font-size: 12px; font-weight: 800; color: #fff; }
.exp-time { font-size: 10px; color: #93c5fd; font-weight: 700; }
.exp-desc { font-size: 10px; color: var(--muted); margin-bottom: 8px; }

.exp-rewards {
  display: flex; gap: 6px; margin-bottom: 8px;
}

.exp-reward {
  font-size: 10px; color: #d1d5db;
  background: rgba(255,255,255,.05);
  padding: 3px 8px; border-radius: 4px;
}

/* Section title */
.section-title {
  font-size: 11px; font-weight: 800; color: var(--gold);
  text-transform: uppercase; letter-spacing: .5px;
  margin: 12px 0 8px;
  display: flex; align-items: center; gap: 6px;
}

.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(245,158,11,.3), transparent);
}

/* Toast */
#toast {
  position: fixed; top: 60px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  z-index: 9999;
  background: rgba(12,14,18,.96);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 12px; font-weight: 700; color: #fff;
  box-shadow: 0 8px 30px rgba(0,0,0,.8);
  opacity: 0; transition: .3s ease;
  pointer-events: none; text-align: center;
  max-width: 85%;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Timer display */
.timer-display {
  font-size: 11px; color: #93c5fd; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
}

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: 100%; max-width: 360px;
  max-height: 70vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.9);
}

.modal h3 {
  font-size: 16px; color: #fff; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.modal-close {
  margin-left: auto;
  background: rgba(255,255,255,.1);
  color: #fff; width: 28px; height: 28px;
  border-radius: 50%; font-size: 14px;
  display: grid; place-items: center;
}

/* Zombie animation */
@keyframes zombieWalk {
  0% { transform: translateX(-50px) scaleX(-1); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateX(calc(100vw + 50px)) scaleX(-1); opacity: 0; }
}

.zombie-walker {
  position: absolute;
  font-size: 28px;
  animation: zombieWalk 4s linear forwards;
  z-index: 15;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.8));
}

/* Floating damage */
.float-text {
  position: absolute;
  font-weight: 900; font-size: 14px;
  pointer-events: none; z-index: 200;
  animation: floatUp .8s ease forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(.8); }
}

/* Battle log */
.battle-log {
  max-height: 120px;
  overflow-y: auto;
  background: rgba(0,0,0,.3);
  border-radius: 8px;
  padding: 8px;
  margin-top: 8px;
}

.battle-log p {
  font-size: 10px; color: var(--muted);
  padding: 2px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}

/* World map styles */
.world-node {
  position: absolute;
  width: 50px; height: 50px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 22px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  border: 2px solid var(--border);
  background: var(--bg-card);
}

.world-node:hover { transform: scale(1.1); }
.world-node.cleared { border-color: var(--green); background: rgba(34,197,94,.15); }
.world-node.current { border-color: var(--gold); box-shadow: 0 0 15px rgba(245,158,11,.4); animation: pulse 2s infinite; }
.world-node.locked { opacity: .4; pointer-events: none; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 15px rgba(245,158,11,.3); }
  50% { box-shadow: 0 0 25px rgba(245,158,11,.6); }
}

.world-path {
  position: absolute;
  background: var(--border);
  z-index: -1;
}

/* Garrison display */
.garrison-bar {
  display: flex; gap: 4px; padding: 4px 0;
}

.garrison-slot {
  width: 32px; height: 32px;
  border-radius: 6px;
  background: rgba(255,255,255,.05);
  border: 1px dashed var(--border);
  display: grid; place-items: center;
  font-size: 14px;
  cursor: pointer;
}

.garrison-slot.filled {
  border-style: solid;
  border-color: var(--gold);
  background: rgba(245,158,11,.1);
}

/* Scrolling ticker */
.ticker {
  background: rgba(220,38,38,.15);
  border-bottom: 1px solid rgba(220,38,38,.3);
  padding: 4px 12px;
  font-size: 10px; font-weight: 700;
  color: #fca5a5;
  white-space: nowrap;
  overflow: hidden;
  flex-shrink: 0;
}

.ticker-text {
  display: inline-block;
  animation: ticker 15s linear infinite;
}

@keyframes ticker {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* Daily login */
.daily-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 12px;
}

.daily-cell {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 2px;
  text-align: center;
}

.daily-cell.today {
  border-color: var(--gold);
  background: rgba(245,158,11,.1);
}

.daily-cell.claimed {
  opacity: .3;
}

.daily-cell .dc-day { font-size: 8px; color: var(--muted); display: block; }
.daily-cell .dc-icon { font-size: 16px; display: block; margin: 2px 0; }
.daily-cell .dc-amt { font-size: 9px; color: #fff; font-weight: 700; }

/* Recruitment banner */
.recruit-banner {
  background: linear-gradient(135deg, #1a1510, #0e0c08);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.recruit-banner::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(245,158,11,.15), transparent 70%);
}

.recruit-banner h4 {
  font-size: 15px; color: #fbbf24; margin-bottom: 4px;
  position: relative;
}

.recruit-banner p {
  font-size: 10px; color: var(--muted);
  margin-bottom: 12px; position: relative;
}

.recruit-buttons {
  display: flex; gap: 8px; justify-content: center;
  position: relative;
}

/* Defense wave indicator */
.wave-indicator {
  display: flex; align-items: center; gap: 6px;
  background: rgba(220,38,38,.1);
  border: 1px solid rgba(220,38,38,.3);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 10px;
}

.wave-indicator .wi-icon { font-size: 20px; }
.wave-indicator .wi-text { flex: 1; }
.wave-indicator .wi-text b { font-size: 12px; color: #f87171; display: block; }
.wave-indicator .wi-text span { font-size: 10px; color: var(--muted); }

/* Tech tree */
.tech-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
}

.tech-row.researched { border-color: var(--green); }
.tech-row.available { border-color: var(--blue); }

.tech-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: #1c2128;
  display: grid; place-items: center;
  font-size: 18px; flex-shrink: 0;
}

.tech-info { flex: 1; }
.tech-info b { font-size: 11px; color: #fff; display: block; }
.tech-info span { font-size: 9px; color: var(--muted); }

/* Inventory */
.inv-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.inv-slot {
  aspect-ratio: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: grid; place-items: center;
  font-size: 20px;
  position: relative;
  cursor: pointer;
}

.inv-slot.empty { opacity: .3; }
.inv-slot .inv-count {
  position: absolute; bottom: 2px; right: 4px;
  font-size: 9px; font-weight: 900; color: #fff;
  text-shadow: 0 1px 3px #000;
}

/* Alliance */
.alliance-banner {
  background: linear-gradient(135deg, #150e1e, #0c0a12);
  border: 1px solid var(--purple);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  margin-bottom: 12px;
}

  // ─── INIT ───
  init() {
    // Give starting hero
    if (this.state.heroes.length === 0) {
      this.state.heroes.push({ ...this.heroPool[10], lvl: 1 }); // Guard Joe
    }
    if (!this.state.buildings.hq) this.state.buildings.hq = 1;

    this.renderTabs();
    this.renderSubTabs();
    this.renderPanel();
    this.updateTopBar();
    this.updateQuest();
    this.initCanvas();
    this.startGameLoop();
  },

  // ─── CANVAS MAP ───
  canvas: null, ctx: null,
  mapBuildings: [],

  initCanvas() {
    this.canvas = document.getElementById('map-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resizeCanvas();
    window.addEventListener('resize', () => this.resizeCanvas());

    // Define building positions on map
    this.mapBuildings = [
      { key: 'hq', x: 0.5, y: 0.45, size: 55 },
      { key: 'farm', x: 0.25, y: 0.35, size: 42 },
      { key: 'sawmill', x: 0.75, y: 0.35, size: 42 },
      { key: 'workshop', x: 0.3, y: 0.6, size: 42 },
      { key: 'wall', x: 0.5, y: 0.2, size: 48 },
      { key: 'barracks', x: 0.7, y: 0.6, size: 42 },
      { key: 'hospital', x: 0.2, y: 0.55, size: 38 },
      { key: 'watchtower', x: 0.8, y: 0.25, size: 38 },
      { key: 'warehouse', x: 0.35, y: 0.75, size: 38 },
      { key: 'lab', x: 0.65, y: 0.75, size: 38 },
    ];

    // Touch events for buildings
    this.canvas.addEventListener('click', (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      this.handleMapClick(cx, cy);
    });

    this.drawMap();
  },

  resizeCanvas() {
    const cont = this.canvas.parentElement;
    this.canvas.width = cont.clientWidth * devicePixelRatio;
    this.canvas.height = cont.clientHeight * devicePixelRatio;
    this.canvas.style.width = cont.clientWidth + 'px';
    this.canvas.style.height = cont.clientHeight + 'px';
    this.ctx.scale(devicePixelRatio, devicePixelRatio);
    this.drawMap();
  },

  drawMap() {
    const c = this.ctx;
    const w = this.canvas.width / devicePixelRatio;
    const h = this.canvas.height / devicePixelRatio;

    // Background
    c.fillStyle = '#0d1117';
    c.fillRect(0, 0, w, h);

    // Ground
    const grad = c.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w,h) * 0.6);
    grad.addColorStop(0, '#1a2010');
    grad.addColorStop(0.5, '#141a10');
    grad.addColorStop(1, '#0a0e08');
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // Grid pattern
    c.strokeStyle = 'rgba(255,255,255,0.03)';
    c.lineWidth = 1;
    for (let x = 0; x < w; x += 40) {
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke();
    }
    for (let y = 0; y < h; y += 40) {
      c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
    }

    // Paths between buildings
    c.strokeStyle = 'rgba(245,158,11,0.1)';
    c.lineWidth = 2;
    c.setLineDash([4, 4]);
    const hqPos = this.mapBuildings[0];
    for (let i = 1; i < this.mapBuildings.length; i++) {
      const b = this.mapBuildings[i];
      if (this.state.buildings[b.key]) {
        c.beginPath();
        c.moveTo(hqPos.x * w, hqPos.y * h);
        c.lineTo(b.x * w, b.y * h);
        c.stroke();
      }
    }
    c.setLineDash([]);

    // Decorations - trees
    const trees = [[0.1,0.15],[0.9,0.15],[0.05,0.7],[0.95,0.7],[0.15,0.85],[0.85,0.85],[0.5,0.1],[0.08,0.4],[0.92,0.5]];
    trees.forEach(([tx, ty]) => {
      c.font = '20px serif';
      c.fillText('🌲', tx * w - 10, ty * h);
    });

    // Zombies wandering
    if (Math.random() > 0.97) {
      c.font = '16px serif';
      c.globalAlpha = 0.4;
      c.fillText('🧟', Math.random() * w, Math.random() * h);
      c.globalAlpha = 1;
    }

    // Buildings
    this.mapBuildings.forEach(b => {
      const bx = b.x * w;
      const by = b.y * h;
      const data = this.buildingData[b.key];
      const lvl = this.state.buildings[b.key] || 0;

      // Shadow
      c.fillStyle = 'rgba(0,0,0,0.3)';
      c.beginPath();
      c.ellipse(bx, by + b.size/2 + 5, b.size/2, 8, 0, 0, Math.PI * 2);
      c.fill();

      // Building circle
      if (lvl > 0) {
        // Built
        const glow = c.createRadialGradient(bx, by, 5, bx, by, b.size);
        glow.addColorStop(0, 'rgba(245,158,11,0.15)');
        glow.addColorStop(1, 'rgba(245,158,11,0)');
        c.fillStyle = glow;
        c.beginPath();
        c.arc(bx, by, b.size, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#1c2128';
        c.strokeStyle = '#b48530';
        c.lineWidth = 2;
      } else {
        // Not built
        c.fillStyle = 'rgba(28,33,40,0.5)';
        c.strokeStyle = 'rgba(100,100,100,0.3)';
        c.lineWidth = 1;
        c.setLineDash([3, 3]);
      }

      c.beginPath();
      c.arc(bx, by, b.size/2, 0, Math.PI * 2);
      c.fill();
      c.stroke();
      c.setLineDash([]);

      // Icon
      c.font = `${b.size * 0.5}px serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(data.icon, bx, by - 3);

      // Name & level
      c.font = 'bold 9px sans-serif';
      c.fillStyle = lvl > 0 ? '#fff' : '#666';
      c.fillText(data.name, bx, by + b.size/2 - 2);

      if (lvl > 0) {
        c.font = 'bold 8px sans-serif';
        c.fillStyle = '#fbbf24';
        c.fillText(`Ур.${lvl}`, bx, by + b.size/2 + 10);
      } else {
        c.font = '8px sans-serif';
        c.fillStyle = '#666';
        c.fillText('Построить', bx, by + b.size/2 + 10);
      }

      // Production indicator
      if (lvl > 0 && data.production) {
        const pulseSz = 4 + Math.sin(Date.now() / 500) * 2;
        c.fillStyle = '#4ade80';
        c.beginPath();
        c.arc(bx + b.size/2 - 5, by - b.size/2 + 5, pulseSz, 0, Math.PI * 2);
        c.fill();
      }
    });

    // Wall HP bar
    if (this.state.buildings.wall) {
      const whp = this.state.wallHP / this.state.wallMaxHP;
      const barW = 120;
      const barX = w/2 - barW/2;
      const barY = 20;

      c.fillStyle = 'rgba(0,0,0,0.6)';
      c.roundRect(barX - 4, barY - 4, barW + 8, 18, 6);
      c.fill();

      c.fillStyle = '#1c2128';
      c.roundRect(barX, barY, barW, 10, 4);
      c.fill();

      c.fillStyle = whp > 0.5 ? '#22c55e' : whp > 0.25 ? '#f59e0b' : '#ef4444';
      c.roundRect(barX, barY, barW * whp, 10, 4);
      c.fill();

      c.font = 'bold 8px sans-serif';
      c.fillStyle = '#fff';
      c.textAlign = 'center';
      c.fillText(`🧱 Стена ${Math.round(whp*100)}%`, w/2, barY + 8);
    }

    // Day/night indicator
    c.font = 'bold 10px sans-serif';
    c.textAlign = 'left';
    c.fillStyle = '#fbbf24';
    c.fillText(`☀ День ${this.state.day}`, 10, h - 10);

    c.textAlign = 'right';
    c.fillStyle = '#f87171';
    c.fillText(`💀 Убито: ${this.state.zombiesKilled}`, w - 10, h - 10);
  },

  handleMapClick(cx, cy) {
    const w = this.canvas.width / devicePixelRatio;
    const h = this.canvas.height / devicePixelRatio;

    for (const b of this.mapBuildings) {
      const bx = b.x * w;
      const by = b.y * h;
      const dist = Math.hypot(cx - bx, cy - by);
      if (dist < b.size/2 + 10) {
        this.showBuildingTooltip(b, bx, by);
        return;
      }
    }
    // Click on empty space - hide tooltip
    document.getElementById('building-tooltip').classList.remove('show');
  },

  showBuildingTooltip(b, x, y) {
    const data = this.buildingData[b.key];
    const lvl = this.state.buildings[b.key] || 0;
    const nextLvl = lvl + 1;
    const cost = data.cost(nextLvl);
    const tooltip = document.getElementById('building-tooltip');

    const canAfford = Object.entries(cost).every(([r, v]) => this.state.resources[r] >= v);
    const atMax = lvl >= data.maxLvl;

    tooltip.innerHTML = `
      <h4>${data.icon} ${data.name} ${lvl > 0 ? `<span class="card-badge badge-gold">Ур.${lvl}</span>` : '<span class="card-badge badge-red">Не построено</span>'}</h4>
      <p>${data.desc}</p>
      ${lvl > 0 ? `<div class="bt-stats"><span class="bt-stat">${data.effect(lvl)}</span></div>` : ''}
      ${!atMax ? `
        <p style="color:#d1d5db;font-size:10px">Стоимость: ${Object.entries(cost).map(([r,v]) => {
          const icons = {food:'🍖',wood:'🪵',metal:'⚙',gems:'💎'};
          const enough = this.state.resources[r] >= v;
          return `<span style="color:${enough?'#4ade80':'#f87171'}">${icons[r]}${v}</span>`;
        }).join(' ')}</p>
      ` : ''}
      <div class="bt-actions">
        ${!atMax ? `<button class="btn-upgrade" ${!canAfford?'disabled':''} onclick="Game.buildUpgrade('${b.key}')">${lvl===0?'Построить':'Улучшить'}</button>` : '<button class="btn-secondary" disabled>Макс. уровень</button>'}
      </div>
    `;

    // Position
    const cont = this.canvas.parentElement.getBoundingClientRect();
    let tx = x - 90;
    let ty = y + 40;
    if (tx < 10) tx = 10;
    if (tx + 200 > cont.width) tx = cont.width - 200;
    if (ty + 150 > cont.height) ty = y - 150;

    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    tooltip.classList.add('show');
  },

  // ─── GAME ACTIONS ───
  buildUpgrade(key) {
    const data = this.buildingData[key];
    const lvl = this.state.buildings[key] || 0;
    const nextLvl = lvl + 1;
    const cost = data.cost(nextLvl);

    if (nextLvl > data.maxLvl) return this.toast('Максимальный уровень!');

    for (const [r, v] of Object.entries(cost)) {
      if (this.state.resources[r] < v) return this.toast('Недостаточно ресурсов!');
    }

    for (const [r, v] of Object.entries(cost)) {
      this.state.resources[r] -= v;
    }

    this.state.buildings[key] = nextLvl;
    this.state.totalBuilt++;

    // Apply effects
    if (key === 'wall') {
      this.state.wallMaxHP = 100 + nextLvl * 50;
      this.state.wallHP = this.state.wallMaxHP;
    }
    if (key === 'warehouse') {
      const bonus = nextLvl * 200;
      this.state.resCaps.food = 2000 + bonus;
      this.state.resCaps.wood = 2000 + bonus;
      this.state.resCaps.metal = 1000 + bonus;
    }

    this.calcPower();
    this.addXP(20 + nextLvl * 5);
    this.toast(`${data.icon} ${data.name} → Уровень ${nextLvl}!`);
    this.updateAll();
    document.getElementById('building-tooltip').classList.remove('show');
  },

  recruit(type) {
    const cost = type === 'single' ? 50 : 200;
    const count = type === 'single' ? 1 : 5;

    if (this.state.resources.gems < cost) return this.toast('Недостаточно 💎!');
    this.state.resources.gems -= cost;

    const gained = [];
    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let pool;
      if (roll < 0.05) pool = this.heroPool.filter(h => h.rarity === 'legendary');
      else if (roll < 0.2) pool = this.heroPool.filter(h => h.rarity === 'epic');
      else if (roll < 0.5) pool = this.heroPool.filter(h => h.rarity === 'rare');
      else pool = this.heroPool.filter(h => h.rarity === 'common');

      const hero = { ...pool[Math.floor(Math.random() * pool.length)], lvl: 1 };

      const existing = this.state.heroes.find(h => h.id === hero.id);
      if (existing) {
        existing.lvl++;
        gained.push(`${hero.icon} ${hero.name} → Ур.${existing.lvl}`);
      } else {
        this.state.heroes.push(hero);
        gained.push(`${hero.icon} ${hero.name} (НОВЫЙ!)`);
      }
    }

    this.calcPower();
    this.toast('Набор: ' + gained.join(', '));
    this.updateAll();
  },

  assignGarrison(heroIdx, slot) {
    const hero = this.state.heroes[heroIdx];
    if (!hero) return;

    // Remove from other slots
    this.state.garrison = this.state.garrison.map(g => g === hero.id ? null : g);
    this.state.garrison[slot] = hero.id;
    this.calcPower();
    this.updateAll();
  },

  removeFromGarrison(slot) {
    this.state.garrison[slot] = null;
    this.calcPower();
    this.updateAll();
  },

  startExpedition(idx) {
    const template = this.expeditionTemplates[idx];
    if (!template) return;

    const garrisonHeroes = this.state.garrison.filter(g => g !== null);
    if (garrisonHeroes.length === 0) return this.toast('Назначьте героев в гарнизон!');

    if (this.state.expeditions.length >= 3) return this.toast('Макс. 3 экспедиции одновременно!');

    this.state.expeditions.push({
      ...template,
      startTime: Date.now(),
      endTime: Date.now() + template.duration * 1000
    });

    this.toast(`🧭 Экспедиция "${template.name}" начата!`);
    this.updateAll();
  },

  collectExpedition(idx) {
    const exp = this.state.expeditions[idx];
    if (!exp || Date.now() < exp.endTime) return;

    Object.entries(exp.rewards).forEach(([r, v]) => {
      this.state.resources[r] = Math.min(this.state.resources[r] + v, this.state.resCaps[r] || 999);
    });

    this.state.expeditions.splice(idx, 1);
    this.addXP(30);
    this.state.zombiesKilled += 5;
    this.toast(`✅ Экспедиция завершена! Получено: ${Object.entries(exp.rewards).map(([r,v]) => `${v} ${r}`).join(', ')}`);
    this.updateAll();
  },

  claimDaily() {
    const dayIdx = this.state.day % 7;
    if (this.state.dailyClaimed >= this.state.day) return this.toast('Уже получено сегодня!');

    const reward = this.dailyRewards[dayIdx];
    this.state.resources[reward.res] = Math.min(
      this.state.resources[reward.res] + reward.amount,
      this.state.resCaps[reward.res] || 999
    );
    this.state.dailyClaimed = this.state.day;
    this.addXP(15);
    this.toast(`🎁 Получено: ${reward.icon} ${reward.amount} ${reward.name}!`);
    this.updateAll();
  },

  claimAchievement(id) {
    if (this.state.achievements[id]) return;
    const ach = this.achievementData.find(a => a.id === id);
    if (!ach || !ach.check()) return;

    this.state.achievements[id] = true;
    Object.entries(ach.reward).forEach(([r, v]) => {
      this.state.resources[r] = Math.min(this.state.resources[r] + v, this.state.resCaps[r] || 999);
    });
    this.addXP(25);
    this.toast(`🏆 Достижение: ${ach.name}! +${Object.entries(ach.reward).map(([r,v])=>`${v} ${r}`).join(', ')}`);
    this.updateAll();
  },

  researchTech(id) {
    if (this.state.techs[id]) return this.toast('Уже исследовано!');
    const tech = this.techData.find(t => t.id === id);
    if (!tech) return;

    const labLvl = this.state.buildings.lab || 0;
    if (labLvl < tech.reqLab) return this.toast(`Нужна Лаборатория Ур.${tech.reqLab}!`);

    for (const [r, v] of Object.entries(tech.cost)) {
      if (this.state.resources[r] < v) return this.toast('Недостаточно ресурсов!');
    }

    for (const [r, v] of Object.entries(tech.cost)) {
      this.state.resources[r] -= v;
    }

    this.state.techs[id] = true;
    this.calcPower();
    this.addXP(40);
    this.toast(`🔬 Исследовано: ${tech.name}!`);
    this.updateAll();
  },

  simulateDefense() {
    if (!this.state.buildings.wall) return this.toast('Постройте стену!');

    const garrisonHeroes = this.state.garrison.filter(g => g !== null)
      .map(id => this.state.heroes.find(h => h.id === id))
      .filter(Boolean);

    if (garrisonHeroes.length === 0) return this.toast('Назначьте героев в гарнизон!');

    const waveStr = this.state.waveNumber * 20 + Math.random() * 30;
    const defStr = garrisonHeroes.reduce((s, h) => s + (h.atk + h.def) * h.lvl, 0);
    const wallBonus = (this.state.buildings.wall || 0) * 10;
    const techBonus = this.state.techs.thick_walls ? 25 : 0;
    const totalDef = defStr + wallBonus + techBonus;

    const won = totalDef > waveStr;
    const dmgTaken = won ? Math.max(5, Math.round(waveStr * 0.3)) : Math.round(waveStr * 0.8);

    this.state.wallHP = Math.max(0, this.state.wallHP - dmgTaken);

    const zombiesKilledNow = Math.round(3 + this.state.waveNumber * 2 + Math.random() * 5);

    const log = [];
    if (won) {
      this.state.zombiesKilled += zombiesKilledNow;
      this.state.waveNumber++;
      const foodReward = 50 + this.state.waveNumber * 15;
      const metalReward = 20 + this.state.waveNumber * 8;
      this.state.resources.food = Math.min(this.state.resources.food + foodReward, this.state.resCaps.food);
      this.state.resources.metal = Math.min(this.state.resources.metal + metalReward, this.state.resCaps.metal);
      this.addXP(30 + this.state.waveNumber * 5);

      log.push(`✅ Волна ${this.state.waveNumber - 1} отражена!`);
      log.push(`💀 Убито зомби: ${zombiesKilledNow}`);
      log.push(`🧱 Стена -${dmgTaken} HP`);
      log.push(`🍖 +${foodReward} еды, ⚙ +${metalReward} металла`);
    } else {
      this.state.zombiesKilled += Math.round(zombiesKilledNow / 2);
      log.push(`❌ Волна ${this.state.waveNumber} прорвала оборону!`);
      log.push(`🧱 Стена -${dmgTaken} HP`);
      log.push(`⚔ Ваша защита: ${Math.round(totalDef)} vs Волна: ${Math.round(waveStr)}`);
    }

    this.state.battleLog = [...log, ...this.state.battleLog].slice(0, 30);

    if (this.state.wallHP <= 0) {
      this.state.wallHP = 0;
      log.push('💥 СТЕНА РАЗРУШЕНА! Почините срочно!');
    }

    this.toast(won ? `⚔ Волна отражена! +${zombiesKilledNow} 💀` : '💀 Оборона пала!');
    this.updateAll();
  },

  repairWall() {
    const cost = { wood: 50, metal: 30 };
    for (const [r, v] of Object.entries(cost)) {
      if (this.state.resources[r] < v) return this.toast('Недостаточно ресурсов!');
    }
    for (const [r, v] of Object.entries(cost)) {
      this.state.resources[r] -= v;
    }
    this.state.wallHP = this.state.wallMaxHP;
    this.toast('🧱 Стена полностью восстановлена!');
    this.updateAll();
  },

  // ─── XP & LEVEL ───
  addXP(amount) {
    this.state.xp += amount;
    while (this.state.xp >= this.state.xpNeeded) {
      this.state.xp -= this.state.xpNeeded;
      this.state.level++;
      this.state.xpNeeded = Math.round(100 * Math.pow(1.3, this.state.level - 1));
      this.toast(`🎉 Уровень ${this.state.level}!`);
    }
  },

  calcPower() {
    let p = 0;
    Object.entries(this.state.buildings).forEach(([k, v]) => p += v * 15);
    this.state.heroes.forEach(h => p += (h.atk + h.def + h.hp / 5) * h.lvl);
    Object.keys(this.state.techs).forEach(() => p += 30);
    this.state.power = Math.round(p);
  },

  // ─── RENDER ───
  renderTabs() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = this.tabs.map(t => `
      <button class="tab-btn ${t.id === this.state.currentTab ? 'active' : ''}" onclick="Game.switchTab('${t.id}')">
        <span class="tab-icon">${t.icon}</span>
        ${t.label}
      </button>
    `).join('');
  },

  renderSubTabs() {
    const cont = document.getElementById('sub-tabs');
    const subs = this.subTabs[this.state.currentTab];
    if (!subs) { cont.innerHTML = ''; return; }

    cont.innerHTML = subs.map(s => `
      <button class="sub-tab ${s.id === this.state.currentSubTab ? 'active' : ''}" onclick="Game.switchSubTab('${s.id}')">
        ${s.label}
      </button>
    `).join('');
  },

  switchTab(id) {
    this.state.currentTab = id;
    this.state.currentSubTab = (this.subTabs[id] || [])[0]?.id || '';
    document.getElementById('building-tooltip').classList.remove('show');
    this.renderTabs();
    this.renderSubTabs();
    this.renderPanel();
  },

  switchSubTab(id) {
    this.state.currentSubTab = id;
    this.renderSubTabs();
    this.renderPanel();
  },

  renderPanel() {
    const panel = document.getElementById('panel-content');
    const tab = this.state.currentTab;
    const sub = this.state.currentSubTab;

    let html = '';

    // BASE TAB
    if (tab === 'base' && sub === 'buildings') {
      html = '<div class="section-title">Здания базы</div><div class="grid-2">';
      Object.entries(this.buildingData).forEach(([key, data]) => {
        const lvl = this.state.buildings[key] || 0;
        const nextLvl = lvl + 1;
        const cost = data.cost(nextLvl);
        const canAfford = Object.entries(cost).every(([r, v]) => this.state.resources[r] >= v);
        const atMax = lvl >= data.maxLvl;
        const icons = { food: '🍖', wood: '🪵', metal: '⚙', gems: '💎' };

        html += `
          <div class="card ${lvl > 0 ? 'highlight' : ''}">
            <div class="card-header">
              <span class="card-title">${data.icon} ${data.name}</span>
              <span class="card-badge ${lvl > 0 ? 'badge-gold' : 'badge-red'}">${lvl > 0 ? `Ур.${lvl}` : 'Нет'}</span>
            </div>
            <p class="card-desc">${data.desc}</p>
            ${lvl > 0 ? `<p class="card-desc" style="color:#4ade80">${data.effect(lvl)}</p>` : ''}
            ${!atMax ? `
              <div class="card-cost">${Object.entries(cost).map(([r, v]) =>
                `<span style="color:${this.state.resources[r] >= v ? '#4ade80' : '#f87171'}">${icons[r]} ${v}</span>`
              ).join('')}</div>
              <button class="btn-primary btn-full" ${!canAfford ? 'disabled' : ''} onclick="Game.buildUpgrade('${key}')">
                ${lvl === 0 ? '🔨 Построить' : '⬆ Улучшить'}
              </button>
            ` : '<button class="btn-secondary btn-full" disabled>✅ Макс. уровень</button>'}
          </div>
        `;
      });
      html += '</div>';
    }

    else if (tab === 'base' && sub === 'tech') {
      html = '<div class="section-title">Технологии</div>';
      const labLvl = this.state.buildings.lab || 0;
      if (labLvl === 0) {
        html += '<div class="card"><p class="card-desc">🔬 Постройте Лабораторию для исследований!</p></div>';
      } else {
        this.techData.forEach(tech => {
          const researched = this.state.techs[tech.id];
          const available = labLvl >= tech.reqLab && !researched;
          const icons = { food: '🍖', wood: '🪵', metal: '⚙', gems: '💎' };
          const canAfford = available && Object.entries(tech.cost).every(([r, v]) => this.state.resources[r] >= v);

          html += `
            <div class="tech-row ${researched ? 'researched' : available ? 'available' : ''}">
              <div class="tech-icon">${tech.icon}</div>
              <div class="tech-info">
                <b>${tech.name} ${researched ? '✅' : ''}</b>
                <span>${tech.desc}</span>
                ${!researched ? `<span style="color:#93c5fd">Лаборатория Ур.${tech.reqLab}</span>` : ''}
              </div>
              ${!researched ? `
                <button class="${available ? 'btn-blue' : 'btn-secondary'}" ${!canAfford ? 'disabled' : ''} onclick="Game.researchTech('${tech.id}')">
                  ${available ? 'Изучить' : '🔒'}
                </button>
              ` : ''}
            </div>
          `;
        });
      }
    }

    else if (tab === 'base' && sub === 'inventory') {
      html = '<div class="section-title">Инвентарь</div>';
      html += '<div class="inv-grid">';
      const items = [
        { icon: '🗡', count: this.state.buildings.barracks || 0 },
        { icon: '🛡', count: this.state.techs.armor ? 1 : 0 },
        { icon: '💊', count: this.state.buildings.hospital || 0 },
        { icon: '💣', count: this.state.techs.explosives ? 3 : 0 },
        { icon: '🔑', count: Math.floor(this.state.zombiesKilled / 20) },
      ];
      for (let i = 0; i < 20; i++) {
        const item = items[i];
        if (item && item.count > 0) {
          html += `<div class="inv-slot"><span>${item.icon}</span><span class="inv-count">${item.count}</span></div>`;
        } else {
          html += `<div class="inv-slot empty"></div>`;
        }
      }
      html += '</div>';
    }

    // HEROES TAB
    else if (tab === 'heroes' && sub === 'roster') {
      html = '<div class="section-title">Ваш отряд (${this.state.heroes.length})</div>'.replace('${this.state.heroes.length}', this.state.heroes.length);
      if (this.state.heroes.length === 0) {
        html += '<div class="card"><p class="card-desc">У вас нет героев. Наберите их во вкладке "Набор"!</p></div>';
      } else {
        this.state.heroes.forEach((hero, idx) => {
          const inGarrison = this.state.garrison.includes(hero.id);
          html += `
            <div class="hero-row ${inGarrison ? 'selected' : ''}">
              <div class="hero-icon ${hero.rarity}">${hero.icon}</div>
              <div class="hero-info">
                <span class="h-name">${hero.name} <span class="card-badge badge-${hero.rarity === 'legendary' ? 'gold' : hero.rarity === 'epic' ? 'purple' : hero.rarity === 'rare' ? 'blue' : 'green'}">${hero.rarity}</span></span>
                <span class="h-class">${hero.class} · Ур.${hero.lvl}</span>
                <span class="h-stats">⚔${hero.atk * hero.lvl} 🛡${hero.def * hero.lvl} ❤${hero.hp * hero.lvl}</span>
              </div>
              <div class="hero-actions">
                ${inGarrison ? '<span class="card-badge badge-green">В строю</span>' : ''}
                <button class="btn-primary" onclick="Game.levelUpHero(${idx})" style="padding:5px 8px;font-size:10px">⬆</button>
              </div>
            </div>
          `;
        });
      }
    }

    else if (tab === 'heroes' && sub === 'recruit') {
      html = `
        <div class="recruit-banner">
          <h4>🎰 Набор выживших</h4>
          <p>Привлеките новых героев в ваше убежище</p>
          <div style="font-size:10px;color:#d1d5db;margin-bottom:12px">
            <span class="card-badge badge-gold">★★★ Легендарный 5%</span>
            <span class="card-badge badge-purple">★★ Эпический 15%</span>
            <span class="card-badge badge-blue">★ Редкий 30%</span>
          </div>
          <div class="recruit-buttons">
            <button class="btn-primary" onclick="Game.recruit('single')">💎 50 — Набор ×1</button>
            <button class="btn-purple" onclick="Game.recruit('multi')">💎 200 — Набор ×5</button>
          </div>
        </div>
        <div class="section-title">Доступные герои в базе</div>
      `;

      this.heroPool.forEach(h => {

  // ─── HELPER ACTIONS ───
  levelUpHero(idx) {
    const hero = this.state.heroes[idx];
    if (!hero) return;
    const cost = hero.lvl * 30;
    if (this.state.resources.food < cost) return this.toast(`Нужно 🍖${cost} для повышения!`);
    this.state.resources.food -= cost;
    hero.lvl++;
    this.calcPower();
    this.toast(`${hero.icon} ${hero.name} → Ур.${hero.lvl}!`);
    this.updateAll();
  },

  assignToFirstSlot(heroIdx) {
    const emptySlot = this.state.garrison.indexOf(null);
    if (emptySlot === -1) return this.toast('Все слоты заняты!');
    this.assignGarrison(heroIdx, emptySlot);
  },

  pvpBattle() {
    const garrisonHeroes = this.state.garrison.filter(g => g !== null);
    if (garrisonHeroes.length === 0) return this.toast('Назначьте героев в гарнизон!');

    const enemyPower = 100 + Math.random() * this.state.power * 1.5;
    const won = this.state.power > enemyPower * (0.7 + Math.random() * 0.6);

    if (won) {
      const ratingGain = Math.round(15 + Math.random() * 20);
      this.state.rating += ratingGain;
      this.state.resources.gems = Math.min(this.state.resources.gems + 5, this.state.resCaps.gems);
      this.addXP(20);
      this.toast(`🏆 Победа! +${ratingGain} рейтинга, +💎5`);
    } else {
      const ratingLoss = Math.round(10 + Math.random() * 15);
      this.state.rating = Math.max(0, this.state.rating - ratingLoss);
      this.toast(`💀 Поражение! -${ratingLoss} рейтинга`);
    }

    this.updateAll();
  },

  // ─── UPDATE ───
  updateAll() {
    this.updateTopBar();
    this.updateQuest();
    this.renderPanel();
    this.drawMap();
  },

  updateTopBar() {
    document.getElementById('r-food').textContent = Math.floor(this.state.resources.food);
    document.getElementById('r-wood').textContent = Math.floor(this.state.resources.wood);
    document.getElementById('r-metal').textContent = Math.floor(this.state.resources.metal);
    document.getElementById('r-gems').textContent = Math.floor(this.state.resources.gems);
    document.getElementById('p-level').textContent = this.state.level;
    document.getElementById('p-xp-fill').style.width = (this.state.xp / this.state.xpNeeded * 100) + '%';
  },

  updateQuest() {
    const quest = this.questLine.find(q => q.chapter === this.state.chapter);
    if (!quest) {
      document.getElementById('q-chapter').textContent = 'Все главы пройдены!';
      document.getElementById('q-objective').textContent = 'Продолжайте развиваться';
      return;
    }

    // Check completion
    while (this.state.questStep < quest.steps.length && quest.steps[this.state.questStep].check()) {
      this.state.questStep++;
    }

    if (this.state.questStep >= quest.steps.length) {
      // Chapter complete
      this.state.chapter++;
      this.state.questStep = 0;
      this.state.day++;
      this.state.resources.gems = Math.min(this.state.resources.gems + 20, this.state.resCaps.gems);
      this.addXP(50);
      this.toast(`📖 Глава ${quest.chapter} завершена! +💎20`);
      this.updateQuest();
      return;
    }

    const step = quest.steps[this.state.questStep];
    document.getElementById('q-chapter').textContent = `Глава ${quest.chapter} — ${quest.title}`;
    document.getElementById('q-objective').textContent = `[${this.state.questStep}/${quest.steps.length}] ${step.text}`;
  },

  // ─── GAME LOOP ───
  lastTick: 0,
  productionTimers: {},

  startGameLoop() {
    this.lastTick = Date.now();
    setInterval(() => this.tick(), 1000);
    setInterval(() => this.drawMap(), 2000); // Redraw map periodically for animations
  },

  tick() {
    const now = Date.now();

    // Resource production
    Object.entries(this.buildingData).forEach(([key, data]) => {
      if (!data.production) return;
      const lvl = this.state.buildings[key] || 0;
      if (lvl === 0) return;

      if (!this.productionTimers[key]) this.productionTimers[key] = 0;
      this.productionTimers[key]++;

      if (this.productionTimers[key] >= data.production.interval) {
        this.productionTimers[key] = 0;
        const amount = data.production.amount(lvl);
        const res = data.production.res;
        const speedBonus = this.state.techs.fast_harvest ? 1.2 : 1;
        this.state.resources[res] = Math.min(
          this.state.resources[res] + amount * speedBonus,
          this.state.resCaps[res]
        );
      }
    });

    // Auto wave timer
    this.state.waveTimer--;
    if (this.state.waveTimer <= 0) {
      this.state.waveTimer = 300;
      if (this.state.buildings.wall && this.state.garrison.some(g => g !== null)) {
        // Zombie attack event
        this.spawnZombieWalker();
      }
    }

    // Update UI
    this.updateTopBar();

    // Update expedition timers
    if (this.state.currentTab === 'map' && this.state.currentSubTab === 'expedition') {
      this.renderPanel();
    }

    // Update wave countdown
    const waveCountdown = document.getElementById('wave-countdown');
    if (waveCountdown) {
      const mins = Math.floor(this.state.waveTimer / 60);
      const secs = this.state.waveTimer % 60;
      waveCountdown.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    }

    // Check quest progress
    this.updateQuest();
  },

  spawnZombieWalker() {
    const scene = document.querySelector('.scene-container');
    const zombie = document.createElement('div');
    zombie.className = 'zombie-walker';
    zombie.style.bottom = (20 + Math.random() * 30) + '%';
    zombie.textContent = ['🧟', '🧟‍♂️', '🧟‍♀️'][Math.floor(Math.random() * 3)];
    scene.appendChild(zombie);
    setTimeout(() => zombie.remove(), 4000);
  },

  // ─── TOAST ───
  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  },

  // ─── QUEST DETAILS ───
  showQuestDetails() {
    this.switchTab('social');
    this.switchSubTab('quests');
  },

  // ─── CAMERA ───
  zoomIn() { this.toast('Приближение +'); },
  zoomOut() { this.toast('Отдаление −'); },
  resetCamera() { this.toast('Камера сброшена'); },
};

// ─── CANVAS roundRect POLYFILL ───
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ─── START ───
document.addEventListener('DOMContentLoaded', () => Game.init());
</script>
