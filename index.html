<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121517">
<title>Последний порт — Живой порт</title>

<style>
/* ================= ТЕМНАЯ ТЕМА И БАЗОВЫЕ СТИЛИ ================= */
:root {
  color-scheme: dark;
  --text: #e5eeea;
  --muted: #8a949e;
  --gold: #f0a500;
  --bg-main: #121517;
  --bg-card: #1e2227;
  --border: #2d3339;
  --height: 100dvh;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); }
body {
  font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
}

button, input, select { font: inherit; }
button { cursor: pointer; border: none; outline: none; }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: default; transform: none; filter: grayscale(1); }
[hidden] { display: none !important; }

/* ================= СЛОИ (CANVAS И UI) ================= */
main {
  position: relative; width: 100%; height: var(--height); overflow: hidden;
}

/* Слой 1: Полноэкранный Canvas */
.scene {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1; background: #0c0f12; overflow: hidden; touch-action: none;
}
canvas { display: block; transform-origin: center; touch-action: none; }
#camera-layer { position: absolute; inset: 0; z-index: 2; cursor: grab; user-select: none; }
#camera-layer.dragging { cursor: grabbing; }

/* Слой 2: Плавающий UI (HUD) */
.ui-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10; pointer-events: none; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) 0 env(safe-area-inset-left, 10px);
}

/* ================= ВЕРХНИЙ HUD ================= */
header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 10px; pointer-events: auto;
}

/* Профиль игрока */
.profile-badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(18, 21, 23, 0.9); border: 1px solid var(--gold);
  border-radius: 40px; padding: 4px 14px 4px 4px; backdrop-filter: blur(8px);
}
.profile-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
.profile-info { display: flex; flex-direction: column; }
.profile-level { font-size: 9px; color: var(--gold); font-weight: 800; letter-spacing: 0.5px; }
.profile-power { font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 4px; margin-top: -2px; }

/* Ресурсы */
.resources {
  display: grid; grid-template-columns: auto auto; gap: 6px; align-items: start;
}
.resource {
  background: rgba(18, 21, 23, 0.9); border: 1px solid var(--border);
  border-radius: 16px; padding: 6px 10px; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px);
}
.resource span { font-variant-numeric: tabular-nums; }
.res-food { color: #a5d6a7; } .res-wood { color: #d7ccc8; }
.res-parts { color: #b0bec5; } .res-wave { color: #81d4fa; }

/* Виджет Главы */
#chapter-strip {
  align-self: flex-start; margin: 0 10px;
  background: rgba(18, 21, 23, 0.9); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 10px;
  backdrop-filter: blur(8px); pointer-events: auto; text-align: left;
}
.chapter-avatar { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #333; display: grid; place-items: center; font-size: 18px;}
.chapter-copy { display: flex; flex-direction: column; }
.chapter-copy small { font-size: 10px; color: var(--muted); }
.chapter-copy strong { font-size: 13px; font-weight: bold; color: #fff; }
#chapter-status { font-size: 10px; color: var(--gold); margin-left: 10px; }
#chapter-strip.ready { border-color: var(--gold); }

/* Плашка события и бейдж */
#event-strip { align-self: center; background: var(--gold); color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-top: 10px; pointer-events: auto; box-shadow: 0 4px 10px rgba(240, 165, 0, 0.4); }
.badge { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); letter-spacing: 1px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px; }

/* ================= ПРАВЫЕ КНОПКИ КАМЕРЫ ================= */
.camera-controls {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
}
.camera-controls button, .icon {
  width: 44px; height: 44px; background: rgba(18, 21, 23, 0.9);
  border: 1px solid var(--border); border-radius: 50%; color: #fff;
  font-size: 20px; display: grid; place-items: center; backdrop-filter: blur(8px);
}
.camera-controls .primary { color: var(--gold); border-color: var(--gold); }

/* ================= НИЖНЯЯ ПАНЕЛЬ (DOCK) ================= */
#dock {
  margin-top: auto; flex-shrink: 0; height: 42dvh; min-height: 250px;
  background: #16191c; border-top-left-radius: 20px; border-top-right-radius: 20px;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.8); pointer-events: auto;
  display: flex; flex-direction: column; transition: height 0.3s ease;
}
#dock[data-size="large"] { height: 65dvh; }
#dock[data-size="map"] { height: auto; min-height: 0; padding-bottom: 20px; }

/* Тулбар вкладок (Жители, Торговля и тд) */
.toolbar {
  display: flex; gap: 8px; padding: 15px 15px 10px; overflow-x: auto; scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--muted); padding: 10px 14px; border-radius: 10px;
  font-size: 12px; font-weight: bold; white-space: nowrap;
}
.toolbar button.active { background: #2a3036; color: #fff; }
.size-button { width: 40px; padding: 0 !important; display: grid; place-items: center; }

/* Панель со скроллом карточек */
#panel {
  flex: 1; overflow-y: auto; padding: 0 15px 15px; scrollbar-width: none;
}
#panel::-webkit-scrollbar { display: none; }

/* ================= КАРТОЧКИ ================= */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.card.selected { border-color: var(--gold); }
.card.working { border-color: #8bc34a; }

.build-head { display: flex; justify-content: space-between; align-items: flex-start; }
.build-head h3 { margin: 0; font-size: 14px; color: #fff; }
.build-head small { font-size: 10px; color: var(--gold); background: rgba(240, 165, 0, 0.1); padding: 2px 6px; border-radius: 4px; }
.card p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.4; flex: 1; }

.card > button {
  width: 100%; background: transparent; border: 1px solid var(--gold);
  color: var(--gold); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-top: auto;
}
.card > button.primary { background: var(--gold); color: #000; }

/* Элементы внутри карточек */
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.row button { flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-weight: bold;}
.row button.primary { background: var(--gold); color: #000; border-color: var(--gold); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #121517; border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 10px; }

/* Полоски прогресса */
.bar { height: 6px; background: #121517; border-radius: 4px; overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; background: var(--gold); }
.bar.enemy i { background: #e63946; }

/* ================= САМАЯ НИЖНЯЯ НАВИГАЦИЯ ================= */
nav {
  display: flex; justify-content: space-around; align-items: center;
  background: var(--bg-main); height: 65px; border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px); flex-shrink: 0;
}
nav button {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: transparent; border: none; color: var(--muted); font-size: 10px; font-weight: 600;
}
nav button.active { color: var(--gold); }
nav button b { font-size: 20px; font-weight: normal; }

/* ================= УВЕДОМЛЕНИЯ И ЖУРНАЛ ================= */
.notice-row { position: absolute; bottom: 80px; left: 15px; right: 15px; display: flex; gap: 10px; pointer-events: auto; }
#notice { flex: 1; background: rgba(18, 21, 23, 0.9); border-left: 2px solid var(--gold); padding: 8px 12px; font-size: 11px; border-radius: 6px; backdrop-filter: blur(8px); }
#journal-button { background: var(--bg-card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 11px; color: #fff; }
#journal-button.unread { border-color: var(--gold); color: var(--gold); }

/* ================= МОДАЛЬНЫЕ ОКНА ================= */
dialog {
  width: 90%; max-width: 400px; max-height: 85dvh; padding: 0; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 20px; color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
.modal { display: flex; flex-direction: column; max-height: 85dvh; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 16px; color: var(--gold); }
.modal-head small { font-size: 11px; color: var(--muted); }
.modal-close { background: transparent; color: var(--muted); font-size: 24px; padding: 0; width: 30px; height: 30px; }
.modal-body { padding: 15px; overflow-y: auto; }
.modal-body p { font-size: 12px; color: var(--muted); margin: 0 0 10px 0; line-height: 1.5; }
.modal-body button.primary { width: 100%; background: var(--gold); color: #000; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
.compare { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat small { font-size: 10px; color: var(--muted); }
.stat strong { font-size: 13px; color: #fff; }
.prices { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.price { background: #121517; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 11px; }
.price.missing { color: #e63946; border-color: #e63946; }

/* Вспомогательные стили для панелей */
.summary { background: #121517; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
.summary strong { font-size: 13px; color: var(--gold); }
.summary p { margin-top: 6px; font-size: 11px; color: var(--muted); }
.wide { grid-column: 1 / -1; }
.hint { font-size: 10px; color: #6a7682; text-align: center; margin-bottom: 10px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.batch-options button { flex: 1; padding: 8px; background: #121517; border: 1px solid var(--border); border-radius: 8px; color: #fff; }
.batch-options button.primary { border-color: var(--gold); color: var(--gold); }
.worker-stepper { display: flex; justify-content: space-between; align-items: center; background: #121517; border-radius: 8px; padding: 4px; margin-top: 8px; }
.worker-stepper button { width: 40px; height: 30px; background: var(--bg-card); border-radius: 6px; color: #fff; }

@media (min-width: 600px) {
  .app-container { max-width: 480px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
}
</style>
</head>
<body>
<main class="app-container">
  
  <!-- СЛОЙ CANVAS (ФОН) -->
  <div class="scene" id="scene">
    <canvas id="world" width="1000" height="780"></canvas>

    <!-- Кнопки управления камерой справа -->

      <button data-camera="in" aria-label="Приблизить">＋</button>

      <button id="fullscreen" class="icon" aria-label="Полноэкранный режим">⛶</button>
      <button class="icon" data-action="help" aria-label="Об игре">?</button>
    </div>

    <!-- Уведомления перед нижней панелью -->
    <div class="notice-row" hidden>
      <div id="notice" role="status">Командир, порт ждёт приказов.</div>
      <button id="journal-button" data-action="journal">☷ Журнал</button>
    </div>

    <!-- Нижняя панель с карточками -->
    <section id="dock" data-size="normal">
      <div class="toolbar">
        <button data-action="people" id="people-button">♙ Жители</button>
        <button data-action="market">⚖ Торговля</button>
        <button data-action="research">⚙ Развитие</button>
        <button data-action="journal" id="journal-tab-btn">☷ Журнал</button>
        <button class="size-button" data-action="collapse">▾</button>
        <button class="size-button" data-action="expand">⇡</button>
      </div>
      
      <div id="panel"></div>

      <!-- Главная Навигация -->
      <nav>
        <button data-action="tab" data-id="base"><b>⌂</b>База</button>
        <button data-action="tab" data-id="territory"><b>▧</b>Земли</button>
        <button data-action="tab" data-id="heroes"><b>★</b>Герои</button>
        <button data-action="tab" data-id="army"><b>⚑</b>Войска</button>
        <button data-action="tab" data-id="map"><b>⌖</b>Карта</button>
        <button data-action="tab" data-id="battle"><b>⚔</b>Оборона</button>
      </nav>
    </section>

  </div>
</main>

<dialog id="dialog">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modal-title">Тайтл</h2>
        <small id="modal-subtitle">Сабтайтл</small>
      </div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>
