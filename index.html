<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TWD Survivors - Canvas Isometric Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c0f12; color: #fff; overflow: hidden; display: flex; justify-content: center; }

    .game-app {
      width: 100vw; max-width: 480px; height: 100vh; position: relative;
      background: #0f1317; display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }

    /* ================= 1. ВЕРХНИЙ ИНТЕРФЕЙС (ВАШ ОРИГИНАЛЬНЫЙ UI) ================= */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start; z-index: 100;
      pointer-events: none;
    }

    .profile-card {
      background: rgba(18, 22, 26, 0.92); border: 1px solid #d48806;
      border-radius: 30px; padding: 3px 12px 3px 3px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); pointer-events: auto;
    }
    .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #f0a500; object-fit: cover; }
    .profile-info .base-lvl { font-size: 9px; color: #a0aab2; font-weight: 700; letter-spacing: 0.5px; }
    .profile-info .power { font-size: 15px; color: #fff; font-weight: 900; display: flex; align-items: center; gap: 4px; }

    .resources-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 230px; pointer-events: auto; }
    .res-item {
      background: rgba(18, 22, 26, 0.92); border: 1px solid #2a313a; border-radius: 16px;
      padding: 4px 8px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Виджет Главы */
    .chapter-widget {
      position: absolute; top: 68px; left: 10px; z-index: 100;
      background: rgba(18, 22, 26, 0.92); border: 1px solid #343c46; border-radius: 12px;
      padding: 5px 12px 5px 5px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .chapter-avatar { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    .chapter-title { font-size: 10px; color: #8c97a0; }
    .chapter-name { font-size: 12px; font-weight: bold; color: #fff; }

    /* ================= 2. CANVAS ИГРОВОЙ МИР ================= */
    #gameCanvas {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10;
    }

    /* Летающий ресурс при сборе */
    .flying-resource {
      position: fixed; z-index: 999; font-weight: bold; font-size: 13px;
      color: #000; background: #f0a500; padding: 4px 10px; border-radius: 20px;
      box-shadow: 0 0 10px rgba(240,165,0,0.8); pointer-events: none;
      transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
    }

    /* ================= 3. КАРТОЧКИ ЗДАНИЙ И НИЖНЯЯ ПАНЕЛЬ ================= */
    .bottom-container {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* Горизонтальный скролл построек (Как у вас на скриншоте 1) */
    .buildings-scroll {
      display: flex; gap: 10px; padding: 0 10px 10px 10px; overflow-x: auto;
      scrollbar-width: none;
    }
    .buildings-scroll::-webkit-scrollbar { display: none; }

    .building-card {
      min-width: 170px; background: rgba(22, 26, 30, 0.95); border: 1px solid #2d353f;
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .card-title { font-size: 13px; font-weight: bold; color: #fff; }
    .card-lvl { font-size: 10px; color: #f0a500; background: rgba(240,165,0,0.15); padding: 2px 6px; border-radius: 4px; }
    .card-desc { font-size: 10px; color: #8a96a0; margin-bottom: 8px; line-height: 1.2; }
    .btn-upgrade {
      width: 100%; background: #2b323a; border: 1px solid #3a4450; color: #fff;
      padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 4px;
    }
    .btn-upgrade.active { background: #f0a500; color: #000; border: none; }

    /* Нижняя панель вкладок */
    .bottom-nav {
      height: 60px; background: rgba(14, 17, 20, 0.98); border-top: 1px solid #232931;
      display: flex; justify-content: space-around; align-items: center;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6a7682; font-size: 10px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: #f0a500; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>

<div class="game-app">

  <!-- ВЕРХНИЙ ИНТЕРФЕЙС (HUD) -->
  <div class="top-bar">
    <div class="profile-card">
      <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80" class="avatar" alt="Avatar">
      <div class="profile-info">
        <div class="base-lvl">БАЗА УР. 1</div>
        <div class="power">⚔️ <span id="val-power">57</span></div>
      </div>
    </div>

    <div class="resources-bar">
      <div class="res-item" style="color: #8bc34a;">🌾 <span id="val-food">5 900</span></div>
      <div class="res-item" style="color: #d7ccc8;">🪵 <span id="val-wood">4 300</span></div>
      <div class="res-item" style="color: #4db6ac;">⚙️ 120</div>
      <div class="res-item" style="color: #00bcd4;">💎 <span id="val-diamonds">90</span></div>
    </div>
  </div>

  <!-- ВИДЖЕТ ГЛАВЫ -->
  <div class="chapter-widget">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="chapter-avatar" alt="Chapter">
    <div>
      <div class="chapter-title">Глава 1</div>
      <div class="chapter-name">Сигнал в темноте</div>
    </div>
  </div>

  <!-- CANVAS ДВИЖОК ИЗОМЕТРИИ -->
  <canvas id="gameCanvas"></canvas>

  <!-- НИЖНИЕ КАРТОЧКИ И НАВИГАЦИЯ -->
  <div class="bottom-container">
    <div class="buildings-scroll">
      <div class="building-card">
        <div class="card-header"><span class="card-title">Штаб</span><span class="card-lvl">Ур.1</span></div>
        <p class="card-desc">Добыча ресурсов и открытие технологий.</p>
        <button class="btn-upgrade active">Улучшить (🪵 50)</button>
      </div>

      <div class="building-card">
        <div class="card-header"><span class="card-title">Теплицы</span><span class="card-lvl">Ур.1</span></div>
        <p class="card-desc">Производит еду для жителей базы.</p>
        <button class="btn-upgrade active">Улучшить (🪵 50)</button>
      </div>

      <div class="building-card">
        <div class="card-header"><span class="card-title">Лесопилка</span><span class="card-lvl">Ур.1</span></div>
        <p class="card-desc">Добыча древесины для построек.</p>
        <button class="btn-upgrade active">Улучшить (🪵 50)</button>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active"><span class="nav-icon">🏚️</span>База</div>
      <div class="nav-item"><span class="nav-icon">🗺️</span>Земли</div>
      <div class="nav-item"><span class="nav-icon">⭐</span>Герои</div>
      <div class="nav-item"><span class="nav-icon">🚩</span>Армия</div>
      <div class="nav-item"><span class="nav-icon">🌐</span>Карта</div>
    </div>
  </div>

</div>

<script>
  // ================= 1. НАСТРОЙКА CANVAS =================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Баланс игрока
  const playerData = { food: 5900, wood: 4300, diamonds: 90, power: 57 };

  // Параметры изометрической сетки
  const tileWidth = 76;   // Ширина плитки
  const tileHeight = 38;  // Высота плитки
  const originX = canvas.width / 2; // Центр по X
  const originY = canvas.height / 2 - 40; // Центр по Y

  // Сетка 3x3
  const mapGrid = [
    { col: 0, row: 0, fog: true, reqPower: 80 },
    { col: 1, row: 0, fog: true, reqPower: 120 },
    { col: 2, row: 0, type: 'empty' },

    { col: 0, row: 1, type: 'building', name: 'Штаб', icon: '⛺', color: '#2c353d', height: 28 },
    { col: 1, row: 1, type: 'building', name: 'Теплицы', icon: '🌾', color: '#1e382b', height: 22, readyRes: '🌾 150', resType: 'food', amount: 150 },
    { col: 2, row: 1, type: 'building', name: 'Лесопилка', icon: '🪵', color: '#3d2c20', height: 22, readyRes: '🪵 80', resType: 'wood', amount: 80 },

    { col: 0, row: 2, type: 'empty' },
    { col: 1, row: 2, type: 'building', name: 'Казарма', icon: '🪖', color: '#3d3420', height: 20 },
    { col: 2, row: 2, fog: true, reqPower: 150 }
  ];

  // Математика перевода координат сетки (col, row) -> экранные (x, y)
  function gridToScreen(col, row) {
    const x = originX + (col - row) * (tileWidth / 2);
    const y = originY + (col + row) * (tileHeight / 2);
    return { x, y };
  }

  // ================= 2. ОТРИСОВКА ИЗОМЕТРИИ НА CANVAS =================
  function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Сортировка клеток для правильного наложения (Back-to-Front depth)
    mapGrid.forEach(tile => {
      const pos = gridToScreen(tile.col, tile.row);

      if (tile.fog) {
        drawFogTile(pos.x, pos.y);
      } else if (tile.type === 'empty') {
        drawEmptyTile(pos.x, pos.y);
      } else if (tile.type === 'building') {
        drawGroundTile(pos.x, pos.y);
        drawIsometricBuilding(pos.x, pos.y, tile);
      }
    });

    requestAnimationFrame(drawGame);
  }

  // Рисуем базовую земляную плитку
  function drawGroundTile(x, y) {
    ctx.beginPath();
    ctx.moveTo(x, y - tileHeight / 2);
    ctx.lineTo(x + tileWidth / 2, y);
    ctx.lineTo(x, y + tileHeight / 2);
    ctx.lineTo(x - tileWidth / 2, y);
    ctx.closePath();

    ctx.fillStyle = '#1b231d';
    ctx.fill();
    ctx.strokeStyle = '#2b362c';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Пустая клетка со значком +
  function drawEmptyTile(x, y) {
    drawGroundTile(x, y);
    ctx.fillStyle = '#f0a500';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', x, y);
  }

  // Плитка в тумане
  function drawFogTile(x, y) {
    ctx.beginPath();
    ctx.moveTo(x, y - tileHeight / 2);
    ctx.lineTo(x + tileWidth / 2, y);
    ctx.lineTo(x, y + tileHeight / 2);
    ctx.lineTo(x - tileWidth / 2, y);
    ctx.closePath();

    ctx.fillStyle = '#0d1013';
    ctx.fill();
    ctx.strokeStyle = '#241a1b';
    ctx.stroke();

    // Иконка замка
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔒', x, y - 2);
  }

  // Настоящее 3D-здание на Canvas (Крыша + 2 боковые стены)
  function drawIsometricBuilding(x, y, tile) {
    const h = tile.height;

    // 1. Левая грань (Тень)
    ctx.beginPath();
    ctx.moveTo(x - tileWidth / 2, y);
    ctx.lineTo(x, y + tileHeight / 2);
    ctx.lineTo(x, y + tileHeight / 2 - h);
    ctx.lineTo(x - tileWidth / 2, y - h);
    ctx.closePath();
    ctx.fillStyle = '#12161a';
    ctx.fill();

    // 2. Правая грань (Полутень)
    ctx.beginPath();
    ctx.moveTo(x, y + tileHeight / 2);
    ctx.lineTo(x + tileWidth / 2, y);
    ctx.lineTo(x + tileWidth / 2, y - h);
    ctx.lineTo(x, y + tileHeight / 2 - h);
    ctx.closePath();
    ctx.fillStyle = '#1c2329';
    ctx.fill();

    // 3. Крыша (Светлая грань)
    ctx.beginPath();
    ctx.moveTo(x, y - tileHeight / 2 - h);
    ctx.lineTo(x + tileWidth / 2, y - h);
    ctx.lineTo(x, y + tileHeight / 2 - h);
    ctx.lineTo(x - tileWidth / 2, y - h);
    ctx.closePath();
    ctx.fillStyle = tile.color;
    ctx.fill();
    ctx.strokeStyle = '#f0a500';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Иконка здания на крыше
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tile.icon, x, y - h);

    // Всплывающая плашка сбора ресурса над крышей
    if (tile.readyRes) {
      const badgeY = y - h - 28;
      
      // Фон баббла
      ctx.beginPath();
      ctx.roundRect(x - 28, badgeY - 10, 56, 20, 10);
      ctx.fillStyle = '#f0a500';
      ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;

      // Текст ресурса
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(tile.readyRes, x, badgeY);
      ctx.shadowBlur = 0; // сброс тени
    }
  }

  // ================= 3. КЛИКИ ПО CANVAS (СБОР РЕСУРСОВ) =================
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    mapGrid.forEach(tile => {
      const pos = gridToScreen(tile.col, tile.row);
      const h = tile.height || 0;

      // Проверка клика по бабблу сбора ресурса
      if (tile.readyRes) {
        const badgeY = pos.y - h - 28;
        if (Math.abs(clickX - pos.x) < 30 && Math.abs(clickY - badgeY) < 15) {
          collectResource(tile, clickX, clickY);
        }
      }
    });
  });

  // Анимация полета ресурса в верхний бар
  function collectResource(tile, startX, startY) {
    const amount = tile.amount;
    const resType = tile.resType;
    tile.readyRes = null; // Сбрасываем сбор

    const targetId = resType === 'food' ? 'val-food' : 'val-wood';
    const targetEl = document.getElementById(targetId);
    const targetRect = targetEl.getBoundingClientRect();

    const flying = document.createElement('div');
    flying.className = 'flying-resource';
    flying.innerText = `+${amount}`;
    flying.style.left = `${startX}px`;
    flying.style.top = `${startY}px`;
    document.body.appendChild(flying);

    requestAnimationFrame(() => {
      flying.style.left = `${targetRect.left}px`;
      flying.style.top = `${targetRect.top}px`;
      flying.style.opacity = '0.2';
      flying.style.transform = 'scale(0.5)';
    });

    setTimeout(() => {
      if (resType === 'food') playerData.food += amount;
      else playerData.wood += amount;

      document.getElementById('val-food').innerText = playerData.food.toLocaleString();
      document.getElementById('val-wood').innerText = playerData.wood.toLocaleString();
      flying.remove();
    }, 800);
  }

  // Запуск отрисовки
  drawGame();
</script>

</body>
</html>
