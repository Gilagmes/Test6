<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102024">
<title>Последний порт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#0c171c; --panel:#15272d; --line:#30474d;
  --gold:#f3bb68; --text:#e5ece7; --muted:#9aafb0;
}
* { box-sizing:border-box }
body {
  margin:0; background:var(--bg); color:var(--text);
  font:15px system-ui,sans-serif;
}
main { max-width:960px; margin:auto; padding:12px 12px 28px }
header {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:10px 0;
}
h1 { font-size:23px; margin:0; letter-spacing:1px }
small,.muted { color:var(--muted) }
.resources {
  display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;
}
.pill {
  background:var(--panel); border:1px solid var(--line);
  border-radius:10px; padding:9px 12px;
}
.scene {
  position:relative; overflow:hidden; border-radius:16px;
  border:1px solid var(--line); background:#142c34;
}
canvas { display:block; width:100%; aspect-ratio:900/530 }
.badge {
  position:absolute; top:12px; left:12px; padding:7px 10px;
  background:#0b151dcc; border-radius:8px; font-size:12px;
  pointer-events:none;
}
nav { display:flex; gap:7px; margin:13px 0 }
button {
  color:var(--text); background:#263b42;
  border:1px solid #496068; border-radius:10px;
  padding:11px 13px; font:inherit; cursor:pointer;
  touch-action:manipulation;
}
button:active { transform:translateY(1px) }
button:disabled { opacity:.45; cursor:default }
nav button { flex:1; padding:11px 5px }
button.active,.primary {
  color:#172026; background:var(--gold); border-color:var(--gold);
}
.grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:10px;
}
.card {
  padding:15px; border:1px solid var(--line);
  background:var(--panel); border-radius:13px;
}
.card h3 { margin:0 0 7px; font-size:17px }
.card p { color:var(--muted); line-height:1.45; margin:8px 0 13px }
.card button { width:100% }
.hero { font-size:32px; float:right }
.progress {
  height:10px; background:#081216; border-radius:8px;
  overflow:hidden; margin:10px 0;
}
.progress div { height:100%; background:#7cbb8a }
#notice {
  min-height:44px; color:var(--gold); padding:10px 2px;
  line-height:1.4;
}
footer { margin-top:18px; font-size:12px; color:var(--muted) }
@media(max-width:420px) {
  h1 { font-size:19px }
  .pill { padding:8px; font-size:13px }
  main { padding:8px 8px 24px }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <small>СТРАТЕГИЯ ВЫЖИВАНИЯ</small>
      <h1>ПОСЛЕДНИЙ ПОРТ</h1>
    </div>
    <span class="pill" id="day"></span>
  </header>

  <div class="resources" id="resources"></div>

  <div class="scene">
    <canvas id="world" width="900" height="530"
            aria-label="База выживших и оборона"></canvas>
    <div class="badge" id="badge">СЕКТОР 07 · ПРИБРЕЖНОЕ УБЕЖИЩЕ</div>
  </div>

  <nav>
    <button data-tab="base">База</button>
    <button data-tab="heroes">Герои</button>
    <button data-tab="map">Вылазки</button>
    <button data-tab="battle">Оборона</button>
  </nav>

  <section id="panel"></section>
  <div id="notice" role="status">Командир, укрепи стену до следующей атаки.</div>
  <footer>
    Прототип · Локальное сохранение · Без покупок и рекламы
  </footer>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const KEY = "last-port-prototype-v1";
const fresh = () => ({
  food:180, wood:200, parts:50,
  wave:1,
  buildings:{hq:1,farm:1,mill:1,barracks:1,wall:1},
  heroes:[1,1,1],
  expedition:null,
  last:Date.now()
});

let s;
try {
  s = JSON.parse(localStorage.getItem(KEY)) || fresh();
  if (!s.buildings || !Array.isArray(s.heroes)) s = fresh();
} catch { s = fresh(); }

let storageWarning = false;
function save() {
  s.last = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(s)); }
  catch {
    if (!storageWarning) {
      storageWarning = true;
      say("Хранилище недоступно: прогресс сохранится только до закрытия игры.");
    }
  }
}
function say(text) { $("notice").textContent = text; }

try {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#102024");
    tg.setBackgroundColor("#0c171c");
  }
} catch {}

const defs = {
  hq:{
    name:"Штаб", desc:"Открывает новые уровни остальных зданий.",
    x:2,y:1,color:"#bc8b60",short:"ШТАБ"
  },
  farm:{
    name:"Теплицы", desc:"Производят еду для улучшений и экспедиций.",
    x:0,y:1,color:"#658d62",short:"ТЕПЛИЦЫ"
  },
  mill:{
    name:"Лесопилка", desc:"Производит древесину для строительства.",
    x:0,y:3,color:"#a27c54",short:"ЛЕСОПИЛКА"
  },
  barracks:{
    name:"Казармы", desc:"Увеличивают урон защитников.",
    x:3,y:3,color:"#698c92",short:"КАЗАРМЫ"
  },
  wall:{
    name:"Периметр", desc:"Увеличивает прочность обороны.",
    x:4,y:1,color:"#898f97",short:"ПЕРИМЕТР"
  }
};
const heroes = [
  {name:"Мира «Искра»",role:"Инженер · +18 прочности за уровень",icon:"🔧"},
  {name:"Лев «Север»",role:"Следопыт · +3 урона за уровень",icon:"🎯"},
  {name:"Ада «Пульс»",role:"Медик · +12 прочности за уровень",icon:"🩺"}
];

function produce(seconds) {
  s.food += seconds * s.buildings.farm * .45;
  s.wood += seconds * s.buildings.mill * .35;
}
produce(Math.min(28800, Math.max(0, (Date.now()-s.last)/1000)));

let tab = "base";
let fight = null;
let lastTick = Date.now();
let lastSaved = Date.now();
let lastShot = 0;

function cost(id) {
  const n = s.buildings[id];
  return {wood:Math.round(65*Math.pow(1.65,n-1)), food:35*n};
}
function power() {
  return 9 + s.buildings.barracks*5 + s.heroes[1]*3;
}
function maxHP() {
  return 170+s.buildings.wall*65+s.heroes[0]*18+s.heroes[2]*12;
}

function upgrade(id) {
  if (fight) return say("Строительство недоступно во время атаки.");
  const c = cost(id);
  if (id!=="hq" && s.buildings[id]>=s.buildings.hq+1)
    return say("Сначала улучши штаб.");
  if (s.wood<c.wood || s.food<c.food)
    return say("Не хватает ресурсов. Подожди производство или отправь вылазку.");
  s.wood-=c.wood;
  s.food-=c.food;
  s.buildings[id]++;
  save(); render();
  say(defs[id].name+" улучшены.");
}

function train(i) {
  if (fight) return say("Герои заняты обороной.");
  const c=s.heroes[i]*25;
  if (s.parts<c) return say("Не хватает деталей: их приносят вылазки и оборона.");
  s.parts-=c;
  s.heroes[i]++;
  save(); render();
  say(heroes[i].name+" получает новый уровень.");
}

function expedition(kind) {
  if (s.expedition) return say("Отряд уже в пути.");
  if (fight) return say("Сначала заверши оборону.");
  const price=kind==="dock"?45:25;
  if (s.food<price) return say("Не хватает еды для отряда.");
  s.food-=price;
  s.expedition={
    kind, ends:Date.now()+(kind==="dock"?90000:45000)
  };
  save(); render();
  say("Отряд вышел за периметр.");
}
function checkExpedition() {
  if (!s.expedition || Date.now()<s.expedition.ends) return;
  const dock=s.expedition.kind==="dock";
  s.wood+=dock?110:65;
  s.food+=dock?30:45;
  s.parts+=dock?40:15;
  s.expedition=null;
  save();
  say(dock
    ?"Отряд вернулся из доков: +110 дерева, +30 еды, +40 деталей."
    :"Отряд вернулся: +65 дерева, +45 еды, +15 деталей.");
}

function startFight() {
  if (fight) return;
  if (s.expedition) return say("Дождись возвращения отряда из вылазки.");
  const enemyMax=140+s.wave*85;
  fight={
    hp:maxHP(), max:maxHP(),
    enemy:enemyMax, enemyMax, wave:s.wave,
    flash:0
  };
  tab="battle";
  render();
  say("Заражённые у стены! Огонь ведётся автоматически. Помогай кнопкой удара.");
}
function shoot() {
  if (!fight || Date.now()-lastShot<550) return;
  lastShot=Date.now();
  fight.enemy-=power()*.8;
  fight.flash=.15;
  resolveFight();
}
function resolveFight() {
  if (!fight) return;
  if (fight.enemy<=0) {
    const n=fight.wave;
    s.wood+=60+n*20;
    s.food+=45+n*10;
    s.parts+=15+n*5;
    s.wave++;
    fight=null;
    save(); render();
    say("Волна отражена! Получены дерево, еда и детали. Оборона восстановлена.");
  } else if (fight.hp<=0) {
    s.food=Math.max(0,s.food-35);
    fight=null;
    save(); render();
    say("Отступление! Потеряно 35 еды. Периметр восстановлен — усиливай базу.");
  }
}

function render() {
  $("day").textContent="Волна "+s.wave;
  $("resources").innerHTML=
    `<span class="pill">🌾 ${Math.floor(s.food)}</span>
     <span class="pill">🪵 ${Math.floor(s.wood)}</span>
     <span class="pill">⚙️ ${Math.floor(s.parts)}</span>
     <span class="pill">⚔️ ${power()}</span>`;

  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===tab);
  });

  if(tab==="base") {
    $("panel").innerHTML=`<div class="grid">${
      Object.entries(defs).map(([id,d])=>{
        const c=cost(id);
        return `<article class="card">
          <h3>${d.name} · ур. ${s.buildings[id]}</h3>
          <p>${d.desc}</p>
          <button data-up="${id}" ${fight?"disabled":""}>
            Улучшить · 🪵 ${c.wood} · 🌾 ${c.food}
          </button>
        </article>`;
      }).join("")
    }</div>`;
  }

  if(tab==="heroes") {
    $("panel").innerHTML=`<div class="grid">${
      heroes.map((h,i)=>`<article class="card">
        <span class="hero">${h.icon}</span>
        <h3>${h.name}</h3>
        <p>${h.role}<br>Уровень: ${s.heroes[i]}</p>
        <button data-train="${i}" ${fight?"disabled":""}>
          Обучить · ⚙️ ${s.heroes[i]*25}
        </button>
      </article>`).join("")
    }</div>`;
  }

  if(tab==="map") {
    const remaining=s.expedition
      ?Math.max(0,Math.ceil((s.expedition.ends-Date.now())/1000)):0;
    $("panel").innerHTML=`
      <div class="card" style="margin-bottom:10px">
        ${s.expedition
          ?`Отряд вернётся через ${remaining} сек.`
          :"Выбери маршрут. Награда начисляется после возвращения."}
      </div>
      <div class="grid">
        <article class="card">
          <h3>Заброшенный квартал</h3>
          <p>45 секунд · Награда: 65 дерева, 45 еды, 15 деталей.</p>
          <button data-exp="block" ${s.expedition||fight?"disabled":""}>
            Отправить · 🌾 25
          </button>
        </article>
        <article class="card">
          <h3>Старые доки</h3>
          <p>90 секунд · Награда: 110 дерева, 30 еды, 40 деталей.</p>
          <button data-exp="dock" ${s.expedition||fight?"disabled":""}>
            Отправить · 🌾 45
          </button>
        </article>
      </div>`;
  }

  if(tab==="battle") {
    $("panel").innerHTML=fight
      ?`<article class="card">
         <h3>Оборона · волна ${fight.wave}</h3>
         <p>Периметр: ${Math.max(0,Math.ceil(fight.hp))} / ${fight.max}</p>
         <div class="progress"><div style="width:${
           Math.max(0,fight.hp/fight.max*100)}%"></div></div>
         <p>Сила орды: ${Math.max(0,Math.ceil(fight.enemy))}</p>
         <button class="primary" data-shoot>Прицельный удар</button>
       </article>`
      :`<article class="card">
         <h3>Приближается волна ${s.wave}</h3>
         <p>Прочность: ${maxHP()} · Урон в секунду: ${power()}.
         Защищай убежище и добывай детали для героев.</p>
         <button class="primary" data-start
           ${s.expedition?"disabled":""}>Начать оборону</button>
       </article>`;
  }
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b || b.disabled) return;
  if(b.dataset.tab) { tab=b.dataset.tab; render(); }
  if(b.dataset.up) upgrade(b.dataset.up);
  if(b.dataset.train!==undefined) train(Number(b.dataset.train));
  if(b.dataset.exp) expedition(b.dataset.exp);
  if(b.hasAttribute("data-start")) startFight();
  if(b.hasAttribute("data-shoot")) shoot();
});

/* Оригинальная процедурная изометрическая сцена. */
const canvas=$("world");
const ctx=canvas.getContext("2d");
const iso=(x,y)=>({x:430+(x-y)*67,y:137+(x+y)*35});

function poly(points,fill,stroke) {
  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle=fill;
  ctx.fill();
  if(stroke) { ctx.strokeStyle=stroke; ctx.stroke(); }
}
function block(x,y,w,d,h,color) {
  const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+d),e=iso(x,y+d);
  const up=p=>({x:p.x,y:p.y-h});
  poly([e,c,up(c),up(e)],"#354850","#1b3036");
  poly([b,c,up(c),up(b)],"#263940","#1b3036");
  poly([up(a),up(b),up(c),up(e)],color,"#c4c2a044");
}
function person(x,y,color,scale=1) {
  ctx.fillStyle="#0005";
  ctx.beginPath();ctx.ellipse(x,y+7,6*scale,3*scale,0,0,7);ctx.fill();
  ctx.fillStyle=color;
  ctx.fillRect(x-3*scale,y-6*scale,6*scale,12*scale);
  ctx.fillStyle="#c4af8d";
  ctx.beginPath();ctx.arc(x,y-10*scale,3*scale,0,7);ctx.fill();
}
function draw(ms) {
  const t=ms/1000;
  const sky=ctx.createLinearGradient(0,0,0,530);
  sky.addColorStop(0,"#172c3d");
  sky.addColorStop(.5,"#516366");
  sky.addColorStop(1,"#102b35");
  ctx.fillStyle=sky;ctx.fillRect(0,0,900,530);

  ctx.fillStyle="#ddaf7044";
  ctx.beginPath();ctx.arc(725,75,35,0,7);ctx.fill();

  // Дальний силуэт города.
  for(let i=0;i<26;i++){
    const h=20+(Math.sin(i*9)+1)*25;
    ctx.fillStyle=i%2?"#182c35":"#233a43";
    ctx.fillRect(i*38,120-h,27,h);
  }

  // Вода и движущиеся блики.
  ctx.strokeStyle="#8ab5b52d";ctx.lineWidth=2;
  for(let i=0;i<48;i++){
    const x=(i*113+t*9)%960-30;
    const y=155+(i*47)%365;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+24,y);ctx.stroke();
  }

  // Остров, плитка и дороги.
  for(let y=-1;y<6;y++){
    for(let x=-1;x<6;x++){
      const road=x===1||y===2;
      poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],
        road?"#8a846d":((x+y)%2?"#536255":"#5b6a5b"),
        "#203b3433");
    }
  }

  // Деревянный причал.
  for(let i=0;i<4;i++) block(5.7,3+i*.3,1.15,.22,6,"#8d7457");

  Object.entries(defs)
    .sort((a,b)=>(a[1].x+a[1].y)-(b[1].x+b[1].y))
    .forEach(([id,d])=>{
      const level=s.buildings[id];
      const h=id==="wall"?24:28+level*4;
      block(d.x,d.y,.82,.82,h,d.color);
      const p=iso(d.x+.4,d.y+.4);

      if(id==="hq") {
        ctx.strokeStyle="#d4bc83";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(p.x,p.y-h);
        ctx.lineTo(p.x,p.y-h-35);ctx.stroke();
        poly([
          {x:p.x,y:p.y-h-35},
          {x:p.x+22,y:p.y-h-29},
          {x:p.x,y:p.y-h-21}
        ],"#df9563");
      }

      ctx.textAlign="center";ctx.font="bold 12px system-ui";
      ctx.fillStyle="#07171dc9";
      ctx.fillRect(p.x-53,p.y-h-23,106,20);
      ctx.fillStyle="#edf0db";
      ctx.fillText(d.short+" "+level,p.x,p.y-h-9);
    });

  // Передняя линия периметра.
  for(let i=-1;i<6;i++) block(i,5.6,.88,.14,18,"#b4a07b");

  // Мирные жители.
  for(let i=0;i<9;i++){
    const p=iso(1.4,((t*.15+i*.59)%5)-.5);
    person(p.x,p.y,i%2?"#d8a569":"#809fac",.8);
  }

  if(fight) {
    $("badge").textContent="ТРЕВОГА · ВОЛНА "+fight.wave;
    const count=Math.max(1,Math.ceil(fight.enemy/fight.enemyMax*22));
    for(let i=0;i<count;i++){
      const x=130+i*29;
      const y=465+Math.sin(t*2+i)*7+(i%3)*13;
      person(x,y,"#74956e",1.25);
    }
    for(let i=0;i<6;i++){
      const p=iso(i-.5,5.2);
      person(p.x,p.y,"#c2a277");
      if(Math.sin(t*15+i)>0.7 || fight.flash>0){
        ctx.strokeStyle="#ffdc84";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(p.x,p.y-6);
        ctx.lineTo(130+((i*97+t*50)%600),473);
        ctx.stroke();
      }
    }
    ctx.fillStyle="#f5905b";
    ctx.textAlign="right";ctx.font="bold 15px system-ui";
    ctx.fillText("ПЕРИМЕТР "+Math.max(0,Math.ceil(fight.hp)),874,34);
  } else {
    $("badge").textContent="СЕКТОР 07 · ПРИБРЕЖНОЕ УБЕЖИЩЕ";
  }

  requestAnimationFrame(draw);
}

setInterval(()=>{
  const now=Date.now();
  const dt=Math.max(0,(now-lastTick)/1000);
  lastTick=now;

  produce(Math.min(dt,28800));
  checkExpedition();

  if(fight) {
    // В фоне бой приостанавливается: не проигрываем из-за свёрнутого окна.
    const combatDt=document.hidden?0:Math.min(dt,.5);
    fight.enemy-=power()*combatDt;
    fight.hp-=(9+fight.wave*4)*combatDt;
    fight.flash=Math.max(0,fight.flash-combatDt);
    resolveFight();
  }

  render();
  if(now-lastSaved>5000) { save(); lastSaved=now; }
},250);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden) save();
});
window.addEventListener("pagehide",save);

checkExpedition();
render();
requestAnimationFrame(draw);
</script>
</body>
</html>
