<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TWD: Survivors - Isometric Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0c0f12; color: #fff; overflow: hidden; display: flex; justify-content: center; }

    .game-app {
      width: 100vw; max-width: 480px; height: 100vh; position: relative;
      background: radial-gradient(circle at center, #181d22 0%, #080a0c 100%);
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* ================= 1. ВЕРХНИЙ ИНТЕРФЕЙС (ВАШ ОРИГИНАЛЬНЫЙ UI) ================= */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start; z-index: 100;
    }

    .profile-card {
      background: rgba(18, 21, 25, 0.85); border: 1px solid #d48806;
      border-radius: 30px; padding: 4px 14px 4px 4px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    }
    .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #f0a500; object-fit: cover; }
    .profile-info .base-lvl { font-size: 9px; color: #a0aab2; font-weight: 700; letter-spacing: 0.5px; }
    .profile-info .power { font-size: 15px; color: #fff; font-weight: 900; display: flex; align-items: center; gap: 4px; }

    .resources-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 220px; }
    .res-item {
      background: rgba(18, 21, 25, 0.85); border: 1px solid #2a313a; border-radius: 16px;
      padding: 4px 10px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px;
      backdrop-filter: blur(8px);
    }

    /* Виджет Главы */
    .chapter-widget {
      position: absolute; top: 70px; left: 12px; z-index: 100;
      background: rgba(18, 21, 25, 0.9); border: 1px solid #343c46; border-radius: 12px;
      padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .chapter-avatar { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    .chapter-title { font-size: 10px; color: #8c97a0; }
    .chapter-name { font-size: 12px; font-weight: bold; color: #fff; }

    /* ================= 2. 2.5D ИЗОМЕТРИЧЕСКАЯ КАРТА И ОБЪЕМНЫЕ ЗДАНИЯ ================= */
    .viewport {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }

    .iso-world {
      position: relative; width: 320px; height: 320px;
      transform: rotateX(60deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    /* Объемная плитка земли */
    .tile-3d {
      position: absolute; width: 80px; height: 80px;
      transform-style: preserve-3d; cursor: pointer;
    }

    /* Текстура поверхности земли */
    .tile-top {
      position: absolute; width: 100%; height: 100%;
      background: #1c2420; border: 1px solid rgba(255,255,255,0.05);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }
    .tile-3d:hover .tile-top { background: #26332c; border-color: #f0a500; }

    /* Земля в тумане */
    .tile-3d.fog .tile-top {
      background: #0d1012; border: 1px dashed #3a2224;
    }
    .tile-3d.fog::after {
      content: "🔒"; position: absolute; top: 25px; left: 28px; font-size: 20px;
      transform: rotateZ(45deg) rotateX(-60deg);
      filter: drop-shadow(0 0 8px rgba(240,165,0,0.6));
    }

    /* ОБЪЕМНОЕ 3D ЗДАНИЕ (Куб с гранями) */
    .building-3d {
      position: absolute; width: 60px; height: 60px; top: 10px; left: 10px;
      transform-style: preserve-3d;
      transform: translateZ(0px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Высота здания (вытягивание вверх по оси Z) */
    .building-3d .wall {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
    }
    
    /* Крыша здания */
    .building-3d .roof {
      position: absolute; width: 60px; height: 60px;
      background: #3a434b; border: 1px solid #f0a500;
      transform: translateZ(40px); /* Высота здания */
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; box-shadow: inset 0 0 15px rgba(240, 165, 0, 0.2);
    }

    /* Передняя грань 3D куба */
    .building-3d .front-wall {
      height: 40px; background: linear-gradient(180deg, #282f35, #15191c);
      transform: rotateX(-90deg) translateZ(30px) translateY(20px);
      border-left: 1px solid #4a545e; border-bottom: 2px solid #000;
    }

    /* Боковая грань 3D куба */
    .building-3d .side-wall {
      height: 40px; background: linear-gradient(180deg, #1e2328, #0e1113);
      transform: rotateY(90deg) translateZ(30px) translateY(-20px);
      border-right: 1px solid #343c45; border-bottom: 2px solid #000;
    }

    /* Иконка сбора ресурсов над крышей */
    .collect-badge {
      position: absolute; top: -35px; left: 15px;
      transform: rotateZ(45deg) rotateX(-60deg) translateZ(50px);
      background: linear-gradient(180deg, #f0a500, #c78600); color: #000;
      padding: 4px 10px; border-radius: 12px; font-weight: 900; font-size: 11px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6); animation: float 1.2s infinite alternate ease-in-out;
      cursor: pointer; z-index: 100;
    }
    @keyframes float { from { transform: rotateZ(45deg) rotateX(-60deg) translateZ(50px) translateY(0); } to { transform: rotateZ(45deg) rotateX(-60deg) translateZ(50px) translateY(-8px); } }

    /* ================= 3. НИЖНЯЯ НАВИГАЦИЯ (КАК НА СКРИНШОТАХ) ================= */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 65px; background: rgba(14, 17, 20, 0.95); border-top: 1px solid #232931;
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6a7682; cursor: pointer; font-size: 10px; font-weight: 600; }
    .nav-item.active { color: #f0a500; }
    .nav-icon { font-size: 20px; }

    /* Всплывающее контекстное меню под зданием */
    .action-sheet {
      position: absolute; bottom: 75px; left: 12px; right: 12px;
      background: #161a1e; border: 1px solid #2e3640; border-radius: 16px;
      padding: 14px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-action {
      background: linear-gradient(180deg, #f0a500, #b87e00); color: #000;
      border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-app">

  <!-- ВЕРХНЯЯ ПАНЕЛЬ (HUD) -->
  <div class="top-bar">
    <div class="profile-card">
      <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80" class="avatar" alt="Avatar">
      <div class="profile-info">
        <div class="base-lvl">БАЗА УР. 1</div>
        <div class="power">⚔️ <span id="power-val">57</span></div>
      </div>
    </div>

    <div class="resources-bar">
      <div class="res-item" style="color: #8bc34a;">🌾 <span id="food-val">5 900</span></div>
      <div class="res-item" style="color: #d7ccc8;">🪵 <span id="wood-val">4 300</span></div>
      <div class="res-item" style="color: #00bcd4;">💎 <span id="dia-val">90</span></div>
    </div>
  </div>

  <!-- ВИДЖЕТ ГЛАВЫ -->
  <div class="chapter-widget">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="chapter-avatar" alt="Chapter">
    <div>
      <div class="chapter-title">Глава 1</div>
      <div class="chapter-name">Сигнал в темноте</div>
    </div>
  </div>

  <!-- ИЗОМЕТРИЧЕСКИЙ МИР 2.5D -->
  <div class="viewport">
    <div class="iso-world" id="iso-world">
      <!-- Здания и Земля генерируются через JS -->
    </div>
  </div>

  <!-- ВСПЛЫВАЮЩЕЕ МЕНЮ ВЗАИМОДЕЙСТВИЯ -->
  <div id="action-sheet" class="action-sheet hidden">
    <div>
      <h4 id="sheet-title" style="color: #f0a500; font-size: 15px;">Лесопилка (Ур. 1)</h4>
      <p id="sheet-desc" style="font-size: 11px; color: #8c97a0;">Добыча древесины для развития базы.</p>
    </div>
    <button class="btn-action" id="sheet-btn">Улучшить (🪵 50)</button>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">🏚️</span>База</div>
    <div class="nav-item"><span class="nav-icon">🗺️</span>Земли</div>
    <div class="nav-item"><span class="nav-icon">⭐</span>Герои</div>
    <div class="nav-item"><span class="nav-icon">🚩</span>Армия</div>
    <div class="nav-item"><span class="nav-icon">🌐</span>Карта</div>
  </div>

</div>

<script>
  // Данные плиток и объемных зданий
  const mapData = [
    { x: 0, y: 0, fog: true, reqPower: 80 },
    { x: 1, y: 0, fog: true, reqPower: 120 },
    { x: 2, y: 0, fog: false, empty: true },
    
    { x: 0, y: 1, fog: false, building: { name: 'Штаб', icon: '⛺', lvl: 1 } },
    { x: 1, y: 1, fog: false, building: { name: 'Теплицы', icon: '🌾', lvl: 1, resource: '🌾 150' } },
    { x: 2, y: 1, fog: false, building: { name: 'Лесопилка', icon: '🪵', lvl: 1, resource: '🪵 80' } },

    { x: 0, y: 2, fog: false, empty: true },
    { x: 1, y: 2, fog: false, building: { name: 'Казарма', icon: '🪖', lvl: 1 } },
    { x: 2, y: 2, fog: true, reqPower: 150 },
  ];

  const worldEl = document.getElementById('iso-world');
  const actionSheet = document.getElementById('action-sheet');

  function render3DWorld() {
    worldEl.innerHTML = '';

    mapData.forEach((tile, index) => {
      const tileEl = document.createElement('div');
      tileEl.className = `tile-3d ${tile.fog ? 'fog' : ''}`;
      tileEl.style.left = `${tile.x * 90}px`;
      tileEl.style.top = `${tile.y * 90}px`;

      // Верхняя грань земли
      const topEl = document.createElement('div');
      topEl.className = 'tile-top';
      tileEl.appendChild(topEl);

      // Если на клетке есть ОБЪЕМНОЕ ЗДАНИЕ
      if (tile.building && !tile.fog) {
        const b3d = document.createElement('div');
        b3d.className = 'building-3d';
        
        b3d.innerHTML = `
          <div class="wall front-wall"></div>
          <div class="wall side-wall"></div>
          <div class="roof">${tile.building.icon}</div>
        `;

        // Иконка готового ресурса над крышей
        if (tile.building.resource) {
          const badge = document.createElement('div');
          badge.className = 'collect-badge';
          badge.innerText = tile.building.resource;
          badge.onclick = (e) => {
            e.stopPropagation();
            alert(`Собрано ${tile.building.resource}!`);
            tile.building.resource = null;
            render3DWorld();
          };
          b3d.appendChild(badge);
        }

        tileEl.appendChild(b3d);
      }

      // Клик по объекту
      tileEl.onclick = () => {
        if (tile.fog) {
          alert(`Для зачистки сектора требуется Сила Армии: ⚔️ ${tile.reqPower}`);
          actionSheet.classList.add('hidden');
        } else if (tile.building) {
          document.getElementById('sheet-title').innerText = `${tile.building.name} (Ур. ${tile.building.lvl})`;
          document.getElementById('sheet-desc').innerText = `Добыча ресурсов и развитие базы.`;
          actionSheet.classList.remove('hidden');
        } else {
          actionSheet.classList.add('hidden');
        }
      };

      worldEl.appendChild(tileEl);
    });
  }

  render3DWorld();
</script>

</body>
</html>
