};

// ======================== CONSTRUCTION ========================
const Construction = {
  start(buildingId) {
    if (State.constructionQueue.length >= 1) { toast('Строитель занят!', 'danger'); return; }
    const b = BUILDINGS[buildingId];
    const currentLevel = State.buildings[buildingId] || 0;
    const nextLevel = currentLevel + 1;
    if (nextLevel > b.maxLevel) { toast('Максимальный уровень!', 'danger'); return; }
    if (b.reqHQ && (State.buildings.hq||1) < b.reqHQ) { toast(`Нужен Штаб ур.${b.reqHQ}`, 'danger'); return; }

    const costs = b.costs(nextLevel);
    if (!canAfford(costs)) { toast('Не хватает ресурсов!', 'danger'); return; }

    spendResources(costs);
    const duration = b.time(nextLevel); // seconds

    State.constructionQueue.push({
      buildingId,
      targetLevel: nextLevel,
      startTime: Date.now(),
      duration
    });

    toast(`${b.icon} ${b.name} → Ур.${nextLevel} (${fmtTime(duration)})`, 'success');
    saveGame();
    Nav.go('build');
  },

  complete(buildingId) {
    const idx = State.constructionQueue.findIndex(q => q.buildingId === buildingId);
    if (idx === -1) return;
    const q = State.constructionQueue[idx];
    const remaining = (q.startTime + q.duration * 1000) - Date.now();
    if (remaining > 0) { toast('Ещё не готово!', 'danger'); return; }

    State.buildings[buildingId] = q.targetLevel;
    State.constructionQueue.splice(idx, 1);

    // Update wall HP if wall upgraded
    if (buildingId === 'wall') {
      State.maxWallHP = 100 + q.targetLevel * 50;
      State.wallHP = State.maxWallHP;
    }

    const b = BUILDINGS[buildingId];
    toast(`${b.icon} ${b.name} → Ур.${q.targetLevel} завершено!`, 'success');
    saveGame();
    Nav.go(Nav.current);
  },

  cancel(buildingId) {
    const idx = State.constructionQueue.findIndex(q => q.buildingId === buildingId);
    if (idx === -1) return;
    const q = State.constructionQueue[idx];
    const b = BUILDINGS[buildingId];
    // Refund 50%
    const costs = b.costs(q.targetLevel);
    for (const r in costs) {
      State.resources[r] = (State.resources[r]||0) + Math.floor(costs[r] * 0.5);
    }
    State.constructionQueue.splice(idx, 1);
    toast(`Строительство ${b.name} отменено. 50% ресурсов возвращено.`, 'warning');
    saveGame();
    Nav.go(Nav.current);
  },

  checkCompletions() {
    const now = Date.now();
    for (const q of State.constructionQueue) {
      if (q.startTime + q.duration * 1000 <= now && !q._notified) {
        q._notified = true;
        const b = BUILDINGS[q.buildingId];
        toast(`${b.icon} ${b.name} готово к завершению!`, 'success');
      }
    }
  }
};

// ======================== EXPEDITIONS ========================
const Expeditions = {
  discover(locId) {
    if ((State.resources.fuel||0) < 5) { toast('Нужно 5 ⛽', 'danger'); return; }
    State.resources.fuel -= 5;
    if (!State.discoveredLocations.includes(locId)) {
      State.discoveredLocations.push(locId);
      const loc = MAP_LOCATIONS.find(l => l.id === locId);
      toast(`${loc.icon} ${loc.name} обнаружено!`, 'success');
    }
    saveGame();
    Nav.go('map');
  },

  send(locId) {
    if (State.activeExpedition) { toast('Уже есть активная экспедиция!', 'danger'); return; }
    if (State.squad.length === 0) { toast('Назначьте отряд!', 'danger'); return; }
    const loc = MAP_LOCATIONS.find(l => l.id === locId);
    const fuelCost = loc.distance * 3;
    if ((State.resources.fuel||0) < fuelCost) { toast('Нужно больше топлива!', 'danger'); return; }

    State.resources.fuel -= fuelCost;
    State.activeExpedition = {
      locationId: locId,
      startTime: Date.now(),
      duration: loc.distance * 20, // seconds
      squad: [...State.squad]
    };
    State.stats.expeditions++;
    toast(`Отряд отправлен к ${loc.icon} ${loc.name}`, 'success');
    saveGame();
    Nav.go('map');
  },

  complete() {
    if (!State.activeExpedition) return;
    const remaining = (State.activeExpedition.startTime + State.activeExpedition.duration * 1000) - Date.now();
    if (remaining > 0) { toast('Отряд ещё в пути!', 'danger'); return; }

    const loc = MAP_LOCATIONS.find(l => l.id === State.activeExpedition.locationId);
    // Calculate success based on squad strength vs difficulty
    let totalPower = 0;
    for (const id of State.activeExpedition.squad) {
      const hs = getHeroState(id);
      if (hs) {
        const stats = getHeroEffectiveStats(hs);
        totalPower += stats.atk + stats.def;
      }
    }
    const successChance = clamp(0.5 + (totalPower - loc.difficulty * 15) / 100, 0.2, 0.95);
    const success = Math.random() < successChance;

    if (success) {
      addResources(loc.loot);
      addXP(loc.xp);
      // Grant hero XP
      for (const id of State.activeExpedition.squad) {
        grantHeroXP(id, loc.xp);
      }
      // Discover next location
      const locIdx = MAP_LOCATIONS.findIndex(l => l.id === loc.id);
      if (locIdx + 1 < MAP_LOCATIONS.length) {
        const nextLoc = MAP_LOCATIONS[locIdx + 1];
        if (!State.discoveredLocations.includes(nextLoc.id)) {
          State.discoveredLocations.push(nextLoc.id);
          toast(`Обнаружено: ${nextLoc.icon} ${nextLoc.name}`, 'success');
        }
      }
      const lootText = Object.entries(loc.loot).map(([r,v]) => `${RES_NAMES[r]?.split(' ')[0]||r} ${v}`).join(', ');
      toast(`✅ Экспедиция успешна! ${lootText}`, 'success');
    } else {
      // Wound a random hero
      const woundId = pick(State.activeExpedition.squad);
      const hs = getHeroState(woundId);
      if (hs) {
        hs.wounded = true;
        hs.woundHealTime = Date.now() + 120000; // 2 min
      }
      // Still get partial loot
      const partial = {};
      for (const r in loc.loot) partial[r] = Math.floor(loc.loot[r] * 0.3);
      addResources(partial);
      toast(`⚠️ Экспедиция провалена. ${getHeroTemplate(woundId)?.name} ранен.`, 'danger');
    }

    State.activeExpedition = null;
    saveGame();
    Nav.go('map');
  }
};

function grantHeroXP(heroId, amount) {
  const hs = getHeroState(heroId);
  if (!hs) return;
  hs.xp += amount;
  const needed = hs.level * 50;
  while (hs.xp >= needed) {
    hs.xp -= needed;
    hs.level++;
    const t = getHeroTemplate(heroId);
    toast(`${t.icon} ${t.name} → Ур.${hs.level}!`, 'success');
  }
}

// ======================== ACTIONS ========================
const Actions = {
  repairWall() {
    if (State.resources.wood < 10) { toast('Нужно 10 🪵', 'danger'); return; }
    if (State.wallHP >= State.maxWallHP) { toast('Стена не повреждена', 'warning'); return; }
    State.resources.wood -= 10;
    State.wallHP = Math.min(State.maxWallHP, State.wallHP + 25);
    toast('🧱 Стена починена +25', 'success');
    saveGame();
    Nav.go(Nav.current);
  },

  toggleSquad(heroId) {
    const hs = getHeroState(heroId);
    if (!hs) return;
    if (hs.wounded) { toast('Герой ранен!', 'danger'); return; }
    const maxSquad = 3 + Math.floor((State.buildings.barracks||0) / 2);
    const idx = State.squad.indexOf(heroId);
    if (idx >= 0) {
      State.squad.splice(idx, 1);
    } else {
      if (State.squad.length >= maxSquad) { toast(`Максимум ${maxSquad} бойцов`, 'danger'); return; }
      State.squad.push(heroId);
    }
    saveGame();
    Nav.go('heroes');
  },

  claimDaily() {
    const today = new Date().toDateString();
    if (State.lastDailyDate === today) { toast('Уже получено сегодня', 'warning'); return; }
    const dayIndex = State.dailyStreak % 7;
    const reward = DAILY_REWARDS[dayIndex];
    addResources(reward);
    State.lastDailyDate = today;
    State.dailyStreak++;
    const rewardText = Object.entries(reward).map(([r,v]) => `${RES_NAMES[r]?.split(' ')[0]||r} ${v}`).join(', ');
    toast(`🎁 ${rewardText}`, 'success');
    saveGame();
    Nav.go('quests');
  },

  claimQuest(questId) {
    if (State.completedQuests.includes(questId)) return;
    let quest = null;
    for (const ch of CHAPTERS) {
      const q = ch.quests.find(q => q.id === questId);
      if (q) { quest = q; break; }
    }
    if (!quest) return;
    if (!quest.check(State)) { toast('Задание не выполнено', 'danger'); return; }
    addResources(quest.reward);
    State.completedQuests.push(questId);
    saveGame();
    Nav.go('quests');
  },

  resetGame() {
    Modal.show(`
      <h3>⚠️ Сбросить прогресс?</h3>
      <div class="text-sm text-dim mb-12">Все данные будут удалены навсегда.</div>
      <div style="display:flex;gap:8px">
        <button class="btn-danger" style="flex:1" onclick="localStorage.removeItem('${SAVE_KEY}'); location.reload();">Сбросить</button>
        <button class="btn-secondary" style="flex:1" onclick="Modal.close()">Отмена</button>
      </div>
    `);
  }
};

// ======================== WAVE MODIFIER SELECTION ========================
function getWaveModifier(waveNum) {
  if (waveNum % 10 === 0) return WAVE_MODS.bloodmoon;
  if (waveNum % 5 === 0) return WAVE_MODS.boss;
  const pool = ['normal', 'fog', 'rage', 'horde', 'normal'];
  const modKey = pool[(waveNum - 1) % pool.length];
  return WAVE_MODS[modKey];
}

// ======================== BATTLE SCENE (Canvas) ========================
const BattleScene = {
  active: false,
  paused: false,
  speed: 1,
  canvas: null,
  ctx: null,
  animFrame: null,
  lastTime: 0,

  // Battle state
  heroes: [],
  enemies: [],
  turrets: [],
  particles: [],
  floatingTexts: [],
  waveNum: 0,
  waveMod: null,
  kills: 0,
  elapsed: 0,
  enemiesSpawned: 0,
  totalEnemiesToSpawn: 0,
  spawnTimer: 0,
  spawnInterval: 2,
  battleOver: false,
  victory: false,
  wallHP: 0,
  maxWallHP: 0,

  // Skill effects
  buffATK: 0,
  buffATKTimer: 0,
  shieldMul: 0,
  shieldTimer: 0,
  debuffTarget: null,
  debuffTimer: 0,

  start() {
    if (State.squad.length === 0) { toast('Назначьте отряд!', 'danger'); return; }
    const hasWounded = State.squad.some(id => { const hs = getHeroState(id); return hs && hs.wounded; });
    if (hasWounded) { toast('Есть раненые!', 'danger'); return; }

    this.waveNum = State.stats.wavesCleared + 1;
    this.waveMod = getWaveModifier(this.waveNum);
    this.kills = 0;
    this.elapsed = 0;
    this.enemiesSpawned = 0;
    this.battleOver = false;
    this.victory = false;
    this.speed = 1;
    this.paused = false;
    this.enemies = [];
    this.turrets = [];
    this.particles = [];
    this.floatingTexts = [];
    this.buffATK = 0; this.buffATKTimer = 0;
    this.shieldMul = 0; this.shieldTimer = 0;
    this.debuffTarget = null; this.debuffTimer = 0;

    // Setup wall
    this.wallHP = State.wallHP;
    this.maxWallHP = State.maxWallHP;

    // Calculate enemies
    const baseCount = 5 + this.waveNum * 2;
    this.totalEnemiesToSpawn = Math.ceil(baseCount * this.waveMod.countMul);
    this.spawnTimer = 0;
    this.spawnInterval = Math.max(0.5, 2 - this.waveNum * 0.05);

    // Setup heroes
    this.heroes = [];
    const positions = [0.25, 0.5, 0.75, 0.35, 0.65];
    State.squad.forEach((id, i) => {
      const hs = getHeroState(id);
      const t = getHeroTemplate(id);
      const stats = getHeroEffectiveStats(hs);
      this.heroes.push({
        id: id,
        template: t,
        hp: stats.hp,
        maxHP: stats.hp,
        atk: stats.atk,
        def: stats.def,
        x: 0.15,
        y: positions[i] || 0.5,
        attackTimer: 0,
        attackSpeed: t.classId === 'shooter' ? 1.2 : (t.classId === 'tank' ? 2.5 : 1.8),
        range: t.classId === 'shooter' ? 0.4 : (t.classId === 'medic' ? 0.35 : 0.15),
        skillCooldown: 0,
        skillReady: true,
        alive: true,
      });
    });

    // Show overlay
    this.canvas = document.getElementById('battle-canvas');
    this.ctx = this.canvas.getContext('2d');
    document.getElementById('battle-overlay').classList.add('active');
    this.resize();
    this.updateHUD();
    this.active = true;
    this.lastTime = performance.now();
    document.getElementById('btn-speed').textContent = '⏩ x1';

    // Update header
    document.getElementById('battle-wave-info').textContent = `Волна ${this.waveNum}`;
    document.getElementById('battle-wave-type').textContent = this.waveMod.name;
    document.getElementById('battle-wave-type').style.color = this.waveMod.color;

    this.animFrame = requestAnimationFrame(t => this.loop(t));
  },

  resize() {
    const parent = document.getElementById('battle-arena');
    const rect = parent.getBoundingClientRect();
    this.canvas.width = rect.width * devicePixelRatio;
    this.canvas.height = rect.height * devicePixelRatio;
    this.canvas.style.width = rect.width + 'px';
    this.canvas.style.height = rect.height + 'px';
  },

  loop(time) {
    if (!this.active) return;
    const rawDt = (time - this.lastTime) / 1000;
    this.lastTime = time;
    const dt = Math.min(rawDt, 0.1) * this.speed;

    if (!this.paused && !this.battleOver) {
      this.elapsed += dt;
      this.update(dt);
    }
    this.draw();
    this.animFrame = requestAnimationFrame(t => this.loop(t));
  },

  update(dt) {
    // Spawn enemies
    this.spawnTimer += dt;
    while (this.spawnTimer >= this.spawnInterval && this.enemiesSpawned < this.totalEnemiesToSpawn) {
      this.spawnTimer -= this.spawnInterval;
      this.spawnEnemy();
      this.enemiesSpawned++;
    }

    // Update buffs/debuffs
    if (this.buffATKTimer > 0) { this.buffATKTimer -= dt; if (this.buffATKTimer <= 0) this.buffATK = 0; }
    if (this.shieldTimer > 0) { this.shieldTimer -= dt; if (this.shieldTimer <= 0) this.shieldMul = 0; }
    if (this.debuffTimer > 0) { this.debuffTimer -= dt; if (this.debuffTimer <= 0) this.debuffTarget = null; }

    // Update turrets
    for (let i = this.turrets.length - 1; i >= 0; i--) {
      const tur = this.turrets[i];
      tur.lifetime -= dt;
      if (tur.lifetime <= 0) { this.turrets.splice(i, 1); continue; }
      tur.attackTimer += dt;
      if (tur.attackTimer >= 1) {
        tur.attackTimer = 0;
        const target = this.enemies.find(e => e.alive);
        if (target) {
          target.hp -= tur.dmg;
          this.addFloatingText(target.x, target.y, `-${tur.dmg}`, '#ff8844');
          if (target.hp <= 0) { target.alive = false; this.kills++; }
        }
      }
    }

    // Update heroes
    for (const hero of this.heroes) {
      if (!hero.alive) continue;
      hero.attackTimer += dt;
      hero.skillCooldown = Math.max(0, hero.skillCooldown - dt);
      hero.skillReady = hero.skillCooldown <= 0;

      // Find nearest enemy
      let nearest = null, nearDist = Infinity;
      for (const e of this.enemies) {
        if (!e.alive) continue;
        const d = Math.hypot(e.x - hero.x, e.y - hero.y);
        if (d < nearDist) { nearDist = d; nearest = e; }
      }

      if (nearest && hero.attackTimer >= hero.attackSpeed) {
        hero.attackTimer = 0;
        let dmg = hero.atk + (hero.atk * this.buffATK);
        dmg -= (nearest.def || 0);
        if (this.debuffTarget === nearest) dmg *= 1.5;
        dmg = Math.max(1, Math.floor(dmg));
        nearest.hp -= dmg;
        this.addFloatingText(nearest.x, nearest.y, `-${dmg}`, '#ffcc44');
        this.addParticle(nearest.x, nearest.y, '#ff6644');
        if (nearest.hp <= 0) {
          nearest.alive = false;
          this.kills++;
        }
      }

      // Medic auto-heal
      if (hero.template.classId === 'medic' && hero.attackTimer >= hero.attackSpeed) {
        const wounded = this.heroes.filter(h => h.alive && h.hp < h.maxHP).sort((a,b) => a.hp/a.maxHP - b.hp/b.maxHP);
        if (wounded.length > 0) {
          const target = wounded[0];
          const heal = Math.floor(hero.atk * 0.5);
          target.hp = Math.min(target.maxHP, target.hp + heal);
          this.addFloatingText(target.x, target.y - 0.02, `+${heal}`, '#44cc66');
        }
      }
    }

    // Update enemies
    for (const e of this.enemies) {
      if (!e.alive) continue;

      // Move toward heroes/wall
      let targetX = 0.05; // wall position
      let targetY = e.y;
      let nearest = null, nearDist = Infinity;
      for (const h of this.heroes) {
        if (!h.alive) continue;
        const d = Math.hypot(h.x - e.x, h.y - e.y);
        if (d < nearDist) { nearDist = d; nearest = h; }
      }
      if (nearest) { targetX = nearest.x; targetY = nearest.y; }

      const dx = targetX - e.x;
      const dy = targetY - e.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 0.06) {
        e.x += (dx / dist) * e.speed * dt * 0.1;
        e.y += (dy / dist) * e.speed * dt * 0.1;
      } else {
        // Attack
        e.attackTimer += dt;
        if (e.attackTimer >= 1.5) {
          e.attackTimer = 0;
          if (nearest && Math.hypot(nearest.x - e.x, nearest.y - e.y) < 0.08) {
            let dmg = e.atk;
            if (this.shieldMul > 0) dmg = Math.floor(dmg * (1 - this.shieldMul));
            dmg -= nearest.def * 0.3;
            dmg = Math.max(1, Math.floor(dmg));
            nearest.hp -= dmg;
            this.addFloatingText(nearest.x, nearest.y, `-${dmg}`, '#ff4444');
            if (nearest.hp <= 0) nearest.alive = false;
          } else if (e.x <= 0.08) {
            // Attack wall
            this.wallHP -= e.atk;
            this.addFloatingText(0.05, e.y, `-${e.atk}`, '#ff2222');
          }
        }
      }
    }

    // Cleanup dead enemies
    this.enemies = this.enemies.filter(e => e.alive || e.deathTimer > 0);

    // Update particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    // Update floating texts
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.life -= dt;
      ft.y -= dt * 0.04;
      if (ft.life <= 0) this.floatingTexts.splice(i, 1);
    }

    // Check win/lose
    const allHeroesDead = this.heroes.every(h => !h.alive);
    const allEnemiesDead = this.enemiesSpawned >= this.totalEnemiesToSpawn && this.enemies.every(e => !e.alive);
    const wallBroken = this.wallHP <= 0;

    if (allEnemiesDead) {
      this.battleOver = true;
      this.victory = true;
      setTimeout(() => this.showResult(), 500);
    } else if (allHeroesDead || wallBroken) {
      this.battleOver = true;
      this.victory = false;
      setTimeout(() => this.showResult(), 500);
    }

    // Update HUD
    document.getElementById('battle-kills').textContent = `☠️ ${this.kills}`;
    document.getElementById('battle-timer').textContent = fmtTime(this.elapsed);
  },

  spawnEnemy() {
    let template;
    if (this.waveMod.hasBoss && this.enemiesSpawned === this.totalEnemiesToSpawn - 1) {
      template = pick(BOSS_TYPES);
    } else {
      const pool = ENEMY_TYPES.filter(e => {
        if (e.id === 'brute' && this.waveNum < 3) return false;
        if (e.id === 'spitter' && this.waveNum < 4) return false;
        if (e.id === 'screamer' && this.waveNum < 6) return false;
        return true;
      });
      template = pick(pool);
    }

    this.enemies.push({
      id: template.id,
      name: template.name,
      icon: template.icon,
      hp: Math.floor(template.hp * this.waveMod.hpMul * (1 + this.waveNum * 0.1)),
      maxHP: Math.floor(template.hp * this.waveMod.hpMul * (1 + this.waveNum * 0.1)),
      atk: Math.floor(template.atk * this.waveMod.atkMul * (1 + this.waveNum * 0.05)),
      def: 0,
      speed: template.speed,
      x: 0.95 + Math.random() * 0.1,
      y: 0.15 + Math.random() * 0.7,
      attackTimer: 0,
      alive: true,
      isBoss: BOSS_TYPES.some(b => b.id === template.id),
      xp: template.xp,
    });
  },

  draw() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const dw = w / devicePixelRatio;
    const dh = h / devicePixelRatio;

    // Background
    const grad = ctx.createLinearGradient(0, 0, dw, 0);
    grad.addColorStop(0, '#1a2210');
    grad.addColorStop(1, '#0e0810');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, dw, dh);

    // Ground
    ctx.fillStyle = '#1a2818';
    ctx.fillRect(0, dh * 0.7, dw, dh * 0.3);

    // Fog effect for fog modifier
    if (this.waveMod === WAVE_MODS.fog) {
      ctx.fillStyle = 'rgba(100,100,150,.15)';
      ctx.fillRect(0, 0, dw, dh);
    }
    // Blood moon
    if (this.waveMod === WAVE_MODS.bloodmoon) {
      ctx.fillStyle = 'rgba(150,20,20,.1)';
      ctx.fillRect(0, 0, dw, dh);
      // Moon
      ctx.beginPath();
      ctx.arc(dw * 0.85, dh * 0.12, 25, 0, Math.PI * 2);
      ctx.fillStyle = '#cc2222';
      ctx.fill();
    }

    // Wall
    const wallPct = this.maxWallHP > 0 ? this.wallHP / this.maxWallHP : 0;
    ctx.fillStyle = wallPct > 0.5 ? '#4a5a48' : (wallPct > 0.2 ? '#6a5a38' : '#6a3a28');
    ctx.fillRect(dw * 0.05 - 4, dh * 0.1, 8, dh * 0.8);
    // Wall HP bar
    ctx.fillStyle = '#222';
    ctx.fillRect(dw * 0.01, dh * 0.05, 12, dh * 0.9);
    ctx.fillStyle = wallPct > 0.5 ? '#44aa44' : '#cc4444';
    ctx.fillRect(dw * 0.01, dh * 0.05 + dh * 0.9 * (1 - wallPct), 12, dh * 0.9 * wallPct);

    // Draw turrets
    for (const tur of this.turrets) {
      ctx.font = '16px serif';
      ctx.textAlign = 'center';
      ctx.fillText('🔫', tur.x * dw, tur.y * dh);
    }

    // Draw heroes
    for (const hero of this.heroes) {
      if (!hero.alive) continue;
      const hx = hero.x * dw;
      const hy = hero.y * dh;

      // Shadow
      ctx.beginPath();
      ctx.ellipse(hx, hy + 14, 12, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fill();

      // Body
      ctx.font = '24px serif';
      ctx.textAlign = 'center';
      ctx.fillText(hero.template.icon, hx, hy);

      // HP bar
      const barW = 30;
      const hpPct = hero.hp / hero.maxHP;
      ctx.fillStyle = '#111';
      ctx.fillRect(hx - barW/2, hy - 22, barW, 4);
      ctx.fillStyle = hpPct > 0.5 ? '#44cc66' : (hpPct > 0.25 ? '#ccaa44' : '#cc4444');
      ctx.fillRect(hx - barW/2, hy - 22, barW * hpPct, 4);

      // Skill ready indicator
      if (hero.skillReady) {
        ctx.fillStyle = '#e8a624';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('⚡', hx + 16, hy - 16);
      }

      // Shield effect
      if (this.shieldMul > 0 && this.shieldTimer > 0) {
        ctx.beginPath();
        ctx.arc(hx, hy - 4, 18, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(68,136,238,.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // Draw enemies
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const ex = e.x * dw;
      const ey = e.y * dh;

      // Shadow
      ctx.beginPath();
      ctx.ellipse(ex, ey + 14, e.isBoss ? 18 : 10, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fill();

      // Body
      ctx.font = e.isBoss ? '32px serif' : '20px serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.icon, ex, ey);

      // HP bar
      const barW = e.isBoss ? 40 : 24;
      const hpPct = e.hp / e.maxHP;
      ctx.fillStyle = '#111';
      ctx.fillRect(ex - barW/2, ey - 20, barW, 3);
      ctx.fillStyle = '#cc4444';
      ctx.fillRect(ex - barW/2, ey - 20, barW * hpPct, 3);

      // Debuff marker
      if (this.debuffTarget === e) {
        ctx.fillStyle = '#ff4488';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('🎯', ex + 14, ey - 12);
      }
    }

    // Draw particles
    for (const p of this.particles) {
      ctx.beginPath();
      ctx.arc(p.x * dw, p.y * dh, 2 * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Draw floating texts
    for (const ft of this.floatingTexts) {
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, ft.life * 2);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x * dw, ft.y * dh);
      ctx.globalAlpha = 1;
    }

    // Wave progress
    const spawnPct = this.totalEnemiesToSpawn > 0 ? this.enemiesSpawned / this.totalEnemiesToSpawn : 0;
    ctx.fillStyle = '#222';
    ctx.fillRect(dw * 0.3, dh * 0.02, dw * 0.4, 6);
    ctx.fillStyle = this.waveMod.color;
    ctx.fillRect(dw * 0.3, dh * 0.02, dw * 0.4 * spawnPct, 6);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText(`Враги: ${this.enemiesSpawned}/${this.totalEnemiesToSpawn}`, dw * 0.5, dh * 0.02 + 16);

    ctx.textAlign = 'start';
  },

  addFloatingText(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 1 });
  },

  addParticle(x, y, color) {
    for (let i = 0; i < 3; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        color, life: 0.5 + Math.random() * 0.5
      });
    }
  },

  updateHUD() {
    let html = '';
    for (const hero of this.heroes) {
      const hpPct = hero.alive ? (hero.hp / hero.maxHP * 100) : 0;
      const t = hero.template;
      const cd = hero.skillCooldown;
      html += `
        <div class="battle-hero-hud">
          <div class="bh-name">${t.icon} ${t.name}</div>
          <div class="bh-hp-bar"><div class="bh-hp-fill" style="width:${hpPct}%"></div></div>
          <div class="bh-skill">
            <button onclick="BattleScene.useSkill('${hero.id}')" ${hero.skillReady && hero.alive ? '' : 'disabled'}>
              ⚡ ${t.skill.name} ${cd > 0 ? `(${Math.ceil(cd)}s)` : ''}
            </button>
          </div>
        </div>
      `;
    }
    document.getElementById('battle-hud').innerHTML = html;
  },

  useSkill(heroId) {
    const hero = this.heroes.find(h => h.id === heroId);
    if (!hero || !hero.alive || !hero.skillReady) return;
    const t = hero.template;
    const skill = t.skill;
    hero.skillCooldown = skill.cooldown;
    hero.skillReady = false;

    switch(skill.type) {
      case 'buff_atk':
        this.buffATK = skill.value;
        this.buffATKTimer = skill.duration;
        this.addFloatingText(hero.x, hero.y - 0.04, '🔥 ATK UP!', '#ffaa00');
        break;
      case 'damage_single': {
        const target = this.enemies.filter(e => e.alive).sort((a,b) => b.hp - a.hp)[0];
        if (target) {
          const dmg = Math.floor(hero.atk * skill.value);
          target.hp -= dmg;
          this.addFloatingText(target.x, target.y, `-${dmg}💥`, '#ff4400');
          this.addParticle(target.x, target.y, '#ff6600');
          if (target.hp <= 0) { target.alive = false; this.kills++; }
        }
        break;
      }
      case 'debuff_target': {
        const target = this.enemies.filter(e => e.alive).sort((a,b) => b.hp - a.hp)[0];
        if (target) {
          this.debuffTarget = target;
          this.debuffTimer = skill.duration;
          this.addFloatingText(target.x, target.y, '🎯 WEAK!', '#ff44aa');
        }
        break;
      }
      case 'shield':
        this.shieldMul = skill.value;
        this.shieldTimer = skill.duration;
        this.addFloatingText(hero.x, hero.y - 0.04, '🛡️ SHIELD!', '#4488ee');
        break;
      case 'heal_all':
        for (const h of this.heroes) {
          if (!h.alive) continue;
          const heal = Math.floor(h.maxHP * skill.value);
          h.hp = Math.min(h.maxHP, h.hp + heal);
          this.addFloatingText(h.x, h.y - 0.03, `+${heal}`, '#44cc66');
        }
        break;
      case 'summon_turret':
        this.turrets.push({
          x: hero.x + 0.08,
          y: hero.y,
          dmg: skill.value,
          lifetime: skill.duration,
          attackTimer: 0
        });
        this.addFloatingText(hero.x, hero.y - 0.04, '🔫 TURRET!', '#886644');
        break;
    }
    this.updateHUD();
  },

  toggleSpeed() {
    this.speed = this.speed === 1 ? 2 : 1;
    document.getElementById('btn-speed').textContent = `⏩ x${this.speed}`;
  },

  retreat() {
    this.battleOver = true;
    this.victory = false;
    this.showResult();
  },

  showResult() {
    this.active = false;
    if (this.animFrame) cancelAnimationFrame(this.animFrame);

    const xpEarned = this.kills * 5;
    const foodReward = this.victory ? 20 + this.waveNum * 10 : 5;
    const woodReward = this.victory ? 15 + this.waveNum * 8 : 3;
    const metalReward = this.victory ? 10 + this.waveNum * 5 : 0;
    const gemReward = this.victory && this.waveNum % 5 === 0 ? 5 : 0;

    // Apply results
    if (this.victory) {
      State.stats.wavesCleared++;
      if (this.waveMod.hasBoss) State.stats.bossesKilled++;
    }
    State.stats.zombiesKilled += this.kills;
    State.wallHP = Math.max(0, this.wallHP);

    addResources({ food: foodReward, wood: woodReward, metal: metalReward, gems: gemReward });
    addXP(xpEarned);

    // Grant hero XP and check wounds
    for (const hero of this.heroes) {
      const hs = getHeroState(hero.id);
      if (!hs) continue;
      grantHeroXP(hero.id, Math.floor(xpEarned / this.heroes.length));
      if (!hero.alive) {
        hs.wounded = true;
        hs.woundHealTime = Date.now() + 120000;
      }
    }

    saveGame();

    // Show result screen
    const box = document.getElementById('result-box');
    box.innerHTML = `
      <h2 class="${this.victory ? 'result-victory' : 'result-defeat'}">${this.victory ? '⚔️ ПОБЕДА!' : '💀 ПОРАЖЕНИЕ'}</h2>
      <div class="text-dim">Волна ${this.waveNum} — ${this.waveMod.name}</div>
      <div class="result-stats">
        <div class="rs-row"><span>Убито зомби</span><span>☠️ ${this.kills}</span></div>
        <div class="rs-row"><span>Время</span><span>⏱️ ${fmtTime(this.elapsed)}</span></div>
        <div class="rs-row"><span>Стена</span><span>🧱 ${Math.max(0, Math.floor(this.wallHP))}/${this.maxWallHP}</span></div>
        <div class="rs-row"><span>Опыт</span><span>⭐ ${xpEarned}</span></div>
      </div>
      <div class="result-rewards">
        <h4>🎁 Награды:</h4>
        ${foodReward ? `<div class="rr-item">🍖 Еда: +${foodReward}</div>` : ''}
        ${woodReward ? `<div class="rr-item">🪵 Дерево: +${woodReward}</div>` : ''}
        ${metalReward ? `<div class="rr-item">⚙️ Металл: +${metalReward}</div>` : ''}
        ${gemReward ? `<div class="rr-item">💎 Кристаллы: +${gemReward}</div>` : ''}
      </div>
      ${this.heroes.filter(h => !h.alive).map(h => `<div class="text-danger text-sm">🩹 ${h.template.name} ранен</div>`).join('')}
      <button class="btn-primary mt-12" onclick="BattleScene.closeBattle()">Продолжить</button>
    `;
    document.getElementById('battle-result').classList.add('active');
  },

  closeBattle() {
    document.getElementById('battle-result').classList.remove('active');
    document.getElementById('battle-overlay').classList.remove('active');
    Nav.go('battle');
  }
};

// ======================== PRODUCTION SYSTEM ========================
const Production = {
  lastTick: Date.now(),

  tick() {
    const now = Date.now();
    const elapsed = (now - this.lastTick) / 1000; // seconds
    this.lastTick = now;
    const minutes = elapsed / 60;
    const lim = getStorageLimit();

    for (const id in BUILDINGS) {
      const b = BUILDINGS[id];
      if (!b.production) continue;
      const level = State.buildings[id] || 0;
      if (level <= 0) continue;
      if (State.constructionQueue.some(q => q.buildingId === id)) continue;

      const rate = b.production.base + level * b.production.perLvl;
      const amount = rate * minutes;
      const res = b.production.res;
      State.resources[res] = Math.min(lim, (State.resources[res]||0) + amount);
    }
  }
};

// ======================== CLOCK SYSTEM ========================
const Clock = {
  tickInterval: 8000, // 8 seconds = 1 game hour
  lastTick: Date.now(),

  tick() {
    const now = Date.now();
    if (now - this.lastTick >= this.tickInterval) {
      this.lastTick = now;
      State.hour++;
      if (State.hour >= 24) {
        State.hour = 0;
        State.day++;
        this.onNewDay();
      }
      this.updateWeather();
    }
  },

  onNewDay() {
    // Season change every 30 days
    const seasons = ['spring', 'summer', 'autumn', 'winter'];
    const seasonNames = { spring: 'Весна', summer: 'Лето', autumn: 'Осень', winter: 'Зима' };
    const idx = Math.floor((State.day - 1) / 30) % 4;
    State.season = seasons[idx];
  },

  updateWeather() {
    const weathers = ['clear', 'cloudy', 'rain', 'storm', 'fog'];
    if (Math.random() < 0.1) {
      State.weather = pick(weathers);
    }
  },

  getWeatherIcon() {
    const icons = { clear: '☀️', cloudy: '⛅', rain: '🌧️', storm: '⛈️', fog: '🌫️' };
    return icons[State.weather] || '☀️';
  },

  getSeasonName() {
    const names = { spring: 'Весна', summer: 'Лето', autumn: 'Осень', winter: 'Зима' };
    return names[State.season] || 'Весна';
  }
};

// ======================== WOUND HEALING ========================
function healWounds() {
  const now = Date.now();
  const hospitalLevel = State.buildings.hospital || 0;
  const healBonus = 1 + hospitalLevel * 0.1;

  for (const hs of State.heroes) {
    if (hs.wounded && hs.woundHealTime) {
      const adjustedTime = hs.woundHealTime - (healBonus - 1) * 30000;
      if (now >= adjustedTime) {
        hs.wounded = false;
        hs.woundHealTime = 0;
        const t = getHeroTemplate(hs.id);
        toast(`${t.icon} ${t.name} вылечен!`, 'success');
      }
    }
  }
}

// ======================== HUD UPDATER ========================
function updateHUD() {
  document.getElementById('res-food').textContent = fmt(State.resources.food||0);
  document.getElementById('res-wood').textContent = fmt(State.resources.wood||0);
  document.getElementById('res-metal').textContent = fmt(State.resources.metal||0);
  document.getElementById('res-fuel').textContent = fmt(State.resources.fuel||0);
  document.getElementById('res-meds').textContent = fmt(State.resources.meds||0);
  document.getElementById('res-gems').textContent = fmt(State.resources.gems||0);

  document.getElementById('hud-day').textContent = `День ${State.day}`;
  document.getElementById('hud-time').textContent = `${String(State.hour).padStart(2,'0')}:00`;
  document.getElementById('hud-weather').textContent = Clock.getWeatherIcon();
  document.getElementById('hud-season').textContent = Clock.getSeasonName();
  document.getElementById('hud-pop').textContent = `👤 ${State.heroes.length}`;

  // Quest badge
  let questCount = 0;
  for (const ch of CHAPTERS) {
    for (const q of ch.quests) {
      if (!State.completedQuests.includes(q.id) && q.check(State)) questCount++;
    }
  }
  const today = new Date().toDateString();
  if (State.lastDailyDate !== today) questCount++;
  const questBadge = document.querySelector('#nav-quests .badge');
  if (questCount > 0) {
    if (!questBadge) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = questCount;
      document.getElementById('nav-quests').appendChild(b);
    } else {
      questBadge.textContent = questCount;
    }
  } else if (questBadge) {
    questBadge.remove();
  }

  // Battle HUD update during battle
  if (BattleScene.active) {
    BattleScene.updateHUD();
  }
}

// ======================== MAIN GAME LOOP ========================
let lastFrameTime = 0;
const AUTOSAVE_INTERVAL = 30000;
let lastAutoSave = Date.now();

function gameLoop(time) {
  requestAnimationFrame(gameLoop);

  Clock.tick();
  Production.tick();
  Construction.checkCompletions();
  healWounds();
  updateHUD();
  BaseRenderer.render();

  // Auto-refresh current panel periodically
  if (time - lastFrameTime > 2000) {
    lastFrameTime = time;
    // Refresh side panel if on certain tabs
    if (['base', 'map'].includes(Nav.current)) Nav.go(Nav.current);
  }

  // Autosave
  if (Date.now() - lastAutoSave > AUTOSAVE_INTERVAL) {
    lastAutoSave = Date.now();
    saveGame();
  }
}

// ======================== OFFLINE INCOME ========================
function processOfflineIncome() {
  const now = Date.now();
  const elapsed = (now - State.lastSaveTime) / 1000;
  if (elapsed < 60) return; // less than 1 minute

  const minutes = Math.min(elapsed / 60, 480); // cap at 8 hours
  const lim = getStorageLimit();
  let totalGained = {};

  for (const id in BUILDINGS) {
    const b = BUILDINGS[id];
    if (!b.production) continue;
    const level = State.buildings[id] || 0;
    if (level <= 0) continue;

    const rate = b.production.base + level * b.production.perLvl;
    const amount = Math.floor(rate * minutes);
    const res = b.production.res;
    State.resources[res] = Math.min(lim, (State.resources[res]||0) + amount);
    totalGained[res] = (totalGained[res]||0) + amount;
  }

  if (Object.keys(totalGained).length > 0) {
    const text = Object.entries(totalGained).map(([r,v]) => `${RES_NAMES[r]?.split(' ')[0]||r} +${v}`).join(', ');
    setTimeout(() => {
      Modal.show(`
        <h3>🌅 Добро пожаловать!</h3>
        <div class="text-dim text-sm mb-8">Вы отсутствовали ${Math.floor(minutes)} мин.</div>
        <div class="card">
          <div class="card-title">📦 Офлайн-доход</div>
          <div class="text-sm">${text}</div>
        </div>
        <button class="btn-primary mt-12" onclick="Modal.close()">Отлично!</button>
      `);
    }, 500);
  }
}

// ======================== INIT ========================
function init() {
  Camera.init();
  BaseRenderer.init();

  processOfflineIncome();
  Production.lastTick = Date.now();

  // Update wall stats based on wall level
  const wallLevel = State.buildings.wall || 0;
  State.maxWallHP = 100 + wallLevel * 50;
  if (State.wallHP > State.maxWallHP) State.wallHP = State.maxWallHP;

  Nav.go('base');
  requestAnimationFrame(gameLoop);

  // Handle resize for battle canvas
  window.addEventListener('resize', () => {
    BaseRenderer.resize();
    if (BattleScene.active) BattleScene.resize();
  });

  console.log(`%c🏚️ The Last Port v${SAVE_VERSION} — Siege Update`, 'font-size:16px;color:#e8a624;font-weight:bold');
}

init();
</script>
