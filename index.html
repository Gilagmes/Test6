<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121517">
<title>Последний порт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: dark;
  --text: #e5eeea; --muted: #8a949e; --gold: #f0a500;
  --bg-main: #121517; --bg-card: #1e2227; --border: #2d3339; --height: 100dvh;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); }
body { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); }
button, input, select { font: inherit; }
button { cursor: pointer; border: none; outline: none; }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: default; transform: none; filter: grayscale(1); }
[hidden] { display: none !important; }

main { position: relative; width: 100%; height: var(--height); overflow: hidden; }
.scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #0c0f12; overflow: hidden; touch-action: none; }
canvas { display: block; transform-origin: center; touch-action: none; }
#camera-layer { position: absolute; inset: 0; z-index: 2; cursor: grab; user-select: none; }
#camera-layer.dragging { cursor: grabbing; }

.ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) 0 env(safe-area-inset-left, 10px); }
header { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px; pointer-events: auto; }

.profile-badge { display: flex; align-items: center; gap: 10px; background: rgba(18, 21, 23, 0.92); border: 1px solid var(--gold); border-radius: 40px; padding: 4px 14px 4px 4px; backdrop-filter: blur(8px); }
.profile-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
.profile-info { display: flex; flex-direction: column; }
.profile-level { font-size: 9px; color: var(--gold); font-weight: 800; letter-spacing: 0.5px; }
.profile-power { font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 4px; margin-top: -2px; }

.resources { display: grid; grid-template-columns: auto auto; gap: 6px; align-items: start; }
.resource { background: rgba(18, 21, 23, 0.92); border: 1px solid var(--border); border-radius: 16px; padding: 5px 10px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px); }
.resource span { font-variant-numeric: tabular-nums; }
.res-food { color: #a5d6a7; } .res-wood { color: #d7ccc8; } .res-parts { color: #b0bec5; } .res-wave { color: #81d4fa; }

#chapter-strip { align-self: flex-start; margin: 0 10px; background: rgba(18, 21, 23, 0.92); border: 1px solid var(--border); border-radius: 12px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(8px); pointer-events: auto; text-align: left; }
.chapter-avatar { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #232930; display: grid; place-items: center; font-size: 18px; }
.chapter-copy { display: flex; flex-direction: column; }
.chapter-copy small { font-size: 10px; color: var(--muted); }
.chapter-copy strong { font-size: 12px; font-weight: bold; color: #fff; }
#chapter-status { font-size: 10px; color: var(--gold); margin-left: 10px; }
#chapter-strip.ready { border-color: var(--gold); }

#event-strip { align-self: center; background: var(--gold); color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-top: 10px; pointer-events: auto; box-shadow: 0 4px 10px rgba(240, 165, 0, 0.4); }
.badge { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); letter-spacing: 1px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 10px; backdrop-filter: blur(4px); }

.camera-controls { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.camera-controls button, .icon { width: 44px; height: 44px; background: rgba(18, 21, 23, 0.92); border: 1px solid var(--border); border-radius: 50%; color: #fff; font-size: 20px; display: grid; place-items: center; backdrop-filter: blur(8px); }
.camera-controls .primary { color: var(--gold); border-color: var(--gold); }

#queue { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; font-size: 11px; color: var(--gold); pointer-events: none; }

#dock { margin-top: auto; flex-shrink: 0; height: 44dvh; min-height: 250px; background: #16191c; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); pointer-events: auto; display: flex; flex-direction: column; transition: height 0.3s ease; }
#dock[data-size="large"] { height: 68dvh; }
#dock[data-size="map"] { height: auto; min-height: 0; padding-bottom: 20px; }

.toolbar { display: flex; gap: 8px; padding: 12px 15px 8px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button { background: var(--bg-card); border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap; }
.toolbar button.active { background: #2a3036; color: #fff; }
.size-button { width: 36px; padding: 0 !important; display: grid; place-items: center; }

#panel { flex: 1; overflow-y: auto; padding: 0 15px 15px; scrollbar-width: none; }
#panel::-webkit-scrollbar { display: none; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card.selected { border-color: var(--gold); }
.card.working { border-color: #8bc34a; }

.build-head { display: flex; justify-content: space-between; align-items: flex-start; }
.build-head h3 { margin: 0; font-size: 13px; color: #fff; }
.build-head small { font-size: 10px; color: var(--gold); background: rgba(240, 165, 0, 0.1); padding: 2px 6px; border-radius: 4px; }
.card p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.4; flex: 1; }

.card > button { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 9px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-top: auto; }
.card > button.primary { background: var(--gold); color: #000; }

.row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.row button { flex: 1; padding: 9px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-weight: bold; }
.row button.primary { background: var(--gold); color: #000; border-color: var(--gold); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #121517; border: 1px solid var(--border); color: #fff; padding: 3px 6px; border-radius: 6px; font-size: 10px; }

.bar { height: 6px; background: #121517; border-radius: 4px; overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; background: var(--gold); }
.bar.enemy i { background: #e63946; }

nav { display: flex; justify-content: space-around; align-items: center; background: var(--bg-main); height: 62px; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); flex-shrink: 0; }
nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; border: none; color: var(--muted); font-size: 10px; font-weight: 600; }
nav button.active { color: var(--gold); }
nav button b { font-size: 18px; font-weight: normal; }

.notice-row { position: absolute; bottom: 75px; left: 15px; right: 15px; display: flex; gap: 10px; pointer-events: auto; }
#notice { flex: 1; background: rgba(18, 21, 23, 0.92); border-left: 2px solid var(--gold); padding: 8px 12px; font-size: 11px; border-radius: 6px; backdrop-filter: blur(8px); }
#journal-button { background: var(--bg-card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 11px; color: #fff; }
#journal-button.unread { border-color: var(--gold); color: var(--gold); }

dialog { width: 90%; max-width: 400px; max-height: 85dvh; padding: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
.modal { display: flex; flex-direction: column; max-height: 85dvh; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 16px; color: var(--gold); }
.modal-head small { font-size: 11px; color: var(--muted); }
.modal-close { background: transparent; color: var(--muted); font-size: 24px; padding: 0; width: 30px; height: 30px; }
.modal-body { padding: 15px; overflow-y: auto; }
.modal-body p { font-size: 12px; color: var(--muted); margin: 0 0 10px 0; line-height: 1.5; }
.modal-body button.primary { width: 100%; background: var(--gold); color: #000; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
.compare { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat small { font-size: 10px; color: var(--muted); }
.stat strong { font-size: 13px; color: #fff; }
.prices { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.price { background: #121517; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 11px; }
.price.missing { color: #e63946; border-color: #e63946; }

.summary { background: #121517; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
.summary strong { font-size: 13px; color: var(--gold); }
.summary p { margin-top: 6px; font-size: 11px; color: var(--muted); }
.wide { grid-column: 1 / -1; }
.hint { font-size: 10px; color: #6a7682; text-align: center; margin-bottom: 10px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.batch-options button { flex: 1; padding: 8px; background: #121517; border: 1px solid var(--border); border-radius: 8px; color: #fff; }
.batch-options button.primary { border-color: var(--gold); color: var(--gold); }
.worker-stepper { display: flex; justify-content: space-between; align-items: center; background: #121517; border-radius: 8px; padding: 4px; margin-top: 8px; }
.worker-stepper button { width: 40px; height: 30px; background: var(--bg-card); border-radius: 6px; color: #fff; }

@media (min-width: 600px) {
  .app-container { max-width: 480px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
}
</style>
</head>
<body>
<main class="app-container">
  <div class="scene" id="scene">
    <canvas id="world" width="1000" height="780"></canvas>
    <div id="camera-layer" aria-hidden="true"></div>
  </div>

  <div class="ui-layer">
    <header>
      <div class="profile-badge">
        <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80" class="profile-avatar" alt="Avatar">
        <div class="profile-info">
          <span class="profile-level">БАЗА УР. 1</span>
          <span class="profile-power">⚔ <span id="power">0</span></span>
        </div>
      </div>
      
      <div class="resources">
        <div class="resource res-food">🌾 <span id="food">0</span></div>
        <div class="resource res-wood">🪵 <span id="wood">0</span></div>
        <div class="resource res-parts">⚙ <span id="parts">0</span></div>
        <div class="resource res-wave">🌊 <span id="wave">1</span></div>
      </div>
    </header>

    <button id="chapter-strip" data-action="campaign">
      <div class="chapter-avatar">⌖</div>
      <div class="chapter-copy">
        <small id="chapter-number">Глава 1</small>
        <strong id="chapter-title">Сигнал в темноте</strong>
      </div>
      <span id="chapter-status"></span>
    </button>
    
    <div class="badge" id="badge">ОКРЕСТНОСТИ</div>
    <div id="queue" hidden></div>
    <button id="event-strip" data-action="event" hidden>⌁ <span id="event-strip-title">Событие</span></button>

    <div class="camera-controls">
      <button data-camera="in" aria-label="Приблизить">＋</button>
      <button data-camera="out" aria-label="Отдалить">−</button>
      <button class="primary" data-camera="home" aria-label="Общий вид">⌂</button>
      <button id="fullscreen" class="icon" aria-label="Полноэкранный режим">⛶</button>
      <button class="icon" data-action="help" aria-label="Об игре">?</button>
    </div>

    <div class="notice-row" hidden>
      <div id="notice" role="status">Командир, порт ждёт приказов.</div>
      <button id="journal-button" data-action="journal">☷ Журнал</button>
    </div>

    <section id="dock" data-size="normal">
      <div class="toolbar">
        <button data-action="people" id="people-button">♙ Жители</button>
        <button data-action="market">⚖ Торговля</button>
        <button data-action="research">⚙ Развитие</button>
        <button data-action="journal" id="journal-tab-btn">☷ Журнал</button>
        <button class="size-button" data-action="collapse">▾</button>
        <button class="size-button" data-action="expand">⇡</button>
      </div>
      
      <div id="panel"></div>

      <nav>
        <button data-action="tab" data-id="base"><b>⌂</b>База</button>
        <button data-action="tab" data-id="territory"><b>▧</b>Земли</button>
        <button data-action="tab" data-id="heroes"><b>★</b>Герои</button>
        <button data-action="tab" data-id="army"><b>⚑</b>Войска</button>
        <button data-action="tab" data-id="map"><b>⌖</b>Карта</button>
        <button data-action="tab" data-id="battle"><b>⚔</b>Оборона</button>
      </nav>
    </section>
  </div>
</main>

<dialog id="dialog">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modal-title">Заголовок</h2>
        <small id="modal-subtitle">Описание</small>
      </div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>
<input id="import-file" type="file" accept=".json,application/json" hidden>

const fmt=n=>nf.format(Math.floor(Math.max(0,n||0)));
const dec=(n,d=2)=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:d}).format(n);

function time(seconds){
  const n=Math.max(0,Math.ceil(seconds)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),ss=n%60;
  return h?`${h} ч ${m} мин`:m?`${m} мин ${ss} с`:`${ss} с`;
}

function btn(action,id,text,disabled=false,primary=false){

}
function price(c){
  return [["wood","🪵"],["food","🌾"],["parts","⚙"]].filter(([k])=>c[k]).map(([k,i])=>`${i} ${fmt(c[k])}`).join(" · ")||"Бесплатно";

function fresh(){
  return {
    version:4,food:5900,wood:4300,parts:120,wave:1,
    buildings:{hq:1,farm:1,mill:1,barracks:1,wall:1,workshop:0,hospital:0,store:0},
    heroes:[1,1,1],army:[8,0,0],wounded:[0,0,0],
    buildJob:null,trainJob:null,healJob:null,expedition:null,fight:null,
    claimedQuests:[],stats:{trained:0,trips:0,trades:0},reports:[],
    development:{chapter:0,tech:{logistics:0,weapons:0,defenses:0},job:null},
    territory:{cleared:[],job:null},expeditionResidents:0,
    civic:{levels:{housing:1,water:1,energy:1},workers:{farm:0,mill:0,workshop:0},job:null},
    market:{refreshAt:Date.now()+MARKET_PERIOD,used:{}},
    journal:{entries:[],nextId:1,readThrough:0},
    livingUpdate:true,last:Date.now()
  };
}
function armyArray(a){return [0,1,2].map(i=>int(a?.[i],0,0,100000))}
function normalize(raw){
  const n=fresh();
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return n;
  const now=Date.now();
  for(const k of ["food","wood","parts"])n[k]=num(raw[k],n[k]);
  n.wave=int(raw.wave,1,1,10000);
  for(const id of Object.keys(BUILD)){
    const min=["hq","farm","mill","barracks","wall"].includes(id)?1:0;
    n.buildings[id]=int(raw.buildings?.[id],n.buildings[id],min,MAX_LEVEL);
  }
  n.heroes=n.heroes.map((v,i)=>int(raw.heroes?.[i],v,1,100));
  if(Array.isArray(raw.army))n.army=armyArray(raw.army);
  n.wounded=armyArray(raw.wounded);
  for(const k of ["trained","trips","trades"])n.stats[k]=int(raw.stats?.[k],0,0,100000000);
  n.expeditionResidents=int(raw.expeditionResidents,0,0,100000000);
  n.last=num(raw.last,now,0,now);
  if(Array.isArray(raw.claimedQuests))n.claimedQuests=[...new Set(raw.claimedQuests.filter(v=>typeof v==="string"))].slice(0,200);
  const validJob=j=>j&&Number.isFinite(j.started)&&Number.isFinite(j.ends)
    &&j.started>=0&&j.started<=now&&j.ends>j.started&&j.ends-j.started<=OFFLINE&&j.ends<=now+OFFLINE;
  const bj=raw.buildJob;
  if(validJob(bj)&&has(BUILD,bj.id)&&bj.target===n.buildings[bj.id]+1&&bj.target<=MAX_LEVEL)
    n.buildJob={id:bj.id,target:bj.target,started:bj.started,ends:bj.ends};
  for(const k of ["trainJob","healJob"]){
    const j=raw[k];
    if(validJob(j)&&Number.isInteger(j.type)&&UNIT[j.type]&&Number.isInteger(j.count)&&j.count>0&&j.count<=100000)
      n[k]={type:j.type,count:j.count,started:j.started,ends:j.ends};
  }
  const exp=raw.expedition;
  if(exp&&has(MISSIONS,exp.kind)&&Number.isFinite(exp.ends)&&exp.ends>=1&&exp.ends<=now+OFFLINE){
    const started=num(exp.started,Math.max(0,exp.ends-MISSIONS[exp.kind].seconds*1000),0,exp.ends-1);
    n.expedition={
      kind:exp.kind,started,ends:exp.ends,army:armyArray(exp.army),power:num(exp.power,0,0,100000000),
      legacy:exp.legacy===true||!Array.isArray(exp.army),lootBoost:num(exp.lootBoost,1,1,2),event:null
    };
    const ev=exp.event;
    if(ev&&has(ENCOUNTERS,ev.type)&&Number.isFinite(ev.at)){
      const choice=has(ENCOUNTERS[ev.type].choices,ev.choice)?ev.choice:null;
      n.expedition.event={type:ev.type,at:clamp(ev.at,started,exp.ends),choice,chosenAt:choice?num(ev.chosenAt,started,0,now):null};
    }
  }
  if(raw.development){
    n.development.chapter=int(raw.development.chapter,0,0,6);
    for(const id of Object.keys(TECH))n.development.tech[id]=int(raw.development.tech?.[id],0,0,TECH[id].max);
    const j=raw.development.job;
    if(validJob(j)&&has(TECH,j.id)&&j.target===n.development.tech[j.id]+1&&j.target<=TECH[j.id].max)
      n.development.job={id:j.id,target:j.target,started:j.started,ends:j.ends};
  }
  if(raw.territory){
    if(Array.isArray(raw.territory.cleared))n.territory.cleared=[...new Set(raw.territory.cleared.filter(id=>has(TERRITORY,id)))];
    const j=raw.territory.job;
    if(validJob(j)&&has(TERRITORY,j.id)&&!n.territory.cleared.includes(j.id))
      n.territory.job={id:j.id,started:j.started,ends:j.ends};
  }
  if(raw.civic){
    for(const id of Object.keys(CIVIC))n.civic.levels[id]=int(raw.civic.levels?.[id],1,1,10);
    for(const id of ["farm","mill","workshop"])n.civic.workers[id]=int(raw.civic.workers?.[id],0,0,12);
    const j=raw.civic.job;
    if(validJob(j)&&has(CIVIC,j.id)&&j.target===n.civic.levels[j.id]+1&&j.target<=10)
      n.civic.job={id:j.id,target:j.target,started:j.started,ends:j.ends};
  }
  if(raw.market){
    n.market.refreshAt=num(raw.market.refreshAt,now+MARKET_PERIOD,0,now+MARKET_PERIOD);
    for(const id of Object.keys(TRADES))n.market.used[id]=int(raw.market.used?.[id],0,0,TRADES[id].stock);
  }
  const f=raw.fight;
  if(f&&Number.isFinite(f.hp)&&f.hp>0&&Number.isFinite(f.enemy)&&f.enemy>0){
    const max=num(f.max,1,1,1e10),enemyMax=num(f.enemyMax,1,1,1e10);
    n.fight={
      hp:num(f.hp,1,1,max),max,enemy:num(f.enemy,1,1,enemyMax),enemyMax,
      wave:int(f.wave,n.wave,1,10000),shot:num(f.shot,0,0,now),repairUsed:f.repairUsed===true,flash:0,
      tactics:{type:has(ENEMIES,f.tactics?.type)?f.tactics.type:"walkers",used:{
        charge:f.tactics?.used?.charge===true,volley:f.tactics?.used?.volley===true,aid:f.tactics?.used?.aid===true
      }}
    };
    if(n.expedition)n.fight=null;
  }
  if(Array.isArray(raw.reports))n.reports=raw.reports.filter(r=>r&&has(MISSIONS,r.kind)).slice(0,5).map(r=>({
    kind:r.kind,won:r.won===true,wounded:int(r.wounded),residents:int(r.residents),
    at:num(r.at,now,0,now),food:num(r.food),wood:num(r.wood),parts:num(r.parts)
  }));
  if(Array.isArray(raw.journal?.entries)){
    const seen=new Set();
    n.journal.entries=raw.journal.entries.filter(e=>{
      if(!e||!Number.isSafeInteger(e.id)||e.id<1||e.id>1e12||seen.has(e.id)||typeof e.title!=="string"||typeof e.text!=="string")return false;
      seen.add(e.id);return true;
    }).sort((a,b)=>b.id-a.id).slice(0,LOG_LIMIT).map(e=>({
      id:e.id,at:num(e.at,now,0,now),type:has(EVENT_TYPES,e.type)?e.type:"system",title:e.title.slice(0,160),text:e.text.slice(0,1800)
    }));
    const maxId=n.journal.entries.reduce((v,e)=>Math.max(v,e.id),0);
    n.journal.nextId=maxId+1;n.journal.readThrough=int(raw.journal.readThrough,0,0,maxId);
  }
  n.livingUpdate=raw.livingUpdate===true;
  return n;
}
function readSave(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw)for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw)break}
    return normalize(JSON.parse(raw));
  }catch{return fresh()}
}
let s=readSave(),storageWarning=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(s))}
  catch{if(!storageWarning){storageWarning=true;say("Хранилище недоступно.")}}
}
function logEvent(type,title,text,at=Date.now()){
  s.journal.entries.unshift({
    id:s.journal.nextId++,at,type:has(EVENT_TYPES,type)?type:"system",
    title:String(title).slice(0,160),text:String(text).slice(0,1800)
  });
  s.journal.entries=s.journal.entries.slice(0,LOG_LIMIT);
}
function unread(){return s.journal.entries.filter(e=>e.id>s.journal.readThrough).length}

function gain(c){for(const k of ["food","wood","parts"])s[k]=clamp(s[k]+(c[k]||0),0,LIMIT)}
function afford(c){return ["food","wood","parts"].every(k=>s[k]>=(c[k]||0))}
function pay(c){
  if(!afford(c))return false;
  for(const k of ["food","wood","parts"])s[k]-=c[k]||0;
  return true;
}
function cleared(id){return s.territory.cleared.includes(id)}
function territoryRescued(){return s.territory.cleared.reduce((n,id)=>n+TERRITORY[id].survivors,0)}
function rescued(){return territoryRescued()+s.expeditionResidents}
function population(){return 12+rescued()}
function housingCapacity(){return 5+15*s.civic.levels.housing}
function waterCapacity(){return 5+15*s.civic.levels.water}
function wellbeing(){return clamp(Math.min(housingCapacity()/population(),waterCapacity()/population()),.5,1)}
function workerLimit(){return Math.min(Math.floor(population()*.6),s.civic.levels.energy*6)}
function sectorLimit(id){return Math.min(12,s.buildings[id]*3)}
function assignedWorkers(){return Object.values(s.civic.workers).reduce((a,b)=>a+b,0)}
function normalizeWorkers(){
  let left=workerLimit();
  for(const id of ["farm","mill","workshop"]){
    const n=clamp(s.civic.workers[id],0,Math.min(left,sectorLimit(id)));
    s.civic.workers[id]=n;left-=n;
  }
}
function workerBonus(id){return 1+s.civic.workers[id]*.04*wellbeing()}
function productionMultiplier(){return (1+s.buildings.store*.05)*(1+s.development.tech.logistics*.05)}
function rates(){
  const m=productionMultiplier();
  return {
    food:s.buildings.farm*.45*m*(cleared("garden")?1.08:1)*workerBonus("farm"),
    wood:s.buildings.mill*.35*m*(cleared("grove")?1.05:1)*workerBonus("mill"),
    parts:s.buildings.workshop*.025*m*(cleared("scrapyard")?1.1:1)*workerBonus("workshop")
  };
}
function production(seconds){
  const r=rates();gain({food:r.food*seconds,wood:r.wood*seconds,parts:r.parts*seconds});
}
function troopCount(a=s.army){return a.reduce((n,v)=>n+v,0)}
function heroDamage(){return 9+s.heroes[1]*3}
function rawPower(){
  return (heroDamage()+s.buildings.barracks*5+s.army.reduce((n,v,i)=>n+v*UNIT[i].damage,0))*(1+s.development.tech.weapons*.04);
}
function currentEnemy(){return ENEMIES[s.fight?.tactics?.type]||ENEMIES.walkers}
function power(){return rawPower()*(s.fight?1-currentEnemy().armor:1)}
function maxHP(){
  return (170+s.buildings.wall*65+s.heroes[0]*18+s.heroes[2]*12+s.army.reduce((n,v,i)=>n+v*UNIT[i].hp,0))*
    (1+s.development.tech.defenses*.05)*(cleared("outpost")?1.1:1);
}
function totalOwnedTroops(){
  return troopCount()+troopCount(s.wounded)+troopCount(s.expedition?.army||[0,0,0])+(s.trainJob?.count||0)+(s.healJob?.count||0);
}
let trainingBatch=5,expeditionMode="auto",manualArmy=[0,0,0],departCount=8;
const BATCHES=[5,10,25,50];
function automaticArmy(count){
  let left=count;return s.army.map(n=>{const take=Math.min(n,left);left-=take;return take});
}
function pickArmy(){
  return expeditionMode==="manual"?s.army.map((n,i)=>clamp(int(manualArmy[i]),0,n)):automaticArmy(departCount);
}
function expeditionPower(a){return heroDamage()+a.reduce((n,v,i)=>n+v*UNIT[i].damage,0)}
function trainingCost(i,count=trainingBatch){
  const u=UNIT[i];return {food:u.food*count,wood:u.wood*count,parts:u.parts*count};
}
function trainingSeconds(i,count=trainingBatch){return UNIT[i].seconds*count/(1+(s.buildings.barracks-1)*.12)}
function buildCost(id){
  const l=s.buildings[id];return {wood:Math.round(65*1.65**Math.max(0,l-1)),food:35*Math.max(1,l),parts:l>=5?10*(l-4):0};
}
function buildTime(id){return Math.min(7200,Math.round(15*1.45**Math.max(0,s.buildings[id]-1)*(id==="hq"?1.5:1)))}
function buildingEffect(id,l){
  const m=productionMultiplier();
  if(id==="hq")return `Здания до ур. ${Math.min(MAX_LEVEL,l+1)}`;
  if(id==="farm")return `${dec(l*.45*m*(cleared("garden")?1.08:1)*workerBonus(id))} еды/с`;
  if(id==="mill")return `${dec(l*.35*m*(cleared("grove")?1.05:1)*workerBonus(id))} дерева/с`;
  if(id==="workshop")return `${dec(l*.025*m*(cleared("scrapyard")?1.1:1)*workerBonus(id),3)} деталей/с`;
  if(id==="barracks")return `+${l*5} базового урона\n×${dec(1+Math.max(0,l-1)*.12)} обучение`;
  if(id==="wall")return `+${l*65} базовой прочности`;
  if(id==="hospital")return l?`×${dec((1+l*.15)*(cleared("clinic")?1.2:1))} лечение`:"Лечение закрыто";
  return `+${l*5}% производства`;
}
function buildReason(id){
  const l=s.buildings[id],b=BUILD[id];
  if(l>=MAX_LEVEL)return "Максимальный уровень.";
  if(s.buildJob?.id===id)return "Строительство идёт.";
  if(s.fight)return "Дождись окончания обороны.";
  if(s.buildJob)return `Строители заняты: ${BUILD[s.buildJob.id].name}.`;
  if(s.buildings.hq<(b.need||1))return `Требуется штаб ${b.need}.`;
  if(id!=="hq"&&l>=s.buildings.hq+1)return `Улучши штаб до уровня ${l}.`;
  if(!afford(buildCost(id)))return "Недостаточно ресурсов.";
  return "";
}
function civicCost(id){
  const t=s.civic.levels[id]+1;
  return {wood:70*t*t,food:35*t,parts:(id==="energy"?20:10)*t};
}
function civicTime(id){return 45*(s.civic.levels[id]+1)}
function civicEffect(id,l){
  return id==="housing"?`Жильё для ${5+l*15} жителей`:id==="water"?`Вода для ${5+l*15} жителей`:`До ${l*6} рабочих мест`;
}
function civicReason(id){
  const l=s.civic.levels[id];
  if(l>=10)return "Максимальный уровень.";
  if(s.civic.job?.id===id)return "Улучшение инфраструктуры идёт.";
  if(s.civic.job)return "Инфраструктурная бригада занята.";
  if(s.fight)return "Дождись окончания обороны.";
  if(s.buildings.hq<l)return `Требуется штаб ${l}.`;
  if(!afford(civicCost(id)))return "Недостаточно ресурсов.";
  return "";
}
function researchCost(id){const t=s.development.tech[id]+1;return {food:40*t,wood:60*t*t,parts:15*t*t}}
function researchTime(id){return 60*(s.development.tech[id]+1)}
function researchReason(id){
  const l=s.development.tech[id];
  if(l>=TECH[id].max)return "Полностью изучено.";
  if(s.development.job?.id===id)return "Исследование выполняется.";
  if(s.development.job)return "Исследователи заняты.";
  if(s.fight)return "Дождись окончания обороны.";
  if(!s.buildings.workshop)return "Построй мастерскую.";
  if(s.buildings.hq<l+2)return `Требуется штаб ${l+2}.`;
  if(!afford(researchCost(id)))return "Недостаточно ресурсов.";
  return "";
}
function territoryReason(id){
  const p=TERRITORY[id];
  if(cleared(id))return "Участок освоен.";
  if(s.territory.job?.id===id)return "Расчистка выполняется.";
  if(s.territory.job)return "Бригада расчистки занята.";
  if(s.fight)return "Дождись окончания обороны.";
  if(p.previous&&!cleared(p.previous))return `Сначала: ${TERRITORY[p.previous].name}.`;
  if(s.buildings.hq<p.need)return `Требуется штаб ${p.need}.`;
  if(!afford(p.cost))return "Недостаточно ресурсов.";
  return "";
}
function refreshMarket(now=Date.now()){
  if(now<s.market.refreshAt)return false;
  const periods=Math.floor((now-s.market.refreshAt)/MARKET_PERIOD)+1;
  s.market.refreshAt+=periods*MARKET_PERIOD;s.market.used={};return true;
}
function tradeReason(id){
  if(s.buildings.hq<2)return "Торговля доступна со штаба 2.";
  if(s.fight)return "Во время обороны торговля закрыта.";
  if((s.market.used[id]||0)>=TRADES[id].stock)return "Запас каравана исчерпан.";
  if(!afford(TRADES[id].cost))return "Недостаточно ресурсов.";
  return "";
}

function createEncounter(now,seconds){
  const types=Object.keys(ENCOUNTERS);
  return {type:types[Math.floor(Math.random()*types.length)],at:now+seconds*400,choice:null,chosenAt:null};
}
function eventAvailable(now=Date.now()){
  const e=s.expedition;return !!(e?.event&&!e.event.choice&&now>=e.event.at&&now<e.ends);
}
function chosenOption(e=s.expedition){return e?.event?.choice?ENCOUNTERS[e.event.type].choices[e.event.choice]:null}
function chooseEvent(choice){
  const e=s.expedition;
  if(!eventAvailable())return say("Событие сейчас недоступно.");
  const def=ENCOUNTERS[e.event.type],o=def.choices[choice];
  if(!o)return;
  if(!pay(o.cost))return say("Недостаточно ресурсов.");
  const now=Date.now(),before=e.ends;
  e.event.choice=choice;e.event.chosenAt=now;
  e.ends=o.delay<0?Math.max(now+1000,e.ends+o.delay*1000):e.ends+o.delay*1000;
  logEvent("encounter",def.title,`Решение: ${o.name}.\n${o.desc}\nИзменение времени: ${Math.round((e.ends-before)/1000)} с.`);
  say(`Приказ принят: ${o.name}.`);
}

function finishExpedition(){
  const e=s.expedition,m=MISSIONS[e.kind],won=e.legacy||e.power>=m.enemy;
  if(e.event&&!e.event.choice){
    e.event.choice="safe";e.event.chosenAt=e.ends;
    const d=ENCOUNTERS[e.event.type];
    logEvent("encounter",d.title,`Без ответа выбрано: ${d.choices.safe.name}.\nБез дополнительных затрат и задержки.`,e.ends);
  }
  const option=chosenOption(e),fraction=e.legacy?0:won?clamp(.20-e.power/m.enemy*.035,.03,.16):.42;
  let wounded=0;
  e.army.forEach((n,i)=>{const c=Math.min(n,Math.ceil(n*fraction));s.army[i]+=n-c;s.wounded[i]+=c;wounded+=c});
  const reward={};
  for(const k of ["food","wood","parts"])reward[k]=Math.floor(m.reward[k]*(won?1:.25)*(e.lootBoost||1))+(option?.loot[k]||0);
  const residents=option?.residents||0;
  s.expeditionResidents=clamp(s.expeditionResidents+residents,0,100000000);
  gain(reward);s.stats.trips++;
  s.reports.unshift({kind:e.kind,won,wounded,residents,at:e.ends,...reward});s.reports=s.reports.slice(0,5);
  logEvent("expedition",`${m.name}: ${won?"успех":"отступление"}`,
    `Добыча всего: ${price(reward)}.\nРаненых: ${wounded}. Вернулись в строй: ${troopCount(e.army)-wounded}.`+
    (residents?`\nСпасено жителей: ${residents}.`:"")+(option?`\nСобытие: ${option.name}.`:""),e.ends);
  s.expedition=null;
  say(`${m.name}: ${won?"успех":"отступление"}. ${price(reward)}.`);
}
function pendingJobs(){
  return [
    {kind:"build",job:s.buildJob},{kind:"train",job:s.trainJob},{kind:"heal",job:s.healJob},
    {kind:"expedition",job:s.expedition},{kind:"research",job:s.development.job},
    {kind:"territory",job:s.territory.job},{kind:"civic",job:s.civic.job}
  ].filter(x=>x.job);
}
function advance(now=Date.now()){
  if(!Number.isFinite(now)||now<s.last)return false;
  let cursor=clamp(s.last,now-OFFLINE,now),changed=false;
  for(let pass=0;pass<16;pass++){
    const due=pendingJobs().filter(x=>x.job.ends<=now).sort((a,b)=>a.job.ends-b.job.ends)[0];
    if(!due)break;
    const until=clamp(due.job.ends,cursor,now);production((until-cursor)/1000);cursor=until;
    const j=due.job;
    if(due.kind==="build"){
      s.buildings[j.id]=j.target;s.buildJob=null;
      const text=`${BUILD[j.id].name}: завершён уровень ${j.target}.`;
      logEvent("build","Строительство завершено",text,j.ends);say(text);
    }
    if(due.kind==="train"){
      s.army[j.type]+=j.count;s.stats.trained+=j.count;s.trainJob=null;
      const text=`${UNIT[j.type].name}: подготовлено ${j.count} бойцов.`;
      logEvent("train","Пополнение гарнизона",text,j.ends);say(text);
    }
    if(due.kind==="heal"){
      s.army[j.type]+=j.count;s.healJob=null;
      const text=`${UNIT[j.type].name}: вернулись в строй ${j.count} бойцов.`;
      logEvent("heal","Лечение завершено",text,j.ends);say(text);
    }
    if(due.kind==="expedition")finishExpedition();
    if(due.kind==="research"){
      s.development.tech[j.id]=j.target;s.development.job=null;
      const text=`${TECH[j.id].name}: уровень ${j.target}.`;
      logEvent("research","Исследование завершено",text,j.ends);say(text);
    }
    if(due.kind==="territory"){
      const p=TERRITORY[j.id];
      if(!cleared(j.id)){
        s.territory.cleared.push(j.id);gain(p.reward);
        logEvent("territory",`${p.name}: участок освоен`,`Спасено: ${p.survivors}.\n${p.bonus}.\nПрипасы: ${price(p.reward)}.`,j.ends);
      }
      s.territory.job=null;say(`${p.name}: освоен! ${p.bonus}.`);
    }
    if(due.kind==="civic"){
      s.civic.levels[j.id]=j.target;s.civic.job=null;
      const text=`${CIVIC[j.id].name}: уровень ${j.target}. ${civicEffect(j.id,j.target)}.`;
      logEvent("civic","Инфраструктура улучшена",text,j.ends);say(text);
    }
    normalizeWorkers();changed=true;
  }
  production(Math.max(0,now-cursor)/1000);s.last=now;
  return refreshMarket(now)||changed;
}

function waveType(w){return w%5===0?"boss":w%3===0?"armored":w%2===0?"swarm":"walkers"}
function bossReward(w){return {food:80+w*12,wood:100+w*15,parts:25+w*5}}
function startBattle(){
  if(s.fight)return;if(s.expedition)return say("Дождись возвращения героев.");
  const type=waveType(s.wave),hp=maxHP(),enemy=Math.round((140+s.wave*85)*ENEMIES[type].health);
  s.fight={hp,max:hp,enemy,enemyMax:enemy,wave:s.wave,shot:0,repairUsed:false,flash:0,tactics:{type,used:{charge:false,volley:false,aid:false}}};
  tab="battle";dockSize="normal";lastCombat=performance.now();homeCamera();
  say(`Волна ${s.wave}: ${ENEMIES[type].name}.`);
}
function woundHome(fraction){
  let total=0;
  s.army=s.army.map((n,i)=>{const c=Math.min(n,Math.ceil(n*fraction));s.wounded[i]+=c;total+=c;return n-c});
  return total;
}
function resolveBattle(){
  const f=s.fight;if(!f)return false;
  if(f.enemy<=0){
    const wounded=woundHome(clamp((1-f.hp/f.max)*.15,0,.15));
    const reward={food:45+f.wave*10,wood:60+f.wave*20,parts:15+f.wave*5};
    if(f.tactics.type==="boss"){const extra=bossReward(f.wave);for(const k of ["food","wood","parts"])reward[k]+=extra[k]}
    gain(reward);s.wave=Math.max(s.wave,f.wave+1);s.fight=null;
    logEvent("win",`Волна ${f.wave} отражена`,`${ENEMIES[f.tactics.type].name}.\nТрофеи: ${price(reward)}.\nПрочность: ${fmt(f.hp)} / ${fmt(f.max)}.\nРаненых: ${wounded}.`);
    say(`Волна отражена! ${price(reward)}.`);return true;
  }
  if(f.hp<=0){
    const wounded=woundHome(.3),lost=Math.min(s.food,35);s.food=Math.max(0,s.food-35);s.fight=null;
    logEvent("loss",`Волна ${f.wave}: отступление`,`Потеряно еды: ${dec(lost)}.\nРаненых: ${wounded}.`);
    say(`Отступление. Раненых: ${wounded}.`);return true;
  }
  return false;
}
function shoot(){
  const f=s.fight;if(!f||document.hidden||Date.now()-f.shot<550)return;
  f.shot=Date.now();f.enemy-=power()*.8;f.flash=.15;resolveBattle();
}
function repair(){
  const f=s.fight;if(!f||f.repairUsed)return;
  if(f.hp>=f.max)return say("Оборона не повреждена.");
  if(!pay({parts:10}))return say("Нужно 10 деталей.");
  f.repairUsed=true;f.hp=Math.min(f.max,f.hp+f.max*.3);say("Восстановлено 30% прочности.");
}
function skillValue(id){
  const f=s.fight;if(!f)return 0;
  if(id==="charge")return Math.round(f.enemyMax*Math.min(.24,.10+s.heroes[0]*.008));
  if(id==="volley")return Math.round(power()*Math.min(6,2.5+s.heroes[1]*.15));
  return Math.round(f.max*Math.min(.4,.20+s.heroes[2]*.01));
}
function skillDescription(id){
  if(id==="charge")return `${dec(Math.min(24,10+s.heroes[0]*.8),1)}% здоровья орды.`;
  if(id==="volley")return `Урон гарнизона ×${dec(Math.min(6,2.5+s.heroes[1]*.15))}.`;
  return `Восстановление до ${Math.min(40,20+s.heroes[2])}% прочности.`;
}
let skillEffect=null;
function useSkill(id){
  const f=s.fight,k=SKILLS.find(v=>v.id===id);
  if(!f||!k||document.hidden||f.tactics.used[id])return;
  if(id==="aid"&&f.hp>=f.max-.01)return say("Помощь пока не требуется.");
  f.tactics.used[id]=true;let amount=skillValue(id);
  if(id==="aid"){amount=Math.min(amount,f.max-f.hp);f.hp+=amount}
  else{amount=Math.min(amount,Math.max(0,f.enemy));f.enemy-=amount;f.flash=.35}
  skillEffect={id,value:amount,started:performance.now()};
  say(`${k.name}: ${id==="aid"?"+":""}${fmt(amount)}.`);resolveBattle();
}
function advanceCombat(dt){
  const f=s.fight;if(!f||document.hidden||dt<=0)return false;
  const our=Math.max(0,power()),enemy=9+f.wave*4;
  const te=our>0?Math.max(0,f.enemy)/our:Infinity,tb=Math.max(0,f.hp)/enemy;
  const elapsed=Math.max(0,Math.min(dt,te,tb));
  f.enemy=Math.max(0,f.enemy-our*elapsed);f.hp=Math.max(0,f.hp-enemy*elapsed);f.flash=Math.max(0,f.flash-dt);
  if(te<=dt&&te<=tb)f.enemy=0;else if(tb<=dt)f.hp=0;
  return resolveBattle();
}

const canvas=$("world"),ctx=canvas.getContext("2d"),scene=$("scene");
let hits=[],lastDraw=0;
const iso=(x,y)=>({x:500+(x-y)*42,y:220+(x+y)*22});

function poly(points,fill,stroke){
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function tile(x,y,w,d,color,stroke){poly([iso(x,y),iso(x+w,y),iso(x+w,y+d),iso(x,y+d)],color,stroke)}
function block(x,y,w,d,h,color){
  const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+d),e=iso(x,y+d),up=p=>({x:p.x,y:p.y-h});
  poly([e,c,up(c),up(e)],"#12171a","#2d3339");poly([b,c,up(c),up(b)],"#1a2026","#2d3339");
  poly([up(a),up(b),up(c),up(e)],color,"#f0a50055");
}

function drawBase(t){
  hits=[];
  ctx.fillStyle="#0f1317";ctx.fillRect(0,0,1000,780);
  
  for(let y=-1;y<7;y++)for(let x=-3;x<7;x++){
    tile(x,y,1,1,"#1b2228","#252d35");
  }

  for(const [id,p] of Object.entries(TERRITORY)){
    const done=cleared(id),working=s.territory.job?.id===id,c=iso(p.x+.85,p.y+.8);
    tile(p.x,p.y,1.75,1.6,done?"#1e2a22":working?"#38321e":"#0d1012","#2d3339");
    if(!done && !working){
      block(p.x+.15,p.y+.15,1.45,1.3,15,"#15191c");
      ctx.font="20px system-ui";ctx.textAlign="center";ctx.fillStyle="#f0a500";
      ctx.fillText("🔒",c.x,c.y-10);
    }
    hits.push({kind:"land",id,x:c.x,y:c.y,r:30});
  }

  const objects=[
    ...Object.entries(BUILD).map(([id,b])=>({kind:"building",id,b,l:s.buildings[id],job:s.buildJob?.id===id?s.buildJob:null})),
    ...Object.entries(CIVIC).map(([id,b])=>({kind:"civic",id,b,l:s.civic.levels[id],job:s.civic.job?.id===id?s.civic.job:null}))
  ].sort((a,b)=>(a.b.x+a.b.y)-(b.b.x+b.b.y));

  for(const o of objects){
    const {kind,id,b,l,job}=o,p=iso(b.x+b.w/2,b.y+b.d/2);
    if(l||job){
      block(b.x,b.y,b.w,b.d,b.h||20,job?"#f0a500":b.roof||"#2c343e");
      ctx.font="16px system-ui";ctx.textAlign="center";ctx.fillStyle="#fff";
      ctx.fillText(b.icon,p.x,p.y-(b.h||20)-5);
    }else{
      tile(b.x,b.y,b.w,b.d,"#181d22","#f0a50044");
    }
    hits.push({kind,id,x:p.x,y:p.y-10,r:30});
  }
}

function drawMap(){
  hits=[];
  ctx.fillStyle="#0f1317";ctx.fillRect(0,0,1000,780);
  const home={x:500,y:500};
  for(const [id,m] of Object.entries(MISSIONS)){
    const active=id===selectedMission;
    ctx.beginPath();ctx.arc(m.x,m.y,20,0,Math.PI*2);
    ctx.fillStyle=active?"#f0a500":"#252d35";ctx.fill();
    ctx.font="12px system-ui";ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.fillText(m.name,m.x,m.y+35);
    hits.push({kind:"mission",id,x:m.x,y:m.y,r:30});
  }
}

/* ================= КАМЕРА И УПРАВЛЕНИЕ ================= */
let camera={scale:1,x:0,y:0};
function applyCamera(){
  canvas.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
}
function fitCanvas(){
  let width=scene.clientWidth,height=width*780/1000;
  if(height>scene.clientHeight){height=scene.clientHeight;width=height*1000/780}
  canvas.style.width=Math.max(1,width)+"px";canvas.style.height=Math.max(1,height)+"px";applyCamera();
}
function homeCamera(){camera={scale:1,x:0,y:0};applyCamera()}

function canvasClick(clientX,clientY){
  const r=canvas.getBoundingClientRect(),x=(clientX-r.left)*1000/r.width,y=(clientY-r.top)*780/r.height;
  const nearest=hits.map(h=>({...h,dist:Math.hypot(h.x-x,h.y-y)})).sort((a,b)=>a.dist-b.dist)[0];
  if(!nearest||nearest.dist>nearest.r)return;
  advance();
  if(nearest.kind==="mission"){selectedMission=nearest.id;tab="map";render()}
  else{selectedObject={kind:nearest.kind,id:nearest.id};openModal(nearest.kind,nearest.id);render()}
  save();
}

const layer=$("camera-layer"),pointers=new Map();let gesture=null;
layer.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1)gesture={startX:e.clientX,startY:e.clientY,moved:false};
});
layer.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)||!gesture)return;
  if(Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY)>5)gesture.moved=true;
});
layer.addEventListener("pointerup",e=>{
  if(gesture&&!gesture.moved)canvasClick(e.clientX,e.clientY);
  pointers.delete(e.pointerId);if(!pointers.size)gesture=null;
});

document.querySelector(".camera-controls").addEventListener("click",e=>{

  applyCamera();
});

  if(a==="batch")trainingBatch=Number(id);
  if(a==="train")trainUnits(Number(id));
  if(a==="heal")healUnits(Number(id));
  if(a==="mission")selectedMission=id;
  if(a==="send")sendExpedition();
  if(a==="event-choice")chooseEvent(id);
  if(a==="battle")startBattle();
  if(a==="repair")repair();
  if(a==="skill")useSkill(id);
  if(a==="shoot")shoot();
  if(a==="claim")claimQuest(id);
  if(a==="chapter-claim")claimChapter();
  if(a==="start-research")startResearch(id);
  if(a==="close")closeModal();
  save();render();
});

function tick(){
  const now=Date.now();
  if(advance(now))render();else live();
}
function frame(ms){
  if(ms-lastDraw>=30){
    if(tab==="map")drawMap();else drawBase(ms/1000);
    lastDraw=ms;
  }
  requestAnimationFrame(frame);
}

normalizeWorkers();
advance();
render();
setInterval(tick,250);
requestAnimationFrame(frame);
window.addEventListener("resize",fitCanvas);
fitCanvas();
</script>
</body>
</html>
