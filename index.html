<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102329">
<title>Последний порт — Новый горизонт</title>
<style>
:root{
  color-scheme:dark;
  --bg:#09171c;--panel:#152c32;--panel2:#203b40;
  --line:#52645c;--gold:#dfbf82;--text:#e6ece6;
  --muted:#a5b8b2;--green:#a9c580;--red:#e4a094;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at 50% 0,#28464a 0,#10252b 38%,var(--bg) 75%);
  color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh;
}
button,input{font:inherit}
button{
  cursor:pointer;color:var(--text);background:linear-gradient(145deg,#2b4548,#162c32);
  border:1px solid #687b716e;border-radius:14px;padding:12px 15px;
  touch-action:manipulation;transition:filter .15s,transform .15s;
}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.43;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.primary{background:linear-gradient(135deg,#eed3a0,#b38a4b);color:#302818;border-color:#eed3a0}
.danger{border-color:#b67868;color:#f1b2a4}
button.small{padding:6px 11px;border-radius:10px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(23px,4.5vw,35px);letter-spacing:2px;line-height:1.25}
h2{font-size:22px}h3{font-size:17px}
p{margin:8px 0;color:#c2cfc7}
small,.muted{color:var(--muted)}
.eyebrow{font-size:10px;letter-spacing:3px;color:#c7c5ac}
.app{max-width:1120px;margin:auto;padding:18px 14px 35px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.header{margin-bottom:14px;gap:15px}
.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.resource{background:#1a3339d9;border:1px solid #67786e66;border-bottom:3px solid var(--accent);
  padding:11px 7px;border-radius:16px;text-align:center}
.resource small{display:block;font-size:10px;letter-spacing:1.5px}
.resource strong{display:block;font-size:clamp(17px,3.4vw,25px)}
.resource em{font-size:10px;color:#aabbb2;font-style:normal}
.scene{
  position:relative;overflow:hidden;border:1px solid #8e896b;border-radius:25px;
  background:#132d35;box-shadow:0 18px 60px #0004;
}
canvas{display:block;width:100%;aspect-ratio:10/7;touch-action:none}
.badge{
  position:absolute;top:12px;left:12px;max-width:calc(100% - 95px);
  border:1px solid #8c835955;padding:7px 12px;border-radius:12px;
  background:#0b2028d9;color:#dfcfab;font-size:10px;letter-spacing:1.5px;pointer-events:none;
}
.camera{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;padding:6px;
  border:1px solid #857d5555;border-radius:18px;background:#0b1c23dc}
.camera button{width:44px;height:44px;padding:0;font-size:25px}
.day{position:absolute;right:12px;top:12px;color:#e5d2a2;font-size:12px;pointer-events:none}
.strip{margin-top:11px;padding:14px 17px;border-radius:17px;border:1px solid #b89d69;
  background:linear-gradient(100deg,#73603b66,#20433888);width:100%;text-align:left}
.strip strong{display:block;font-size:18px}
.queue{display:flex;gap:7px;overflow:auto;padding:11px 0 3px;scrollbar-width:thin}
.queue:empty{display:none}
.chip{white-space:nowrap;font-size:12px;border:1px solid #81907c44;border-radius:30px;padding:6px 11px;background:#20373b}
.toolbar{margin:13px 0 10px;display:flex;gap:7px;flex-wrap:wrap}
.toolbar button{flex:1;white-space:nowrap;padding:10px}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:7px;border-radius:20px;
  background:#142b31f5;border:1px solid #73827766;position:sticky;top:5px;z-index:3;backdrop-filter:blur(10px)}
nav button{border:0;background:none;padding:9px 3px;font-size:12px;color:#aabeb6}
nav button b{display:block;font-size:24px;line-height:1.3}
nav button.active{background:linear-gradient(140deg,#ead09b,#b18b52);color:#332d1d}
#panel{margin:15px 0;min-height:180px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{
  padding:16px;border:1px solid #70847750;border-radius:18px;
  background:linear-gradient(140deg,#243d40bd,#10272fc9);min-width:0;
}
.card p{font-size:13px}
.card button{margin-top:8px}
.card .row button{margin-top:0}
.card.selected{border-color:var(--gold)}
.card.working{border-color:#a8c38a}
.icon{font-size:25px;margin-bottom:4px}
.cost{color:#d8c69b;font-size:12px;line-height:1.8}
.bad{color:var(--red)}
.good{color:var(--green)}
.bar{height:9px;border-radius:8px;overflow:hidden;background:#071820;margin:9px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a361,#edd5a0);transition:width .2s}
.bar.red i{background:linear-gradient(90deg,#ad5d50,#e7a381)}
.bar.green i{background:linear-gradient(90deg,#68835b,#b5d28a)}
.hint{font-size:12px;color:#9db0a9}
.section-title{margin:0 0 11px}
.wide{grid-column:1/-1}
footer{font-size:11px;color:#879e98;margin-top:18px}
dialog{
  border:1px solid #aa966b;border-radius:24px;padding:0;background:#10262d;color:var(--text);
  width:min(650px,calc(100% - 22px));max-height:88dvh;box-shadow:0 30px 100px #000a;
}
dialog::backdrop{background:#020b11bc;backdrop-filter:blur(5px)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:17px 19px;border-bottom:1px solid #77856b44;background:#1b3338}
#modal-body{padding:18px;overflow:auto;max-height:calc(88dvh - 86px)}
#modal-body .card{margin-bottom:10px}
.quote{border-left:3px solid var(--gold);padding:9px 14px;background:#bda3640d}
.log{border-bottom:1px solid #64776b3b;padding:12px 0}
.log small{font-size:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;
  pointer-events:none;z-index:20;background:#ead2a2;color:#292a21;padding:12px 20px;
  border-radius:13px;box-shadow:0 8px 30px #0008;transition:.2s;width:max-content;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:25px;text-align:center;color:#a8bcb2}
@media(min-width:800px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scene{max-height:590px}
  canvas{aspect-ratio:1000/550}
  #modal-body .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  .app{padding:13px 9px 25px}
  .header button{padding:9px 13px}
  .resource{padding:9px 3px}
  .resource small{font-size:8px}
  .toolbar button{font-size:12px;padding:10px 6px}
  .card{padding:12px}.card h3{font-size:15px}
  .card button{padding:10px 12px;font-size:13px}
  canvas{aspect-ratio:1/1}
  nav button{font-size:10px}
  .badge{font-size:8px;padding:7px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="row between header">
    <div><div class="eyebrow">НОВЫЙ ГОРИЗОНТ · СТРАТЕГИЯ ВЫЖИВАНИЯ</div><h1>ПОСЛЕДНИЙ ПОРТ</h1></div>
    <div class="row"><small id="wave"></small><button data-act="fullscreen" aria-label="Полный экран">⛶</button><button data-act="help">?</button></div>
  </header>
  <div class="resources" id="resources"></div>
  <section class="scene">
    <canvas id="world" aria-label="Карта порта. Здания также доступны в разделе База."></canvas>
    <div class="badge" id="badge"></div><div class="day" id="day"></div>
    <div class="camera">
      <button data-act="zoomout" aria-label="Уменьшить">−</button>
      <button data-act="zoomin" aria-label="Увеличить">+</button>
      <button data-act="home" class="primary" aria-label="Общий вид">⌂</button>
    </div>
  </section>
  <button class="strip" data-act="project" id="project-strip"></button>
  <div id="queue" class="queue"></div>
  <div class="toolbar">
    <button data-act="people">♙ Жители</button>
    <button data-act="market">⚖ Торговля</button>
    <button data-act="research">⚙ Развитие</button>
    <button data-act="quests">✧ Задания</button>
  </div>
  <nav id="nav"></nav>
  <section id="panel"></section>
  <div class="row between"><span class="hint" id="status">Порт ждёт твоих решений.</span><button data-act="journal">☷ Журнал</button></div>
  <footer>Автосохранение в этом браузере · производство в отсутствие игрока до 8 часов · оборона в фоне приостановлена.</footer>
</main>
<dialog id="dialog">
  <div class="modal-head"><h2 id="modal-title"></h2><button data-act="close" aria-label="Закрыть">✕</button></div>
  <div id="modal-body"></div>
</dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

<script>
"use strict";
(()=>{
const $=id=>document.getElementById(id);
const KEY="last-port-new-horizon-v1";
const VERSION=1;
const nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const fmt=n=>nf.format(Math.floor(n));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RES={food:["🌾","Еда"],wood:["▥","Дерево"],parts:["⚙","Детали"],coins:["◈","Марки"]};
const B={
 hq:{name:"Штаб",icon:"⚑",desc:"Увеличивает прочность базы и открывает новые уровни зданий.",x:4,y:3,w:1.2,d:1.2,h:56,color:"#bda172",cost:{wood:100,parts:30},max:10},
 farm:{name:"Теплицы",icon:"♧",desc:"Выращивают еду для отрядов и жителей.",x:2,y:2,w:1.4,d:1.1,h:24,color:"#8bac91",cost:{wood:65,parts:12},max:10,res:"food",rate:.8},
 mill:{name:"Лесопилка",icon:"▥",desc:"Перерабатывает древесину из окрестностей.",x:2,y:5,w:1.2,d:1,h:29,color:"#a38c60",cost:{wood:70,parts:15},max:10,res:"wood",rate:.6},
 workshop:{name:"Мастерская",icon:"⚙",desc:"Производит детали. Нужна для исследований.",x:5,y:2,w:1.1,d:1,h:36,color:"#819c96",cost:{wood:95,parts:20},max:10,res:"parts",rate:.22},
 housing:{name:"Жилой квартал",icon:"⌂",desc:"Каждый уровень даёт жильё для 15 жителей.",x:1,y:3.5,w:1.1,d:1.2,h:35,color:"#b6a07b",cost:{wood:90,parts:15},max:10},
 water:{name:"Водонапорная",icon:"◉",desc:"Обеспечивает водой 18 жителей за уровень.",x:1,y:5.7,w:.8,d:.8,h:34,color:"#8db7b0",cost:{wood:60,parts:30},max:10},
 energy:{name:"Электростанция",icon:"ϟ",desc:"Поддерживает 6 рабочих мест за уровень.",x:3.4,y:6,w:1,d:1,h:27,color:"#8caa92",cost:{wood:80,parts:40},max:10},
 store:{name:"Склад",icon:"▣",desc:"Увеличивает вместимость еды, дерева и деталей.",x:5,y:5,w:1.3,d:1.1,h:31,color:"#929d8c",cost:{wood:100,parts:25},max:10},
 barracks:{name:"Казармы",icon:"⚔",desc:"Вмещают по 15 бойцов за уровень и ускоряют обучение.",x:6.4,y:3.5,w:1.1,d:1.2,h:30,color:"#9c9874",cost:{wood:110,parts:35},max:10},
 hospital:{name:"Лазарет",icon:"✚",desc:"Лечит раненых. Новые уровни сокращают время лечения.",x:6.3,y:5.5,w:1,d:1,h:28,color:"#bcbaa5",cost:{wood:95,parts:45},max:10},
 wall:{name:"Периметр",icon:"♜",desc:"Усиливает прочность базы и постоянный урон обороны.",x:.6,y:.7,w:.7,d:.7,h:62,color:"#a28a62",cost:{wood:100,parts:30},max:10},
 dock:{name:"Причал",icon:"⚓",desc:"Увеличивает добычу экспедиций на 8% за уровень.",x:7,y:7,w:1.5,d:1.1,h:15,color:"#a28c63",cost:{wood:130,parts:45},max:10}
};
const TECH={
 tools:{name:"Точные инструменты",icon:"⚙",desc:"+12% ко всему производству за уровень.",cost:{wood:150,parts:70},max:5},
 tactics:{name:"Тактическая связь",icon:"⌁",desc:"+10% к урону обороны за уровень.",cost:{food:160,parts:85},max:5},
 logistics:{name:"Логистика",icon:"⚓",desc:"Вылазки короче на 6% за уровень.",cost:{wood:180,parts:80},max:5},
 medicine:{name:"Полевая медицина",icon:"✚",desc:"На 12% меньше раненых за уровень.",cost:{food:200,parts:65},max:5}
};
const HERO={
 vera:{name:"Вера · инженер",icon:"⚙",desc:"+5% производства за уровень.",cost:70},
 mark:{name:"Марк · командир",icon:"⚔",desc:"+7% урона обороны за уровень.",cost:80},
 lina:{name:"Лина · разведчица",icon:"⌖",desc:"+8% добычи экспедиций за уровень.",cost:75}
};
const LAND={
 grove:{name:"Старый лес",desc:"+15% производства дерева.",wood:.15,cost:{food:140,wood:150,parts:30},time:60,x:0,y:8},
 fields:{name:"Затопленные сады",desc:"+15% производства еды.",food:.15,cost:{food:220,wood:200,parts:60},time:100,x:8,y:0},
 depot:{name:"Грузовой терминал",desc:"+20% производства деталей.",parts:.2,cost:{food:300,wood:350,parts:100},time:150,x:8,y:2},
 village:{name:"Посёлок у дамбы",desc:"В порт переселятся 10 жителей.",people:10,cost:{food:500,wood:450,parts:140},time:210,x:3,y:8},
 radar:{name:"Радиостанция",desc:"+15% добычи экспедиций. Нужна для маяка.",loot:.15,cost:{food:650,wood:600,parts:220},time:270,x:8,y:5}
};
const MISSIONS={
 coast:{name:"Береговая полоса",icon:"≈",desc:"Короткий маршрут за припасами.",need:3,time:70,cost:{food:35},reward:{food:130,wood:100,parts:30,coins:12},risk:.08},
 city:{name:"Заброшенный город",icon:"▥",desc:"Много деталей, но встречаются засады.",need:7,time:150,cost:{food:80},reward:{food:100,wood:160,parts:130,coins:30},risk:.18},
 bunker:{name:"Северный бункер",icon:"◈",desc:"Дальний маршрут за редкими запасами.",need:12,time:280,cost:{food:150},reward:{food:260,wood:250,parts:280,coins:65},risk:.26}
};
const EVENTS=[
 {name:"Огонёк на берегу",text:"В пустом доме прячутся выжившие. Они просят еды и место в порту.",choice:"Принять жителей",cost:{food:65},reward:{},people:3},
 {name:"Закрытый контейнер",text:"Отряд нашёл грузовой контейнер. Понадобятся инструменты, чтобы открыть замок.",choice:"Вскрыть контейнер",cost:{parts:25},reward:{wood:140,parts:95,coins:20},people:0},
 {name:"Застрявший караван",text:"Повозка торговцев сломалась. За ремонт они предлагают часть груза.",choice:"Помочь с ремонтом",cost:{wood:60,parts:15},reward:{food:200,coins:45},people:1}
];
const TRADES={
 food:{name:"Провиант для каравана",cost:{food:150},reward:{parts:45},stock:5},
 wood:{name:"Строевой лес",cost:{wood:150},reward:{parts:45},stock:5},
 tools:{name:"Ящик инструментов",cost:{coins:30},reward:{parts:120},stock:4},
 supply:{name:"Запас продовольствия",cost:{coins:15},reward:{food:180},stock:4}
};
const PROJECT=[
 {name:"Основание маяка",desc:"Вернуть порту ориентир среди тумана.",cost:{wood:500,parts:180},hq:2,land:1},
 {name:"Оптический блок",desc:"Собрать линзу и автономный генератор.",cost:{wood:1000,parts:550,coins:120},hq:3,land:3},
 {name:"Свет нового горизонта",desc:"Зажечь маяк. Все производства получат +25%.",cost:{wood:1800,parts:1000,coins:250},hq:4,land:5}
];
const QUESTS=[
 {name:"Первые мастерские",text:"Улучшить мастерскую до 2 уровня.",check:s=>s.b.workshop>=2,reward:{parts:80,coins:25}},
 {name:"Надёжный дом",text:"Улучшить жильё до 2 уровня.",check:s=>s.b.housing>=2,reward:{food:200,wood:150}},
 {name:"Наука возвращается",text:"Завершить любое исследование.",check:s=>Object.values(s.tech).some(v=>v>0),reward:{parts:120,coins:40}},
 {name:"Не одиноки",text:"Довести население до 18 жителей.",check:s=>s.people>=18,reward:{food:350,coins:60}},
 {name:"За периметром",text:"Освоить две территории.",check:s=>s.lands.length>=2,reward:{wood:300,parts:140}},
 {name:"Опытный отряд",text:"Завершить три вылазки.",check:s=>s.stats.trips>=3,reward:{coins:120,parts:200}},
 {name:"Стальной рубеж",text:"Выиграть три обороны.",check:s=>s.stats.wins>=3,reward:{food:400,parts:250,coins:100}},
 {name:"Новый горизонт",text:"Завершить строительство маяка.",check:s=>s.project>=3,reward:{coins:500,parts:700}}
];
const TABS=[["base","⌂","База"],["lands","▧","Земли"],["heroes","★","Герои"],["army","⚑","Войска"],["trips","⌖","Вылазки"],["defense","⚔","Оборона"]];
function fresh(){
 const now=Date.now();
 return {version:VERSION,last:now,res:{food:500,wood:550,parts:220,coins:90},
 b:Object.fromEntries(Object.keys(B).map(k=>[k,1])),
 tech:Object.fromEntries(Object.keys(TECH).map(k=>[k,0])),
 heroes:{vera:1,mark:1,lina:1},active:"vera",people:12,army:8,wounded:0,
 jobs:{build:null,research:null,train:null,heal:null,trip:null,land:null},
 lands:[],project:0,wave:1,fight:null,claimed:[],logs:[],
 stats:{trips:0,wins:0},market:{epoch:Math.floor(now/14400000),used:{}}
 };
}
function validate(v){
 const number=(n,min,max)=>typeof n==="number"&&Number.isFinite(n)&&n>=min&&n<=max;
 const integer=(n,min,max)=>number(n,min,max)&&Number.isInteger(n);
 const assert=(ok)=>{if(!ok)throw Error("Неверный или несовместимый файл сохранения.");};
 assert(v&&v.version===VERSION);
 const out=fresh();
 assert(number(v.last,0,Date.now()+86400000));out.last=v.last;
 for(const k in RES){assert(number(v.res?.[k],0,1e12));out.res[k]=v.res[k]}
 for(const k in B){assert(integer(v.b?.[k],1,B[k].max));out.b[k]=v.b[k]}
 for(const k in TECH){assert(integer(v.tech?.[k],0,TECH[k].max));out.tech[k]=v.tech[k]}
 for(const k in HERO){assert(integer(v.heroes?.[k],1,10));out.heroes[k]=v.heroes[k]}
 assert(Object.hasOwn(HERO,v.active));out.active=v.active;
 for(const [k,min,max] of [["people",12,100000],["army",0,150],["wounded",0,150],["project",0,3],["wave",1,100000]]){
   assert(integer(v[k],min,max));out[k]=v[k];
 }
 assert(v.army+v.wounded<=v.b.barracks*15);
 assert(Array.isArray(v.lands)&&v.lands.every(k=>Object.hasOwn(LAND,k))&&new Set(v.lands).size===v.lands.length);
 out.lands=[...v.lands];
 assert(Array.isArray(v.claimed)&&v.claimed.every(k=>integer(k,0,QUESTS.length-1)));
 out.claimed=[...new Set(v.claimed)];
 for(const k of ["trips","wins"]){assert(integer(v.stats?.[k],0,1e9));out.stats[k]=v.stats[k]}
 assert(integer(v.market?.epoch,0,1e10));
 out.market={epoch:v.market.epoch,used:{}};
 for(const k in TRADES){
   const n=v.market.used?.[k]??0;assert(integer(n,0,TRADES[k].stock));out.market.used[k]=n;
 }
 assert(v.jobs&&typeof v.jobs==="object");
 for(const kind in out.jobs){
   const j=v.jobs[kind];if(j==null)continue;
   assert(number(j.start,0,Date.now()+86400000)&&number(j.end,j.start+1,j.start+86400000));
   const n={start:j.start,end:j.end};
   if(kind==="build"||kind==="research"){
     const defs=kind==="build"?B:TECH,state=kind==="build"?out.b:out.tech;
     assert(Object.hasOwn(defs,j.id)&&state[j.id]<defs[j.id].max);n.id=j.id;
   }
   if(kind==="land"){assert(Object.hasOwn(LAND,j.id)&&!out.lands.includes(j.id));n.id=j.id}
   if(kind==="train"||kind==="heal"){
     assert(integer(j.count,1,150));n.count=j.count;
     if(kind==="train")assert(out.army+out.wounded+n.count<=out.b.barracks*15);
     else assert(n.count<=out.wounded);
   }
   if(kind==="trip"){
     assert(Object.hasOwn(MISSIONS,j.id)&&integer(j.units,1,out.army));
     assert(number(j.at,j.start,j.end)&&integer(j.event,0,EVENTS.length-1));
     assert([null,"safe","help"].includes(j.choice)&&number(j.roll,0,1));
     Object.assign(n,{id:j.id,units:j.units,at:j.at,event:j.event,choice:j.choice,roll:j.roll});
   }
   out.jobs[kind]=n;
 }
 if(v.fight){
   const f=v.fight;
   for(const k of ["hp","max","enemy","enemyMax","damage","attack"])
     assert(number(f[k],.001,1e12));
   assert(f.hp<=f.max&&f.enemy<=f.enemyMax&&number(f.cooldown,0,2));
   assert(Array.isArray(f.used)&&f.used.every(x=>["burst","repair","cover"].includes(x)));
   assert(number(f.shield,0,10));
   out.fight={hp:f.hp,max:f.max,enemy:f.enemy,enemyMax:f.enemyMax,damage:f.damage,attack:f.attack,
     cooldown:f.cooldown,shield:f.shield,used:[...new Set(f.used)]};
 }
 assert(Array.isArray(v.logs));
 out.logs=v.logs.slice(0,80).map(e=>{
   assert(number(e.at,0,Date.now()+86400000)&&typeof e.text==="string");
   return {at:e.at,text:e.text.slice(0,500)};
 });
 return out;
