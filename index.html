function fresh(){
  return {
    version:4,food:180,wood:200,parts:50,wave:1,
    buildings:{hq:1,farm:1,mill:1,barracks:1,wall:1,workshop:0,hospital:0,store:0},
    heroes:[1,1,1],army:[8,0,0],wounded:[0,0,0],
    buildJob:null,trainJob:null,healJob:null,expedition:null,fight:null,
    claimedQuests:[],stats:{trained:0,trips:0,trades:0},reports:[],
    development:{chapter:0,tech:{logistics:0,weapons:0,defenses:0},job:null},
    territory:{cleared:[],job:null},expeditionResidents:0,
    civic:{levels:{housing:1,water:1,energy:1},workers:{farm:0,mill:0,workshop:0},job:null},
    market:{refreshAt:Date.now()+MARKET_PERIOD,used:{}},
    journal:{entries:[],nextId:1,readThrough:0},
    livingUpdate:true,last:Date.now()
  };
}
function armyArray(a){return [0,1,2].map(i=>int(a?.[i],0,0,100000))}
function normalize(raw){
  const n=fresh();
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return n;
  const now=Date.now();
  for(const k of ["food","wood","parts"])n[k]=num(raw[k],n[k]);
  n.wave=int(raw.wave,1,1,10000);
  for(const id of Object.keys(BUILD)){
    const min=["hq","farm","mill","barracks","wall"].includes(id)?1:0;
    n.buildings[id]=int(raw.buildings?.[id],n.buildings[id],min,MAX_LEVEL);
  }
  n.heroes=n.heroes.map((v,i)=>int(raw.heroes?.[i],v,1,100));
  if(Array.isArray(raw.army))n.army=armyArray(raw.army);
  n.wounded=armyArray(raw.wounded);
  for(const k of ["trained","trips","trades"])n.stats[k]=int(raw.stats?.[k],0,0,100000000);
  n.expeditionResidents=int(raw.expeditionResidents,0,0,100000000);
  n.last=num(raw.last,now,0,now);
  if(Array.isArray(raw.claimedQuests))n.claimedQuests=[...new Set(raw.claimedQuests.filter(v=>typeof v==="string"))].slice(0,200);
  const validJob=j=>j&&Number.isFinite(j.started)&&Number.isFinite(j.ends)
    &&j.started>=0&&j.started<=now&&j.ends>j.started&&j.ends-j.started<=OFFLINE&&j.ends<=now+OFFLINE;
  const bj=raw.buildJob;
  if(validJob(bj)&&has(BUILD,bj.id)&&bj.target===n.buildings[bj.id]+1&&bj.target<=MAX_LEVEL)
    n.buildJob={id:bj.id,target:bj.target,started:bj.started,ends:bj.ends};
  for(const k of ["trainJob","healJob"]){
    const j=raw[k];
    if(validJob(j)&&Number.isInteger(j.type)&&UNIT[j.type]&&Number.isInteger(j.count)&&j.count>0&&j.count<=100000)
      n[k]={type:j.type,count:j.count,started:j.started,ends:j.ends};
  }
  const exp=raw.expedition;
  if(exp&&has(MISSIONS,exp.kind)&&Number.isFinite(exp.ends)&&exp.ends>=1&&exp.ends<=now+OFFLINE){
    const started=num(exp.started,Math.max(0,exp.ends-MISSIONS[exp.kind].seconds*1000),0,exp.ends-1);
    n.expedition={
      kind:exp.kind,started,ends:exp.ends,army:armyArray(exp.army),power:num(exp.power,0,0,100000000),
      legacy:exp.legacy===true||!Array.isArray(exp.army),lootBoost:num(exp.lootBoost,1,1,2),event:null
    };
    const ev=exp.event;
    if(ev&&has(ENCOUNTERS,ev.type)&&Number.isFinite(ev.at)){
      const choice=has(ENCOUNTERS[ev.type].choices,ev.choice)?ev.choice:null;
      n.expedition.event={type:ev.type,at:clamp(ev.at,started,exp.ends),choice,chosenAt:choice?num(ev.chosenAt,started,0,now):null};
    }
  }
  if(raw.development){
    n.development.chapter=int(raw.development.chapter,0,0,6);
    for(const id of Object.keys(TECH))n.development.tech[id]=int(raw.development.tech?.[id],0,0,TECH[id].max);
    const j=raw.development.job;
    if(validJob(j)&&has(TECH,j.id)&&j.target===n.development.tech[j.id]+1&&j.target<=TECH[j.id].max)
      n.development.job={id:j.id,target:j.target,started:j.started,ends:j.ends};
  }
  if(raw.territory){
    if(Array.isArray(raw.territory.cleared))n.territory.cleared=[...new Set(raw.territory.cleared.filter(id=>has(TERRITORY,id)))];
    const j=raw.territory.job;
    if(validJob(j)&&has(TERRITORY,j.id)&&!n.territory.cleared.includes(j.id))
      n.territory.job={id:j.id,started:j.started,ends:j.ends};
  }
  if(raw.civic){
    for(const id of Object.keys(CIVIC))n.civic.levels[id]=int(raw.civic.levels?.[id],1,1,10);
    for(const id of ["farm","mill","workshop"])n.civic.workers[id]=int(raw.civic.workers?.[id],0,0,12);
    const j=raw.civic.job;
    if(validJob(j)&&has(CIVIC,j.id)&&j.target===n.civic.levels[j.id]+1&&j.target<=10)
      n.civic.job={id:j.id,target:j.target,started:j.started,ends:j.ends};
  }
  if(raw.market){
    n.market.refreshAt=num(raw.market.refreshAt,now+MARKET_PERIOD,0,now+MARKET_PERIOD);
    for(const id of Object.keys(TRADES))n.market.used[id]=int(raw.market.used?.[id],0,0,TRADES[id].stock);
  }
  const f=raw.fight;
  if(f&&Number.isFinite(f.hp)&&f.hp>0&&Number.isFinite(f.enemy)&&f.enemy>0){
    const max=num(f.max,1,1,1e10),enemyMax=num(f.enemyMax,1,1,1e10);
    n.fight={
      hp:num(f.hp,1,1,max),max,enemy:num(f.enemy,1,1,enemyMax),enemyMax,
      wave:int(f.wave,n.wave,1,10000),shot:num(f.shot,0,0,now),repairUsed:f.repairUsed===true,flash:0,
      tactics:{type:has(ENEMIES,f.tactics?.type)?f.tactics.type:"walkers",used:{
        charge:f.tactics?.used?.charge===true,volley:f.tactics?.used?.volley===true,aid:f.tactics?.used?.aid===true
      }}
    };
    if(n.expedition)n.fight=null;
  }
  if(Array.isArray(raw.reports))n.reports=raw.reports.filter(r=>r&&has(MISSIONS,r.kind)).slice(0,5).map(r=>({
    kind:r.kind,won:r.won===true,wounded:int(r.wounded),residents:int(r.residents),
    at:num(r.at,now,0,now),food:num(r.food),wood:num(r.wood),parts:num(r.parts)
  }));
  if(Array.isArray(raw.journal?.entries)){
    const seen=new Set();
    n.journal.entries=raw.journal.entries.filter(e=>{
      if(!e||!Number.isSafeInteger(e.id)||e.id<1||e.id>1e12||seen.has(e.id)||typeof e.title!=="string"||typeof e.text!=="string")return false;
      seen.add(e.id);return true;
    }).sort((a,b)=>b.id-a.id).slice(0,LOG_LIMIT).map(e=>({
      id:e.id,at:num(e.at,now,0,now),type:has(EVENT_TYPES,e.type)?e.type:"system",title:e.title.slice(0,160),text:e.text.slice(0,1800)
    }));
    const maxId=n.journal.entries.reduce((v,e)=>Math.max(v,e.id),0);
    n.journal.nextId=maxId+1;n.journal.readThrough=int(raw.journal.readThrough,0,0,maxId);
  }
  n.livingUpdate=raw.livingUpdate===true;
  return n;
}
function readSave(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw)for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw)break}
    return normalize(JSON.parse(raw));
  }catch{return fresh()}
}
let s=readSave(),storageWarning=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(s))}
  catch{if(!storageWarning){storageWarning=true;say("Хранилище недоступно. Скачай резервную копию.")}}
}
function logEvent(type,title,text,at=Date.now()){
  s.journal.entries.unshift({
    id:s.journal.nextId++,at,type:has(EVENT_TYPES,type)?type:"system",
    title:String(title).slice(0,160),text:String(text).slice(0,1800)
  });
  s.journal.entries=s.journal.entries.slice(0,LOG_LIMIT);
}
function unread(){return s.journal.entries.filter(e=>e.id>s.journal.readThrough).length}

/* ================= ЖИТЕЛИ И ЭКОНОМИКА ================= */

function gain(c){for(const k of ["food","wood","parts"])s[k]=clamp(s[k]+(c[k]||0),0,LIMIT)}
function afford(c){return ["food","wood","parts"].every(k=>s[k]>=(c[k]||0))}
function pay(c){
  if(!afford(c))return false;
  for(const k of ["food","wood","parts"])s[k]-=c[k]||0;
  return true;
}
function cleared(id){return s.territory.cleared.includes(id)}
function territoryRescued(){return s.territory.cleared.reduce((n,id)=>n+TERRITORY[id].survivors,0)}
function rescued(){return territoryRescued()+s.expeditionResidents}
function population(){return 12+rescued()}
function housingCapacity(){return 5+15*s.civic.levels.housing}
function waterCapacity(){return 5+15*s.civic.levels.water}
function wellbeing(){
  return clamp(Math.min(housingCapacity()/population(),waterCapacity()/population()),.5,1);
}
function workerLimit(){return Math.min(Math.floor(population()*.6),s.civic.levels.energy*6)}
function sectorLimit(id){return Math.min(12,s.buildings[id]*3)}
function assignedWorkers(){return Object.values(s.civic.workers).reduce((a,b)=>a+b,0)}
function normalizeWorkers(){
  let left=workerLimit();
  for(const id of ["farm","mill","workshop"]){
    const n=clamp(s.civic.workers[id],0,Math.min(left,sectorLimit(id)));
    s.civic.workers[id]=n;left-=n;
  }
}
function workerBonus(id){return 1+s.civic.workers[id]*.04*wellbeing()}
function productionMultiplier(){return (1+s.buildings.store*.05)*(1+s.development.tech.logistics*.05)}
function rates(){
  const m=productionMultiplier();
  return {
    food:s.buildings.farm*.45*m*(cleared("garden")?1.08:1)*workerBonus("farm"),
    wood:s.buildings.mill*.35*m*(cleared("grove")?1.05:1)*workerBonus("mill"),
    parts:s.buildings.workshop*.025*m*(cleared("scrapyard")?1.1:1)*workerBonus("workshop")
  };
}
function production(seconds){
  const r=rates();gain({food:r.food*seconds,wood:r.wood*seconds,parts:r.parts*seconds});
}
function troopCount(a=s.army){return a.reduce((n,v)=>n+v,0)}
function heroDamage(){return 9+s.heroes[1]*3}
function rawPower(){
  return (heroDamage()+s.buildings.barracks*5+s.army.reduce((n,v,i)=>n+v*UNIT[i].damage,0))*(1+s.development.tech.weapons*.04);
}
function currentEnemy(){return ENEMIES[s.fight?.tactics?.type]||ENEMIES.walkers}
function power(){return rawPower()*(s.fight?1-currentEnemy().armor:1)}
function maxHP(){
  return (170+s.buildings.wall*65+s.heroes[0]*18+s.heroes[2]*12+s.army.reduce((n,v,i)=>n+v*UNIT[i].hp,0))*
    (1+s.development.tech.defenses*.05)*(cleared("outpost")?1.1:1);
}
function totalOwnedTroops(){
  return troopCount()+troopCount(s.wounded)+troopCount(s.expedition?.army||[0,0,0])+(s.trainJob?.count||0)+(s.healJob?.count||0);
}
let trainingBatch=5,expeditionMode="auto",manualArmy=[0,0,0],departCount=8;
const BATCHES=[5,10,25,50];
function automaticArmy(count){
  let left=count;return s.army.map(n=>{const take=Math.min(n,left);left-=take;return take});
}
function pickArmy(){
  return expeditionMode==="manual"?s.army.map((n,i)=>clamp(int(manualArmy[i]),0,n)):automaticArmy(departCount);
}
function expeditionPower(a){return heroDamage()+a.reduce((n,v,i)=>n+v*UNIT[i].damage,0)}
function trainingCost(i,count=trainingBatch){
  const u=UNIT[i];return {food:u.food*count,wood:u.wood*count,parts:u.parts*count};
}
function trainingSeconds(i,count=trainingBatch){return UNIT[i].seconds*count/(1+(s.buildings.barracks-1)*.12)}
function buildCost(id){
  const l=s.buildings[id];return {wood:Math.round(65*1.65**Math.max(0,l-1)),food:35*Math.max(1,l),parts:l>=5?10*(l-4):0};
}
function buildTime(id){return Math.min(7200,Math.round(15*1.45**Math.max(0,s.buildings[id]-1)*(id==="hq"?1.5:1)))}
function buildingEffect(id,l){
  const m=productionMultiplier();
  if(id==="hq")return `Здания до ур. ${Math.min(MAX_LEVEL,l+1)}`;
  if(id==="farm")return `${dec(l*.45*m*(cleared("garden")?1.08:1)*workerBonus(id))} еды/с`;
  if(id==="mill")return `${dec(l*.35*m*(cleared("grove")?1.05:1)*workerBonus(id))} дерева/с`;
  if(id==="workshop")return `${dec(l*.025*m*(cleared("scrapyard")?1.1:1)*workerBonus(id),3)} деталей/с`;

/* ================= СОБЫТИЯ ВЫЛАЗОК ================= */

function createEncounter(now,seconds){
  const types=Object.keys(ENCOUNTERS);
  return {type:types[Math.floor(Math.random()*types.length)],at:now+seconds*400,choice:null,chosenAt:null};
}
function eventAvailable(now=Date.now()){
  const e=s.expedition;return !!(e?.event&&!e.event.choice&&now>=e.event.at&&now<e.ends);
}
function chosenOption(e=s.expedition){return e?.event?.choice?ENCOUNTERS[e.event.type].choices[e.event.choice]:null}
function chooseEvent(choice){
  const e=s.expedition;
  if(!eventAvailable())return say("Событие сейчас недоступно.");
  const def=ENCOUNTERS[e.event.type],o=def.choices[choice];
  if(!o)return;
  if(!pay(o.cost))return say("Недостаточно ресурсов.");
  const now=Date.now(),before=e.ends;
  e.event.choice=choice;e.event.chosenAt=now;
  e.ends=o.delay<0?Math.max(now+1000,e.ends+o.delay*1000):e.ends+o.delay*1000;
  logEvent("encounter",def.title,`Решение: ${o.name}.\n${o.desc}\nИзменение времени: ${Math.round((e.ends-before)/1000)} с.`);
  say(`Приказ принят: ${o.name}.`);
}

/* ================= ОЧЕРЕДИ И ОФЛАЙН ================= */

function finishExpedition(){
  const e=s.expedition,m=MISSIONS[e.kind],won=e.legacy||e.power>=m.enemy;
  if(e.event&&!e.event.choice){
    e.event.choice="safe";e.event.chosenAt=e.ends;
    const d=ENCOUNTERS[e.event.type];
    logEvent("encounter",d.title,`Без ответа выбрано: ${d.choices.safe.name}.\nБез дополнительных затрат и задержки.`,e.ends);
  }
  const option=chosenOption(e),fraction=e.legacy?0:won?clamp(.20-e.power/m.enemy*.035,.03,.16):.42;
  let wounded=0;
  e.army.forEach((n,i)=>{const c=Math.min(n,Math.ceil(n*fraction));s.army[i]+=n-c;s.wounded[i]+=c;wounded+=c});
  const reward={};
  for(const k of ["food","wood","parts"])reward[k]=Math.floor(m.reward[k]*(won?1:.25)*(e.lootBoost||1))+(option?.loot[k]||0);
  const residents=option?.residents||0;
  s.expeditionResidents=clamp(s.expeditionResidents+residents,0,100000000);
  gain(reward);s.stats.trips++;
  s.reports.unshift({kind:e.kind,won,wounded,residents,at:e.ends,...reward});s.reports=s.reports.slice(0,5);
  logEvent("expedition",`${m.name}: ${won?"успех":"отступление"}`,
    `Добыча всего: ${price(reward)}.\nРаненых: ${wounded}. Вернулись в строй: ${troopCount(e.army)-wounded}.`+
    (residents?`\nСпасено жителей: ${residents}.`:"")+(option?`\nСобытие: ${option.name}.`:""),e.ends);
  s.expedition=null;
  say(`${m.name}: ${won?"успех":"отступление"}. ${price(reward)}. Раненых: ${wounded}.${residents?` Спасено: ${residents}.`:""}`);
}
function pendingJobs(){
  return [
    {kind:"build",job:s.buildJob},{kind:"train",job:s.trainJob},{kind:"heal",job:s.healJob},
    {kind:"expedition",job:s.expedition},{kind:"research",job:s.development.job},
    {kind:"territory",job:s.territory.job},{kind:"civic",job:s.civic.job}
  ].filter(x=>x.job);
}
function advance(now=Date.now()){
  if(!Number.isFinite(now)||now<s.last)return false;
  let cursor=clamp(s.last,now-OFFLINE,now),changed=false;
  for(let pass=0;pass<16;pass++){
    const due=pendingJobs().filter(x=>x.job.ends<=now).sort((a,b)=>a.job.ends-b.job.ends)[0];
    if(!due)break;
    const until=clamp(due.job.ends,cursor,now);production((until-cursor)/1000);cursor=until;
    const j=due.job;
    if(due.kind==="build"){
      s.buildings[j.id]=j.target;s.buildJob=null;
      const text=`${BUILD[j.id].name}: завершён уровень ${j.target}.`;
      logEvent("build","Строительство завершено",text,j.ends);say(text);
    }
    if(due.kind==="train"){
      s.army[j.type]+=j.count;s.stats.trained+=j.count;s.trainJob=null;
      const text=`${UNIT[j.type].name}: подготовлено ${j.count} бойцов.`;
      logEvent("train","Пополнение гарнизона",text,j.ends);say(text);
    }
    if(due.kind==="heal"){
      s.army[j.type]+=j.count;s.healJob=null;
      const text=`${UNIT[j.type].name}: вернулись в строй ${j.count} бойцов.`;
      logEvent("heal","Лечение завершено",text,j.ends);say(text);
    }
    if(due.kind==="expedition")finishExpedition();
    if(due.kind==="research"){
      s.development.tech[j.id]=j.target;s.development.job=null;
      const text=`${TECH[j.id].name}: уровень ${j.target}.`;
      logEvent("research","Исследование завершено",text,j.ends);say(text);
    }
    if(due.kind==="territory"){
      const p=TERRITORY[j.id];
      if(!cleared(j.id)){
        s.territory.cleared.push(j.id);gain(p.reward);
        logEvent("territory",`${p.name}: участок освоен`,`Спасено: ${p.survivors}.\n${p.bonus}.\nПрипасы: ${price(p.reward)}.`,j.ends);
      }
      s.territory.job=null;say(`${p.name}: освоен! ${p.bonus}.`);
    }
    if(due.kind==="civic"){
      s.civic.levels[j.id]=j.target;s.civic.job=null;
      const text=`${CIVIC[j.id].name}: уровень ${j.target}. ${civicEffect(j.id,j.target)}.`;
      logEvent("civic","Инфраструктура улучшена",text,j.ends);say(text);
    }
    normalizeWorkers();changed=true;
  }
  production(Math.max(0,now-cursor)/1000);s.last=now;
  return refreshMarket(now)||changed;
}

function startBuild(id){

  if(!pay(buildCost(id)))return;const now=Date.now();
  s.buildJob={id,target:s.buildings[id]+1,started:now,ends:now+buildTime(id)*1000};

}

  if(!has(CIVIC,id))return;const reason=civicReason(id);if(reason)return say(reason);
  if(!pay(civicCost(id)))return;const now=Date.now();
  s.civic.job={id,target:s.civic.levels[id]+1,started:now,ends:now+civicTime(id)*1000};

function assignWorker(id,delta){
  if(!["farm","mill","workshop"].includes(id)||![-1,1].includes(delta))return;
  normalizeWorkers();
  if(delta>0){
    if(assignedWorkers()>=workerLimit())return say("Нет свободных рабочих мест. Нужны жители или энергия.");
    if(s.civic.workers[id]>=sectorLimit(id))return say("Все места этого производства заняты. Улучши здание.");
  }
  s.civic.workers[id]=clamp(s.civic.workers[id]+delta,0,sectorLimit(id));
}
function trainHero(i){
  if(!HERO[i])return;
  if(s.fight||s.expedition)return say("Герои заняты.");
  if(s.heroes[i]>=100)return say("Максимальный уровень.");
  const cost=s.heroes[i]*25;if(!pay({parts:cost}))return say("Недостаточно деталей.");
  s.heroes[i]++;const text=`${HERO[i].name}: уровень ${s.heroes[i]}.`;

function trainUnits(i){

  if(s.expedition)return say("Отряд уже в пути.");

/* ================= ОБОРОНА ================= */

function waveType(w){return w%5===0?"boss":w%3===0?"armored":w%2===0?"swarm":"walkers"}
function bossReward(w){return {food:80+w*12,wood:100+w*15,parts:25+w*5}}
function startBattle(){
  if(s.fight)return;if(s.expedition)return say("Дождись возвращения героев.");
  const type=waveType(s.wave),hp=maxHP(),enemy=Math.round((140+s.wave*85)*ENEMIES[type].health);
  s.fight={hp,max:hp,enemy,enemyMax:enemy,wave:s.wave,shot:0,repairUsed:false,flash:0,tactics:{type,used:{charge:false,volley:false,aid:false}}};
  tab="battle";dockSize="normal";lastCombat=performance.now();homeCamera();
  say(`Волна ${s.wave}: ${ENEMIES[type].name}.`);
}
function woundHome(fraction){
  let total=0;
  s.army=s.army.map((n,i)=>{const c=Math.min(n,Math.ceil(n*fraction));s.wounded[i]+=c;total+=c;return n-c});
  return total;
}
function resolveBattle(){
  const f=s.fight;if(!f)return false;
  if(f.enemy<=0){
    const wounded=woundHome(clamp((1-f.hp/f.max)*.15,0,.15));
    const reward={food:45+f.wave*10,wood:60+f.wave*20,parts:15+f.wave*5};
    if(f.tactics.type==="boss"){const extra=bossReward(f.wave);for(const k of ["food","wood","parts"])reward[k]+=extra[k]}
    gain(reward);s.wave=Math.max(s.wave,f.wave+1);s.fight=null;
    logEvent("win",`Волна ${f.wave} отражена`,`${ENEMIES[f.tactics.type].name}.\nТрофеи: ${price(reward)}.\nПрочность: ${fmt(f.hp)} / ${fmt(f.max)}.\nРаненых: ${wounded}.`);
    say(`Волна отражена! ${price(reward)}. Раненых: ${wounded}.`);return true;
  }
  if(f.hp<=0){
    const wounded=woundHome(.3),lost=Math.min(s.food,35);s.food=Math.max(0,s.food-35);s.fight=null;
    logEvent("loss",`Волна ${f.wave}: отступление`,`Потеряно еды: ${dec(lost)}.\nРаненых: ${wounded}. Здания и жители сохранены.`);
    say(`Отступление. Раненых: ${wounded}. Здания сохранены.`);return true;
  }
  return false;
}
function shoot(){
  const f=s.fight;if(!f||document.hidden||Date.now()-f.shot<550)return;
  f.shot=Date.now();f.enemy-=power()*.8;f.flash=.15;resolveBattle();
}
function repair(){
  const f=s.fight;if(!f||f.repairUsed)return;
  if(f.hp>=f.max)return say("Оборона не повреждена.");
  if(!pay({parts:10}))return say("Нужно 10 деталей.");
  f.repairUsed=true;f.hp=Math.min(f.max,f.hp+f.max*.3);say("Восстановлено до 30% прочности.");
}
function skillValue(id){
  const f=s.fight;if(!f)return 0;
  if(id==="charge")return Math.round(f.enemyMax*Math.min(.24,.10+s.heroes[0]*.008));
  if(id==="volley")return Math.round(power()*Math.min(6,2.5+s.heroes[1]*.15));
  return Math.round(f.max*Math.min(.4,.20+s.heroes[2]*.01));
}
function skillDescription(id){
  if(id==="charge")return `${dec(Math.min(24,10+s.heroes[0]*.8),1)}% здоровья орды, игнорирует броню.`;
  if(id==="volley")return `Урон гарнизона ×${dec(Math.min(6,2.5+s.heroes[1]*.15))}.`;
  return `Восстановление до ${Math.min(40,20+s.heroes[2])}% прочности.`;
}
let skillEffect=null;
function useSkill(id){
  const f=s.fight,k=SKILLS.find(v=>v.id===id);
  if(!f||!k||document.hidden||f.tactics.used[id])return;
  if(id==="aid"&&f.hp>=f.max-.01)return say("Помощь пока не требуется.");
  f.tactics.used[id]=true;let amount=skillValue(id);
  if(id==="aid"){amount=Math.min(amount,f.max-f.hp);f.hp+=amount}
  else{amount=Math.min(amount,Math.max(0,f.enemy));f.enemy-=amount;f.flash=.35}
  skillEffect={id,value:amount,started:performance.now()};
  say(`${k.name}: ${id==="aid"?"+":""}${fmt(amount)}.`);resolveBattle();
}
function advanceCombat(dt){
  const f=s.fight;if(!f||document.hidden||dt<=0)return false;
  const our=Math.max(0,power()),enemy=9+f.wave*4;
  const te=our>0?Math.max(0,f.enemy)/our:Infinity,tb=Math.max(0,f.hp)/enemy;
  const elapsed=Math.max(0,Math.min(dt,te,tb));
  f.enemy=Math.max(0,f.enemy-our*elapsed);f.hp=Math.max(0,f.hp-enemy*elapsed);f.flash=Math.max(0,f.flash-dt);
  if(te<=dt&&te<=tb)f.enemy=0;else if(tb<=dt)f.hp=0;
  return resolveBattle();
}

function render(){
  updateDock();

    const active=b.dataset.id===tab;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active));

function renderModal(){

  let html="";
  if(modal.type==="building"||modal.type==="civic")html=renderDetail(modal.type,modal.id);

function openJournal(){
  const previous=s.journal.readThrough;
  journalSnapshot=s.journal.nextId-1;
  modal={type:"journal",id:"",previousRead:previous};
  s.journal.readThrough=journalSnapshot;$("modal-body").scrollTop=0;renderModal();
  if(!$("dialog").open)$("dialog").showModal();
  syncBack();save();live();
}
function clearJournal(){
  if(!confirm("Очистить журнал? Прогресс останется без изменений."))return;
  s.journal={entries:[],nextId:1,readThrough:0};journalSnapshot=0;openJournal();
}

function live(){
  const now=Date.now();
  for(const k of ["food","wood","parts"])$(k).textContent=fmt(s[k]);
  $("power").textContent=fmt(power());$("wave").textContent="Волна "+s.wave;
  $("people-button").textContent=`♙ Жители · ${fmt(population())}`;
  const jobs=pendingJobs();
  const names={build:"🏗",train:"⚑",heal:"✚",expedition:"⌖",research:"⚙",territory:"▧",civic:"♙"};
  $("queue").hidden=!jobs.length;
  $("queue").textContent=jobs.map(x=>`${names[x.kind]} ${time((x.job.ends-now)/1000)}`).join(" · ");
  const c=currentChapter(),ready=chapterReady();
  $("chapter-number").textContent=c?`КАМПАНИЯ · ГЛАВА ${s.development.chapter+1}`:"КАМПАНИЯ ЗАВЕРШЕНА";
  $("chapter-title").textContent=c?c.title:"Живой порт: построим настоящий дом";
  $("chapter-status").textContent=c?(ready?"Награда →":`${c.goals.filter(g=>g.value()>=g.goal).length}/${c.goals.length} →`):"✓";
  $("chapter-strip").classList.toggle("ready",ready);
  const available=eventAvailable();
  $("event-strip").hidden=!available;
  if(available)$("event-strip-title").textContent=ENCOUNTERS[s.expedition.event.type].title;
  $("badge").textContent=tab==="map"?"ОКРЕСТНОСТИ · ДАЛЬНИЕ МАРШРУТЫ":s.fight?`⚠ ОБОРОНА · ВОЛНА ${s.fight.wave}`:`ЖИВОЙ ПОРТ · ЖИТЕЛЕЙ ${fmt(population())}`;
  const unreadCount=unread();
  $("journal-button").textContent=`☷ Журнал${unreadCount?" · "+unreadCount:""}`;
  $("journal-button").classList.toggle("unread",unreadCount>0);
  if(modal?.type==="journal"&&$("journal-refresh")){
    const count=s.journal.entries.filter(e=>e.id>journalSnapshot).length;
    $("journal-refresh").textContent=count?`Обновить · новых ${count}`:"Обновить";
  }
  document.querySelectorAll("[data-end]").forEach(el=>el.textContent=time((Number(el.dataset.end)-now)/1000));
  document.querySelectorAll("[data-start][data-finish]").forEach(el=>{
    const a=Number(el.dataset.start),b=Number(el.dataset.finish);
    el.style.width=clamp((now-a)/(b-a)*100,0,100)+"%";
  });
  document.querySelectorAll("[data-resource][data-amount]").forEach(el=>el.classList.toggle("missing",s[el.dataset.resource]<Number(el.dataset.amount)));
  if(s.expedition?.event&&$("exp-contact-button")){
    const e=s.expedition,o=chosenOption();
    $("exp-contact-button").disabled=!o&&!available;
    $("exp-contact-button").textContent=o?"Событие: решение принято →":available?"⌁ Отряд ждёт ответа →":"Отряд ещё не вышел на связь";
    $("exp-event-status").textContent=o?`Решение: ${o.name}.`:available?"Можно ответить сейчас или оставить безопасное действие.":`До связи: ${time((e.event.at-now)/1000)}.`;
  }
  if(modal&&$("dialog").open){
    if(["building","civic","land"].includes(modal.type)&&$("detail-start")){
      const reason=modal.type==="building"?buildReason(modal.id):modal.type==="civic"?civicReason(modal.id):territoryReason(modal.id);
      $("detail-reason").textContent=reason||"Ресурсы спишутся при начале работ.";$("detail-start").disabled=!!reason;
    }
    if(modal.type==="research")for(const id of Object.keys(TECH)){
      const b=$("modal-body").querySelector(`[data-action="start-research"][data-id="${id}"]`);
      const reason=researchReason(id);if(b)b.disabled=!!reason;
      const p=$("modal-body").querySelector(`[data-research-reason="${id}"]`);if(p)p.textContent=reason||"Можно начать.";
    }
    if(modal.type==="market")for(const id of Object.keys(TRADES)){
      const b=$("modal-body").querySelector(`[data-action="trade"][data-id="${id}"]`);
      const reason=tradeReason(id);if(b)b.disabled=!!reason;
      const p=$("modal-body").querySelector(`[data-trade-reason="${id}"]`);if(p)p.textContent=reason||"Обмен доступен.";
    }
    if(modal.type==="event"&&s.expedition?.event){
      const d=ENCOUNTERS[s.expedition.event.type];
      $("modal-body").querySelectorAll('[data-action="event-choice"]').forEach(b=>{
        const o=d.choices[b.dataset.id],can=afford(o.cost);
        b.disabled=!available||!can;
        const p=$("modal-body").querySelector(`[data-event-reason="${b.dataset.id}"]`);if(p)p.textContent=can?"":"Недостаточно ресурсов.";
      });
    }
  }
  const f=s.fight;
  if(f&&$("fight-hp")){
    $("fight-hp").textContent=fmt(f.hp);$("enemy-hp").textContent=fmt(f.enemy);
    $("hp-bar").style.width=clamp(f.hp/f.max*100,0,100)+"%";$("enemy-bar").style.width=clamp(f.enemy/f.enemyMax*100,0,100)+"%";
    $("effective-power").textContent=dec(power(),1);
    const b=document.querySelector('[data-action="shoot"]'),left=Math.max(0,550-(now-f.shot));
    if(b){b.disabled=left>0;b.textContent=left?`Зарядка ${(left/1000).toFixed(1)} с`:"Прицельный удар"}
    for(const k of SKILLS){
      const el=document.querySelector(`[data-action="skill"][data-id="${k.id}"]`);if(!el)continue;
      const used=f.tactics.used[k.id],full=k.id==="aid"&&f.hp>=f.max-.01;
      el.disabled=used||full;el.querySelector("span").textContent=used?"Использован":full?"Оборона цела":k.id==="aid"?`До +${fmt(skillValue(k.id))} HP`:`${fmt(skillValue(k.id))} урона`;
    }
  }
}

/* ================= CANVAS ================= */

const canvas=$("world"),ctx=canvas.getContext("2d"),scene=$("scene");
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
let hits=[],mapLabelAreas=[],lastDraw=0;
const iso=(x,y)=>({x:430+(x-y)*43,y:240+(x+y)*23});
function poly(points,fill,stroke){
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function line(x1,y1,x2,y2,color,width=1){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function rect(x,y,w,h,color,stroke){
  ctx.fillStyle=color;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.strokeRect(x,y,w,h)}
}
function glow(x,y,r,color){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,"transparent");

function prepareLabels(){

  for(const el of [$("badge"),document.querySelector(".camera-controls")]){
    const r=el.getBoundingClientRect();
    mapLabelAreas.push({x:(r.left-b.left-7)*1000/b.width,y:(r.top-b.top-7)*780/b.height,w:(r.width+14)*1000/b.width,h:(r.height+14)*780/b.height});

function label(text,x,y,selected=false,color="#eeddb7"){
  const scale=Math.max(.1,canvas.clientWidth/1000*camera.scale),fontSize=clamp((selected?10.5:9)/scale,10,25),height=fontSize*1.65;
  ctx.save();ctx.font=`${selected?700:600} ${fontSize}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";
  const width=ctx.measureText(text).width+fontSize*1.1,step=height+6;
  let box=null,shift=false;
  for(const [dx,dy] of [[0,0],[0,-step],[0,step],[0,-2*step],[-width*.55,0],[width*.55,0]]){
    const c={x:x-width/2+dx,y:y-height/2+dy,w:width,h:height};
    if(c.x<5||c.x+c.w>995||c.y<5||c.y+c.h>775)continue;
    if(mapLabelAreas.some(a=>c.x<a.x+a.w+5&&c.x+c.w>a.x-5&&c.y<a.y+a.h+5&&c.y+c.h>a.y-5))continue;
    box=c;shift=dx!==0||dy!==0;break;
  }
  if(!box){ctx.restore();return {x:-10000,y:-10000,w:0,h:0}}
  mapLabelAreas.push(box);
  if(shift)line(x,y,clamp(x,box.x,box.x+box.w),clamp(y,box.y,box.y+box.h),"#cdb88966");
  ctx.shadowColor="#020b1299";ctx.shadowBlur=selected?8:4;
  rect(box.x,box.y,box.w,box.h,selected?"#76603df2":"#091c23e8",selected?"#f2d79c":"#b6a77b66");
  ctx.shadowBlur=0;ctx.fillStyle=color;ctx.fillText(text,box.x+box.w/2,box.y+box.h/2);ctx.restore();return box;
}

let camera={scale:1,x:0,y:0},cameraSaveTimer=0;
try{
  const c=JSON.parse(localStorage.getItem(CAMERA_KEY));
  if(c)camera={scale:num(c.scale,1,1,2.8),x:num(c.x,0,-5000,5000),y:num(c.y,0,-5000,5000)};

function applyCamera(){
  if(camera.scale<=1.01){camera.scale=1;camera.x=0;camera.y=0}
  else{
    const mx=Math.max(0,(canvas.clientWidth*camera.scale-scene.clientWidth)/2)+75,my=Math.max(0,(canvas.clientHeight*camera.scale-scene.clientHeight)/2)+75;
    camera.x=clamp(camera.x,-mx,mx);camera.y=clamp(camera.y,-my,my);
  }
  canvas.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
  document.querySelector('[data-camera="out"]').disabled=camera.scale<=1.01;
  document.querySelector('[data-camera="in"]').disabled=camera.scale>=2.79;
  clearTimeout(cameraSaveTimer);cameraSaveTimer=setTimeout(()=>{try{localStorage.setItem(CAMERA_KEY,JSON.stringify(camera))}catch{}},300);
}
function fitCanvas(){
  let width=scene.clientWidth,height=width*780/1000;
  if(height>scene.clientHeight){height=scene.clientHeight;width=height*1000/780}
  canvas.style.width=Math.max(1,width)+"px";canvas.style.height=Math.max(1,height)+"px";applyCamera();
}
function homeCamera(){camera={scale:1,x:0,y:0};applyCamera()}
function zoomAt(scale,x,y){
  const next=clamp(scale,1,2.8),ratio=next/camera.scale,r=scene.getBoundingClientRect();
  camera.x=camera.x*ratio+(x-r.left-r.width/2)*(1-ratio);camera.y=camera.y*ratio+(y-r.top-r.height/2)*(1-ratio);
  camera.scale=next;applyCamera();
}

function canvasClick(clientX,clientY){

  const lh=[...hits].reverse().find(h=>h.box.w>0&&x>=h.box.x&&x<=h.box.x+h.box.w&&y>=h.box.y&&y<=h.box.y+h.box.h);
  const nearest=hits.map(h=>({...h,dist:Math.hypot(h.x-x,h.y-y)})).sort((a,b)=>a.dist-b.dist)[0];
  const hit=lh||(nearest&&nearest.dist<=nearest.r?nearest:null);if(!hit)return;

const layer=$("camera-layer"),pointers=new Map();let gesture=null;
function pointerSnapshot(){
  const p=[...pointers.values()];
  if(p.length>=2)return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
  return p.length?{x:p[0].x,y:p[0].y,d:0}:null;
}
layer.addEventListener("contextmenu",e=>e.preventDefault());
layer.addEventListener("pointerdown",e=>{
  if(e.button!==0||pointers.size>=2)return;
  e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{layer.setPointerCapture(e.pointerId)}catch{}
  if(pointers.size===1)gesture={startX:e.clientX,startY:e.clientY,started:performance.now(),moved:false,multi:false,last:pointerSnapshot()};
  else if(gesture){gesture.multi=true;gesture.moved=true;gesture.last=pointerSnapshot();layer.classList.add("dragging")}
});
layer.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)||!gesture)return;
  e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=pointerSnapshot(),p=gesture.last;if(!c||!p){gesture.last=c;return}
  if(pointers.size===2){
    gesture.multi=true;gesture.moved=true;
    if(p.d>4&&c.d>4){
      const scale=clamp(camera.scale*c.d/p.d,1,2.8),ratio=scale/camera.scale,r=scene.getBoundingClientRect();
      camera.x=camera.x*ratio+(p.x-r.left-r.width/2)*(1-ratio)+c.x-p.x;
      camera.y=camera.y*ratio+(p.y-r.top-r.height/2)*(1-ratio)+c.y-p.y;camera.scale=scale;applyCamera();
    }
    gesture.last=c;return;
  }
  if(!gesture.moved){
    if(Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY)<7){gesture.last=c;return}
    gesture.moved=true;gesture.last=c;layer.classList.add("dragging");return;
  }
  if(camera.scale>1.01){camera.x+=c.x-p.x;camera.y+=c.y-p.y;applyCamera()}gesture.last=c;
});
function pointerEnd(e){
  if(!pointers.has(e.pointerId))return;if(e.cancelable)e.preventDefault();
  const tap=e.type==="pointerup"&&pointers.size===1&&gesture&&!gesture.moved&&!gesture.multi&&performance.now()-gesture.started<500&&Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY)<7;
  pointers.delete(e.pointerId);try{if(layer.hasPointerCapture(e.pointerId))layer.releasePointerCapture(e.pointerId)}catch{}
  if(!pointers.size){gesture=null;layer.classList.remove("dragging")}
  else if(gesture){const p=pointerSnapshot();gesture.multi=true;gesture.moved=true;gesture.last=p;gesture.startX=p.x;gesture.startY=p.y}
  if(tap)canvasClick(e.clientX,e.clientY);
}
layer.addEventListener("pointerup",pointerEnd);layer.addEventListener("pointercancel",pointerEnd);layer.addEventListener("lostpointercapture",pointerEnd);
layer.addEventListener("wheel",e=>{

function validateImportedSave(raw){
  if(!raw||typeof raw!=="object"||Array.isArray(raw))throw new Error("Нет данных сохранения.");
  if(raw.version!==undefined&&(!Number.isInteger(raw.version)||raw.version<1||raw.version>4))throw new Error("Неподдерживаемая версия сохранения.");
  for(const k of ["food","wood","parts"])if(!Number.isFinite(raw[k])||raw[k]<0||raw[k]>LIMIT)throw new Error(`Повреждён ресурс: ${k}.`);
  if(!Number.isInteger(raw.wave)||raw.wave<1||raw.wave>10000)throw new Error("Некорректная волна.");
  if(!raw.buildings||typeof raw.buildings!=="object"||Array.isArray(raw.buildings))throw new Error("Нет данных построек.");
  for(const id of Object.keys(BUILD)){
    const required=["hq","farm","mill","barracks","wall"].includes(id);
    if(!required&&!has(raw.buildings,id))continue;
    const l=raw.buildings[id];if(!Number.isInteger(l)||l<(required?1:0)||l>MAX_LEVEL)throw new Error(`Повреждено здание: ${BUILD[id].name}.`);
  }
  const validArray=(a,min,max)=>Array.isArray(a)&&a.length===3&&[0,1,2].every(i=>Number.isInteger(a[i])&&a[i]>=min&&a[i]<=max);
  if(!validArray(raw.army,0,100000))throw new Error("Повреждена армия.");
  if(!validArray(raw.heroes,1,100))throw new Error("Повреждены герои.");
  if(raw.wounded!==undefined&&!validArray(raw.wounded,0,100000))throw new Error("Повреждены раненые.");
  if(!Number.isFinite(raw.last)||raw.last<0)throw new Error("Повреждена дата сохранения.");
}
function exportSave(){
  advance();save();
  try{
    const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="last-port-living-save.json";document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);say("Запрошено скачивание копии. Некоторые клиенты могут блокировать файлы.");
  }catch{say("Не удалось скачать резервную копию.")}
}

}

  if(a==="send")sendExpedition();

    else if(c){closeModal();navigate(c.route)}
  }
  if(a==="close")closeModal();
  if(a==="export")exportSave();
  if(a==="import")$("import-file").click();
  save();if(lightweight)live();else render();
  try{if(supportsTelegram("6.1"))tg.HapticFeedback?.selectionChanged()}catch{}
});

let lastCombat=performance.now(),lastSave=0;
function eventSignature(){
  const e=s.expedition;
  return e?.event?`${e.started}:${e.event.type}:${e.event.choice||""}:${eventAvailable()}`:"none";
}
function tick(){
  const perf=performance.now();if(document.hidden){lastCombat=perf;return}
  const dt=clamp((perf-lastCombat)/1000,0,.5);lastCombat=perf;
  const now=Date.now();let changed=advance(now);if(advanceCombat(dt))changed=true;
  const signature=eventSignature();
  if(signature!==eventState){
    eventState=signature;
    if(modal?.type==="event")renderModal();
  }
  if(changed){render();save()}else live();
  if(now-lastSave>=5000){save();lastSave=now}
}
function frame(ms){
  if(!document.hidden&&ms-lastDraw>=1000/(reduced.matches?10:30)){
    const t=reduced.matches?0:ms/1000;
    if(tab==="map")drawMap(t);else drawBase(t);lastDraw=ms;
  }

}
function resetGestures(){
  const ids=[...pointers.keys()];pointers.clear();gesture=null;layer.classList.remove("dragging");
  for(const id of ids){try{if(layer.hasPointerCapture(id))layer.releasePointerCapture(id)}catch{}}
}
document.addEventListener("visibilitychange",()=>{
  const changed=advance();lastCombat=performance.now();save();
  if(!document.hidden){
    if(changed)render();else{if(modal?.type==="event")renderModal();live()}
    layout();
  }else resetGestures();
});

  lastCombat=performance.now();if(advance()){render();save()}layout();
});

normalizeWorkers();migrateLiving();
const absent=Math.max(0,Date.now()-s.last),completed=advance();
if(!completed&&absent>=60000)say("Порт продолжал работать: учтён доход за "+time(Math.min(absent,OFFLINE)/1000)+".");
if(s.fight)say("Сохранённая оборона продолжена. В фоне бой приостанавливается.");
eventState=eventSignature();
render();layout();save();
setInterval(tick,250);
requestAnimationFrame(frame);</script>
