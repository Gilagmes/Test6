<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1814">
<title>Последний порт — SLG Edition</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--text:#e8e2d5;--muted:#9c917e;--gold:#f4a222;--line:#4a3f2d;--height:100dvh;--bg-color:#1a1814;--panel-bg:rgba(28,25,20,0.95);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font:13px system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#2d2a22,#0d0c0a 80%);-webkit-tap-highlight-color:transparent;}
button,input,select{font:inherit;}
button{padding:9px;color:var(--text);cursor:pointer;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#3a3224,#1c1913);touch-action:manipulation;}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default;transform:none}
.primary{color:#111;border-color:#f4a222;background:linear-gradient(135deg,#f6bc58,#d38311);font-weight:bold;}
.selected{border-color:var(--gold)!important}
[hidden]{display:none!important}

/* --- ОГЛОБЛЯЮЩАЯ СТРУКТУРА SLG --- */
main{display:flex;flex-direction:column;width:100%;height:var(--height);overflow:hidden;padding-bottom:65px;position:relative;}

/* --- ШАПКА В СТИЛЕ TWD:S --- */
header{display:flex;justify-content:space-between;padding:10px;align-items:flex-start;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,0.8) 0%,transparent 100%);}
.profile-box{display:flex;align-items:center;background:rgba(0,0,0,0.6);border:1px solid var(--line);border-radius:40px;padding:4px 12px 4px 4px;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,0.5);}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:url('https://i.pravatar.cc/100?img=11') center/cover;}
.power-box{font-size:15px;font-weight:800;display:flex;align-items:center;gap:4px;}

.res-col{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.res-row{display:flex;gap:4px;}
.res-badge{background:rgba(0,0,0,0.7);border:1px solid #333;border-radius:12px;padding:3px 8px;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:bold;}

/* --- ПЛАВАЮЩИЙ КВЕСТ (Слева) --- */
#chapter-strip{position:absolute;left:0;top:80px;z-index:10;background:var(--panel-bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:8px;display:flex;align-items:center;gap:8px;max-width:200px;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,0.6);}
#chapter-strip .copy{overflow:hidden;}
#chapter-number{display:block;font-size:9px;color:var(--gold);text-transform:uppercase;font-weight:bold;}
#chapter-title{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* --- НИЖНЕЕ МЕНЮ (Bottom Nav) --- */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(20,18,15,0.98);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 5px max(8px,env(safe-area-inset-bottom));z-index:50;box-shadow:0 -5px 20px rgba(0,0,0,0.8);}
.bottom-nav button{background:transparent;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px;}
.bottom-nav button b{font-size:22px;font-weight:normal;}
.bottom-nav button.active{color:var(--gold);}
.bottom-nav button.active b{transform:scale(1.15);text-shadow:0 0 10px rgba(244,162,34,0.6);}

/* --- КАРТА И ПАНЕЛИ --- */
.scene{position:relative;display:grid;place-items:center;flex:1 1 0;min-height:110px;overflow:hidden;background:#0d1214;touch-action:none;}
canvas{display:block;transform-origin:center;touch-action:none;}
#camera-layer{position:absolute;inset:0;z-index:2;touch-action:none;cursor:grab;}
.camera-controls{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;flex-direction:column;gap:5px;}
.camera-controls button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.7);font-size:18px;}

#dock{display:flex;flex-direction:column;flex-shrink:0;height:40dvh;min-height:220px;background:var(--panel-bg);border-top:1px solid var(--line);z-index:5;}
.toolbar{display:flex;gap:4px;padding:8px;background:#14120e;}
.toolbar button{flex:1;font-size:11px;}
#panel{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;}

/* --- ЭЛЕМЕНТЫ UI --- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.card{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#231f18,#14120e);}
.card h3{font-size:13px;color:#fff;}
.card p{font-size:11px;color:var(--muted);line-height:1.4;}
.wide{grid-column:1/-1;}
.bar{height:6px;background:#000;border-radius:4px;overflow:hidden;margin:4px 0;}
.bar i{display:block;height:100%;background:var(--gold);}
.tags{display:flex;gap:4px;flex-wrap:wrap;}
.tag{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#000;color:var(--gold);font-size:9px;}

/* Модалки */
dialog{width:90%;max-width:400px;margin:auto;padding:0;color:var(--text);background:var(--panel-bg);border:1px solid var(--gold);border-radius:16px;}
dialog::backdrop{background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);}
.modal-head{display:flex;justify-content:space-between;padding:15px;background:#111;border-bottom:1px solid var(--line);}
.modal-body{padding:15px;max-height:70vh;overflow-y:auto;}
</style>
</head>
<body>

<main>
  <!-- SLG ШАПКА -->
  <header>
    <div class="profile-box">
      <div class="avatar"></div>
      <div>
        <div style="font-size:10px; color:var(--gold); font-weight:bold;">БАЗА УР. <span id="hq-level">1</span></div>
        <div class="power-box">⚔️ <span id="power">0</span></div>
      </div>
    </div>
    <div class="res-col">
      <div class="res-row">
        <div class="res-badge" style="color:#aed581;">🌾 <span id="food">0</span></div>
        <div class="res-badge" style="color:#d7ccc8;">🪵 <span id="wood">0</span></div>
      </div>
      <div class="res-row">
        <div class="res-badge" style="color:#b0bec5;">⚙️ <span id="parts">0</span></div>
        <div class="res-badge" style="color:var(--gold);">🌊 <span id="wave">1</span></div>
      </div>
    </div>
  </header>

  <!-- ПЛАВАЮЩИЙ КВЕСТ СЛЕВА -->
  <button id="chapter-strip" data-action="campaign">
    <div style="width:30px; height:30px; border-radius:6px; background:url('https://i.pravatar.cc/100?img=5') center/cover;"></div>
    <div class="copy">
      <small id="chapter-number">Глава 1</small>
      <strong id="chapter-title">Сигнал в темноте</strong>
    </div>
  </button>

  <!-- ИГРОВАЯ КАРТА (CANVAS) -->
  <div class="scene" id="scene">
    <canvas id="world" width="1000" height="780"></canvas>
    <div id="camera-layer"></div>
    <div class="camera-controls">
      <button data-camera="in">＋</button>
      <button data-camera="out">−</button>
      <button data-camera="home" style="color:var(--gold);">⌂</button>
      <button id="fullscreen">⛶</button>
    </div>
  </div>

  <div id="queue" style="position:absolute; top:130px; left:10px; font-size:10px; color:var(--gold); background:rgba(0,0,0,0.8); padding:4px 8px; border-radius:6px;" hidden></div>

  <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <section id="dock" data-size="normal">
    <div class="toolbar">
      <button data-action="people" id="people-button">♙ Жители</button>
      <button data-action="market">⚖ Торговля</button>
      <button data-action="research">⚙ Развитие</button>
      <button data-action="journal" id="journal-button">☷ Журнал</button>
    </div>
    <div id="panel"></div>
  </section>

  <!-- НИЖНЕЕ МЕНЮ (BOTTOM NAV) -->
  <nav class="bottom-nav">
    <button data-action="tab" data-id="base"><b>⌂</b>База</button>
    <button data-action="tab" data-id="territory"><b>▧</b>Земли</button>
    <button data-action="tab" data-id="heroes"><b>★</b>Герои</button>
    <button data-action="tab" data-id="army"><b>⚑</b>Армия</button>
    <button data-action="tab" data-id="map"><b>🌍</b>Карта</button>
    <button data-action="tab" data-id="battle"><b>⚔</b>Оборона</button>
  </nav>

</main>

<dialog id="dialog">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modal-title" style="font-size:16px;">Заголовок</h2>
        <small id="modal-subtitle" style="color:var(--gold); font-size:10px;"></small>
      </div>
      <button data-action="close" style="background:transparent; border:none; font-size:20px; color:#fff;">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>

<!-- ================= JAVASCRIPT ИГРЫ ================= -->
<script>
"use strict";
const $=id=>document.getElementById(id);
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY="last-port-slg-v1", LIMIT=1e12, MAX_LEVEL=20, OFFLINE=28800000;
const MARKET_PERIOD=4*3600000;
const fmt=n=>new Intl.NumberFormat("ru-RU").format(Math.floor(Math.max(0,n||0)));
const dec=(n,d=2)=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:d}).format(n);

function time(seconds){
  const n=Math.max(0,Math.ceil(seconds)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),ss=n%60;
  return h?`${h}ч ${m}м`:m?`${m}м ${ss}с`:`${ss}с`;
}
function btn(action,id,text,disabled=false,primary=false){
  return `<button type="button" data-action="${action}" data-id="${id}" ${disabled?"disabled":""} ${primary?'class="primary"':""} style="width:100%; margin-top:8px;">${text}</button>`;
}
function price(c){ return [["wood","🪵"],["food","🌾"],["parts","⚙"]].filter(([k])=>c[k]).map(([k,i])=>`${i}${fmt(c[k])}`).join(" ")||"Бесплатно"; }

// --- СЖАТЫЕ ДАННЫЕ ИГРЫ ---
const BUILD={hq:{name:"Штаб",short:"ШТАБ",x:2.25,y:.8,w:1.1,d:1,h:49,roof:"#b49464"},farm:{name:"Теплицы",short:"ТЕПЛИЦЫ",x:.05,y:.05,w:.85,d:1.25,h:21,roof:"#93ada0"},mill:{name:"Лесопилка",short:"ЛЕСОПИЛКА",x:0,y:3.25,w:.9,d:.9,h:32,roof:"#947753"},barracks:{name:"Казармы",short:"КАЗАРМЫ",x:3.25,y:3.2,w:1.05,d:.95,h:34,roof:"#687e63"},wall:{name:"Периметр",short:"ПЕРИМЕТР",x:5,y:1.2,w:.5,d:.5,h:48,roof:"#958368"},workshop:{name:"Мастерская",short:"МАСТЕРСКАЯ",x:2.2,y:-.55,w:.8,d:.8,h:29,roof:"#638a91",need:2},hospital:{name:"Госпиталь",short:"ГОСПИТАЛЬ",x:4,y:-.55,w:.85,d:.8,h:31,roof:"#c0c5b1",need:2},store:{name:"Склад",short:"СКЛАД",x:5,y:3.4,w:.8,d:.85,h:28,roof:"#8b927f",need:2}};
const CIVIC={housing:{name:"Жилой квартал",x:-2.7,y:1.1,w:1.2,d:1,h:32,roof:"#b69a74"},water:{name:"Водоснабжение",x:-2.7,y:3,w:1,d:1,h:30,roof:"#7aa7ac"},energy:{name:"Электростанция",x:-2.7,y:4.9,w:1.1,d:1,h:26,roof:"#80988c"}};
const HERO=[{name:"Мира",role:"Инженер",desc:"+18 прочности",color:"#ba935b"},{name:"Лев",role:"Следопыт",desc:"+3 урона",color:"#729387"},{name:"Ада",role:"Медик",desc:"+12 прочности",color:"#b17868"}];
const UNIT=[{name:"Штурмовики",icon:"🛡",damage:1.4,hp:10,food:8,wood:4,parts:0,seconds:5,need:1},{name:"Стрелки",icon:"🏹",damage:2.2,hp:6,food:10,wood:6,parts:0,seconds:7,need:2},{name:"Разведчики",icon:"⌖",damage:2.8,hp:7,food:12,wood:4,parts:2,seconds:9,need:3}];
const MISSIONS={block:{name:"Квартал",seconds:45,food:25,enemy:18,reward:{wood:65,food:45,parts:15},x:285,y:370,need:1},dock:{name:"Доки",seconds:90,food:45,enemy:35,reward:{wood:110,food:30,parts:40},x:750,y:490,need:1}};
const TECH={logistics:{name:"Снабжение",bonus:5,max:5},weapons:{name:"Оружие",bonus:4,max:5},defenses:{name:"Защита",bonus:5,max:5}};
const TERRITORY={grove:{name:"Сквер",short:"СКВЕР",x:-1,y:-3,need:1,previous:null,seconds:35,cost:{food:25,wood:30},reward:{wood:100,food:45},survivors:3,bonus:"Дерево +5%"},scrapyard:{name:"Металлолом",short:"МЕТАЛЛ",x:1,y:-3,need:2,previous:"grove",seconds:65,cost:{food:45,wood:80},reward:{parts:65},survivors:2,bonus:"Детали +10%"}};
const CHAPTERS=[{title:"Сигнал в темноте",goals:[{text:"Штаб 2",value:()=>s.buildings.hq,goal:2}],reward:{food:100,wood:120,parts:30},route:"base"},{title:"Не только сегодня",goals:[{text:"Теплицы 2",value:()=>s.buildings.farm,goal:2}],reward:{food:130},route:"base"}];
const TRADES={buyFood:{name:"Еда",cost:{parts:15},reward:{food:100},stock:6}};
const ENEMIES={walkers:{name:"Бродячие",health:1,armor:0,color:"#b3c080"},boss:{name:"Вожак",health:1.75,armor:.15,color:"#e4a284"}};

let s = fresh();
function fresh(){ return {food:180,wood:200,parts:50,wave:1,buildings:{hq:1,farm:1,mill:1,barracks:1,wall:1,workshop:0,hospital:0,store:0},heroes:[1,1,1],army:[8,0,0],wounded:[0,0,0],buildJob:null,trainJob:null,healJob:null,expedition:null,fight:null,claimedQuests:[],stats:{trained:0,trips:0,trades:0},reports:[],development:{chapter:0,tech:{logistics:0,weapons:0,defenses:0},job:null},territory:{cleared:[],job:null},expeditionResidents:0,civic:{levels:{housing:1,water:1,energy:1},workers:{farm:0,mill:0,workshop:0},job:null},market:{refreshAt:Date.now()+MARKET_PERIOD,used:{}},journal:{entries:[],nextId:1,readThrough:0},last:Date.now()};}
try{const saved=localStorage.getItem(KEY); if(saved) s = {...fresh(), ...JSON.parse(saved)};}catch(e){}
function save(){ localStorage.setItem(KEY, JSON.stringify(s)); }

function gain(c){for(const k of ["food","wood","parts"])s[k]=clamp(s[k]+(c[k]||0),0,LIMIT)}
function afford(c){return ["food","wood","parts"].every(k=>s[k]>=(c[k]||0))}
function pay(c){if(!afford(c))return false; for(const k of ["food","wood","parts"])s[k]-=c[k]||0; return true;}
function population(){return 12+s.territory.cleared.length*3+s.expeditionResidents;}
function power(){return (9+s.heroes[1]*3+s.buildings.barracks*5+s.army.reduce((n,v,i)=>n+v*UNIT[i].damage,0))*(1+s.development.tech.weapons*.04);}

let tab="base", trainingBatch=5, selectedMission="block", selectedObject=null, modal=null;

// --- ЛОГИКА ИНТЕРФЕЙСА (ОКНА) ---
function renderBase(){
  return `<div class="grid">${Object.entries(BUILD).map(([id,b])=>{
    const l=s.buildings[id], working=s.buildJob?.id===id;
    return `<article class="card ${working?'selected':''}"><h3>${b.name} <span class="tag">Ур.${l}</span></h3>
    <p>${working?'Строительство...':`Требует штаб: ${b.need||1}`}</p>
    ${btn("building",id,"Управлять",false,true)}</article>`;
  }).join("")}</div>`;
}

function renderTerritory(){
  return `<div class="grid">${Object.entries(TERRITORY).map(([id,p])=>{
    const done=s.territory.cleared.includes(id), working=s.territory.job?.id===id;
    return `<article class="card"><h3>${p.name}</h3><p>${done?'Освоено':working?'Расчистка...':price(p.cost)}</p>
    ${btn("land",id,done?"Готово":"Освоить",done||working, !done)}</article>`;
  }).join("")}</div>`;
}

function renderArmy(){
  return `<div class="grid">${UNIT.map((u,i)=>{
    return `<article class="card"><h3>${u.icon} ${u.name}</h3><p>В строю: ${s.army[i]}<br>Цена: ${price({food:u.food*5, wood:u.wood*5})}</p>
    ${btn("train",i,"Обучить 5",!!s.trainJob,true)}</article>`;
  }).join("")}</div>`;
}

function renderMapPanel(){
  return `<div class="grid">${Object.entries(MISSIONS).map(([id,m])=>`
    <article class="card"><h3>${m.name}</h3><p>Награда: ${price(m.reward)}<br>Сила врага: ${m.enemy}</p>
    ${btn("send-exp",id,"Отправить отряд",!!s.expedition,true)}</article>
  `).join("")}</div>`;
}

function render(){
  document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===tab));
  $("panel").innerHTML={base:renderBase,territory:renderTerritory,heroes:renderBase,army:renderArmy,map:renderMapPanel,battle:renderBase}[tab]();
  live();
}

function live(){
  $("food").textContent=fmt(s.food); $("wood").textContent=fmt(s.wood); $("parts").textContent=fmt(s.parts);
  $("power").textContent=fmt(power()); $("hq-level").textContent=s.buildings.hq; $("wave").textContent=s.wave;
  const c=CHAPTERS[s.development.chapter];
  if(c){ $("chapter-number").textContent=`Глава ${s.development.chapter+1}`; $("chapter-title").textContent=c.title; }
  $("queue").hidden = !s.buildJob;
  if(s.buildJob) $("queue").textContent = `🏗 Строительство: ${time((s.buildJob.ends-Date.now())/1000)}`;
}

// --- CANVAS (ТУМАН И ЗАМКИ) ---
const canvas=$("world"), ctx=canvas.getContext("2d");
const iso=(x,y)=>({x:500+(x-y)*43,y:300+(x+y)*23});
function poly(points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.fillStyle=fill;ctx.fill();}
function block(x,y,w,d,h,color){
  const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+d),e=iso(x,y+d),up=p=>({x:p.x,y:p.y-h});
  poly([e,c,up(c),up(e)],"#2a2a2a"); poly([b,c,up(c),up(b)],"#1a1a1a"); poly([up(a),up(b),up(c),up(e)],color);
}

function drawWorld(){
  ctx.clearRect(0,0,1000,780);
  // Основа карты
  for(let y=-2;y<5;y++)for(let x=-2;x<5;x++){
    const p1=iso(x,y), p2=iso(x+1,y), p3=iso(x+1,y+1), p4=iso(x,y+1);
    poly([p1,p2,p3,p4], (x+y)%2?"#2d342d":"#252c25");
  }
  
  // Здания
  block(2,1,1,1,30,"#5c5346"); // Штаб
  block(0,0,1,1,15,"#5e7063"); // Ферма

  // Территории (ТУМАН И ЗАМКИ)
  for(const [id,p] of Object.entries(TERRITORY)){
    const done = s.territory.cleared.includes(id);
    const center = iso(p.x+0.5, p.y+0.5);
    if(done){
      block(p.x, p.y, 1, 1, 10, "#4a5d4a"); // Зачищено
    }else{
      // ТЕМНЫЙ ТУМАН С ЗАМКОМ
      block(p.x, p.y, 1, 1, 20, "rgba(10, 15, 18, 0.9)");
      ctx.font="20px sans-serif"; ctx.fillStyle="#f4a222"; ctx.textAlign="center";
      ctx.fillText("🔒", center.x, center.y-25);
    }
  }
  requestAnimationFrame(drawWorld);
}

// --- ОБРАБОТКА КЛИКОВ ---
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-action]"); if(!b)return;
  const a=b.dataset.action, id=b.dataset.id;
  
  if(a==="tab"){ tab=id; render(); }
  if(a==="building"){
    if(!pay({wood:50})){alert("Нужно 50 дерева!"); return;}
    s.buildJob={id, ends:Date.now()+15000}; save(); render();
  }
  if(a==="land"){
    if(!pay(TERRITORY[id].cost)){alert("Не хватает ресурсов!"); return;}
    s.territory.cleared.push(id); save(); render();
  }
  if(a==="train"){
    if(!pay({food:40})){alert("Нужно 40 еды!"); return;}
    s.army[id]+=5; save(); render();
  }
  if(a==="send-exp"){
    if(s.army[0]<5){alert("Обучите минимум 5 бойцов!"); return;}
    s.expedition={kind:id, ends:Date.now()+10000}; s.army[0]-=5; save(); render();
  }
});

// Игровой цикл
setInterval(()=>{
  const now=Date.now();
  s.food+=1; s.wood+=1; // Пассивный доход
  
  if(s.buildJob && now >= s.buildJob.ends){
    s.buildings[s.buildJob.id]++; s.buildJob=null;
  }
  if(s.expedition && now >= s.expedition.ends){
    s.food+=100; s.army[0]+=5; s.expedition=null; alert("Отряд вернулся с добычей!");
  }
  live(); save();
}, 1000);

render(); drawWorld();
</script>
