#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

#main { flex: 1; display: flex; overflow: hidden; position: relative; }

#camera-controls button:hover { background: var(--bg-hover); }

#side-panel { width: 380px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
#panel-header { padding: 10px 14px; background: var(--bg-card); border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
#panel-header .close-btn { background: none; color: var(--text-dim); font-size: 20px; padding: 2px 6px; }

#bottombar { display: flex; background: var(--bg-panel); border-top: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
#bottombar button { flex: 1; padding: 8px 4px; background: none; color: var(--text-dim); border-radius: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; border-right: 1px solid var(--border); position: relative; }
#bottombar button:last-child { border-right: none; }
#bottombar button .nav-ico { font-size: 20px; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.card-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }

.btn-primary:hover { background: var(--accent-dim); }
.btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--bg-hover); color: var(--text); padding: 6px 12px; border: 1px solid var(--border); }

.fill-accent { background: var(--accent); } .fill-danger { background: var(--danger); } .fill-heal { background: var(--heal); } .fill-shield { background: var(--shield); }

.hero-card { display: flex; gap: 10px; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: border-color .2s; }

.hero-info { flex: 1; min-width: 0; } .hero-name { font-weight: 700; font-size: 13px; } .hero-class { font-size: 11px; color: var(--text-dim); }

.rarity-common { border-left: 3px solid #888; } .rarity-rare { border-left: 3px solid #4488ee; } .rarity-epic { border-left: 3px solid #aa44ee; } .rarity-legendary { border-left: 3px solid #ee8800; }

.building-item { display: flex; gap: 10px; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: border-color .2s; }
.building-item:hover { border-color: var(--accent); } .building-ico { width: 48px; height: 48px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--bg-dark); flex-shrink: 0; }
.building-info { flex: 1; } .building-name { font-weight: 700; font-size: 13px; } .building-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; } .building-level { font-size: 11px; color: var(--accent); }

.cost-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.cost-item { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg-dark); }
.cost-item.affordable { color: var(--heal); } .cost-item.expensive { color: var(--danger); }

.quest-item { padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.quest-title { font-weight: 700; font-size: 13px; } .quest-desc { font-size: 12px; color: var(--text-dim); margin: 4px 0; } .quest-reward { font-size: 11px; color: var(--accent); margin-top: 4px; }

#battle-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.92); z-index: 500; display: none; flex-direction: column; }

#battle-arena { flex: 1; position: relative; overflow: hidden; } #battle-canvas { width: 100%; height: 100%; }

.battle-hero-hud { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; text-align: center; }
.battle-hero-hud .bh-name { font-size: 11px; font-weight: 700; } .battle-hero-hud .bh-hp-bar { width: 100%; height: 6px; background: var(--bg-dark); border-radius: 3px; margin: 4px 0; overflow: hidden; }
.battle-hero-hud .bh-hp-fill { height: 100%; background: var(--heal); border-radius: 3px; transition: width .3s; }
.battle-hero-hud .bh-skill { margin-top: 4px; } .battle-hero-hud .bh-skill button { width: 100%; padding: 4px; font-size: 10px; background: var(--accent); color: #000; font-weight: 700; }
.battle-hero-hud .bh-skill button:disabled { background: var(--border); color: var(--text-dim); }
#battle-controls { padding: 8px 16px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: center; }
#battle-controls button { padding: 8px 20px; font-weight: 700; }

#battle-result { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.9); z-index: 600; display: none; align-items: center; justify-content: center; }
#battle-result.active { display: flex; } .result-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 30px; text-align: center; max-width: 400px; width: 90%; }
.result-box h2 { font-size: 24px; margin-bottom: 6px; } .result-box .result-victory { color: var(--accent); } .result-box .result-defeat { color: var(--danger); }
.result-stats { margin: 16px 0; text-align: left; } .result-stats .rs-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.result-rewards { margin: 12px 0; text-align: left; } .result-rewards h4 { color: var(--accent); margin-bottom: 6px; font-size: 13px; } .result-rewards .rr-item { font-size: 12px; padding: 2px 0; }

#modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); z-index: 400; display: none; align-items: center; justify-content: center; }
#modal-overlay.active { display: flex; } .modal-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal-box h3 { margin-bottom: 12px; }

#toast-container { position: fixed; top: 50px; right: 12px; z-index: 800; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; animation: toast-in .3s, toast-out .3s 2.7s forwards; box-shadow: var(--shadow); max-width: 300px; }
.toast-success { border-left: 3px solid var(--heal); } .toast-warning { border-left: 3px solid var(--accent); } .toast-danger { border-left: 3px solid var(--danger); }

.tab-row { display: flex; gap: 4px; margin-bottom: 12px; } .tab-btn { flex: 1; padding: 6px; background: var(--bg-dark); color: var(--text-dim); font-size: 11px; font-weight: 600; }
.tab-btn.active { background: var(--accent); color: #000; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.text-accent { color: var(--accent); } .text-dim { color: var(--text-dim); } .text-danger { color: var(--danger); } .text-heal { color: var(--heal); }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .text-center { text-align: center; } .text-sm { font-size: 12px; } .fw-700 { font-weight: 700; } .gap-6 { gap: 6px; } .flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }

@media (max-width: 768px) { #side-panel { width: 100%; position: absolute; top: 0; bottom: 0; right: -100%; z-index: 200; transition: right .3s; } #side-panel.open { right: 0; } }

/* World Map v5.0 */
#world-overlay { position: fixed; inset: 0; background: #0a0d12; z-index: 550; display: none; flex-direction: column; }
#world-overlay.active { display: flex; }
#world-header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
#world-arena { flex: 1; position: relative; overflow: hidden; } #world-canvas { width: 100%; height: 100%; cursor: grab; } #world-canvas:active { cursor: grabbing; }

.tut-highlight { animation: tut-pulse 1s infinite; position: relative; z-index: 450; }
@keyframes tut-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,166,36,.7); } 50% { box-shadow: 0 0 0 8px rgba(232,166,36,0); } }

<div id="app">
  <!-- TOP BAR -->

}
